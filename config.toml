# weave configuration (github.com/harrisoncramer/weave).
#
# Generated from the Config struct in internal/appconfig. Do not edit by hand;
# change the struct's doc comments or DefaultKeybindings and run
# 'mise run gen:config'.
#
# Every value below is the tool's built-in default, spelled out. Copy this file
# to ~/.config/weave/config.toml and change what you like; anything you
# delete falls back to the same default shown here. An unknown key is an error,
# so nothing outside this file is configurable.

# Which agent CLI a new agent runs when neither the agent nor its workflow
# names one. It has to be a harness this binary implements, so it is one of
# the names under [harness] below.
default_harness = "claude"
# How many unarchived agents may exist at once, past which a create is
# refused.
max_agents      = 50
# The marks the mark key cycles through, in order. A mark is a glyph and means
# whatever you decide, so the glyph is the label. Pressing mark advances the
# hovered agent to the next one here, and past the last one back to unmarked,
# which leaves a one-mark list behaving as a toggle. A colour is either one of
# the sixteen your terminal's own scheme maps, named as "red" or "brightred",
# or a hex value such as "#DCA561". The panel draws itself from the sixteen,
# so a name is what keeps a mark in the same scheme as everything around it.
marks = [
  { glyph = "●", color = "yellow" },
  { glyph = "◐", color = "yellow" },
  { glyph = "✓", color = "yellow" },
]

# Per-CLI configuration, which is where the flags an agent of that CLI
# inherits live.

[harness.claude]
# Flags appended to every agent's command line for this CLI, ahead of the
# flags that agent carries itself. Flag vocabularies do not overlap between
# CLIs, which is why they are configured per harness rather than once.
flags = ""

[harness.codex]
# Flags appended to every Codex agent's command line, ahead of the flags that
# agent carries itself.
flags             = ""
# Whether to record each agent's directory as trusted in Codex's own config
# before launching it. Codex asks whether a directory is trusted the first
# time it runs there and waits for an answer, which it reads only from that
# file, so an agent in a fresh worktree otherwise starts blocked and shows
# here as waiting. Turning this on edits ~/.codex/config.toml on your behalf,
# adding nothing but a trust entry per directory and never changing one you
# set yourself.
trust_launch_dirs = false

# How the popup's width is divided between the panel and the stage beside it.
[layout]
# The share of the width the panel's list takes, as a fraction above zero and
# below one. The stage showing whatever the cursor is on takes the rest, so
# the default leaves the greater part to the preview, which is where there is
# something to read.
split = 0.2

# Panel keybindings, scoped to the screen each binding acts in.

# Navigation, shared by every menu so movement is the same everywhere.
[keybindings.nav]
# Move the cursor up.
up   = ["k"]
# Move the cursor down.
down = ["j"]

# The key that draws the legend under a list, shared by every screen for the
# same reason navigation is.
[keybindings.help]
# Toggle for the keybindings
toggle = ["?"]

# The agents list, the panel's main screen.
[keybindings.agents]
# Quit the panel.
quit        = ["ctrl+c"]
# Step out of a workflow scope, or quit at the root.
back        = ["esc"]
# Attach to the hovered agent.
open        = ["enter"]
# Open the hovered agent's directory in whatever EDITOR names. The window is
# created on your own tmux server rather than the panel's, and the panel
# closes behind it, so you are left in the editor.
editor      = ["e"]
# Start a new agent.
new         = ["n"]
# Rename the hovered agent.
rename      = ["r"]
# Archive the hovered agent, which stops it and moves it to the archive screen
# rather than destroying it.
archive     = ["z"]
# Filter the list by name.
search      = ["/"]
# Swap the hovered agent's stored record into the stage in place of the agent.
info        = ["i"]
# Move the hovered agent to the next mark in the marks list, and past the last
# one back to unmarked. Nothing but you ever sets a mark.
mark        = ["m"]
# Hide the hovered agent from this list, or unhide one while the hidden agents
# are shown. Hiding stops nothing: the agent keeps running and every other
# view still holds it.
hide        = ["h"]
# Show the hidden agents alongside the rest, and press it again to put them
# away. While they are away each workflow header carries the count of what it
# is not showing.
show_hidden = ["H"]
# Show the background service's log in the stage, in place of the row under
# the cursor, and press it again to put the row back. The service is spawned
# detached and writes to a file, so nothing else shows what it is doing.
logs        = ["L"]

# The new-agent, rename, and workflow forms.
[keybindings.form]
# Abort the form and quit the panel.
quit   = ["ctrl+c"]
# Abort the form without quitting the panel.
back   = ["esc"]
# Submit the form. Plain enter belongs to the text inputs, so this is
# deliberately something else.
submit = ["ctrl+s"]

# The bindings that create and change workflows, from the agents list.
[keybindings.workflows]
# Create a workflow. Works from anywhere in the list.
new     = ["W"]
# Rename the workflow under the cursor.
rename  = ["r"]
# Edit the workflow under the cursor.
edit    = ["e"]
# Archive the workflow under the cursor, which archives the agents inside it.
archive = ["z"]

# The schedules screen, and the key that opens it from the agents list.
[keybindings.schedules]
# Open the schedules screen from the agents list.
open    = ["s"]
# Quit the panel.
quit    = ["ctrl+c"]
# Leave the schedules screen for the agents list.
back    = ["esc"]
# Write a new schedule.
new     = ["n"]
# Edit the schedule under the cursor.
edit    = ["enter"]
# Pause or resume the schedule under the cursor.
toggle  = [" "]
# Archive the schedule under the cursor, which stops it firing. The agents it
# launched are kept, and nothing brings the schedule back.
archive = ["z"]

# The archive screen, and the key that opens it from the agents list.
[keybindings.archive]
# Open the archive from the agents list.
open    = ["Z"]
# Quit the panel.
quit    = ["ctrl+c"]
# Leave the archive for the agents list.
back    = ["esc"]
# Put the agent under the cursor back in the panel.
restore = ["r"]
# Destroy the agent under the cursor for good, with its transcript. This is
# the one thing in the panel nothing undoes, so it asks first.
delete  = ["d"]

# The actions list, and the key that opens it on the hovered agent.
[keybindings.actions]
# Open the actions list on the hovered agent. It acts on a row rather than on
# the list, so this does nothing on a workflow header.
open = ["a"]
# Quit the panel.
quit = ["ctrl+c"]
# Leave the actions list for the agents list.
back = ["esc"]
# Run the script under the cursor on the agent the list was opened on.
run  = ["enter"]

# Where the panel finds the scripts its action key runs.
[actions]
# The directory holding them, one file per action, named by the file. Every
# file directly inside is offered and the directory is read on each press, so
# writing an action is dropping an executable in rather than an edit here. An
# action runs on the agent it was chosen on, in that agent's directory, with
# the agent as JSON in WEAVE_AGENT. Left empty this is
# ~/.config/weave/actions, beside this file.
dir = ""

# The log the background service writes, which the panel's log key pages.
[log]
# How much is written, one of debug, info, warn, or error. Served requests are
# logged at debug and failures at error, so the default keeps the file to what
# went wrong. Debug is worth turning on while chasing something. It is loud,
# because the panel calls four times a second while it is open.
level  = "info"
# What the log key opens the log in. It runs in the stage pane through a
# shell, so a pipeline is as good as a single command. Two variables are
# exported into it: WEAVE_BIN is this binary, whose "logs" subcommand prints
# the file a line per record rather than as the JSON it is stored as, and
# WEAVE_LOG is the file itself, for a reader that would rather have it raw.
# Nothing in the command is rewritten, so a tool's own placeholders are its
# own: "$WEAVE_BIN logs --color=always | fzf --ansi --tac" gives fzf the whole
# of its "{}". Whatever it runs has to hold the pane, the way a pager does. A
# command that prints and exits takes the pane down with it, and the stage
# comes back empty.
viewer = "\"$WEAVE_BIN\" logs --color=always | less -RSX +G"
