      mcp_guidance: "resource_exhausted means komrad is running as many agents as it may, or the task has as many reviewers as it may. When komrad is full, say so, carry on without the review and leave the change for the person. When the task is full, resolve what the reviewers raised and ask again once one is archived."
      destructive: false
      roles: [ROLE_WRITER]
