name: main-release

# The tip of main, published as one rolling prerelease whose tag never moves off the name
# `tip`, so the download URL is fixed forever and installing is a single curl. It is
# deliberately not a release: no version promise, and every merge replaces it.
#
# The tag is `tip` rather than `main` because a tag sharing a branch's name is ambiguous to
# git. It is reachable from the branch, so it is fetched by default, and every rev-parse,
# checkout, and log naming it then warns, for every contributor, forever.
#
# It waits on the suite the merge already started rather than starting a second one. A workflow
# cannot read another's result any other way, and calling ci.yml here instead ran every job twice
# against the same commit.
on:
  workflow_run:
    workflows: [ci]
    branches: [main]
    types: [completed]

permissions:
  contents: write

# Two merges landing close together would otherwise publish against the same tag and the same
# asset names, and could interleave into a tag at one commit with binaries from another. The
# newer merge wins instead, since the older build's output was going to be overwritten anyway.
concurrency:
  group: main-release
  cancel-in-progress: true

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: namespace-profile-harrisoncramer

    steps:
      # A workflow_run checks out the default branch by default, not the commit that was tested.
      # The history comes with it because the tag is pushed from here.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Use Mise
        uses: ./.github/actions/use-mise
        with:
          gh-access-token: ${{ env.GH_ACCESS_TOKEN }}

      # All four targets, macOS included, build here with CGO off. The Go linker ad-hoc
      # signs the darwin/arm64 binary, which is what Apple Silicon refuses to run without,
      # so no macOS runner is involved.
      - name: Build
        run: mise run go:release

      # The tag is force-moved to this commit by full ref, so a tag and a branch of the same
      # name can never be confused for one another on the push side either.
      #
      # Assets are replaced in place rather than added, so storage stays constant and the
      # per-file URLs keep working. The release is edited instead of recreated so that
      # deleting it is a decision somebody makes rather than something a merge does.
      # The notes are the pull requests merged since the newest stable release, which is what
      # somebody on tip wants to know: how far ahead of the last release they are. Before the
      # first release there is nothing to measure from, so GitHub reaches back to the beginning.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git tag -f tip "$SHA"
          git push -f origin refs/tags/tip

          PREVIOUS="$(gh release list --exclude-drafts --exclude-pre-releases \
            --limit 1 --json tagName --jq '.[0].tagName // ""')"

          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name=tip -f target_commitish="$SHA" \
            ${PREVIOUS:+-f previous_tag_name="$PREVIOUS"} \
            --jq .body >/tmp/notes.md

          {
            echo
            echo "---"
            echo
            echo "The tip of main, rebuilt on every merge, currently $SHA. This is not a release:"
            echo "it makes no version promise and changes without notice."
            echo
            echo '```sh'
            echo "curl -fsSL -o ~/.local/bin/komrade \\"
            echo "  https://github.com/$GITHUB_REPOSITORY/releases/download/tip/komrade-darwin-arm64"
            echo "chmod +x ~/.local/bin/komrade"
            echo '```'
            echo
            echo "checksums.txt is same-origin. It catches a corrupted download, not a"
            echo "compromised release."
          } >>/tmp/notes.md

          if gh release view tip >/dev/null 2>&1; then
            gh release edit tip --prerelease --notes-file /tmp/notes.md
          else
            gh release create tip --prerelease --title "tip of main" --notes-file /tmp/notes.md
          fi

          gh release upload tip dist/* --clobber
