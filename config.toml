# komrad configuration (github.com/harrisoncramer/komrad).
#
# Generated from the Config struct in config. Do not edit by hand;
# change the struct's doc comments or its default tag and run
# 'mise run gen:config'.
#
# These are the built-in defaults. Do not copy this file over: write
# ~/.config/komrad/config.toml holding only what you are changing. An unknown key
# is an error.

# Which agent CLI a new agent runs when neither the agent nor its workflow
# names one. It has to be a harness this binary implements, so it is one of
# the names under [harness] below.
default_harness = "claude"
# Whether `komrad open` sets up a workflow for the git checkout it is run in, with a
# worktree for each agent and an orchestrator standing by, when no workflow covers that
# directory yet.
auto_setup      = false
# Edit the panel's text fields the way vim does. A form's field opens in insert mode, esc goes
# to normal mode, and a second esc closes it. The filter, search and rename lines close on esc,
# and ctrl+f puts one in normal mode, after which esc works as it does in a form.
vim_mode        = false

[harness.claude]
# Flags appended to every agent's command line for this CLI, ahead of the flags that agent carries itself.
flags             = ""
# Records each agent's directory as trusted in this CLI's own config when on,
# before launching it. The CLI asks whether a directory is trusted the first
# time it runs there and waits for an answer, which it reads only from that
# file, so an agent in a fresh worktree otherwise starts blocked and shows
# here as waiting. Turning this on edits that file on your behalf.
trust_launch_dirs = false

[harness.codex]
# Flags appended to every agent's command line for this CLI, ahead of the flags that agent carries itself.
flags             = ""
# Records each agent's directory as trusted in this CLI's own config when on,
# before launching it. The CLI asks whether a directory is trusted the first
# time it runs there and waits for an answer, which it reads only from that
# file, so an agent in a fresh worktree otherwise starts blocked and shows
# here as waiting. Turning this on edits that file on your behalf.
trust_launch_dirs = false

# Limits how much agents may run and how large their conversations may grow.
[usage]
# The number of unarchived agents this engine may run at once. Past it, komrad refuses a create.
max_agents = 50

# The limits on one task.
[usage.task]
# The number of live reviewers one task may hold at once. Reviewers read their task's checkout,
# so this is deliberately far lower than max_agents.
max_reviewers = 3

# The limits on a writer, the agent that lands a task's work on its branch.
[usage.writer]
# The conversation size in tokens an agent is held under, summarizing its history a little
# before it gets there. Lower costs less per turn and forgets more. 0 leaves the agent CLI's
# own default, and a value the CLI will not take is moved to the nearest one it will.
auto_compaction = 250000

# The limits on a reviewer, the agent that reads a task's work.
[usage.reviewer]
# The conversation size in tokens an agent is held under, summarizing its history a little
# before it gets there. Lower costs less per turn and forgets more. 0 leaves the agent CLI's
# own default, and a value the CLI will not take is moved to the nearest one it will.
auto_compaction     = 250000
# Archives a reviewer once it releases an approval when on. Turn it off to keep approved
# reviewers in the sidebar until you archive them yourself.
archive_on_approval = true

# The limits on a workflow's orchestrator.
[usage.orchestrator]
# The conversation size in tokens an agent is held under, summarizing its history a little
# before it gets there. Lower costs less per turn and forgets more. 0 leaves the agent CLI's
# own default, and a value the CLI will not take is moved to the nearest one it will.
auto_compaction = 150000
# The number of live tasks one orchestrator may have started at once. 0 leaves max_agents as
# the only cap.
max_tasks       = 0

# Sets how much of the window the panel's sidebar, the stage beside it, and the info pane each take, and which side of the stage the info pane opens on.
[layout]
# The width, in columns, the panel's sidebar opens at. Dragging the divider afterwards moves it, and the panel follows.
sidebar_width  = 47
# Which side of the stage the info pane opens on, "below" or "above". That pane is where the server log and an editor are drawn.
info_side      = "below"
# The height the info pane opens at, either a share of the stage's height below one or a whole number of rows.
info_height    = 0.4
# The number of lines the details under the list draw, either a share of the sidebar's height below one or a whole number of lines. The marks the hovered row is carrying are spelled out in that same room, ahead of the fields. The chrome around them is added on top, and the two together never take more than half the sidebar's height. Once the details hold the keys they grow past this to show the whole record, as far as the sidebar allows.
details_height = 9
# The number of tasks the triage zone at the top of the agents list draws, the agents most in need of you, the most urgent first. A task is drawn as its writer with its reviewers under it, and the zone never draws fewer rows than it has slots. Zero turns the zone off.
triage_rows    = 3

# Panel keybindings, scoped to the screen each binding acts in.

# The agents list, the panel's main screen.
[keybindings.agents]
# Jump to the first agent in the triage zone at the top of the list.
triage = ["t"]
# Rename the hovered agent, or the slug of the hovered task.
rename = ["r"]

# The archive screen.
[keybindings.archive]
# Rename the agent or live workflow under the cursor, typed over its row.
rename = ["r"]

# The archive menu, nested under the menu on the hovered row of the archive.
[keybindings.archive_menu]
# Archive the agent, task, workflow or schedule, or every chosen task.
archive      = ["a"]
# Destroy the row for good, with its transcript or its run history, archiving a live task
# first, which takes its agents, documents, reviews and worktree with it. On the worktrees it
# deletes the directory, through the task delete when an archived task answers for it.
# Nothing undoes it, so it asks first.
delete       = ["d"]
# Put the row back in the panel.
restore      = ["r"]
# Put the agent back in the panel and open it, which relaunches its conversation in a pane
# and takes you to it. The entry is gray on an agent that never got as far as starting.
restore_open = ["o"]
# Deletes every unused worktree. That covers every directory whose agent is archived, through
# the agent delete and its hooks, and every directory agents don't answer for. A directory
# with a live agent in it is never deleted. The entry is only on the worktrees screen, and is
# gray when every worktree is in use.
clear        = ["c"]

# The keys for the details under whichever list is on screen. One hands them the
# cursor, and one copies the field it lands on.
[keybindings.details]
# Copy the field the details cursor is on to the system clipboard.
copy = ["y"]

# A diff with a cursor in it, shared by the review and a document's history.
[keybindings.diff]
# Draw the whole of the file the cursor is in rather than the changed lines and the
# three around them, or go back to those. The lines this adds behave like any other:
# the cursor rests on them and, on the review, a comment can be written on one. A file
# stays open while you are reading this change and is drawn tight again when you leave.
expand     = ["E"]
# Jump to the next file in the diff.
next_file  = ["]"]
# Jump to the next line matching the pattern the filter key searched for.
next_match = ["n"]
# Pan the diff left, for a line wider than the pane.
pan_left   = ["h", "left"]
# Pan back to the start of the line.
pan_reset  = ["0"]
# Pan the diff right.
pan_right  = ["l", "right"]
# Jump to the previous file in the diff.
prev_file  = ["["]
# Jump to the previous line matching the pattern.
prev_match = ["N"]
# Wrap lines wider than the pane, or go back to cutting them off and panning.
wrap       = ["w"]

# The documents view, which lists every document agents have written, and the document types.
[keybindings.documents]
# Step back to an earlier write of the document under the cursor, drawing what that write
# changed.
older = ["<"]
# Step forward to a later write, and past the newest back to the document as it stands.
newer = [">"]

# The menu on the hovered document, over the documents view's own entries.
[keybindings.document_menu]
# Open the document in your editor, in place of the text drawn beside the list. Quitting the
# editor, or picking the entry again to close it, saves what it has written.
edit   = ["e"]
# Rename the document, typing over its name in the list.
rename = ["r"]
# Write a new document for the agent whose documents are listed, from a form. The entry is
# only on the documents view opened from an agent.
new    = ["c"]
# Delete the document and every earlier version of it, once you confirm.
delete = ["d"]

# The menu on the document type under the cursor of the documents view.
[keybindings.document_types_menu]
# Edit the type's name and context, from a form holding them as they stand.
edit   = ["e"]
# Define a new document type, from a form asking its name and the context an agent reads
# before writing one.
new    = ["c"]
# Delete the type, once you confirm.
delete = ["d"]

# The filter over whichever list is on screen, shared by every screen that
# draws one. The key that opens it is "/" and is not configured.
[keybindings.filter]
# Move the cursor to the next row matching the search, wrapping at the end of the list.
next_match = ["n"]
# Move the cursor to the previous row matching the search.
prev_match = ["N"]

# The key that draws the legend under a list, shared by every screen for the
# same reason navigation is.
[keybindings.help]
# Toggle for the keybindings
toggle = ["?"]

# The git menu, nested under the menu on the hovered row, and the actions inside it.
[keybindings.git]
# Open the forge menu to the right of this one, for acting on the hovered task's pull request.
forge            = ["f"]
# Send the hovered task's branch to origin, which asks first and says how many commits go
# up, whether origin's copy is overwritten after a rebase, and what stays uncommitted.
push             = ["p"]
# Undo the rebase, am, merge, cherry-pick or revert part-way through the hovered task's
# worktree, which asks first. The entry names the kind and is off when nothing is in progress.
abort            = ["x"]
# Bring the hovered task's worktree up to date on the latest base, which asks first and
# says what it would do to the branch and to the files.
rebase           = ["r"]
# Re-target the hovered child onto the workflow's base branch, rebasing only its own commits,
# which asks first. The entry is off for a task without a parent.
rebase_onto_base = ["R"]
# Pick the fork point of the hovered child, the commit its own commits sit on, once a rewrite
# of its branch has orphaned it.
pick_fork_point  = ["s"]

# The forge menu, nested under the git menu, which acts on the hovered task's pull request.
[keybindings.forge]
# Open the hovered task's current pull request in your browser: the newest one opened from
# its branch that is not finished, else the newest finished one. The entry says so rather
# than acting on a task with none.
open_pull_request     = ["o"]
# Copy the address of the hovered task's current pull request to your clipboard.
copy_pull_request_url = ["c"]
# Change the title and description of the hovered task's pull request, in a form that opens
# on what the forge holds now.
edit                  = ["e"]
# Mark the hovered task's pull request a draft, or ready for review when it is one.
toggle_draft          = ["d"]
# Ask everyone who requested changes on the hovered task's pull request to review it again.
request_rereview      = ["v"]
# Merge the pull request and leave the task where it is.
merge                 = ["m"]
# Merge the pull request, then archive the task once the forge has merged it.
merge_archive         = ["a"]
# Have the forge merge the pull request on its own once its checks and reviews pass, or stop it
# when it is already waiting to.
auto_merge            = ["u"]
# Merge the pull request on the forge, then bring the task's worktree up to date on the base,
# which now holds its work.
merge_rebase          = ["r"]

# The jump menu, nested under the menu on a task, a document or a worktree.
[keybindings.jump_menu]
# Land on the agent, on the agents list or in the archive.
agent     = ["a"]
# Land on the task, on the agents list or in the archive.
task      = ["t"]
# Land on the agent's worktree on the worktrees screen.
worktree  = ["w"]
# Open the documents view on the task's documents from a task's menu, and on the agent's elsewhere.
documents = ["d"]

# The hide menu, nested under the menu on the agents list.
[keybindings.hide_menu]
# Hide the hovered task or every chosen task, or unhide them when they are all hidden.
hide        = ["h"]
# Show the hidden tasks alongside the rest, or put them away again.
show_hidden = ["H"]

# The logs screen, which tails what the server logged about one agent.
[keybindings.logs]
# Copy the log line the cursor is on to the system clipboard.
copy = ["y"]

# The messages komrad pushed, read in the main pane.
[keybindings.messages]
# Open every message in the main pane, and close it again.
open        = ["ctrl+g"]
# Dismiss the message under the cursor.
dismiss     = ["d"]
# Dismiss every message.
dismiss_all = ["D"]

# Navigation, shared by every menu so movement is the same everywhere.
[keybindings.nav]
# Jump to the last row.
bottom    = ["G"]
# Move the cursor down.
down      = ["j"]
# Move the cursor down a chunk of rows, stopping on the last one.
page_down = ["ctrl+d"]
# Move the cursor up a chunk of rows, stopping on the first one.
page_up   = ["ctrl+u"]
# Jump to the first row, pressed twice the way vim's gg is.
top       = ["g"]
# Move the cursor up.
up        = ["k"]

# The review screen, which draws a task's diff in the stage and its review
# threads in the sidebar.
[keybindings.review]
# From the menu, pass a held comment from the forge on to the writer, copied as your own words and
# released at once. A comment is held when its author cannot push to the repository, and the
# writer reads nothing in its thread until the comment opening it is accepted.
accept           = ["A"]
# From the menu, show only the change that answered the comment under the cursor, from the work as
# it stood just before the writer's addressed reply to the work that reply carried, or
# go back to all changes from there.
answer           = ["a"]
# Walk back a review, from the whole change to the work since your last review and on into the
# older ones, stopping on the oldest.
base             = ["<"]
# Walk the other way through your reviews, towards the newest work and on to the whole change.
base_forward     = [">"]
# From the menu, write a message on the line under the cursor, replying in the thread already there
# or opening a new one.
compose          = ["c"]
# From the menu, open the file under the cursor in your editor, beside the diff, on the line the
# cursor is on. This is the task's own worktree rather than a copy of it, so what
# you write is what the writer finds there, and the key is refused while the writer is
# working rather than letting you both write at once. It is drawn off on a range ending
# before the newest snapshot, since those lines have moved on.
edit_file        = ["e"]
# From the menu, throw away a reply of yours the forge refused on the thread under the cursor. Nothing is
# posted.
forge_discard    = ["x"]
# From the menu, try again with a reply of yours the forge refused on the thread under the cursor.
forge_post       = ["p"]
# From the menu, write a reply on the forge thread under the cursor, posted on the pull request where
# anyone can read it.
forge_reply      = ["C"]
# From the menu, jump from the comment under the cursor to the diff it was written against, with the
# cursor on it, or back to where you were from there. Anywhere else, move to the next
# comment from the forge on the pull request.
jump             = ["J"]
# Jump to the next line carrying a review thread.
next_thread      = ["t"]
# Move the cursor to the next comment nobody has settled. It stops on the last one.
next_open_thread = ["u"]
# Move the cursor to the previous comment nobody has settled. It stops on the first one.
prev_open_thread = ["U"]
# Jump to the previous line carrying a review thread.
prev_thread      = ["T"]
# From the menu while the diff ends before the newest snapshot, end it on the newest snapshot.
range_end        = ["L"]
# From the menu, catch up with the writer, taking a snapshot of the worktree as it stands and ending
# the diff on it.
reload           = ["R"]
# From the menu, hide the conversations agents opened, or show them again. They show whenever a
# review opens.
agent_threads    = ["b"]
# From the menu, settle the thread under the cursor, which marks it resolved without deleting it.
resolve          = ["r"]
# On the file tree, open the folder the cursor rests on, or close it when it is open. Over the
# file tree, open the review of a task in the stack, go to a thread that needs you, or open the
# pull request's description.
toggle_folder    = ["o"]
# From the menu, fold away the file the cursor is in once you have read it, or open it again. A file
# the writer writes to afterwards comes back on its own.
toggle_viewed    = ["v"]

# The keys the mouse wheel presses over the panel, shared by every screen.
[keybindings.column]
# Scroll down.
scroll_down = ["ctrl+n"]
# Scroll up.
scroll_up   = ["ctrl+p"]

# The schedules screen.
[keybindings.schedules]
# Rename the schedule under the cursor, typed over its row.
rename = ["r"]

# The menu on the hovered schedule.
[keybindings.schedule_menu]
# Pause the schedule, or resume it when it is paused.
toggle = ["p"]
# Edit the hovered schedule.
edit   = ["e"]
# Write a new schedule, offered on the schedules screen whatever is hovered.
new    = ["c"]

# Choosing several rows at once, shared by every list that takes a selection.
[keybindings.selection]
# Drop the whole selection, which is the way back out of multi-select mode.
clear  = ["esc"]
# Take in every row between the cursor and the nearest already-selected one.
range  = ["V"]
# Take the row under the cursor into the selection, or back out of it.
toggle = ["v"]

# The menu on the hovered row, which lists the screens that belong to it and the menus nested
# under it.
[keybindings.menu]
# Opens the menu, which shows the hovered row's entries, or the chosen tasks', over the screen's own.
# The key opens nothing on a screen with neither.
open          = ["space"]
# Open the review of the task's diff. The entry is gray on a task without a worktree, and in
# the archive.
review        = ["r"]
# Open the agent's logs, the server log lines about it.
logs          = ["l"]
# Open the status checks run on the task's pull request.
status_checks = ["x"]
# Open a shell in the pane below the stage, rooted at the hovered task's or workflow's directory,
# or hand the keyboard to the one already rooted there. The entry is gray in the archive and
# where there is no directory.
terminal      = ["t"]
# Open the git menu to the right of this one, for rebasing or pushing the task's branch, with
# its pull request in the forge menu nested inside. On the review the git menu holds only push
# and the forge menu.
git           = ["g"]
# Open the jump menu to the right of this one, for landing on the hovered row's agent or task,
# its worktree or its documents.
jump          = ["J"]
# Open the archive menu to the right of this one, for archiving or deleting the hovered task
# or every chosen task, for archiving the hovered agent, workflow or schedule, for restoring
# or deleting a row of the archive, or for deleting worktrees.
archive       = ["a"]
# Open the hide menu to the right of this one, for hiding the hovered task or every chosen
# task, or showing the hidden ones. The entry is only on the agents list.
hide          = ["h"]
# Open your editor on the files of the hovered task or agent, in place of the pane beside
# the list. The entry is refused while the agent is working. Quitting the editor, picking
# the entry again or leaving the agents list closes it and mails the agent that you had its
# worktree open.
# The entry is only on the agents list.
edit          = ["e"]
# Retry the launch of an agent that failed to create, opening a form where the flags can be
# corrected before confirming. The entry is only on such an agent.
retry         = ["R"]
# Snooze the hovered task in triage, which takes its agents out of the zone until what they
# wait on changes, or wake it when it is snoozed. The entry is only on a task or an
# orchestrator in triage.
snooze        = ["z"]
# Edit the hovered workflow, or the hovered task's title, goal and notes.
edit_row      = ["E"]
# Swap the pane beside the list between the hovered task's goal and notes and its writer's pane.
# Escape puts the writer's pane back too. The entry is only on a task.
notes         = ["n"]
# Restart the hovered task's writer, or the hovered workflow's orchestrator, on a new
# conversation, from a form asking for a note to it. The entry does nothing on a task with no
# live writer.
restart       = ["o"]
# Put an agent on a branch that already exists, in the hovered workflow.
adopt         = ["A"]
# Start a new task on the hovered workflow. On the hovered task it starts a reviewer of its
# writer, or a writer in the task's checkout when it has none, and it is not offered once the
# worktree was removed. The entry is only on the agents list.
new_agent     = ["c"]
# Create a workflow. The entry is only on a workflow in the agents list.
new_workflow  = ["w"]
# Restore the hovered workflow on the deleted list with its archived agents. The agents on a task
# whose worktree was deleted stay archived.
restore       = ["u"]
# Delete the hovered row of the deleted list, or every chosen row, once you confirm.
delete        = ["d"]

# The row of tabs a screen draws over its list, and the key that hands it the cursor.
[keybindings.tabs]
# Hand the keys to the row of tabs over the list; escape hands them back.
focus = ["f"]

# The row of kinds a screen listing more than one kind of resource draws under its tabs.
[keybindings.kinds]
# Hand the keys to the row of kinds, where tab and shift+tab switch the kind listed; escape
# hands them back.
focus = ["F"]

# The switcher at the top of the panel, which moves between the agents, query,
# schedules, archive and worktrees from any of them.
[keybindings.views]
# Open the next view.
next     = ["tab"]
# Open the previous view.
previous = ["shift+tab"]

# The bindings that create and change workflows, from the agents list.
[keybindings.workflows]
# Rename the workflow under the cursor.
rename = ["r"]

# Sets how the panel draws a diff.
[diff]
# Wrap a line wider than the pane onto the lines under it rather than cutting it off. The wrap
# key turns this off and on while reading.
wrap = true

# The icons the panel draws, grouped by where each one is drawn. Every icon is one character
# from the approved set, the Nerd Fonts octicons and a few named characters. The chrome the
# layout is drawn with, such as the status bars, dividers and rules, is fixed and not
# configured here.
[glyphs]
# The spinner drawn while something is loading, one of braille, arcs or ascii.
loader = "braille"

# The repo column of the sidebar, which says where an agent's own checkout stands.
[glyphs.row]
# An agent with a checkout of its own, drawn in a warning colour while a rebase is stopped in
# it, and the title over the worktrees list.
worktree      = ""
# An agent whose checkout no longer exists.
worktree_gone = ""

# The forge column of the sidebar, which says where the pull request from an agent's branch stands.
[glyphs.pull_request]
# An open pull request, and an approved one that cannot merge yet.
open              = ""
# A pull request a reviewer has asked for changes on.
changes_requested = ""
# A draft pull request.
draft             = ""
# A pull request the forge would merge now.
approved          = ""
# A merged pull request.
merged            = ""
# A pull request closed without merging.
closed            = ""
# A pull request with a failing check.
failing           = ""
# A pull request that no longer merges cleanly.
conflicting       = ""

# The marks drawn after a row's name in the sidebar and beside what they say in the details.
[glyphs.marks]
# A script komrad fired for the agent failed and its log is unread.
failed_script     = ""
# Mail is waiting that the agent has not read.
mail              = ""
# The row has been hidden from the sidebar.
hidden            = ""
# A schedule launches into the workflow, and the title over the schedules list.
schedule          = ""
# The agent has written documents for a person.
document          = ""
# The forge will merge the pull request on its own once its checks and reviews pass.
auto_merge        = ""
# Beside the count of comments reviewer agents left on the agent's work.
reviewer_comments = ""
# Beside the count of comments you left on the agent's work.
person_comments   = ""
# Beside the count of your comments holding a reply you have not read.
unread            = ""
# Before the name of a reviewer agent under its task.
reviewer          = ""

# The titles over the panel's lists, and the prompt and cursor they draw.
[glyphs.lists]
# The title over the agents list.
workflow = ""
# The title over the archive.
archive  = ""
# The title over the transcript search.
search   = ""
# The prompt of the filter over a list.
filter   = "▽"
# The dot beside the engine, coloured by whether it answers.
engine   = ""

# The marks on the review screen's threads and files, and on how far a comment has got.
[glyphs.review]
# A thread holding something you have not read.
unread        = "●"
# A thread nobody has resolved, with nothing new in it.
read          = "○"
# A thread that has been resolved.
settled       = "✓"
# A thread holding a comment nobody has sent yet.
unsent        = "◇"
# A thread mirrored from the pull request on the forge.
forge         = "◆"
# The row of the file tree beside the diff that the cursor is in.
current       = "▸"
# A folder of the file tree beside the diff that shows the files inside it.
folder_open   = ""
# A folder of the file tree beside the diff that hides the files inside it.
folder_closed = ""
# A comment the agent has been given.
delivered     = "✓"

# The messages the panel shows, one for each kind.
[glyphs.messages]
# Something failed.
error   = "✗"
# Something needs your attention.
warning = "!"
# Something finished as asked.
success = "✓"
# Something to know.
info    = "·"

# The schedules list, one for a schedule that runs and one for a schedule that is paused.
[glyphs.schedules]
# A schedule that runs.
enabled  = "◆"
# A schedule that is paused.
disabled = "◇"

# The status checks list, one for a check that passed, one for a check that failed, one for a check that was skipped,
# and one for a check komrad stopped reading before it finished.
[glyphs.status_checks]
# A check that passed.
passing = ""
# A check that ended any other way.
failing = ""
# A check that was skipped or ended neutral.
skipped = ""
# A check komrad stopped reading before it finished, so its result is not known.
unknown = ""

# The colours the panel draws in, one for each part a colour plays. Each is a terminal colour
# number from 0 to 255, which your terminal's theme decides the look of, or a hex code like
# "#1e3a5f".
[palette]
# Focus, titles and whatever holds the keys.
primary       = "4"
# A second accent for what is set apart from the primary chrome, such as diff hunk headers and
# inline code.
secondary     = "6"
# Text that matters less than what is around it.
muted         = "8"
# Something finished or approved.
success       = "10"
# Something that needs your attention.
warning       = "11"
# Something failed or is gone.
danger        = "9"
# The colour of text you wrote.
user_me       = "12"
# The colour of text an agent wrote.
user_agent    = "13"
# The colour of text a reviewer agent wrote.
user_reviewer = "14"
# The colour of text that came from GitHub.
user_github   = "3"
# A merged pull request.
merged        = "5"
# The colour of text picked out for you to act on, such as a search match.
highlight     = "208"
# Text drawn on a filled bar.
inverse       = "0"

# The background of a line a diff adds.
[palette.diff_added]
# The colour on a light terminal.
light = "#dafbe1"
# The colour on a dark terminal.
dark  = "#1b3823"

# The background of a line a diff deletes.
[palette.diff_deleted]
# The colour on a light terminal.
light = "#ffebe9"
# The colour on a dark terminal.
dark  = "#402222"

# The background of the row under the cursor or taken into a selection.
[palette.selection]
# The colour on a light terminal.
light = "#dbeafe"
# The colour on a dark terminal.
dark  = "#1e3a5f"

# The background of the cursor's row while the keys are elsewhere.
[palette.selection_dim]
# The colour on a light terminal.
light = "#e5e7eb"
# The colour on a dark terminal.
dark  = "#2b3038"

# The background of a search match in a diff.
[palette.match]
# The colour on a light terminal.
light = "#fde68a"
# The colour on a dark terminal.
dark  = "#7c5c00"

# The colour of each mode the panel is in, drawn as the label at the foot of the sidebar.
[palette.mode]
# Browsing the panel.
normal = "4"
# Selecting text to copy.
visual = "5"
# Picking a pane to jump to.
jump   = "3"
# Typing into a text field.
edit   = "9"

# Sets where komrad finds the scripts a workflow hangs on a moment in its agents' lives, and how long
# each may run.
[hooks]
# The directory for hooks, which holds one executable file per hook, named after the hook.
# A hook is a script or program komrad runs at a moment a workflow names it against, in the
# agent's own directory, with agent info in KOMRAD_AGENT as JSON and the moment in
# KOMRAD_TRIGGER. Default is ~/.config/komrad/hooks.
dir     = ""
# The longest a hook may run before komrad stops it and counts it as failed, as a Go duration
# such as "60s" or "5m". A hook's own #KOMRAD timeout can ask for less, never more, and a
# hook that asks for "none" gets this. A duration komrad cannot read, or one that is not
# positive, is refused.
timeout = "60s"

# Sets where a workflow's generated worktree provisioner creates its worktrees.
[worktrees]
# Directory that holds generated worktrees, one subdirectory per agent.
# Left empty this is ~/.local/state/komrad/worktrees.
dir = ""

# Controls how komrad reads the git checkouts its agents work in.
[git]
# SSH hosts that stand in for a forge's web host, each written as "ssh_host=web_host", such
# as "ssh.gitlab.example.com=gitlab.example.com". A remote on the SSH host is then matched to
# the forge connected for the web host. Write host names only, without a port, scheme or
# user. Public aliases such as ssh.github.com and altssh.gitlab.com are already known.
ssh_hosts = []

# Controls how komrad reads the review threads on the pull requests its agents open.
[forge]
# Logins whose review comments are left out of the threads mirrored onto an agent, such as a
# CI bot or a code review App. A thread whose every comment is from one of them is not mirrored
# at all. Names ignore case.
bot_names           = []
# The largest check log komrad keeps, in bytes. Komrad drops a log past it, and the panel links to it
# on the forge instead. Komrad refuses a negative size.
max_check_log_bytes = 2097152

# The GitHub App an engine fetches and pushes as.
[github_app]
# The App's own id, from its settings page. Left empty the engine has no GitHub identity
# and git is left to whatever credentials the account already has, which on a machine
# nobody logs into is none.
app_id           = ""
# The installation the token is for, which scopes it to the repositories the App was
# installed on rather than to everything it could reach. GitHub writes it as a number, and
# it appears in the URL of the installation's own settings page.
installation_id  = ""
# The PEM the App was created with. On a deployed engine, komrad fetches this into a tmpfs at
# boot rather than writing it to disk, so the key does not outlive the machine.
private_key_path = ""

# The standing text every agent is started with, whatever workflow it is in.
[context]
# The file holding global context, read at each launch.
# Left empty this is ~/.config/komrad/context.md, but will not trigger a failure if left blank.
file = ""

# Controls how komrad delivers mail between agents.
[mail]
# The time mail stays deliverable, as a Go duration such as "3h" or "45m". Komrad neither
# delivers nor shows mail past it, and keeps the row as a record that it never arrived. A duration komrad cannot read, or one that is not positive, is refused.
delivery_deadline = "3h"
# The amount of mail two agents may write each other before komrad refuses a send between
# them. It counts the pair in both directions over every thread, so opening a new
# subject is not a way around it. When a send is refused komrad marks a row for
# attention and tells the recipient its mail was stopped, so an exchange that is cut
# off does not leave the other side waiting on a reply that will never arrive. A
# negative limit is refused.
max_exchange      = 40

# The log the server writes, which the panel's log key pages.
[log]
# The amount komrad writes, one of debug, info, warn, or error.
level = "info"

# Puts komrad into debug mode which records additional information used to help diagnose issues.
[debug]
# Keeps the pane capture behind each reading of an agent under the cache directory when on.
frames        = false
# The number of frames komrad keeps for one agent before it drops the oldest. A number at or
# below zero takes the default.
frame_history = 500

# Go's pprof profiler, served by the server and the panel.

# The server, which runs the agents and answers the API.
[debug.pprof.server]
# Serves profiles from the process when on. Komrad reads it when the process starts.
enabled = false
# The host and port the profiles are served on.
address = "localhost:6060"

# The panel, which draws the screen and talks to the server.
[debug.pprof.panel]
# Serves profiles from the process when on. Komrad reads it when the process starts.
enabled = false
# The host and port the profiles are served on.
address = "localhost:6061"

# The identity provider people sign in to this engine with, and the listener their requests
# reach it on.
[sign_in]
# The provider's issuer, like https://accounts.google.com, which every ID token it signs
# names. Left empty, along with client_id, the engine doesn't take signed-in requests.
issuer        = ""
# The id the owner registered komrad under at the provider, which every ID token for komrad
# names as its audience.
client_id     = ""
# The secret some providers, such as Google, hand a desktop app beside its id. Every copy of
# komrad carries it, so it protects nothing, and `komrad login` reads it from the engine.
client_secret = ""
# The address the public listener serves signed-in requests on. It has to be a loopback
# host, since a web server on the same machine carries the network's requests to it.
addr          = "127.0.0.1:8788"

# Which komrad this is, by its database, its address, its tmux socket and its cache.
[connection]
# The Postgres komrad keeps every agent, workflow, schedule and transcript in, reached as
# this engine's own login, which is what keeps its rows apart from every other engine's.
# `komrad engine ensure` creates the login and prints this url.
# Left empty this is the default engine's login on the embedded Postgres under state_dir.
# Whenever this reaches the socket under state_dir, the server runs the embedded Postgres and
# starts it again when it exits.
database_url          = ""
# The login that owns the schema, used only by `komrad migrate` and the `komrad engine` commands.
# Left empty this is database_url, or the embedded Postgres's owner while database_url reaches it.
owner_database_url    = ""
# The least-privilege login the MCP query tools connect as.
# Left empty this is database_url with the engine's reader login, which is its own login
# with _reader on the end and the same password.
readonly_database_url = ""
# The address the server listens on, which the panel, the CLI and the MCP
# endpoint all reach it at. Change it to run two komrads on one machine. It has to be a
# loopback host, since the api has no auth and its writes spawn agents.
addr                  = "127.0.0.1:8787"
# The tmux socket komrad runs its own server on. Nothing in your normal tmux sees
# that server, which is why `tmux -L komrad ls` is how you look at it directly.
tmux_socket           = "komrad"
# The directory where komrad keeps what it generates, such as the server log, the built-in
# scripts it writes out on every start, and the temp files a harness passes a prompt through.
# Left empty this is ~/Library/Caches/komrad on a Mac and ~/.cache/komrad on Linux.
# Everything under it is komrad's to delete and rewrite, so nothing of yours belongs here.
cache_dir             = ""
# The directory where komrad keeps its own files about agents, such as generated worktrees,
# released reviews and forge credentials.
# Left empty this is ~/.local/state/komrad.
# It holds credentials and is komrad's to manage, so nothing of yours belongs here.
state_dir             = ""
# The https address the engine is served on, like https://komrad.example.com. Left empty the
# engine is local and an agent's terminal is shown by moving its own pane into the panel. It
# may be plain http when its host is this machine.
url                   = ""
