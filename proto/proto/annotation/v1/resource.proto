syntax = "proto3";

package annotation.v1;

import "google/protobuf/descriptor.proto";

option go_package = "weave/proto/gen/annotation/v1;annotationv1";

extend google.protobuf.MessageOptions {
  // Which table the message is one row of, and which tables are rendered onto it.
  Resource resource = 50004;
}

message Resource {
  // The Postgres table this message is one row of.
  string table = 1;
  // The column the row is keyed by, "id" when empty.
  string key = 2;
  // Tables whose rows are rendered onto this one, and whose writes move it.
  repeated Projection projects = 3;
}

// Projection is one table rendered onto a resource, and how a row of it finds the resource
// it belongs to: by a column holding the resource's key, or by a lookup matching a column of
// the resource's table against one of its own.
message Projection {
  // The projected table.
  string table = 1;
  // The column on the projected row that holds the resource's key.
  string column = 2;
  // The column on the resource's table matched against via, when the key is not on the row.
  string lookup = 3;
  // The column on the projected row that lookup is matched against.
  string via = 4;
  // A condition on the resource's table narrowing the lookup, such as archived_at IS NULL.
  string where = 5;
}
