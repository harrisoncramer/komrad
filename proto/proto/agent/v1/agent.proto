      mcp: true
      name: "list_review_snapshots"
      description: "List the snapshots of a task, the caller's task by default, oldest first. Diff one snapshot's `sha` against the next to see what changed between them."
      roles: [
        ROLE_WRITER,
        ROLE_REVIEWER,
        ROLE_ORCHESTRATOR
      ]
    };
  }
  rpc ListReviews(ListReviewsRequest) returns (ListReviewsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "list_reviews"
      description: "List the reviews released on a task, the caller's task by default, in snapshot order, each with its verdict."
      roles: [
        ROLE_WRITER,
        ROLE_REVIEWER,
        ROLE_ORCHESTRATOR
      ]
    };
  }
  rpc GetReview(GetReviewRequest) returns (GetReviewResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "get_review"
      description: "Read one released review in full: the verdict, the note on the work, then each thread with the code it is pinned to. Line numbers are true of the snapshot."
      roles: [
        ROLE_WRITER,
        ROLE_REVIEWER,
        ROLE_ORCHESTRATOR
      ]
    };
  }
  rpc ReleaseReview(ReleaseReviewRequest) returns (ReleaseReviewResponse) {
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "release_review"
      description: "Release the caller's review with a verdict: approved only when the caller started no thread on the snapshot, changes requested when it started any. Komrad mails the agent under review once, naming the review for `get_review`. An approval tells the agent its work is done."
      destructive: false
      idempotent: false
      roles: [ROLE_REVIEWER]
    };
  }
  rpc SetReviewFileViewed(SetReviewFileViewedRequest) returns (SetReviewFileViewedResponse) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.surfaces) = {
      cli: false
      mcp: false
      reason: "Only the person can say which files of a diff they have read."
    };
  }
  rpc ListReviewViewedFiles(ListReviewViewedFilesRequest) returns (ListReviewViewedFilesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: false
      mcp: false
      reason: "Which files the person has read is of use only to the person."
    };
  }
}
