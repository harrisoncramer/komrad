      name: "resolve_review_thread"
      description: "Settle a review thread you wrote once its answer is good enough, or reopen one you settled too early. A review is finished when its threads are, not when a verdict is given, so this is how a finding is closed. Only the thread's author may settle it: a comment about your own work is not yours to resolve, however well you have answered it. The person reviewing may settle anything."
      destructive: false
      idempotent: true
      roles: [ROLE_REVIEWER]
    };
  }
  rpc OpenReviewRound(OpenReviewRoundRequest) returns (OpenReviewRoundResponse) {
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "open_review_round"
      description: "Freeze an agent's worktree as it stands and get back the round to review against. A round is a snapshot commit of the whole worktree, committed and uncommitted alike. Call this before reading the diff, and diff the round's base_sha against its snapshot_sha to see exactly what you are reviewing. A tree that has not changed since the last round returns that round, so calling twice is safe."
      destructive: false
      idempotent: true
      roles: [ROLE_REVIEWER]
    };
  }
  rpc ListReviewRounds(ListReviewRoundsRequest) returns (ListReviewRoundsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "list_review_rounds"
      description: "List the rounds taken of an agent, oldest first. Each round is a frozen snapshot of the worktree at that moment, so this is how you find what a review was given against and what changed between two rounds: diff one round's snapshot_sha against the next. Use open_review_round to take a new one."
      roles: [
        ROLE_IMPLEMENTER,
        ROLE_REVIEWER,
        ROLE_ORCHESTRATOR
      ]
    };
  }
  rpc ListReviews(ListReviewsRequest) returns (ListReviewsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "list_reviews"
      description: "List every review released on an agent, in round order, each with its verdict. This is how you find where a change stands: approved, changes requested or only commented, and how many rounds it took. The findings themselves are in the threads, which list_review_threads reads. Unreleased reviews are left out, since they are still the reviewer's own. You may read the reviews of your own work and of the agent you are a child of."
      roles: [
        ROLE_IMPLEMENTER,
        ROLE_REVIEWER,
        ROLE_ORCHESTRATOR
      ]
    };
  }
  rpc GetReview(GetReviewRequest) returns (GetReviewResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "get_review"
      description: "Read one released review whole, in reading order. It begins with the verdict and what the reviewer said about the work as a whole, then each thread with the file and lines it is pinned to, the code around them as the round held it, and the messages that came with this release. On a later round only the new comments appear. Line numbers are true of the snapshot rather than of your files now, so once you have edited, search for the quoted text instead. Answer each thread with add_review_message. You may read a review of your own work and of the agent you are a child of."
      roles: [
        ROLE_IMPLEMENTER,
        ROLE_REVIEWER,
        ROLE_ORCHESTRATOR
      ]
    };
  }
  rpc ReleaseReview(ReleaseReviewRequest) returns (ReleaseReviewResponse) {
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "release_review"
      description: "Send the review you have been writing on another agent's diff. Komrad mails the agent to say the review is there, and the agent reads it whole with get_review, so it arrives as one thing rather than a comment at a time. Give a verdict: approved if you wrote no comments on the round, changes requested if you wrote any, since every comment is blocking and a nit is still a comment, and commented for notes without a conclusion. Approved tells the agent it is done, so it is the last thing you say about a change rather than something to pair with findings. Set interrupt to stop the agent where it stands rather than waiting for its turn to end. The body is your note on the work as a whole, a few sentences at most. The comments carry the findings."
      destructive: false
      idempotent: false
      roles: [ROLE_REVIEWER]
    };
  }
  rpc SetReviewFileViewed(SetReviewFileViewedRequest) returns (SetReviewFileViewedResponse) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.surfaces) = {
      cli: false
      mcp: false
      reason: "Which files of a diff have been read is a person's own reading, which no agent can claim on their behalf."
    };
  }
  rpc ListReviewViewedFiles(ListReviewViewedFilesRequest) returns (ListReviewViewedFilesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: false
      mcp: false
      reason: "These marks are the record of which files a person has read, so only the panel drawing them back to that person has any use for them."
    };
  }
}
