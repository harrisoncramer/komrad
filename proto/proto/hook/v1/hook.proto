syntax = "proto3";

package hook.v1;

import "annotation/v1/tool.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";

option go_package = "komrad/proto/gen/hook/v1;hookv1";

// Hook is a script in the hooks directory.
message Hook {
  // The hook's file name in the hooks directory. A workflow names the hook by it.
  string name = 1;
  // Whether the file is executable. The hook cannot run until it is.
  bool executable = 2;
  // The description from the hook's header comments.
  string description = 3;
  // How long the hook may run. The header can shorten the `hooks.timeout` setting but not
  // lengthen it.
  optional google.protobuf.Duration timeout = 4;
  // The header lines that could not be read. Each one leaves its setting at the default.
  repeated string header_problems = 5;
}

message ListHooksResponse {
  // Every file in the hooks directory, executable or not.
  repeated Hook hooks = 1;
}

// HookService lists the hooks the person has written.
service HookService {
  rpc ListHooks(google.protobuf.Empty) returns (ListHooksResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "list_hooks"
      description: "List the hooks in the person's hooks directory, by the names `create_workflow` and `update_workflow` take."
      roles: [ROLE_ORCHESTRATOR]
    };
  }
}
