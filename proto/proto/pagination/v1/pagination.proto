syntax = "proto3";

package pagination.v1;

import "buf/validate/validate.proto";

option go_package = "komrad/proto/gen/pagination/v1;paginationv1";

// Pagination selects one page of a listing.
message Pagination {
  // How many records to return. Komrad caps the value, and picks one when unset.
  optional int32 limit = 1 [(buf.validate.field).int32.gte = 0];
  // The `next_page_token` from the previous response. Unset to start from the first page.
  optional string cursor = 2 [(buf.validate.field).string.max_len = 2048];
}
