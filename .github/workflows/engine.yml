name: engine

# Keeps the remote engine current with main.
#
# Two things go stale and they are not updated the same way. The binary changes on every merge, and
# replacing it is cheap and leaves the agents running, so that happens here automatically. The
# machine image changes when the units or the provisioning scripts change, and taking a new image
# means replacing the instance, which stops every agent on it. So the image is built here and its
# id recorded, and applying it is left to a person who knows what is running.
#
# CI reaches the engine through Systems Manager rather than ssh, because the engine only accepts
# ssh from named addresses and a runner does not have one.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: engine
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  changes:
    runs-on: namespace-profile-harrisoncramer
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            image:
              - 'packer/**'
              - 'mise/tasks/packer/**'
              - '.github/workflows/engine.yml'

  deploy:
    needs: [ci, changes]
    if: vars.AWS_CI_ROLE != ''
    runs-on: namespace-profile-harrisoncramer
    steps:
      - uses: actions/checkout@v4

      - name: Use Mise
        uses: ./.github/actions/use-mise
        with:
          gh-access-token: ${{ env.GH_ACCESS_TOKEN }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      # The backend is not in the repository, because it names an account's own bucket.
      - name: Point Terraform at the state
        run: |
          cat >infra/terraform/backend.hcl <<EOF
          bucket       = "${{ vars.TF_STATE_BUCKET }}"
          key          = "${{ vars.TF_STATE_KEY }}"
          region       = "${{ vars.AWS_REGION }}"
          encrypt      = true
          use_lockfile = true
          EOF

      - name: Read the state
        run: mise run terraform:init

      - name: Put this build on the engine
        run: mise run remote:deploy

  image:
    needs: [ci, changes]
    if: needs.changes.outputs.image == 'true' && vars.AWS_CI_ROLE != ''
    runs-on: namespace-profile-harrisoncramer
    steps:
      - uses: actions/checkout@v4

      - name: Use Mise
        uses: ./.github/actions/use-mise
        with:
          gh-access-token: ${{ env.GH_ACCESS_TOKEN }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Build the image
        run: mise run packer:build | tee /tmp/packer.log

      - name: Record what it built
        run: |
          AMI="$(grep -oE 'ami-[0-9a-f]+' /tmp/packer.log | tail -1)"
          if [ -z "$AMI" ]; then
            echo "packer printed no ami id, so there is nothing to record" >&2
            exit 1
          fi

          aws ssm put-parameter \
            --name "/${{ vars.ENGINE_NAME || 'weave-development' }}/engine/ami-id" \
            --type String --overwrite --value "$AMI"

          {
            echo "### A new engine image is ready"
            echo
            echo "    $AMI"
            echo
            echo "Applying it replaces the instance and stops every agent on it, so it is not"
            echo "applied here. Set \`ami_id\` to it in your \`terraform.tfvars\` and apply when"
            echo "the box is free."
          } >>"$GITHUB_STEP_SUMMARY"
