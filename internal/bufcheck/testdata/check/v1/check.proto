syntax = "proto3";

package check.v1;

message Request {}

message Response {}

service DeclaredService {
  rpc GetThing(Request) returns (Response) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc ListThings(Request) returns (Response) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc SearchThings(Request) returns (Response) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc SetThing(Request) returns (Response) {
    option idempotency_level = IDEMPOTENT;
  }
  rpc DeleteThing(Request) returns (Response) {
    option idempotency_level = IDEMPOTENT;
  }
  rpc CreateThing(Request) returns (Response) {}
  rpc Getaway(Request) returns (Response) {}
  rpc Settle(Request) returns (Response) {}
}

service BareService {
  rpc GetBare(Request) returns (Response) {}
  rpc SetBare(Request) returns (Response) {}
}

service WrongLevelService {
  rpc GetWrong(Request) returns (Response) {
    option idempotency_level = IDEMPOTENT;
  }
  rpc SetWrong(Request) returns (Response) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message IDRequest {
  string id = 1;
  string agent_id = 2;
  repeated string ids = 3;
  string name = 4;
  string identifier = 5;
}

service IDService {
  rpc GetThing(IDRequest) returns (Response) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

enum Colour {
  COLOUR_UNSPECIFIED = 0;
  COLOUR_RED = 1;
}

message EnumRequest {
  Colour colour = 1;
  string name = 2;
  repeated Colour colours = 3;
}

service EnumService {
  rpc GetEnum(EnumRequest) returns (Response) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message Inner {
  string agent_id = 1;
  Colour tint = 2;
  Loop loop = 3;
}

message Loop {
  optional Loop next = 1;
  string round_id = 2;
}

message NestedRequest {
  Inner inner = 1;
  map<string, Colour> palette = 2;
}

service NestedService {
  rpc GetNested(NestedRequest) returns (Response) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}
