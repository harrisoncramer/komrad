syntax = "proto3";

package session.v1;

import "annotation/v1/tool.proto";
import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";

option go_package = "claude-agents/proto/gen/session/v1;sessionv1";

// Session is one background Claude agent, as stored.
message Session {
  string id = 1;
  string name = 2;
  string cwd = 3;
  string flags = 4;
  string prompt = 5;
  string pane_id = 6;
  string state = 7;
  string claude_session_id = 8;
  // The workflow this chat belongs to. Optional so an unset value means the chat
  // is unassigned, distinct from an empty id.
  optional string workflow_id = 9;
  // When the chat was first created, as an RFC 3339 timestamp, for display.
  string created_at = 10;
}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

// CreateSessionRequest launches a background agent. The prompt and directory
// are required: a chat created over RPC has nobody at the keyboard, so one with
// no prompt would sit idle forever, and the tmux fallback for a blank directory
// resolves against whichever client happens to be current, which would let the
// same request start in a different repository each time it ran. A blank title
// is auto-named and blank flags mean the configured defaults alone.
message CreateSessionRequest {
  string prompt = 1 [(buf.validate.field).string = {
    min_len: 1,
    max_len: 50000
  }];
  string title = 2 [(buf.validate.field).string.max_len = 200];
  string dir = 3 [
    (buf.validate.field).string = {
      min_len: 1,
      max_len: 4096
    },
    (buf.validate.field).cel = {
      id: "dir.absolute",
      message: "dir must be an absolute path or start with ~",
      expression: "this.startsWith('/') || this.startsWith('~')"
    }
  ];
  // Flags are quoted before they reach the pane's shell, so this rule is the
  // second lock rather than the only one: it refuses the characters that would
  // mean anything to a shell, so a request carrying them is rejected outright
  // instead of being neutralised and run.
  string flags = 4 [
    (buf.validate.field).string.max_len = 500,
    (buf.validate.field).cel = {
      id: "flags.no_shell_metacharacters",
      message: "flags must not contain shell metacharacters",
      expression: "!this.matches('[;&|<>`$\\\\\\n]')"
    }
  ];
  // The workflow to place the chat in. Unset leaves it unassigned, which is
  // distinct from an empty id: that would name a workflow that cannot exist.
  optional string workflow_id = 5 [(buf.validate.field).string.min_len = 1];
}

message CreateSessionResponse {
  Session session = 1;
}

message GetSessionRequest {
  string name = 1 [(buf.validate.field).string = {
    min_len: 1,
    max_len: 200
  }];
}

message GetSessionResponse {
  Session session = 1;
}

// SetStateRequest moves a chat between lifecycle states. The state is closed:
// the store treats an unknown value as a state nothing renders, so a typo would
// make a chat vanish from every count rather than fail.
message SetStateRequest {
  string name = 1 [(buf.validate.field).string = {
    min_len: 1,
    max_len: 200
  }];
  string state = 2 [(buf.validate.field).string = {
    in: [
      "new",
      "thinking",
      "waiting",
      "done"
    ]
  }];
}

message DeleteSessionRequest {
  string name = 1 [(buf.validate.field).string = {
    min_len: 1,
    max_len: 200
  }];
}

// UpdateSessionRequest renames a chat by id. The name is what tmux and the
// store agree on, so the characters the store would rewrite are rejected here
// rather than silently changed underneath the caller.
message UpdateSessionRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  string name = 2 [
    (buf.validate.field).string = {
      min_len: 1,
      max_len: 200
    },
    (buf.validate.field).cel = {
      id: "name.tmux_safe",
      message: "name must not contain spaces, colons, or dots",
      expression: "!this.contains(' ') && !this.contains(':') && !this.contains('.')"
    }
  ];
}

message SearchTranscriptsRequest {
  // Three characters is the floor, not a stylistic minimum: the index uses a
  // trigram tokenizer, so a shorter query can never match anything and would
  // come back as a confident empty result.
  string query = 1 [(buf.validate.field).string = {
    min_len: 3,
    max_len: 500
  }];
  // Cap on results returned. Zero lets the server pick a default. The ceiling
  // keeps one query from pulling the whole corpus into a response.
  int32 limit = 2 [(buf.validate.field).int32 = {
    gte: 0,
    lte: 500
  }];
}

// SearchHit is one transcript matched by a search: the session it belongs to,
// its display name and whether it is soft-deleted, a snippet of the matching
// text with the matched terms wrapped in markers, and the relevance rank (lower
// is a better match).
message SearchHit {
  string session_id = 1;
  string snippet = 2;
  double rank = 3;
  string name = 4;
  bool deleted = 5;
}

message SearchTranscriptsResponse {
  repeated SearchHit hits = 1;
}

message GetTranscriptRequest {
  string session_id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetTranscriptResponse {
  // The full flattened transcript, empty when the session has none synced yet.
  string content = 1;
}

// SessionService reads and mutates the agent store. Every method carries a tool
// annotation, which is what puts it on the MCP surface: a method without one is
// not reachable from a model at all.
service SessionService {
  // Reads: no side effects, safe to cache and issue over GET.
  rpc ListSessions(google.protobuf.Empty) returns (ListSessionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.tool) = {
      tool_name: "list_sessions"
      description: "List every chat the panel tracks, live and dormant, with its name, state, working directory, flags, and workflow. Start here to find the id or name another tool needs."
    };
  }
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.tool) = {
      tool_name: "get_session"
      description: "Fetch one chat by its exact name. Names are unique among live chats. Returns not_found if no chat has that name."
    };
  }
  // CreateSession launches a background agent and returns it as stored. It is
  // not idempotent: each call spawns another chat, since two chats may
  // legitimately run the same prompt.
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse) {
    option (annotation.v1.tool) = {
      tool_name: "create_session"
      description: "Launch a background Claude chat with an opening prompt. Requires an absolute or ~-prefixed directory: this spawns a real agent in a real tmux window, and a relative path would resolve somewhere unpredictable. Each call spawns another chat, so do not retry a call that may have succeeded."
      destructive: false
    };
  }
  // Mutations key on the unique session name, so repeating them yields the same
  // state. They are idempotent and safe for the client to retry.
  rpc SetState(SetStateRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.tool) = {
      tool_name: "set_session_state"
      description: "Move a chat to one of new, thinking, waiting, or done. The reconciler derives state from the live pane every couple of seconds, so a value set here is overwritten shortly after unless the chat is dormant."
      destructive: false
    };
  }
  rpc DeleteSession(DeleteSessionRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.tool) = {
      tool_name: "delete_session"
      description: "Permanently remove a chat's record by name. This is a hard delete, not the panel's soft delete, and the transcript row goes with it. Prefer leaving chats alone unless asked to remove one."
      destructive: true
    };
  }
  // UpdateSession patches a session by id (currently its title/name).
  rpc UpdateSession(UpdateSessionRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.tool) = {
      tool_name: "rename_session"
      description: "Rename a chat, keyed by its id rather than its current name. The name is a display label that tmux also uses, so it may not contain spaces, colons, or dots."
      destructive: false
    };
  }
  // SearchTranscripts runs a full-text search over stored transcripts.
  rpc SearchTranscripts(SearchTranscriptsRequest) returns (SearchTranscriptsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.tool) = {
      tool_name: "search_transcripts"
      description: "Full-text search across every chat's conversation, including deleted ones, returning a ranked snippet per hit with the matched text marked. Substring matching, so partial words work. Use this to answer what was discussed; use query for the SQL view of the same data."
    };
  }
  // GetTranscript returns a session's full stored transcript by id.
  rpc GetTranscript(GetTranscriptRequest) returns (GetTranscriptResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.tool) = {
      tool_name: "get_transcript"
      description: "Fetch one chat's full transcript by session id, not by name. Transcripts can be very large; prefer search_transcripts when looking for something specific."
    };
  }
}
