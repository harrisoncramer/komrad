syntax = "proto3";

package agent.v1;

import "annotation/v1/tool.proto";
import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "pagination/v1/pagination.proto";

option go_package = "claude-agents/proto/gen/agent/v1;agentv1";

// Session is one background Claude agent, as stored.
message Agent {
  string id = 1;
  string name = 2;
  string cwd = 3;
  string flags = 4;
  string prompt = 5;
  string pane_id = 6;
  string state = 7;
  string claude_session_id = 8;
  // The workflow this agent belongs to. Optional so an unset value means the agent
  // is unassigned, distinct from an empty id.
  optional string workflow_id = 9;
  // When the agent was first created, as an RFC 3339 timestamp, for display.
  string created_at = 10;
  // Whether the agent's tmux pane is still running. It is observed at read time
  // rather than stored, so a caller does not need tmux of its own to tell a live
  // agent from a dormant one.
  bool alive = 11;
}

message ListAgentsRequest {
  optional pagination.v1.Pagination pagination = 1;
}

message ListAgentsResponse {
  repeated Agent agents = 1;
  // The token that fetches the page after this one, unset once the listing is
  // exhausted. A caller wanting every agent keeps calling until it is absent.
  optional string next_page_token = 2;
}

// CreateAgentRequest launches a background agent. The prompt and directory
// are required: an agent created over RPC has nobody at the keyboard, so one with
// no prompt would sit idle forever, and the tmux fallback for a blank directory
// resolves against whichever client happens to be current, which would let the
// same request start in a different repository each time it ran. A blank title
// is auto-named and blank flags mean the configured defaults alone.
message CreateAgentRequest {
  string prompt = 1 [(buf.validate.field).string = {
    min_len: 1,
    max_len: 50000
  }];
  // Control characters are refused here rather than sanitised: the title
  // becomes the tmux window name, and tmux rejects a name containing one, which
  // used to fail the launch in a way nothing checked.
  string title = 2 [
    (buf.validate.field).string.max_len = 200,
    (buf.validate.field).cel = {
      id: "title.printable",
      message: "title must not contain control characters",
      expression: "!this.matches('[\\x00-\\x1f\\x7f]')"
    }
  ];
  string dir = 3 [
    (buf.validate.field).string = {
      min_len: 1,
      max_len: 4096
    },
    (buf.validate.field).cel = {
      id: "dir.absolute",
      message: "dir must be an absolute path or start with ~",
      expression: "this.startsWith('/') || this.startsWith('~')"
    }
  ];
  // Flags are quoted before they reach the pane's shell, so this rule is the
  // second lock rather than the only one: it refuses the characters that would
  // mean anything to a shell, so a request carrying them is rejected outright
  // instead of being neutralised and run.
  string flags = 4 [
    (buf.validate.field).string.max_len = 500,
    (buf.validate.field).cel = {
      id: "flags.no_shell_metacharacters",
      message: "flags must not contain shell metacharacters",
      expression: "!this.matches('[;&|<>`$\\\\\\n]')"
    }
  ];
  // The workflow to place the agent in. Unset leaves it unassigned, which is
  // distinct from an empty id: that would name a workflow that cannot exist.
  optional string workflow_id = 5 [(buf.validate.field).string.min_len = 1];
}

message CreateAgentResponse {
  Agent agent = 1;
}

message GetAgentRequest {
  string name = 1 [(buf.validate.field).string = {
    min_len: 1,
    max_len: 200
  }];
}

message GetAgentResponse {
  Agent agent = 1;
}

// SetStateRequest moves an agent between lifecycle states. The state is closed:
// the store treats an unknown value as a state nothing renders, so a typo would
// make an agent vanish from every count rather than fail.
message SetStateRequest {
  string name = 1 [(buf.validate.field).string = {
    min_len: 1,
    max_len: 200
  }];
  string state = 2 [(buf.validate.field).string = {
    in: [
      "new",
      "thinking",
      "waiting",
      "done"
    ]
  }];
}

// ArchiveAgentRequest hides an agent without destroying it. This is what the
// panel's delete key does: the agent is stopped and the agent drops out of the
// listing, but its transcript stays searchable and it can be restored.
message ArchiveAgentRequest {
  string name = 1 [(buf.validate.field).string = {
    min_len: 1,
    max_len: 200
  }];
}

// RestoreAgentRequest brings an agent back, keyed by id rather than name: an
// archived agent's name may have been taken by a live one since, in which case
// restoring renames it.
message RestoreAgentRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message RestoreAgentResponse {
  Agent agent = 1;
}

message DeleteAgentRequest {
  string name = 1 [(buf.validate.field).string = {
    min_len: 1,
    max_len: 200
  }];
}

// UpdateAgentRequest renames an agent by id. The name is what tmux and the
// store agree on, so the characters the store would rewrite are rejected here
// rather than silently changed underneath the caller.
message UpdateAgentRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  string name = 2 [
    (buf.validate.field).string = {
      min_len: 1,
      max_len: 200
    },
    (buf.validate.field).cel = {
      id: "name.storable",
      message: "name must not contain spaces, colons, dots, slashes, or control characters",
      expression: "!this.contains(' ') && !this.contains(':') && !this.contains('.') && !this.contains('/') && !this.matches('[\\x00-\\x1f\\x7f]')"
    }
  ];
}

message SearchTranscriptsRequest {
  // Three characters is the floor, not a stylistic minimum: the index uses a
  // trigram tokenizer, so a shorter query can never match anything and would
  // come back as a confident empty result.
  string query = 1 [(buf.validate.field).string = {
    min_len: 3,
    max_len: 500
  }];
  optional pagination.v1.Pagination pagination = 2;
}

// SearchHit is one transcript matched by a search: the agent it belongs to,
// its display name and whether it is soft-deleted, a snippet of the matching
// text with the matched terms wrapped in markers, and the relevance rank.
message SearchHit {
  string agent_id = 1;
  string snippet = 2;
  // How many times the query occurs in the transcript. Results come back in
  // descending order of this, so an agent that discussed something at length
  // outranks one that mentioned it once.
  int64 occurrences = 3;
  string name = 4;
  bool deleted = 5;
}

message SearchTranscriptsResponse {
  repeated SearchHit hits = 1;
  // The token that fetches the page after this one, unset once the matches are
  // exhausted. It is tied to the query that produced it, so it is only ever sent
  // back alongside that same query.
  optional string next_page_token = 2;
}

message GetTranscriptRequest {
  string agent_id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetTranscriptResponse {
  // The full flattened transcript, empty when the agent has none synced yet.
  string content = 1;
}

// AgentService reads and mutates the agent store. Every method carries a tool
// annotation, which is what puts it on the MCP surface: a method without one is
// not reachable from a model at all.
service AgentService {
  // Reads: no side effects, safe to cache and issue over GET.
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.tool) = {
      tool_name: "list_agents"
      description: "List the agents the panel tracks, live and dormant, with each one\'s name, state, working directory, flags, and workflow. Agents soft-deleted from the panel are excluded, though search_transcripts still returns them. Returns one page, most recently updated first; pass the response\'s nextPageToken back as pagination.cursor for the next one. Start here to find the id or name another tool needs."
    };
  }
  rpc GetAgent(GetAgentRequest) returns (GetAgentResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.tool) = {
      tool_name: "get_agent"
      description: "Fetch one agent by its exact name. Names are unique among live agents. Returns not_found if no agent has that name."
    };
  }
  // CreateAgent launches a background agent and returns it as stored. It is
  // not idempotent: each call spawns another agent, since two agents may
  // legitimately run the same prompt.
  rpc CreateAgent(CreateAgentRequest) returns (CreateAgentResponse) {
    option (annotation.v1.tool) = {
      tool_name: "create_agent"
      description: "Launch a background Claude agent with an opening prompt. Requires an absolute or ~-prefixed directory: this spawns a real agent in a real tmux window, and a relative path would resolve somewhere unpredictable. Each call spawns another agent, so do not retry a call that may have succeeded."
      destructive: false
    };
  }
  // Mutations key on the unique agent name, so repeating them yields the same
  // state. They are idempotent and safe for the client to retry.
  rpc SetState(SetStateRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.tool) = {
      tool_name: "set_agent_state"
      description: "Move an agent to one of new, thinking, waiting, or done. The reconciler derives state from the live pane every couple of seconds, so a value set here is overwritten shortly after unless the agent is dormant."
      destructive: false
    };
  }
  rpc ArchiveAgent(ArchiveAgentRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.tool) = {
      tool_name: "archive_agent"
      description: "Stop an agent and hide it from the panel, keeping its record and transcript. Prefer this to delete_agent: it is reversible with restore_agent, and search_transcripts still finds the conversation. Returns not_found if no agent has that name."
      destructive: false
    };
  }
  rpc RestoreAgent(RestoreAgentRequest) returns (RestoreAgentResponse) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.tool) = {
      tool_name: "restore_agent"
      description: "Bring an agent back and relaunch claude on the same conversation, keyed by id. Works on archived agents and on ones whose pane has since died. An agent that is already running is returned as it stands rather than started twice. The agent may come back under a new name if another has taken its old one."
      destructive: false
    };
  }
  rpc DeleteAgent(DeleteAgentRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.tool) = {
      tool_name: "delete_agent"
      description: "Permanently remove an agent's record by name. This is a hard delete, not the panel's soft delete, and the transcript row goes with it. Prefer leaving agents alone unless asked to remove one."
      destructive: true
    };
  }
  // UpdateAgent patches an agent by id (currently its title/name).
  rpc UpdateAgent(UpdateAgentRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.tool) = {
      tool_name: "rename_agent"
      description: "Rename an agent, keyed by its id rather than its current name. The name is a display label the store keys on; the running tmux window keeps whatever it was called at launch. It may not contain spaces, colons, dots, slashes, or control characters."
      destructive: false
    };
  }
  // SearchTranscripts runs a full-text search over stored transcripts.
  rpc SearchTranscripts(SearchTranscriptsRequest) returns (SearchTranscriptsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.tool) = {
      tool_name: "search_transcripts"
      description: "Full-text search across every agent's conversation, including deleted ones, returning a ranked snippet per hit with the matched text marked. Substring matching, so partial words work. Returns one page, best match first; pass the response's nextPageToken back as pagination.cursor alongside the same query for the next one. Use this to answer what was discussed; use query for the SQL view of the same data."
    };
  }
  // GetTranscript returns an agent's full stored transcript by id.
  rpc GetTranscript(GetTranscriptRequest) returns (GetTranscriptResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.tool) = {
      tool_name: "get_transcript"
      description: "Fetch one agent's full transcript by agent id, not by name. Transcripts can be very large; prefer search_transcripts when looking for something specific."
    };
  }
}
