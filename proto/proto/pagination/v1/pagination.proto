syntax = "proto3";

package pagination.v1;

import "buf/validate/validate.proto";

option go_package = "weave/proto/gen/pagination/v1;paginationv1";

message Pagination {
  optional int32 limit = 1 [(buf.validate.field).int32.gte = 0];
  optional string cursor = 2 [(buf.validate.field).string.max_len = 2048];
}
