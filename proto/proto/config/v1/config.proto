syntax = "proto3";

package config.v1;

import "annotation/v1/tool.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";

option go_package = "weave/proto/gen/config/v1;configv1";

message GetConfigResponse {
  // The configuration as it stands, keyed the way the user's own file is, with the connection
  // strings redacted.
  google.protobuf.Struct config = 1;
  // Why the user's file would not parse, in which case the configuration above is the defaults
  // the panel fell back to.
  optional string config_error = 2;
  // The build the server answering is running, which is what to quote in a bug report.
  string version = 3;
}

// ConfigService reads the configuration the panel is running on, with the connection strings
// redacted.
service ConfigService {
  rpc GetConfig(google.protobuf.Empty) returns (GetConfigResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "get_config"
      description: "Read the panel's configuration as it is currently in force, keyed the same way the user's config file is. Covers the default flags every new agent inherits and the keybindings for each of the panel's screens. Anything the user left out of their file reads back as the built-in default. A configError in the response means their file would not parse, in which case the configuration returned is the defaults the panel is running on instead. The version is the build the server answering you is running, which is worth quoting in a bug report about behaviour that makes no sense."
    };
  }
}
