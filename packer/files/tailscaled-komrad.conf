[Unit]
Wants=network-online.target
After=network-online.target nftables.service komrad-data-volume.service
Requires=komrad-data-volume.service
RequiresMountsFor=/var/lib/komrad
ConditionPathIsMountPoint=/var/lib/komrad
ConditionPathExists=/etc/komrad/tailscale.env

[Service]
EnvironmentFile=/etc/komrad/tailscale.env
Environment=TS_PERMIT_CERT_UID=caddy
RuntimeDirectoryMode=0750
ExecStartPost=/usr/bin/chgrp caddy /run/tailscale
ExecStart=
ExecStart=/usr/sbin/tailscaled --state=${KOMRAD_TAILSCALE_STATE} --statedir=/var/lib/komrad/tailscale --socket=/run/tailscale/tailscaled.sock --port=${PORT}
RestartSec=5
