services:
  # The machines komrad doctor is written for, each the same image at a different stage of
  # having been set up. They are the only way to see the first-run experience, since the
  # machine this is developed on has every dependency already.
  #
  # They sit behind a profile and are run rather than brought up: each one runs the binary once
  # and exits. Drive them with `mise run doctor:sandbox <stage>`, which builds the binary they
  # mount first.
  doctor-bare:
    profiles: ["doctor"]
    build: &doctor-sandbox-build
      context: docker
      dockerfile: doctor-sandbox.Dockerfile
      target: bare
    volumes: &doctor-sandbox-volumes
      - ./bin/komrad-linux:/usr/local/bin/komrad:ro

  doctor-tmux-old:
    profiles: ["doctor"]
    build:
      <<: *doctor-sandbox-build
      target: tmux-old
    volumes: *doctor-sandbox-volumes

  doctor-tmux:
    profiles: ["doctor"]
    build:
      <<: *doctor-sandbox-build
      target: tmux
    volumes: *doctor-sandbox-volumes

  # A Postgres of the sandbox's own, on no volume and no published port, standing in for one the
  # person runs instead of the embedded Postgres. It starts empty every run, which is also what
  # the checks want to see.
  doctor-db:
    profiles: ["doctor"]
    image: postgres:18
    environment:
      POSTGRES_USER: komrad
      POSTGRES_PASSWORD: komrad
      POSTGRES_DB: komrad
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "komrad"]
      interval: 2s
      timeout: 5s
      retries: 15

  # The same machine with a Postgres reachable, for the checks that need one to answer.
  # Override KOMRAD_DATABASE_URL on the run to point it at a database that is missing, unmigrated,
  # or refusing the password.
  doctor-postgres:
    profiles: ["doctor"]
    build:
      <<: *doctor-sandbox-build
      target: tmux
    volumes: *doctor-sandbox-volumes
    depends_on:
      doctor-db:
        condition: service_healthy
    environment:
      KOMRAD_DATABASE_URL: postgres://komrad:komrad@doctor-db:5432/komrad?sslmode=disable
