syntax = "proto3";

package surface.v1;

import "annotation/v1/tool.proto";

message Request {}

message Response {}

service SurfaceService {
  rpc Everyone(Request) returns (Response) {
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "everyone"
      description: "Reachable from a model and from a script."
      roles: [ROLE_IMPLEMENTER, ROLE_REVIEWER, ROLE_ORCHESTRATOR]
    };
  }
  rpc ScriptOnly(Request) returns (Response) {
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: false
      name: "script_only"
      description: "Reachable from a script but not offered to a model."
      reason: "A model has no business with it."
    };
  }
  rpc PanelKept(Request) returns (Response) {
    option (annotation.v1.surfaces) = {
      cli: false
      mcp: false
      reason: "The panel keeps this one."
    };
  }
  rpc Undeclared(Request) returns (Response) {}
  rpc ModelOnly(Request) returns (Response) {
    option (annotation.v1.surfaces) = {
      cli: false
      mcp: true
      name: "model_only"
      description: "A tool with no command."
      reason: "Nobody wants this."
    };
  }
  rpc Nameless(Request) returns (Response) {
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      description: "Carries everything but the name both surfaces are generated under."
    };
  }
  rpc Wordless(Request) returns (Response) {
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "wordless"
    };
  }
  rpc Silent(Request) returns (Response) {
    option (annotation.v1.surfaces) = {
      cli: false
      mcp: false
    };
  }
  rpc Apologetic(Request) returns (Response) {
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "apologetic"
      description: "On every surface."
      roles: [ROLE_IMPLEMENTER, ROLE_REVIEWER, ROLE_ORCHESTRATOR]
      reason: "Explains an omission that is not there."
    };
  }
  rpc Roleless(Request) returns (Response) {
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "roleless"
      description: "A tool that does not say who carries it."
    };
  }
}
