syntax = "proto3";

package workflow.v1;

import "annotation/v1/tool.proto";
import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "pagination/v1/pagination.proto";

option go_package = "claude-agents/proto/gen/workflow/v1;workflowv1";

// Workflow is a named bucket of related chats. It runs nothing itself: it holds
// a label, shared context injected into the chats spawned inside it, and the
// working directory and flags those chats start from.
message Workflow {
  string id = 1;
  string name = 2;
  // Free-text durable state the user edits. Chats created inside the workflow
  // get it appended to their system prompt as a snapshot at launch, so editing
  // it reaches only chats spawned afterwards.
  string context = 3;
  string cwd = 4;
  string flags = 5;
}

message ListWorkflowsRequest {
  optional pagination.v1.Pagination pagination = 1;
}

message ListWorkflowsResponse {
  repeated Workflow workflows = 1;
  // The token that fetches the page after this one, unset once the listing is
  // exhausted.
  optional string next_page_token = 2;
}

message GetWorkflowRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetWorkflowResponse {
  Workflow workflow = 1;
}

// CreateWorkflowRequest describes a new bucket. Only the name is required; a
// workflow with no context, directory, or flags is a plain folder, which is a
// perfectly ordinary thing to want.
message CreateWorkflowRequest {
  string name = 1 [(buf.validate.field).string = {
    min_len: 1,
    max_len: 200
  }];
  string context = 2 [(buf.validate.field).string.max_len = 50000];
  // Blank means chats inside this workflow choose their own directory. When set
  // it must be absolute or ~-prefixed, matching what creating a chat demands,
  // since this is the value prefilled into that form.
  string cwd = 3 [
    (buf.validate.field).string.max_len = 4096,
    (buf.validate.field).cel = {
      id: "cwd.absolute_or_blank",
      message: "cwd must be blank, absolute, or start with ~",
      expression: "this == '' || this.startsWith('/') || this.startsWith('~')"
    }
  ];
  string flags = 4 [
    (buf.validate.field).string.max_len = 500,
    (buf.validate.field).cel = {
      id: "flags.no_shell_metacharacters",
      message: "flags must not contain shell metacharacters",
      expression: "!this.matches('[;&|<>`$\\\\\\n]')"
    }
  ];
}

message CreateWorkflowResponse {
  Workflow workflow = 1;
}

// UpdateWorkflowRequest replaces a workflow's editable fields. Every field is
// sent, so an omitted one reads as cleared rather than unchanged: fetch the
// workflow, change what you mean to, and send it back.
message UpdateWorkflowRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  string name = 2 [(buf.validate.field).string = {
    min_len: 1,
    max_len: 200
  }];
  string context = 3 [(buf.validate.field).string.max_len = 50000];
  string cwd = 4 [
    (buf.validate.field).string.max_len = 4096,
    (buf.validate.field).cel = {
      id: "cwd.absolute_or_blank",
      message: "cwd must be blank, absolute, or start with ~",
      expression: "this == '' || this.startsWith('/') || this.startsWith('~')"
    }
  ];
  string flags = 5 [
    (buf.validate.field).string.max_len = 500,
    (buf.validate.field).cel = {
      id: "flags.no_shell_metacharacters",
      message: "flags must not contain shell metacharacters",
      expression: "!this.matches('[;&|<>`$\\\\\\n]')"
    }
  ];
}

// DeleteWorkflowRequest removes a workflow. What happens to the chats inside it
// is the caller's choice, and it is the whole of the decision: the workflow goes
// either way.
message DeleteWorkflowRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  // Leave false to orphan the chats back to unassigned, which loses nothing.
  // Set true to archive them alongside the workflow, hiding them from the panel
  // while search can still reach them.
  bool archive_chats = 2;
}

// WorkflowService manages the buckets chats are grouped into. Every method
// carries a tool annotation, which is what puts it on the MCP surface.
service WorkflowService {
  rpc ListWorkflows(ListWorkflowsRequest) returns (ListWorkflowsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.tool) = {
      tool_name: "list_workflows"
      description: "List the workflows chats are grouped into, most recently updated first, with each one's shared context and the working directory and flags its chats start from. Returns one page; pass the response's nextPageToken back as pagination.cursor for the next."
    };
  }
  rpc GetWorkflow(GetWorkflowRequest) returns (GetWorkflowResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.tool) = {
      tool_name: "get_workflow"
      description: "Fetch one workflow by id. Returns not_found if no workflow has that id."
    };
  }
  rpc CreateWorkflow(CreateWorkflowRequest) returns (CreateWorkflowResponse) {
    option (annotation.v1.tool) = {
      tool_name: "create_workflow"
      description: "Create a workflow to group chats under. Nothing runs as a result; this is organisation. The cwd and flags become the defaults prefilled when a chat is created inside it, and the context is appended to those chats' system prompts."
      destructive: false
    };
  }
  rpc UpdateWorkflow(UpdateWorkflowRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.tool) = {
      tool_name: "update_workflow"
      description: "Replace a workflow's name, context, directory, and flags. Every field is written, so read the workflow first and send back the ones you are not changing. Editing the context reaches only chats spawned afterwards, since existing chats took a snapshot at launch."
      destructive: false
    };
  }
  rpc DeleteWorkflow(DeleteWorkflowRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.tool) = {
      tool_name: "delete_workflow"
      description: "Remove a workflow. By default its chats are orphaned back to unassigned and keep running. Set archiveChats to hide them alongside it, which leaves them findable through search_transcripts. Neither form deletes a transcript."
      destructive: true
    };
  }
}
