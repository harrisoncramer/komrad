version: "2"
# The integration tests carry a build tag, so without this the linter would not read them
# at all and every rule below would stop at the files a unit run compiles.
run:
  build-tags:
    - integration
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
linters:
  enable:
    - bodyclose
    - komradlint
    - unparam
    - exhaustive
    - fussy
    - depguard
    - importas
    - copyloopvar
    - errorlint
    - fatcontext
    - forcetypeassert
    - nilerr
    - nilnil
    - gocritic
    - iface
    - inamedparam
    - noctx
    - testifylint
    - sloglint
    - usetesting
    - errname
    - forbidigo
    - godot
    - predeclared
    - misspell
    - dupword
    - whitespace
    - wastedassign
    - unconvert
    - mirror
    - makezero
    - tparallel
    - intrange
    - nlreturn
    - revive
    - thelper
    - nolintlint
    - usestdlibvars
    - gocheckcompilerdirectives
    - dogsled
    - godox
    - asasalint
    - asciicheck
    - bidichk
    - durationcheck
    - spancheck
    - errchkjson
    - musttag
    - reassign
    - nakedret
    - exptostd
    - nilnesserr
    - containedctx
    - decorder
  settings:
    errcheck:
      # A discarded error is the same bug whether it went to _ or nowhere, so the blank
      # form is checked too. What is excluded below is the handful of calls where the zero
      # value genuinely is the answer.
      check-blank: true
      check-type-assertions: true
      exclude-functions:
        # Cleanup that runs in a defer, where the caller has already returned and there is
        # nothing left to report the failure to.
        - (github.com/jackc/pgx/v5.Tx).Rollback
        - (*github.com/jackc/pgx/v5.Conn).Close
        - (*komrad/internal/store.Pool).Close
        - (*os.File).Close
        - (io.Closer).Close
        # Fails only with no HOME, and every caller treats the empty string as the fallback
        # it would have chosen anyway.
        - os.UserHomeDir
    staticcheck:
      checks:
        - all
    forbidigo:
      # Explainer: driving a real git is what makes a test slow and what makes it flake under
      # load, so the suite is split into unit tests and integration tests, and only the
      # packages below pay for it. The rule is written against the calls rather than the
      # imports, since a unit test that hands over a fake still imports komrad/internal/git
      # for the types the fake is written in.
      analyze-types: true
      forbid:
        - pattern: ^git\.NewClient$
          msg: a unit test takes the git seam and hands over a fake
        - pattern: ^git\.Run$
          msg: a unit test does not run git itself
        - pattern: ^exec\.Command(Context)?$
          msg: a unit test does not shell out to git
        - pattern: ^(fmt\.Print(|f|ln)|print|println)$
          msg: log through internal/logging
        - pattern: ^log\.(Print|Fatal|Panic)(|f|ln)$
          msg: log through internal/logging
        - pattern: ^proto\.(String|Bool|Int32|Int64|Uint32|Uint64|Float32|Float64)$
          msg: take a pointer with xptr.Ptr
        - pattern: ^sort\.
          msg: sort with slices
        - pattern: ^os\.Rename$
          msg: write a file in place with xfile.WriteAtomic
        - pattern: ^time\.Sleep$
          msg: sleep with clock.Sleep so the wait ends with its context
        - pattern: ^context\.(Background|TODO)$
          msg: take the caller's context
        - pattern: ^slog\.Default$
          msg: log on logging.From(ctx) or a logger handed in
        - pattern: ^pgx\.ErrNoRows$
          msg: ask db.IsNoRows whether Postgres found nothing
        - pattern: ^connect\.NewError$
          msg: answer through rpcerr
        - pattern: ^os\.Exit$
          msg: return the error and let main exit
    depguard:
      # The layers, as docs/src/content/guides/how-it-works.md describes them. A layer may call the one below it
      # and may not reach past it, and the panel receives its adapters rather than
      # importing them. These are cheap to keep and expensive to rediscover.
      rules:
        presentation:
          files:
            - "**/internal/ui/paint/**"
          deny:
            - pkg: komrad/internal/store
              desc: the drawing primitives hold no domain, so nothing here reads a record
            - pkg: komrad/db
              desc: the drawing primitives hold no domain, so nothing here reads a record
            - pkg: komrad/proto
              desc: the drawing primitives hold no domain, so nothing here reads a record
            - pkg: komrad/internal/ui
              desc: paint is under the panel rather than beside it, so it never reaches back up
        shared:
          files:
            - "**/internal/ui/keys/**"
            - "**/internal/ui/zone/**"
            - "**/internal/ui/list/**"
            - "**/internal/ui/field/**"
            - "**/internal/ui/screen/**"
            - "**/internal/ui/menu/**"
            - "**/internal/ui/form/**"
            - "**/internal/ui/pickfont/**"
            - "**/internal/ui/api/**"
            - "**/internal/ui/editor/**"
            - "**/internal/ui/column/**"
            - "**/internal/ui/legend/**"
            - "**/internal/ui/tabs/**"
            - "**/internal/ui/record/**"
            - "**/internal/ui/filter/**"
            - "**/internal/ui/cursor/**"
            - "**/internal/ui/diffview/**"
            - "**/internal/ui/layout/**"
            - "**/internal/ui/logview/**"
            - "**/internal/ui/paint/**"
            - "**/internal/ui/panel/**"
            - "**/internal/ui/reader/**"
            - "**/internal/ui/savedscreen/**"
            - "**/internal/ui/submitting/**"
          deny:
            - pkg: komrad/internal/ui$
              desc: a shared package sits under the panel's screens, so it never reaches back up into the root
            - pkg: komrad/internal/ui/logs$
              desc: a shared package sits under the screen domains, so it never imports one
            - pkg: komrad/internal/ui/checks$
              desc: a shared package sits under the screen domains, so it never imports one
            - pkg: komrad/internal/ui/schedules$
              desc: a shared package sits under the screen domains, so it never imports one
        domains:
          files:
            - "**/internal/ui/logs/**"
            - "**/internal/ui/checks/**"
            - "**/internal/ui/schedules/**"
          list-mode: lax
          allow:
            - komrad/internal/ui/api$
            - komrad/internal/ui/column$
            - komrad/internal/ui/cursor$
            - komrad/internal/ui/diffview$
            - komrad/internal/ui/editor$
            - komrad/internal/ui/field$
            - komrad/internal/ui/filter$
            - komrad/internal/ui/form$
            - komrad/internal/ui/keys$
            - komrad/internal/ui/layout$
            - komrad/internal/ui/legend$
            - komrad/internal/ui/list$
            - komrad/internal/ui/logview$
            - komrad/internal/ui/menu$
            - komrad/internal/ui/paint$
            - komrad/internal/ui/paint/label$
            - komrad/internal/ui/panel$
            - komrad/internal/ui/paneltest$
            - komrad/internal/ui/pickfont$
            - komrad/internal/ui/reader$
            - komrad/internal/ui/record$
            - komrad/internal/ui/savedscreen$
            - komrad/internal/ui/screen$
            - komrad/internal/ui/submitting$
            - komrad/internal/ui/tabs$
            - komrad/internal/ui/zone$
          deny:
            - pkg: komrad/internal/ui
              desc: a screen domain reaches the panel through the shared packages and the requests it returns, so it never imports the root or another domain
        panel:
          files:
            - "**/internal/ui/**"
          deny:
            - pkg: komrad/internal/tmux$
              desc: the panel takes what it needs of tmux as a dependency, so the option names stay in the adapter
            - pkg: komrad/internal/git$
              desc: the panel takes what it reads of git as a dependency or over the API, never running git itself
            - pkg: komrad/internal/harness
              desc: which CLI an agent runs is the service's business, and reaches the panel as data
            - pkg: komrad/internal/scripts
              desc: the panel lists and fires scripts over the API rather than reading the directory
            - pkg: komrad/internal/agents
              desc: the panel is a client of the service, not a caller of it in process
            - pkg: komrad/db
              desc: the panel holds no database connection
            - pkg: komrad/internal/store
              desc: the panel knows nothing the service has not told it, so a record reaches it as a proto and is kept in its own shape
            - pkg: komrad/internal/rpc/
              desc: a handler's helpers convert between the store and the wire, and the panel has no store to convert from
        transport:
          files:
            - "!$test"
            - "**/internal/rpc/**"
            - "**/internal/mcp/**"
          deny:
            - pkg: komrad/internal/tmux
              desc: a handler translates and nothing more, so what tmux can do reaches it through the service
            - pkg: komrad/internal/harness
              desc: same reason, and the service restates the refusals a handler maps on
            - pkg: komrad/internal/scripts
              desc: same reason, with agents.Script naming a script for a handler that has to describe one
            - pkg: komrad/db
              desc: a handler holds no database connection
        domain:
          files:
            - "**/internal/agents/**"
            - "**/internal/checkouts/**"
            - "**/internal/documents/**"
            - "**/internal/mail/**"
            - "**/internal/pullrequests/**"
            - "**/internal/reviews/**"
            - "**/internal/schedules/**"
            - "**/internal/scriptrun/**"
            - "**/internal/tasks/**"
            - "**/internal/transcripts/**"
            - "**/internal/worktrees/**"
          list-mode: lax
          allow:
            - komrad/proto/gen/oneofs
            - komrad/proto/gen/event/v1
          deny:
            - pkg: komrad/proto/gen
              desc: the service decides in its own types, and rendering them onto the wire is the handler's job
            - pkg: connectrpc.com/connect
              desc: the service returns a sentinel, and rpcerr picks the code it answers with
        peers-of-agents:
          files:
            - "!$test"
            - "**/internal/checkouts/**"
            - "**/internal/documents/**"
            - "**/internal/mail/**"
            - "**/internal/pullrequests/**"
            - "**/internal/reviews/**"
            - "**/internal/schedules/**"
            - "**/internal/scriptrun/**"
            - "**/internal/tasks/**"
            - "**/internal/transcripts/**"
            - "**/internal/worktrees/**"
          deny:
            - pkg: komrad/internal/agents$
              desc: the other domain services sit beside the lifecycle and below it, so the lifecycle calls them and its sentinels reach them through agenterr
        agenterr:
          files:
            - "**/internal/agenterr/**"
          list-mode: lax
          allow:
            - komrad/internal/fail
          deny:
            - pkg: komrad/internal
              desc: agenterr is imported by every domain package and so may depend on nothing but fail
        doctor:
          files:
            - "**/internal/doctor/**"
          deny:
            - pkg: komrad/internal/view
              desc: doctor reads the glyph table from glyph, so it never pulls in the list's renderer
            - pkg: komrad/internal/ui/paint$
              desc: same reason as view
        protoconv:
          files:
            - "**/lib/protoconv/**"
          list-mode: lax
          allow:
            - komrad/lib/protoconv
          deny:
            - pkg: komrad
              desc: protoconv does not import anything, in case I want to pull it out into it's own library
        stores:
          files:
            - "**/internal/store/**"
          list-mode: lax
          allow:
            - komrad/proto/gen/watch/v1
            - komrad/proto/gen/event/v1
          deny:
            - pkg: komrad/internal/agents
              desc: a store holds no rules, so nothing above it belongs here
            - pkg: komrad/internal/tmux
              desc: a store writes rows, and what is true of tmux reaches it as an argument
            - pkg: komrad/internal/harness
              desc: same reason as tmux
            - pkg: komrad/internal/ui
              desc: nothing below the panel may depend on it
            - pkg: komrad/proto/gen
              desc: a row is the store's own struct, and two layers above it decide what the wire sees
            - pkg: connectrpc.com/connect
              desc: same reason as the wire types
        adapters:
          files:
            - "**/internal/tmux/**"
            - "**/internal/harness/**"
            - "**/internal/scripts/**"
          deny:
            - pkg: komrad/internal/store
              desc: an adapter is a seam in front of something komrad does not own, and knows nothing of rows
            - pkg: komrad/internal/agents
              desc: the service calls the adapter rather than the other way round
            - pkg: komrad/internal/ui
              desc: same reason
            - pkg: komrad/proto/gen
              desc: what tmux or a CLI can do is komrad's own vocabulary, not the wire's
            - pkg: connectrpc.com/connect
              desc: same reason as the wire types
        handler-tests:
          files:
            - "**/internal/rpc/**/*_test.go"
          deny:
            - pkg: komrad/internal/storetest
              desc: a handler takes its service as an interface, so its test hands in a fake service and covers only what the handler adds
            - pkg: komrad/internal/pgtest
              desc: same reason as storetest
        generated-queries:
          files:
            - "**/*.go"
            - "!**/internal/store/**"
            - "!**/db/**"
          deny:
            - pkg: komrad/db/models
              desc: the generated queries are the store's to call, so a caller goes through the domain store
        config:
          files:
            - "**/config/**"
            - "!**/internal/**"
          list-mode: lax
          allow:
            - komrad/internal/glyph
            - komrad/internal/loader
            - komrad/internal/theme
          deny:
            - pkg: komrad/internal
              desc: config is read by everything and so may depend on nothing
    importas:
      no-unaliased: true
      alias:
        - pkg: komrad/internal/store/(\w+)
          alias: ${1}store
        - pkg: komrad/proto/gen/(\w+)/v1
          alias: ${1}v1
    sloglint:
      # Every line in komrad is written with LogAttrs, on the logger the context carries, so a
      # line reaches the log with the request's trace on it rather than bare.
      context: all
      attr-only: true
      no-global: all
      # The keys are OpenTelemetry names declared once in internal/logging, so a literal at
      # the call site is a key nothing else will ever match on.
      no-raw-keys: true
      # A message built with Sprintf is a message no query can group by, and the arguments it
      # interpolates belong in attributes where they can be filtered.
      static-msg: true
      msg-style: lowercased
    usetesting:
      # A test's own context is cancelled when the test ends, so work it started cannot
      # outlive it and hold a database handle open into the next one.
      context-background: true
      context-todo: true
      os-temp-dir: true
    nlreturn:
      block-size: 2
    revive:
      rules:
        - name: receiver-naming
          arguments:
            - maxLength: 2
        - name: argument-limit
          arguments:
            - 4
    thelper:
      # A table row's check closure takes t too, and it is the helper's parameter position
      # and name that are held rather than its first statement.
      test:
        begin: false
    nolintlint:
      require-explanation: true
      require-specific: true
    exhaustive:
      check:
        - switch
      default-signifies-exhaustive: false
      # A member named for an end is one past the last real state, there to give a caller walking
      # an enum a bound that moves on its own, so no switch answers for it.
      ignore-enum-members: End$
    custom:
      komradlint:
        type: module
        description: Checks for komrad's own conventions.
        settings:
          sentinel_inline:
            skip: false
            exclude: []
          wrap_phrase:
            skip: false
            # Unanchored regexps over the path lint was run from. A config error names the key
            # it is about, and the docs generator names the file it was writing.
            exclude:
              - ^config/
              - ^cmd/gen-docs/
          oneline_func:
            skip: false
          params_shape:
            skip: false
            exclude: []
          single_append:
            skip: false
            # Unanchored regexps over the path lint was run from. The package that defines Map,
            # the sqlc output nobody edits, and protoconv, which imports nothing from komrad.
            exclude:
              - ^lib/xslice/
              - ^db/models/
              - ^db/testmodels/
              - ^lib/protoconv/
          conversion_name:
            skip: false
            # Unanchored regexps over the path lint was run from. The service builds proto
            # messages, so its converters are renderX.
            render:
              - ^internal/rpc/
            # The panel reads proto messages, so its converters are xFrom, never protoToX,
            # xFromProto or renderX.
            from:
              - ^internal/ui/
          bare_http:
            skip: false
            # Unanchored regexps over the path lint was run from. The one package that builds
            # the configured client and transport everything else uses.
            exclude:
              - ^lib/xhttp/
          secret_expose:
            skip: false
            # Where Expose may be called, spelled as types.Func.FullName spells a function. The
            # header that sends the token and the store that keeps it, and nothing else.
            allow:
              - (komrad/internal/forge.Credential).HeaderValue
              - (*komrad/internal/forge.FileStore).Set
              - komrad/internal/cli.tokenForTheWire
          handler_shape:
            skip: false
            # Unanchored regexps over the path lint was run from. The adapter's own signature is
            # the one this rule looks for.
            exclude:
              - ^internal/rpcerr/
          sentinel_kind:
            skip: false
            # Unanchored regexps over the path lint was run from. Nothing a caller reaches
            # through the RPC layer is declared in these, so their sentinels answer no status
            # code: the panel's own screens, the CLI's control flow, the diff the panel draws
            # for itself, configuration, the pool held open before a request can arrive, and
            # protoconv, which imports nothing from komrad and so cannot reach fail.
            exclude:
              - ^internal/ui/
              - ^internal/errui/
              - ^internal/cli/
              - ^internal/diff/
              - ^internal/interceptors/
              - ^config/
              - ^db/
              - ^lib/protoconv/
          black_box:
            skip: false
            # The panel's stories are in package ui_test and each domain's own test package, where
            # they can only reach the model and a domain's screen through the harness.
            types:
              - komrad/internal/ui.model
              - komrad/internal/ui/logs.Screen
              - komrad/internal/ui/checks.Screen
              - komrad/internal/ui/checks.Logs
              - komrad/internal/ui/schedules.Screen
              - komrad/internal/ui/schedules.Archive
            # Unanchored regexps over the path lint was run from.
            exclude:
              # Table tests over the screens' key tables, which are typed over the model. They read
              # the tables and never drive the model.
              - ^internal/ui/list_internal_test\.go$
              - ^internal/ui/help_internal_test\.go$
          fake_store:
            skip: false
            # Unanchored regexps over the path lint was run from.
            exclude:
              # A store's own tests are the tests of the real store. A helper there that shares a
              # method name with the store is setting up rows, not faking anything.
              - ^internal/store/
          test_beside:
            skip: false
            # Unanchored regexps over the path lint was run from.
            exclude:
              # Scenario files are named for the feature a user meets, such as mail or reviews,
              # and a feature spans many source files.
              - ^internal/e2e/
              # Drives the whole panel against a real service and tmux. It is a scenario for the
              # panel as a whole, and there is no panel.go for it to sit beside.
              - ^internal/ui/panel_integration_test\.go$
          bound_key:
            skip: false
            roots:
              - type: komrad/config.Keybindings
              - type: komrad/config.FixedKeys
                prefix: Fixed
            matchers:
              - komrad/internal/ui/keys.IsBound
              - komrad/internal/ui/keys.DirectionOf
            compares:
              - slices.Contains
            navigation:
              - Nav
              - Column
              - Sidebar
              - Tabs
              - Kinds
              - Views
              - Help
              - Filter
              - Diff
              - Menu.Open
              - Messages.Open
              - Review.PrevOpenThread
              - Review.PrevThread
              - Fixed.Back
              - Fixed.Quit
              - Fixed.Editor
            dispatchers:
              - komrad/internal/ui/keys.Spec.Dispatch
              - komrad/internal/ui.model.routeGlobalKey
              - komrad/internal/ui.model.updateDoc
              - komrad/internal/ui.model.updateSubmenu
            inputs:
              - komrad/internal/ui.model.updateForm
              - komrad/internal/ui.model.updateWorkflowForm
              - komrad/internal/ui.model.updateMessages
              - komrad/internal/ui.model.updateSignIn
              - komrad/internal/ui/field.NameEdit.Take
              - komrad/internal/ui/field.NameEdit.takeGone
              - komrad/internal/ui.reviewScreen.updateComposer
              - komrad/internal/ui.reviewScreen.updateRelease
            exclude:
              - _test\.go$
          ctx_sleep:
            skip: false
            # Unanchored regexps over the path lint was run from. The package that defines
            # Sleep.
            exclude:
              - ^lib/clock/
          test_fatal_err:
            skip: false
            # Unanchored regexps over the import path. The tools modules carry no testify.
            packages:
              - ^komrad/
          error_text:
            skip: false
          store_query:
            skip: false
            # Unanchored regexps over the import path. The domain services, the jobs that run beside
            # them, the server that wires stores into both, the watch broker and doctor that each hold
            # a connection of their own, and the fixtures the tests share.
            allow:
              - ^komrad/internal/(agents|checkouts|documents|forge|mail|pullrequests|reviews|schedules|scriptrun|tasks|transcripts|worktrees)$
              - ^komrad/internal/jobs(/internaljobs)?$
              - ^komrad/internal/(server|watch|doctor)$
              - ^komrad/internal/(storetest|komradtest)$
          tx_store:
            skip: false
          one_service:
            skip: false
            # An agent handler acts through one service and then reads the row back to render it.
            readers:
              - rows
            exclude:
              - ^internal/fail/
              # Reading the agents' logs picks between the server log and a run's log, which is a
              # choice of source the request makes rather than a combining of two answers.
              - ^internal/rpc/log/handler\.go$
          view_split:
            skip: false
            # Unanchored regexps over the import path. The panel keeps each screen's drawing in a
            # file of its own that only reads what the screen holds.
            packages:
              - ^komrad/internal/ui(/|$)
      fussy:
        type: module
        description: General Go checks from fussy.
        settings:
          comment_length:
            skip: false
            # Unanchored regexps over the file path. The config structs' doc comments
            # are the text of the generated config.toml, so they are prose on purpose.
            exclude:
              - /config/[^/]+\.go$
          forbid_getenv:
            skip: false
          forbid_nil_nil:
            skip: false
          comment_prefix:
            skip: false
            require: true
          # Unanchored regexps over the file path. The panel talks to the service over HTTP,
          # so a call of its own that never times out is a frame that never redraws.
          context_timeout:
            skip: false
            include:
              - internal/ui/
          # Unanchored regexps over the file path, same exclusion as comment_length.
          comment_reference:
            skip: false
            exclude:
              - /config/[^/]+\.go$
          switch_default:
            skip: false
          params_struct:
            skip: false
            # Structs named after a concept several functions build from rather than after one
            # function, which the function-name half of the rule cannot fit.
            allow:
              - scriptEnvParams
              - workflowConfigParams
              - resumeParams
          table_test:
            skip: false
          store_verb:
            skip: false
            include:
              - internal/store/
            verbs:
              - Abandon
              - Advance
              - Append
              - Archive
              - Begin
              - Claim
              - Clear
              - Complete
              - Count
              - Create
              - Delete
              - Does
              - Ensure
              - Exists
              - Finish
              - Forget
              - Get
              - Hold
              - Is
              - List
              - Lock
              - Mark
              - Move
              - Normalize
              - Observe
              - Open
              - Prune
              - Record
              - Release
              - Rename
              - Reset
              - Restore
              - Search
              - Send
              - Set
              - Start
              - Unmark
              - Update
              - Upsert
              - Validate
            allow:
              - Close
              - Config
              - Error
              - InTx
              - MarshalJSON
              - MarshalText
              - Scan
              - ServeHTTP
              - String
              - UnmarshalJSON
              - UnmarshalText
              - Value
              - Workflow
  exclusions:
    # The docs site is a node project, and a package under its node_modules can ship a Go file
    # of its own.
    paths:
      - ^docs/
    rules:
      # The rule is about tests. Everything else constructs the real client on purpose, which
      # is what a seam is for.
      - path-except: _test\.go$
        linters:
          - forbidigo
        text: a unit test
      # The integration tests: the packages whose subject is what git, tmux or the panel's own
      # binaries actually do, which is the one case a test has to drive the real thing. It is
      # the set mise/tasks/go/test runs for --kind integration. The fixture packages beside
      # them, such as internal/komradtest, hold no test of their own and so need no entry.
      - path: internal/(git|diff|scripts|e2e|tmux|tmuxtest|cli|harness)/
        linters:
          - forbidigo
        text: a unit test
      - path: ((^|/)main\.go$|^cmd/|^internal/(cli|ui|tmux)/)
        linters:
          - forbidigo
        text: the caller's context
      - path: (_test\.go$|^internal/tmux/)
        linters:
          - forbidigo
        text: a logger handed in
      - path: ^db/errors\.go$
        linters:
          - forbidigo
        text: db.IsNoRows
      # A test plays the server and answers with whatever code its case needs.
      - path: (_test\.go$|^internal/rpcerr/)
        linters:
          - forbidigo
        text: answer through rpcerr
      # A test exits from TestMain and from the stand-in processes it re-execs itself as.
      - path: ((^|/)main\.go$|_test\.go$)
        linters:
          - forbidigo
        text: let main exit
      # A binary's package comment would be the first thing a reader of the command sees on
      # pkg.go.dev, and these three exist to be run rather than to be read about.
      - path: (^main\.go$|^cmd/|^config/gen/)
        linters:
          - staticcheck
        text: ST1000
      # The config package is where configuration is read from the environment, which is
      # the thing forbidgetenv exists to funnel through it. It cannot follow its own advice.
      - path: ^config/
        linters:
          - fussy
        text: forbidgetenv
      # A nil next-page token is the absence the proto field itself carries, and it is handed
      # straight to the response rather than acted on, so there is nothing for a sentinel to say.
      - path: ^lib/pagination/
        linters:
          - fussy
        text: forbidnilnil
      - path: ^tools/komradlint/
        linters:
          - nilnil
      # Migrating the schema and setting up the engine login run before any service exists, so the
      # commands that do them call the store themselves.
      - path: ^internal/cli/(migrate|engine)\.go$
        linters:
          - komradlint
        text: is a store query
      # A test asserts on the assertion it just made, so an unchecked assertion fails the
      # test on the spot rather than travelling as a wrong value the way it would in the server.
      # The same files shell out to git and tmux to build their fixtures, where the command
      # is bounded by the test binary's own life and has no request to be cancelled with.
      # Tests and the fixtures they share discard errors in t.Cleanup teardown, where a
      # failure means the throwaway server or file is already gone.
      - path: (_test\.go|internal/(pgtest|tmuxtest|storetest|harnesstest|logtest|komradtest)/)
        linters:
          - forcetypeassert
          - noctx
          - errcheck
      # A doctor problem is a record carrying a code and a sentence, and satisfying error is
      # how it reaches a caller rather than what it is, so ProblemError would name the interface
      # instead of the thing.
      - path: ^internal/doctor/
        linters:
          - errname
      # A test helper takes t and the fixture before its own arguments, so the limit that
      # holds a function to four does not fit one.
      - path: _test\.go$
        linters:
          - revive
        text: argument-limit
      # A buf rule over a pair of messages takes the signature bufplugin's checkutil hands it.
      - path: ^internal/bufcheck/tighten\.go$
        linters:
          - revive
        text: argument-limit
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - ^docs/
  settings:
    goimports:
      local-prefixes:
        - komrad
