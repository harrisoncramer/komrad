# Local development database. The app itself is not containerised: it runs on
# the host because it drives tmux. Only Postgres is in Docker.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: komrad
      POSTGRES_PASSWORD: komrad
      POSTGRES_DB: komrad
    ports:
      - "${DB_PORT:-5460}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "komrad"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - komrad-db:/var/lib/postgresql

  # The machines komrad doctor is written for, each the same image at a different stage of
  # having been set up. They are the only way to see the first-run experience, since the
  # machine this is developed on has every dependency already.
  #
  # They sit behind a profile so they are not started by docker:up, and they are run rather
  # than brought up: each one runs the binary once and exits. Drive them with
  # `mise run doctor:sandbox <stage>`, which builds the binary they mount first.
  doctor-bare:
    profiles: ["doctor"]
    build: &doctor-sandbox-build
      context: docker
      dockerfile: doctor-sandbox.Dockerfile
      target: bare
    volumes: &doctor-sandbox-volumes
      - ./bin/komrad-linux:/usr/local/bin/komrad:ro

  doctor-tmux-old:
    profiles: ["doctor"]
    build:
      <<: *doctor-sandbox-build
      target: tmux-old
    volumes: *doctor-sandbox-volumes

  doctor-tmux:
    profiles: ["doctor"]
    build:
      <<: *doctor-sandbox-build
      target: tmux
    volumes: *doctor-sandbox-volumes

  # A Postgres of the sandbox's own, on no volume and no published port. It is not the db
  # service above, because that one holds the panel's real state on a named volume, and a
  # sandbox that tears itself down would take a developer's agents with it. This one starts
  # empty every run, which is also what the checks want to see.
  doctor-db:
    profiles: ["doctor"]
    image: postgres:18
    environment:
      POSTGRES_USER: komrad
      POSTGRES_PASSWORD: komrad
      POSTGRES_DB: komrad
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "komrad"]
      interval: 2s
      timeout: 5s
      retries: 15

  # The same machine with a Postgres reachable, for the checks that need one to answer.
  # Override KOMRAD_DATABASE_URL on the run to point it at a database that is missing, unmigrated,
  # or refusing the password.
  doctor-postgres:
    profiles: ["doctor"]
    build:
      <<: *doctor-sandbox-build
      target: tmux
    volumes: *doctor-sandbox-volumes
    depends_on:
      doctor-db:
        condition: service_healthy
    environment:
      KOMRAD_DATABASE_URL: postgres://komrad:komrad@doctor-db:5432/komrad?sslmode=disable

volumes:
  komrad-db:
