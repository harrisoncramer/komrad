syntax = "proto3";

package pullrequest.v1;

import "annotation/v1/tool.proto";
import "buf/validate/validate.proto";
import "pagination/v1/pagination.proto";

option go_package = "komrad/proto/gen/pullrequest/v1;pullrequestv1";

message ListPullRequestsRequest {
  // The repository the pull requests target, as a git remote spells it or as the canonical
  // address komrad stores.
  string repository_url = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 2048
  }];
  // The branch the pull requests were opened from; left empty, every pull request stored for
  // the repository is listed.
  string head_branch = 2 [(buf.validate.field).string = {max_len: 512}];
  // Which page to read and how many to a page, twenty when unset and at most a hundred.
  optional pagination.v1.Pagination pagination = 3;
}

message PullRequest {
  // The handle komrad keys the row by.
  string id = 1;
  // Which forge it lives on, such as github.
  string forge = 2;
  // The forge's own stable identifier, such as GitHub's node_id.
  string provider_id = 3;
  // The web address a person opens.
  string url = 4;
  // The canonical address of the repository it targets.
  string repository_url = 5;
  // The canonical address of the repository its branch lives in, empty when the forge no
  // longer has it.
  string head_repository_url = 6;
  // The number the forge shows a person, which is per repository.
  int32 number = 7;
  // The title as the forge has it.
  string title = 8;
  // The branch the pull request was opened from.
  string head_branch = 9;
  // The commit at the tip of that branch when last read.
  string head_sha = 10;
  // The branch it targets.
  string base_branch = 11;
  // The commit the target branch was at when last read.
  string base_sha = 12;
  // Whether the forge marks it a draft.
  bool draft = 13;
  // Where it stands, decided from the stored row.
  PullRequestState state = 14;
  // When it was opened on the forge, in RFC 3339.
  string opened_at = 15;
  // When the forge last saw it change, in RFC 3339.
  string changed_at = 16;
  // When it merged, in RFC 3339, unset while it has not.
  optional string merged_at = 17;
  // When it closed, in RFC 3339, unset while it is open; a merged one carries this too.
  optional string closed_at = 18;
  // Whether the forge would merge it: its reviews, checks, mergeability and auto-merge.
  MergeReadiness merge_readiness = 19;
  // The login of whoever opened it, empty when the forge no longer has that account.
  string author = 20;
  // The description as the forge has it, empty when none was written.
  string body = 21;
}

// MergeReadiness is how close a pull request is to merging, as komrad shows it for its head.
message MergeReadiness {
  // Where the forge says the reviews stand.
  ReviewDecision decision = 1;
  // Where the checks on the head stand, unspecified when the forge last answered for an older head.
  Checks checks = 2;
  // Where the forge says it stands against its base and rules. While the forge is working it
  // out again, this is the last answer it gave for the same head.
  Mergeability mergeability = 3;
  // True when mergeability is the last answer for this head rather than the latest read.
  bool mergeability_unconfirmed = 4;
  // Whether the forge says it will merge on its own once its checks and reviews pass.
  bool auto_merge = 5;
  // Whether the forge would let komrad turn auto-merge on now, which it will not for a draft, one
  // with nothing left to wait for, or a repository that does not allow it.
  bool auto_mergeable = 6;
}

// Repository is one repository the pull request sync reads.
message Repository {
  // The canonical address of the repository.
  string url = 1;
}

message ListPullRequestsResponse {
  // One page of pull requests, the unfinished ones first and each group newest opened first,
  // so the first is the one an agent's row on the branch stands for.
  repeated PullRequest pull_requests = 1;
  // The token for the page after this one, unset on the last.
  optional string next_page_token = 2;
}

// PullRequestState is where a stored pull request stands, decided on the server from its stamps,
// its draft flag, the checks on its head, its mergeability and the forge's review decision,
// finished first.
enum PullRequestState {
  // No state was decided.
  PULL_REQUEST_STATE_UNSPECIFIED = 0;
  // The repository has not been read yet, so nothing is known.
  PULL_REQUEST_STATE_UNREAD = 1;
  // The repository has been read and nothing was opened from the branch.
  PULL_REQUEST_STATE_NONE = 2;
  // Open with no review decision that settles it.
  PULL_REQUEST_STATE_OPEN = 3;
  // Open and the forge would merge it now: its rules on reviews and checks are met and the
  // branch is level with its base.
  PULL_REQUEST_STATE_APPROVED = 4;
  // Open with a reviewer asking for changes.
  PULL_REQUEST_STATE_CHANGES_REQUESTED = 5;
  // Still a draft, whatever its reviews say.
  PULL_REQUEST_STATE_DRAFT = 6;
  // Merged.
  PULL_REQUEST_STATE_MERGED = 7;
  // Closed without merging.
  PULL_REQUEST_STATE_CLOSED = 8;
  // Open with a failing check on its head, whatever its reviews say.
  PULL_REQUEST_STATE_FAILING = 9;
  // Approved on the forge but not yet mergeable: its branch is behind or a branch rule is unmet.
  PULL_REQUEST_STATE_APPROVED_WAITING = 10;
  // Open and no longer merging cleanly into its base, whatever its reviews say.
  PULL_REQUEST_STATE_CONFLICTING = 11;
  // Open with checks still running on its head and no change request.
  PULL_REQUEST_STATE_CHECKS_RUNNING = 12;
  // Open with every reviewer who asked for changes asked to review again.
  PULL_REQUEST_STATE_REREVIEW_REQUESTED = 13;
}

// Mergeability is where the forge says a pull request stands against its base and its branch
// rules, as it last computed it.
enum Mergeability {
  // The mergeability has not been read.
  MERGEABILITY_UNSPECIFIED = 0;
  // The forge has not computed it yet.
  MERGEABILITY_UNKNOWN = 1;
  // The forge would merge it now.
  MERGEABILITY_CLEAN = 2;
  // Its checks are not all passing.
  MERGEABILITY_UNSTABLE = 3;
  // A branch rule is unmet, such as a required review.
  MERGEABILITY_BLOCKED = 4;
  // The base has moved past the branch.
  MERGEABILITY_BEHIND = 5;
  // The branch no longer merges cleanly into its base.
  MERGEABILITY_CONFLICTING = 6;
}

// ReviewDecision is where a forge says a pull request's reviews stand.
enum ReviewDecision {
  // The reviews have not been read.
  REVIEW_DECISION_UNSPECIFIED = 0;
  // The forge has said nothing about the reviews.
  REVIEW_DECISION_NONE = 1;
  // A review the forge requires that nobody has given.
  REVIEW_DECISION_PENDING = 2;
  // The forge counts the pull request as approved.
  REVIEW_DECISION_APPROVED = 3;
  // A reviewer is asking for changes.
  REVIEW_DECISION_CHANGES_REQUESTED = 4;
  // Every reviewer who asked for changes has been asked to review again.
  REVIEW_DECISION_REREVIEW_REQUESTED = 5;
}

// Checks is where the checks on a pull request's head commit stand, as the forge last reported
// them.
enum Checks {
  // The checks have not been read.
  CHECKS_UNSPECIFIED = 0;
  // The forge reports no checks on the head.
  CHECKS_NONE = 1;
  // A run is still in flight.
  CHECKS_PENDING = 2;
  // Every check passed.
  CHECKS_PASSING = 3;
  // At least one check failed and the run has finished.
  CHECKS_FAILING = 4;
  // At least one check failed while others are still running.
  CHECKS_FAILING_RUNNING = 5;
}

message ListStatusChecksRequest {
  // The pull request whose status checks to list, by the handle komrad keys it by.
  string pull_request_id = 1 [(buf.validate.field).string.min_len = 1];
}

message ListStatusChecksResponse {
  // Each head commit the status checks were read on, oldest first, empty when they have never been read.
  repeated StatusCheckReading readings = 4;
}

message ReadCheckLogRequest {
  // The check whose log to read, as StatusCheck.id names it.
  string check_id = 1 [(buf.validate.field).string.min_len = 1];
  // The first line to read, counting from one.
  int32 first_line = 2 [(buf.validate.field).int32.gte = 1];
  // How many lines to read.
  int32 count = 3 [(buf.validate.field).int32 = {
    gte: 1
    lte: 5000
  }];
}

message ReadCheckLogResponse {
  // The lines read, in order, fewer than asked for when the log ends first.
  repeated CheckLogLine lines = 1;
  // How many lines the whole log holds.
  int32 line_count = 2;
}

// CheckLogLine is one line of a check's log.
message CheckLogLine {
  // The line, without its timestamp, color codes or newline.
  string text = 1;
}

message SearchCheckLogsRequest {
  // The checks whose logs to search, as StatusCheck.id names them.
  repeated string check_ids = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
    items: {
      string: {min_len: 1}
    }
  }];
  // The RE2 regular expression each line is matched against.
  string pattern = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 512
  }];
}

message SearchCheckLogsResponse {
  // The lines the pattern matched, in check and line order.
  repeated CheckLogHit hits = 1;
  // Whether the search stopped at the most hits it answers with, so more lines match.
  bool limited = 2;
}

// CheckLogHit is one line of a check's log a search matched.
message CheckLogHit {
  // The check whose log holds the line.
  string check_id = 1;
  // The line, counting from one.
  int32 line = 2;
  // The step the line sits in, and 0 for a line in no step.
  int32 step_number = 3;
  // The line, cut when it runs long.
  string text = 4;
  // Whether the line ran past the most characters a hit carries, and was cut there.
  bool cut = 5;
}

// StatusCheckReading is the status checks read on one head commit of a pull request.
message StatusCheckReading {
  // The head commit the status checks were read on.
  string head_sha = 1;
  // When komrad first read the checks on that head, in RFC 3339.
  optional string first_read_at = 2;
  // When the forge was last asked about that head, in RFC 3339.
  optional string read_at = 3;
  // The status checks on that head, by kind, source and name.
  repeated StatusCheck status_checks = 4;
}

// StatusCheck is one status check the forge listed on a pull request's head commit.
message StatusCheck {
  // The forge's own stable identifier for the check.
  string provider_id = 1;
  // What sort of check the forge reported.
  StatusCheckKind kind = 2;
  // The app or workflow that ran it.
  string source = 3;
  // The name the forge shows for it.
  string name = 4;
  // How far along it is.
  StatusCheckState state = 5;
  // How it ended, as the forge words it, empty while it has not.
  string conclusion = 6;
  // When it started, in RFC 3339, unset when the forge did not say.
  optional string started_at = 7;
  // When it finished, in RFC 3339, unset while it has not.
  optional string finished_at = 8;
  // Whether the pull request needs it to pass before it merges.
  bool required = 9;
  // The web address a person opens to read it.
  string url = 10;
  // The steps of a check run, in the order it runs them, empty for a check that lists none.
  repeated StatusCheckStep steps = 11;
  // What started the run, such as pull_request or push, empty when no workflow ran it.
  string run_event = 13;
  // When the run was created, in RFC 3339, unset when the check ran in none.
  optional string run_started_at = 14;
  // The log komrad keeps of the check, and where fetching it stands.
  CheckLog log = 15;
  // The identifier komrad keeps the check under, which ReadCheckLog and SearchCheckLogs take.
  string id = 16;
}

// CheckLog is where komrad stands with a check's log, with the map of its steps and without its text.
message CheckLog {
  // Where fetching the log stands.
  CheckLogState state = 1;
  // When komrad last asked the forge for the log, in RFC 3339, unset while it has not.
  optional string fetched_at = 2;
  // How many lines a fetched log holds.
  int32 line_count = 3;
  // How many lines of a fetched log the forge marked as errors.
  int32 error_count = 4;
  // Where each step sits in a fetched log, in the order the steps ran, empty when none could be placed.
  repeated CheckLogStep steps = 5;
}

// CheckLogStep is where one step of a check run sits in the check's log.
message CheckLogStep {
  // Where the step falls in the run, counting from one.
  int32 number = 1;
  // The name the forge shows for it.
  string name = 2;
  // How it ended, as the forge words it, empty while it has not.
  string conclusion = 3;
  // The line the step starts on, counting from one.
  int32 first_line = 4;
  // How many lines the step wrote.
  int32 line_count = 5;
  // How many of the step's lines the forge marked as errors.
  int32 error_count = 6;
}

// CheckLogState is where fetching a check's log stands.
enum CheckLogState {
  // The state was not read.
  CHECK_LOG_STATE_UNSPECIFIED = 0;
  // The check ran in no job, so it has no log to fetch.
  CHECK_LOG_STATE_NONE = 1;
  // The log is still to come, because the check has not finished or komrad has not fetched it yet.
  CHECK_LOG_STATE_PENDING = 2;
  // komrad fetched the log and keeps it.
  CHECK_LOG_STATE_FETCHED = 3;
  // The log ran past the most komrad keeps, so none of it is kept.
  CHECK_LOG_STATE_TOO_LARGE = 4;
  // The forge never had a log for the check.
  CHECK_LOG_STATE_MISSING = 5;
  // The forge no longer keeps the log.
  CHECK_LOG_STATE_EXPIRED = 6;
  // komrad gave up asking the forge for the log.
  CHECK_LOG_STATE_FAILED = 7;
}

// StatusCheckStep is one step of a check run.
message StatusCheckStep {
  // Where the step falls in the run, counting from one.
  int32 number = 1;
  // The name the forge shows for it.
  string name = 2;
  // How far along it is.
  StatusCheckState state = 3;
  // How it ended, as the forge words it, empty while it has not.
  string conclusion = 4;
  // When it started, in RFC 3339, unset when the forge did not say.
  optional string started_at = 5;
  // When it finished, in RFC 3339, unset while it has not.
  optional string finished_at = 6;
}

// StatusCheckKind is what sort of status check a forge reported.
enum StatusCheckKind {
  // The kind was not read.
  STATUS_CHECK_KIND_UNSPECIFIED = 0;
  // A run an app reported against the commit.
  STATUS_CHECK_KIND_CHECK_RUN = 1;
  // A status a service set on the commit.
  STATUS_CHECK_KIND_STATUS = 2;
  // A pipeline the forge ran for the commit.
  STATUS_CHECK_KIND_PIPELINE = 3;
}

// StatusCheckState is how far along a status check is.
enum StatusCheckState {
  // The state was not read.
  STATUS_CHECK_STATE_UNSPECIFIED = 0;
  // Waiting for a runner to pick it up.
  STATUS_CHECK_STATE_QUEUED = 1;
  // Running now.
  STATUS_CHECK_STATE_RUNNING = 2;
  // Held until something else lets it go on, such as an approval.
  STATUS_CHECK_STATE_WAITING = 3;
  // Done, with its conclusion saying how it ended.
  STATUS_CHECK_STATE_COMPLETED = 4;
  // On a commit that is no longer the head, still in flight when komrad stopped reading it.
  STATUS_CHECK_STATE_UNKNOWN = 5;
}

// PullRequestService reads the pull requests komrad has stored from its forges.
service PullRequestService {
  rpc ListPullRequests(ListPullRequestsRequest) returns (ListPullRequestsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "list_pull_requests"
      description: "List the pull requests komrad has stored for a repository, unfinished first. A repository no live agent sits on may be behind, and list_forge_pull_requests asks the forge itself."
      roles: [
        ROLE_IMPLEMENTER,
        ROLE_ORCHESTRATOR
      ]
    };
  }
  rpc ListStatusChecks(ListStatusChecksRequest) returns (ListStatusChecksResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: false
      mcp: false
      reason: "The status check list is drawn for a person on the status checks screen, and an agent reads where its checks stand through the merge readiness list_pull_requests returns."
    };
  }
  rpc ReadCheckLog(ReadCheckLogRequest) returns (ReadCheckLogResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: false
      mcp: false
      reason: "A check's log is read a window at a time for a person on the check log screen."
    };
  }
  rpc SearchCheckLogs(SearchCheckLogsRequest) returns (SearchCheckLogsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: false
      mcp: false
      reason: "Check logs are searched for a person on the check log screen."
    };
  }
}
