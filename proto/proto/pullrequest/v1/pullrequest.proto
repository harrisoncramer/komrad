syntax = "proto3";

package pullrequest.v1;

import "annotation/v1/tool.proto";
import "buf/validate/validate.proto";
import "forge/v1/enums.proto";
import "google/protobuf/timestamp.proto";
import "pagination/v1/pagination.proto";
import "pullrequest/v1/enums.proto";

option go_package = "komrad/proto/gen/pullrequest/v1;pullrequestv1";

message ListPullRequestsRequest {
  // The repository the pull requests merge into, as a git remote or a web address.
  string repository_url = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 2048
  }];
  // The branch the pull requests merge from. Empty lists every pull request komrad has recorded
  // for the repository.
  string head_branch = 2 [(buf.validate.field).string = {max_len: 512}];
  // The page to read. The page size defaults to twenty and is at most a hundred.
  optional pagination.v1.Pagination pagination = 3;
}

// PullRequest is a pull request as komrad last read it from the forge.
message PullRequest {
  // The pull request's id.
  string id = 1;
  // The kind of forge the pull request is on.
  forge.v1.Kind forge = 2;
  // The forge's own stable id for the pull request, such as GitHub's `node_id`.
  string provider_id = 3;
  // The pull request's web address.
  string url = 4;
  // The web address of the repository the pull request merges into.
  string repository_url = 5;
  // The web address of the repository the pull request's branch is in. Empty when the forge no
  // longer has that repository.
  string head_repository_url = 6;
  // The pull request's number, unique within its repository.
  int32 number = 7;
  // The pull request's title.
  string title = 8;
  // The branch the pull request merges from.
  string head_branch = 9;
  // The commit at the tip of the pull request's branch.
  string head_sha = 10;
  // The branch the pull request merges into.
  string base_branch = 11;
  // The commit at the tip of the branch the pull request merges into.
  string base_sha = 12;
  // Whether the pull request is a draft.
  bool draft = 13;
  // The pull request's state.
  PullRequestState state = 14;
  // When the pull request was opened.
  google.protobuf.Timestamp opened_at = 15;
  // When the pull request last changed on the forge.
  google.protobuf.Timestamp changed_at = 16;
  // When the pull request merged. Unset until the pull request merges.
  optional google.protobuf.Timestamp merged_at = 17;
  // When the pull request closed, merged or not. Unset while the pull request is
  // open.
  optional google.protobuf.Timestamp closed_at = 18;
  // How close the forge is to merging the pull request.
  MergeReadiness merge_readiness = 19;
  // The login of the pull request's author. Empty when the forge no longer has the account.
  string author = 20;
  // The pull request's description. Empty when it has none.
  string body = 21;
}

// MergeReadiness is how close a pull request's head commit is to merging.
message MergeReadiness {
  // The forge's review decision.
  ReviewDecision decision = 1;
  // The state of the checks on the head commit. Unspecified when the forge last reported on an
  // older head.
  Checks checks = 2;
  // The forge's mergeability, or the last value for the same head while the forge recomputes it.
  Mergeability mergeability = 3;
  // Whether `mergeability` is the last value for this head, not yet confirmed by a new read.
  bool mergeability_unconfirmed = 4;
  // Whether auto-merge is on, so the forge merges once the checks and reviews pass.
  bool auto_merge = 5;
  // Whether the forge would let komrad turn auto-merge on now. The forge refuses for a draft, a
  // pull request with nothing left to wait for, and a repository that does not allow auto-merge.
  bool auto_mergeable = 6;
}

// Repository is one repository komrad reads pull requests from.
message Repository {
  // The repository's web address.
  string url = 1;
}

message ListPullRequestsResponse {
  // One page of pull requests, open ones first, each group newest first.
  repeated PullRequest pull_requests = 1;
  // The cursor for the next page. Unset on the last page.
  optional string next_page_token = 2;
}

message ListStatusChecksRequest {
  // The pull request whose status checks to list, by id.
  string pull_request_id = 1 [(buf.validate.field).string.uuid = true];
}

message ListStatusChecksResponse {
  // The status checks on each head commit komrad read them on, oldest first. Empty when they were
  // never read.
  repeated StatusCheckReading readings = 1;
}

message ReadCheckLogRequest {
  // The check whose log to read, by `StatusCheck.id`.
  string check_id = 1 [(buf.validate.field).string.uuid = true];
  // The first line to read, counting from one.
  int32 first_line = 2 [(buf.validate.field).int32.gte = 1];
  // How many lines to read.
  int32 count = 3 [(buf.validate.field).int32 = {
    gte: 1
    lte: 5000
  }];
}

message ReadCheckLogResponse {
  // The lines read, in order. Fewer than `count` when the log ends first.
  repeated CheckLogLine lines = 1;
  // How many lines the whole log has.
  int32 line_count = 2;
}

// CheckLogLine is one line of a check's log.
message CheckLogLine {
  // The line's text, without its timestamp, color codes or newline.
  string text = 1;
}

message SearchCheckLogsRequest {
  // The checks whose logs to search, by `StatusCheck.id`.
  repeated string check_ids = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
    items: {
      string: {uuid: true}
    }
  }];
  // An RE2 regular expression each line must match.
  string pattern = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 512
  }];
}

message SearchCheckLogsResponse {
  // The matching lines, by check and then by line.
  repeated CheckLogHit hits = 1;
  // Whether the search stopped at its limit, with more lines left to match.
  bool limited = 2;
}

// CheckLogHit is one line of a check's log that matched a search.
message CheckLogHit {
  // The id of the check whose log has the line.
  string check_id = 1;
  // The line's number, counting from one.
  int32 line = 2;
  // The number of the step the line is in. Zero when the line is in no step.
  int32 step_number = 3;
  // The line's text, cut when the line is long.
  string text = 4;
  // Whether `text` was cut.
  bool cut = 5;
}

// StatusCheckReading is the status checks komrad read on one head commit of a pull request.
message StatusCheckReading {
  // The head commit the status checks were read on.
  string head_sha = 1;
  // When komrad first read the checks on the commit.
  optional google.protobuf.Timestamp first_read_at = 2;
  // When komrad last asked the forge about the commit.
  optional google.protobuf.Timestamp read_at = 3;
  // The newest run of each status check on the commit, by source, run event and name.
  repeated StatusCheck status_checks = 4;
}

// StatusCheck is one status check the forge reported on a pull request's head commit.
message StatusCheck {
  // The forge's own stable id for the check.
  string provider_id = 1;
  // The check's kind.
  StatusCheckKind kind = 2;
  // The app or CI workflow that ran the check.
  string source = 3;
  // The check's name.
  string name = 4;
  // The check's state.
  StatusCheckState state = 5;
  // The check's conclusion, in the forge's words. Empty until the check completes.
  string conclusion = 6;
  // When the check started. Unset when the forge does not say.
  optional google.protobuf.Timestamp started_at = 7;
  // When the check finished. Unset until the check finishes.
  optional google.protobuf.Timestamp finished_at = 8;
  // Whether the pull request needs the check to pass before it merges.
  bool required = 9;
  // The check's web address.
  string url = 10;
  // The check run's steps, in order. Empty when the check lists none.
  repeated StatusCheckStep steps = 11;
  // The event that started the check's CI workflow, such as `pull_request` or `push`. Empty when
  // no CI workflow ran the check.
  string run_event = 12;
  // When the check's CI workflow run was created. Unset when no CI workflow ran the
  // check.
  optional google.protobuf.Timestamp run_started_at = 13;
  // The check's log, as komrad keeps it.
  CheckLog log = 14;
  // The check's id, which `ReadCheckLog` and `SearchCheckLogs` take.
  string id = 15;
  // Whether the check completed with a passing conclusion, such as success, neutral or skipped.
  bool passed = 16;
}

// CheckLog is komrad's record of a check's log: the fetch state and where each step's lines are.
message CheckLog {
  // The state of fetching the log.
  CheckLogState state = 1;
  // When komrad last asked the forge for the log. Unset until komrad asks.
  optional google.protobuf.Timestamp fetched_at = 2;
  // How many lines the fetched log has.
  int32 line_count = 3;
  // How many lines of the fetched log the forge marked as errors.
  int32 error_count = 4;
  // Where each step's lines are in the fetched log, in the order the steps ran. Empty when no step
  // could be placed.
  repeated CheckLogStep steps = 5;
}

// CheckLogStep is where one step of a check run is in the check's log.
message CheckLogStep {
  // The step's position in the run, counting from one.
  int32 number = 1;
  // The step's name.
  string name = 2;
  // The step's conclusion, in the forge's words. Empty until the step completes.
  string conclusion = 3;
  // The line the step starts on, counting from one.
  int32 first_line = 4;
  // How many lines the step wrote.
  int32 line_count = 5;
  // How many of the step's lines the forge marked as errors.
  int32 error_count = 6;
  // Whether the step's conclusion is a passing one, such as success, neutral or skipped.
  bool passed = 7;
}

// StatusCheckStep is one step of a check run.
message StatusCheckStep {
  // The step's position in the run, counting from one.
  int32 number = 1;
  // The step's name.
  string name = 2;
  // The step's state.
  StatusCheckState state = 3;
  // The step's conclusion, in the forge's words. Empty until the step completes.
  string conclusion = 4;
  // When the step started. Unset when the forge does not say.
  optional google.protobuf.Timestamp started_at = 5;
  // When the step finished. Unset until the step finishes.
  optional google.protobuf.Timestamp finished_at = 6;
  // Whether the step completed with a passing conclusion, such as success, neutral or skipped.
  bool passed = 7;
}

// PullRequestService reads the pull requests and status checks komrad has recorded from forges.
service PullRequestService {
  rpc ListPullRequests(ListPullRequestsRequest) returns (ListPullRequestsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "list_pull_requests"
      description: "List the pull requests komrad has recorded for a repository, open ones first. A repository with no live agent may be out of date. `list_forge_pull_requests` reads the forge directly."
      roles: [
        ROLE_WRITER,
        ROLE_ORCHESTRATOR
      ]
    };
  }
  rpc ListStatusChecks(ListStatusChecksRequest) returns (ListStatusChecksResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: false
      mcp: false
      reason: "Only the person reads each status check, and an agent reads the checks' state from `merge_readiness` on `list_pull_requests`."
    };
  }
  rpc ReadCheckLog(ReadCheckLogRequest) returns (ReadCheckLogResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: false
      mcp: false
      reason: "Only the person reads check logs."
    };
  }
  rpc SearchCheckLogs(SearchCheckLogsRequest) returns (SearchCheckLogsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: false
      mcp: false
      reason: "Only the person searches check logs."
    };
  }
}
