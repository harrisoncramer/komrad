services:
  db:
    command: ["postgres", "-c", "max_connections=300"]

  # The identity provider every throwaway instance signs in with, configured in docker/dex.
  dex:
    image: dexidp/dex:v2.41.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports:
      - "127.0.0.1:5556:5556"
    volumes:
      - ./docker/dex/config.yaml:/etc/dex/config.yaml:ro
