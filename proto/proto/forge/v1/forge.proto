syntax = "proto3";

package forge.v1;

import "annotation/v1/tool.proto";
import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "pagination/v1/pagination.proto";

option go_package = "komrad/proto/gen/forge/v1;forgev1";

message Forge {
  // The connection's own id.
  string id = 1;
  // Which forge the host runs, github or gitlab.
  string kind = 2;
  // The host agents' remotes name, such as github.com.
  string host = 3;
  // Where an enterprise host answers API calls, empty for the public forge.
  string api_url = 4;
  // How the credential was obtained, token or github_app.
  string method = 5;
  // Who the forge said the credential belongs to, a user login or an App's name.
  string login = 6;
  // When the forge last confirmed the credential, in RFC 3339, unset once it refused.
  optional string verified_at = 7;
  // Whether this machine still holds what the connection needs. The token method needs its
  // file, and the App method always has what it needs.
  bool has_credential = 8;
  // When the connection was made, in RFC 3339.
  string created_at = 9;
}

message ConnectForgeRequest {
  // The host agents' remotes name, such as github.com.
  string host = 1;
  // Which forge it runs. Komrad works it out from the host when empty. Required for any host
  // other than github.com or gitlab.com.
  string kind = 2;
  // Where an enterprise host answers API calls. It must be https.
  string api_url = 3;
  // How the credential comes: token, or github_app for the App in the server's config.
  string method = 4;
  // The token for the token method. It travels once and is never returned.
  string token = 5;
}

message ConnectForgeResponse {
  // The connection.
  Forge forge = 1;
}

message ListForgesResponse {
  // Every connection, by host.
  repeated Forge forges = 1;
}

message DisconnectForgeRequest {
  // The host to forget.
  string host = 1;
}

message CheckForgesResponse {
  // One entry per connection, in the order list_forges gives them.
  repeated ForgeCheck checks = 1;
}

message ForgeCheck {
  // The connection.
  Forge forge = 1;
  // What the forge answered, empty when it accepted the credential.
  string problem = 2;
  // Which kind of trouble it is when problem is set: refused, no_credential or unreachable.
  string problem_kind = 3;
}

message ListForgePullRequestsRequest {
  // The repository as a git remote spells it, such as git@github.com:owner/repo.git or
  // https://github.com/owner/repo, whose host picks the forge connection.
  string remote_url = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 2048
  }];
  // The branch the pull requests were opened from. Pull requests of any state are listed. When
  // empty, the repository's open pull requests are listed instead.
  string branch = 2 [(buf.validate.field).string = {max_len: 512}];
  // Which page to read and how many to a page. Twenty when unset, and at most a hundred, the
  // most the forge hands over in one call.
  optional pagination.v1.Pagination pagination = 3;
}

// ForgePullRequest is a pull request as the forge describes it, read live and stored nowhere.
message ForgePullRequest {
  // Which forge it lives on, such as github.
  string forge = 1;
  // The forge's own stable identifier, such as GitHub's node_id.
  string provider_id = 2;
  // The web address a person opens.
  string url = 3;
  // The canonical address of the repository it targets.
  string repository_url = 4;
  // The canonical address of the repository its branch lives in, empty when the forge no
  // longer has it.
  string head_repository_url = 5;
  // The number the forge shows a person. Numbers are per repository.
  int32 number = 6;
  // The title as the forge has it.
  string title = 7;
  // The branch the pull request was opened from.
  string head_branch = 8;
  // The commit at the tip of that branch when last read.
  string head_sha = 9;
  // The branch it targets.
  string base_branch = 10;
  // The commit the target branch was at when last read.
  string base_sha = 11;
  // Whether the forge marks it a draft.
  bool draft = 12;
  // The state the forge reports: OPEN, CLOSED or MERGED. Read merged_at and closed_at to tell
  // whether it is finished.
  string state = 13;
  // When it was opened on the forge, in RFC 3339.
  string created_at = 14;
  // When the forge last saw it change, in RFC 3339.
  string updated_at = 15;
  // When it merged, in RFC 3339, unset while it has not.
  optional string merged_at = 16;
  // When it closed, in RFC 3339, unset while it is open; a merged one carries this too.
  optional string closed_at = 17;
}

message MergeForgePullRequestRequest {
  // The pull request's web address, whose host picks the forge connection.
  string url = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 2048
  }];
}

message SetForgePullRequestDraftRequest {
  // The pull request's web address, whose host picks the forge connection.
  string url = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 2048
  }];
  // Whether it should be a draft, false to mark it ready for review.
  bool draft = 2;
}

message RequestForgePullRequestRereviewRequest {
  // The pull request's web address, whose host picks the forge connection.
  string url = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 2048
  }];
}

message SetForgePullRequestAutoMergeRequest {
  // The pull request's web address, whose host picks the forge connection.
  string url = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 2048
  }];
  // The head commit the person saw. The forge refuses to queue once the branch has moved past
  // it. Empty queues whatever the head is.
  string head_sha = 2 [(buf.validate.field).string.max_len = 64];
  // Whether it should merge on its own once its checks and reviews pass, false to stop that.
  bool on = 3;
}

message ListForgePullRequestsResponse {
  // One page of pull requests, as the forge orders them.
  repeated ForgePullRequest pull_requests = 1;
  // The token for the page after this one, unset on the last.
  optional string next_page_token = 2;
}

// ForgeService connects komrad to the services pull requests live on, and reads them live.
service ForgeService {
  rpc ConnectForge(ConnectForgeRequest) returns (ConnectForgeResponse) {
    option (annotation.v1.surfaces) = {
      cli: false
      mcp: false
      reason: "komrad forge connect is the one caller, reading the token from stdin or a file. A generated command would take it as an argument, which every process on the machine can read, and a model handed one would be holding a credential it has no business holding."
    };
  }
  rpc ListForges(google.protobuf.Empty) returns (ListForgesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "list_forges"
      description: "List the forges komrad is connected to and who it acts as on each. Tokens are never returned."
      roles: [ROLE_ORCHESTRATOR]
    };
  }
  rpc CheckForges(google.protobuf.Empty) returns (CheckForgesResponse) {
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "check_forges"
      description: "Check that every connected forge's credential still works, recording the answer on each connection."
      destructive: false
      roles: [ROLE_ORCHESTRATOR]
    };
  }
  rpc ListForgePullRequests(ListForgePullRequestsRequest) returns (ListForgePullRequestsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "list_forge_pull_requests"
      description: "List a repository's pull requests by asking its forge, either every one from a named branch or the open ones. list_pull_requests reads what komrad has stored instead."
      roles: [ROLE_ORCHESTRATOR]
    };
  }
  rpc MergeForgePullRequest(MergeForgePullRequestRequest) returns (google.protobuf.Empty) {
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: false
      name: "merge_forge_pull_request"
      description: "Merge a pull request through its forge, the way the repository merges by default."
      reason: "Landing work on the base is for a person to decide."
    };
  }
  rpc SetForgePullRequestDraft(SetForgePullRequestDraftRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: false
      name: "set_forge_pull_request_draft"
      description: "Mark a pull request a draft or ready for review through its forge."
      reason: "Saying a pull request is ready for review is for a person to decide."
    };
  }
  rpc SetForgePullRequestAutoMerge(SetForgePullRequestAutoMergeRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: false
      name: "set_forge_pull_request_auto_merge"
      description: "Turn a pull request's auto-merge on or off through its forge."
      reason: "Letting work land on the base without a person there is for a person to decide."
    };
  }
  rpc RequestForgePullRequestRereview(RequestForgePullRequestRereviewRequest) returns (google.protobuf.Empty) {
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: false
      name: "request_forge_pull_request_rereview"
      description: "Ask every reviewer who requested changes on a pull request to review it again."
      reason: "Telling a colleague the work is ready for them again is for a person to decide."
    };
  }
  rpc DisconnectForge(DisconnectForgeRequest) returns (google.protobuf.Empty) {
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: false
      name: "disconnect_forge"
      description: "Forget a forge and its credential."
      reason: "A person gave the credential and is the one to take it away."
    };
  }
}
