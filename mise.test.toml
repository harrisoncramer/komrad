# The throwaway instance, a second checkout kept on main to verify builds against. It is
# not loaded by default: link mise.local.toml to this file in the checkout that should be
# the throwaway one, and every other checkout ignores it.
#
# Everything here is something the two instances would otherwise share. Moving all of it
# means `mise run restart` in the throwaway checkout cannot reach the agents or the data in
# the one being developed against.
[env]
# Its own Postgres. The port is what docker-compose publishes and what the two connection
# strings point at, and the compose project is named after the directory, so `docker:up`
# brings up a container of its own rather than colliding on the other instance's.
DB_PORT = "5461"
DATABASE_URL = "postgres://weave:weave@localhost:5461/weave?sslmode=disable"
WEAVE_READONLY_DATABASE_URL = "postgres://weave_readonly:weave_readonly@localhost:5461/weave?sslmode=disable"

# Its own server, so both can run at once and neither adopts the other's.
WEAVE_ADDR = "127.0.0.1:8790"

# Its own tmux server. This is the one that matters most: the panel and every agent live
# on it, and `mise run restart` kills it whole.
WEAVE_TMUX_SOCKET = "weave-test"

# Its own log and generated files, so a tail here is not the other instance's output.
WEAVE_CACHE_DIR = "{{env.HOME}}/Library/Caches/weave-test"
