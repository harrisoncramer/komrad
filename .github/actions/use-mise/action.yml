name: Use Mise
description: >-
  Mount the repository's cache volume and install mise tools. Every job mounts the same
  paths whether or not it writes them all: a job forks the volume when it starts and the
  last job to finish cleanly becomes its next version, so a path only some jobs mounted
  would be dropped by whichever job finished after them.

runs:
  using: composite
  steps:
    # Only the Namespace runners have the volume. A fork's pull request runs on a GitHub-hosted
    # runner instead, so by default it stays out of the cache the release builds read.
    - name: Mount the cache volume
      if: runner.environment == 'self-hosted'
      uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
      with:
        cache: apt,go,mise
        path: |
          /home/runner/.cache/golangci-lint
          /home/runner/.cache/terraform/plugins
          /home/runner/.config/packer/plugins
          /home/runner/.npm
          ${{ github.workspace }}/local

    - name: Set CI-only mise overrides
      shell: bash
      # These tools are local only and do not need to be installed in CI
      # We need to persist them to the github runner so that subsequent tools also pick them up
      run: |
        echo "MISE_DISABLE_TOOLS=cargo:worktrunk,rust,kubectl,mc,aqua:junegunn/fzf,go:github.com/go-delve/delve/cmd/dlv,air,aqua:securego/gosec,aqua:aws/session-manager-plugin,conda:ffmpeg,conda:ttyd,aqua:charmbracelet/vhs" >> "$GITHUB_ENV"

    - name: Install mise tools
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      env:
        GOWORK: "off"
      with:
        version: 2026.6.14
        cache: false
