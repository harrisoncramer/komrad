syntax = "proto3";

package pullrequest.v1;

import "annotation/v1/tool.proto";
import "buf/validate/validate.proto";
import "pagination/v1/pagination.proto";

option go_package = "weave/proto/gen/pullrequest/v1;pullrequestv1";

message ListPullRequestsRequest {
  // The repository as a git remote spells it, such as git@github.com:owner/repo.git or
  // https://github.com/owner/repo, whose host picks the forge connection.
  string remote_url = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 2048
  }];
  // The branch the pull requests were opened from, listed whatever their state; left empty,
  // the repository's open pull requests are listed instead.
  string branch = 2 [(buf.validate.field).string = {max_len: 512}];
  // Which page to read and how many to a page, twenty when unset and at most a hundred, which
  // is what the forge will hand over in one call.
  optional pagination.v1.Pagination pagination = 3;
}

message PullRequest {
  // Which forge it lives on, such as github.
  string forge = 1;
  // The forge's own stable identifier, such as GitHub's node_id.
  string provider_id = 2;
  // The web address a person opens.
  string url = 3;
  // The canonical address of the repository it targets.
  string repository_url = 4;
  // The canonical address of the repository its branch lives in, empty when the forge no
  // longer has it.
  string head_repository_url = 5;
  // The number the forge shows a person, which is per repository.
  int32 number = 6;
  // The title as the forge has it.
  string title = 7;
  // The branch the pull request was opened from.
  string head_branch = 8;
  // The commit at the tip of that branch when last read.
  string head_sha = 9;
  // The branch it targets.
  string base_branch = 10;
  // The commit the target branch was at when last read.
  string base_sha = 11;
  // Whether the forge marks it a draft.
  bool draft = 12;
  // Where the forge says it stands, as OPEN, CLOSED or MERGED; read merged_at and closed_at for
  // whether it is finished.
  string state = 13;
  // When it was opened on the forge, in RFC 3339.
  string created_at = 14;
  // When the forge last saw it change, in RFC 3339.
  string updated_at = 15;
  // When it merged, in RFC 3339, unset while it has not.
  optional string merged_at = 16;
  // When it closed, in RFC 3339, unset while it is open; a merged one carries this too.
  optional string closed_at = 17;
}

message ListPullRequestsResponse {
  // One page of pull requests, as the forge orders them.
  repeated PullRequest pull_requests = 1;
  // The token for the page after this one, unset on the last.
  optional string next_page_token = 2;
}

// PullRequestState is where a stored pull request stands, decided on the server from its stamps,
// its draft flag, the checks on its head, its mergeability and the forge's review decision,
// finished first.
enum PullRequestState {
  // No state was decided.
  PULL_REQUEST_STATE_UNSPECIFIED = 0;
  // The repository's first sweep has not completed, so nothing is known.
  PULL_REQUEST_STATE_UNREAD = 1;
  // The repository has been swept and nothing was opened from the branch.
  PULL_REQUEST_STATE_NONE = 2;
  // Open with no review decision that settles it.
  PULL_REQUEST_STATE_OPEN = 3;
  // Open and the forge would merge it now: its rules on reviews and checks are met and the
  // branch is level with its base.
  PULL_REQUEST_STATE_APPROVED = 4;
  // Open with a reviewer asking for changes.
  PULL_REQUEST_STATE_CHANGES_REQUESTED = 5;
  // Still a draft, whatever its reviews say.
  PULL_REQUEST_STATE_DRAFT = 6;
  // Merged.
  PULL_REQUEST_STATE_MERGED = 7;
  // Closed without merging.
  PULL_REQUEST_STATE_CLOSED = 8;
  // Open with a failing check on its head, whatever its reviews say.
  PULL_REQUEST_STATE_FAILING = 9;
  // Approved on the forge but not yet mergeable: its checks are still running, its branch is
  // behind, or a branch rule is unmet.
  PULL_REQUEST_STATE_APPROVED_WAITING = 10;
  // Open and no longer merging cleanly into its base, whatever its reviews say.
  PULL_REQUEST_STATE_CONFLICTING = 11;
}

// Mergeability is where the forge says a pull request stands against its base and its branch
// rules, as it last computed it.
enum Mergeability {
  // The mergeability has not been read.
  MERGEABILITY_UNSPECIFIED = 0;
  // The forge has not computed it yet.
  MERGEABILITY_UNKNOWN = 1;
  // The forge would merge it now.
  MERGEABILITY_CLEAN = 2;
  // Its checks are not all passing.
  MERGEABILITY_UNSTABLE = 3;
  // A branch rule is unmet, such as a required review.
  MERGEABILITY_BLOCKED = 4;
  // The base has moved past the branch.
  MERGEABILITY_BEHIND = 5;
  // The branch no longer merges cleanly into its base.
  MERGEABILITY_CONFLICTING = 6;
}

// Checks is where the checks on a pull request's head commit stand, as the forge last reported
// them.
enum Checks {
  // The checks have not been read.
  CHECKS_UNSPECIFIED = 0;
  // The forge reports no checks on the head.
  CHECKS_NONE = 1;
  // A run is still in flight.
  CHECKS_PENDING = 2;
  // Every check passed.
  CHECKS_PASSING = 3;
  // At least one check failed.
  CHECKS_FAILING = 4;
}

message ListAgentPullRequestsRequest {
  // Which agent's branch to list the pull requests of.
  string agent_id = 1 [(buf.validate.field).string.min_len = 1];
}

message AgentPullRequest {
  // The number the forge shows a person, which is per repository.
  int32 number = 1;
  // The web address a person opens.
  string url = 2;
  // The title as the forge has it.
  string title = 3;
  // Where it stands, decided from the stored row.
  PullRequestState state = 4;
  // Where the checks on its head stand.
  Checks checks = 9;
  // Where the forge says it stands against its base and rules.
  Mergeability mergeability = 10;
  // Whether this is the one the agent's row stands for: the newest opened that is not finished,
  // else the newest opened of the finished.
  bool current = 5;
  // When it was opened on the forge, in RFC 3339.
  string opened_at = 6;
  // When it merged, in RFC 3339, unset while it has not.
  optional string merged_at = 7;
  // When it closed, in RFC 3339, unset while it is open; a merged one carries this too.
  optional string closed_at = 8;
}

message ListAgentPullRequestsResponse {
  // Every pull request opened from the agent's branch in its repository, newest opened first,
  // read from what the sync has stored rather than from the forge.
  repeated AgentPullRequest pull_requests = 1;
  // When the sync last made a request for the repository, in RFC 3339, unset until its first
  // sweep has completed.
  optional string repository_read_at = 2;
}

// PullRequestService reads pull requests through the forge connections weave holds.
service PullRequestService {
  rpc ListPullRequests(ListPullRequestsRequest) returns (ListPullRequestsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "list_pull_requests"
      description: "List a repository's pull requests through the forge connection for its host, a page at a time: every one opened from a branch when one is named, whatever its state, or the open ones when none is. Give the repository as a git remote spells it, and pass the next_page_token back as pagination.cursor for the next page. A repository the connection's credential cannot see is answered as not found, which is also what a repository that does not exist answers."
    };
  }
  rpc ListAgentPullRequests(ListAgentPullRequestsRequest) returns (ListAgentPullRequestsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "list_agent_pull_requests"
      description: "List the pull requests opened from an agent's branch in its repository, newest opened first, each with where it stands: open, approved, changes requested, draft, merged or closed. The one marked current is what the agent's row in the panel shows. This reads what the pull request sync has stored rather than asking the forge, so repository_read_at says how fresh it is, and an unset repository_read_at means the repository's first sweep has not completed. An agent whose checkout is not on a forge repository answers an empty list."
    };
  }
}
