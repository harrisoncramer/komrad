syntax = "proto3";

package forge.v1;

import "annotation/v1/tool.proto";
import "buf/validate/validate.proto";
import "forge/v1/enums.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "pagination/v1/pagination.proto";

option go_package = "komrad/proto/gen/forge/v1;forgev1";

// Forge is komrad's connection to one forge host and the credential komrad uses there.
message Forge {
  // The connection's id.
  string id = 1;
  // The kind of forge the host runs.
  Kind kind = 2;
  // The host that git remotes name, such as `github.com`.
  string host = 3;
  // The address of an enterprise host's API. Empty for the public forge.
  string api_url = 4;
  // How the credential was given.
  CredentialMethod method = 5;
  // The account the forge says the credential belongs to, a user login or an App's name.
  string login = 6;
  // When the forge last accepted the credential. Unset once the forge refuses it.
  optional google.protobuf.Timestamp verified_at = 7;
  // Whether this machine still has the credential. A `token` connection needs its token file,
  // and a `github_app` connection always has its credential.
  bool has_credential = 8;
  // When the connection was created.
  google.protobuf.Timestamp created_at = 9;
}

message ConnectForgeRequest {
  // The host that git remotes name, such as `github.com`.
  string host = 1;
  // The kind of forge the host runs. Unspecified works it out from `github.com` or `gitlab.com`,
  // and any other host needs it.
  Kind kind = 2 [(buf.validate.field).enum.defined_only = true];
  // The address of an enterprise host's API, over https.
  string api_url = 3;
  // How the credential is given. Unspecified gives a token.
  CredentialMethod method = 4 [(buf.validate.field).enum.defined_only = true];
  // The token for the token and rotating token methods. Calls never return it.
  string token = 5;
}

message ConnectForgeResponse {
  // The connection as created.
  Forge forge = 1;
}

message ListForgesResponse {
  // Every connection, by host.
  repeated Forge forges = 1;
}

message DisconnectForgeRequest {
  // The host to disconnect.
  string host = 1;
}

message CheckForgesResponse {
  // One check for each connection, in the order `list_forges` returns them.
  repeated ForgeCheck checks = 1;
}

// ForgeCheck is what one forge said about komrad's credential.
message ForgeCheck {
  // The connection checked.
  Forge forge = 1;
  // What the forge said was wrong. Empty when the forge accepted the credential.
  string problem = 2;
  // The kind of problem. Unspecified when there is none.
  ProblemKind problem_kind = 3;
}

message ListForgePullRequestsRequest {
  // The repository's git remote, such as `git@github.com:owner/repo.git` or
  // `https://github.com/owner/repo`. The remote's host picks the forge connection.
  string remote_url = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 2048
  }];
  // The branch whose pull requests to list, in any state. Empty lists the repository's open pull
  // requests.
  string branch = 2 [(buf.validate.field).string = {max_len: 512}];
  // The page to read. The page size defaults to twenty and is at most a hundred.
  optional pagination.v1.Pagination pagination = 3;
}

// ForgePullRequest is a pull request as the forge describes it, read live and not kept.
message ForgePullRequest {
  // The kind of forge the pull request is on.
  Kind forge = 1;
  // The forge's own stable id for the pull request, such as GitHub's `node_id`.
  string provider_id = 2;
  // The pull request's web address.
  string url = 3;
  // The web address of the repository the pull request merges into.
  string repository_url = 4;
  // The web address of the repository the pull request's branch is in. Empty when the forge no
  // longer has that repository.
  string head_repository_url = 5;
  // The pull request's number, unique within its repository.
  int32 number = 6;
  // The pull request's title.
  string title = 7;
  // The branch the pull request merges from.
  string head_branch = 8;
  // The commit at the tip of the pull request's branch.
  string head_sha = 9;
  // The branch the pull request merges into.
  string base_branch = 10;
  // The commit at the tip of the branch the pull request merges into.
  string base_sha = 11;
  // Whether the pull request is a draft.
  bool draft = 12;
  // The state the forge reports, `OPEN`, `CLOSED` or `MERGED`.
  string state = 13;
  // When the pull request was opened.
  google.protobuf.Timestamp created_at = 14;
  // When the pull request last changed on the forge.
  google.protobuf.Timestamp updated_at = 15;
  // When the pull request merged. Unset until the pull request merges.
  optional google.protobuf.Timestamp merged_at = 16;
  // When the pull request closed, merged or not. Unset while the pull request is
  // open.
  optional google.protobuf.Timestamp closed_at = 17;
}

// CommitMessage is the text of the commit a merge writes.
message CommitMessage {
  // The commit's first line.
  string headline = 1;
  // The rest of the commit's message. Empty writes a headline alone.
  string body = 2;
}

// MergeOption is one way a pull request could merge.
message MergeOption {
  // The merge method.
  MergeMethod method = 1;
  // Whether the repository and the pull request's base branch allow the method.
  bool allowed = 2;
  // The message the forge writes for the method by itself. Unset for a method that doesn't write a
  // commit of its own.
  optional CommitMessage message = 3;
}

message PlanForgePullRequestMergeRequest {
  // The pull request to plan, by web address. The address's host picks the forge connection.
  string url = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 2048
  }];
}

message PlanForgePullRequestMergeResponse {
  // Every merge method the forge offers for the pull request, in the forge's order.
  repeated MergeOption options = 1;
  // The method the pull request merges by when a merge names none.
  MergeMethod default_method = 2;
  // The pull request's head commit when the plan was read.
  string head_sha = 3;
}

message MergeForgePullRequestRequest {
  // The pull request to merge, by web address. The address's host picks the forge connection.
  string url = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 2048
  }];
  // How the pull request merges. Unspecified merges by a method the base branch allows.
  MergeMethod method = 2 [(buf.validate.field).enum.defined_only = true];
  // The first line of the commit the merge writes. Unset leaves it to the forge.
  optional string headline = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 1024
  }];
  // The rest of the commit the merge writes. Unset leaves it to the forge, and empty writes a
  // headline alone.
  optional string body = 4 [(buf.validate.field).string.max_len = 65536];
  // The head commit the caller expects. The forge refuses to merge once the branch has moved
  // past it. Empty accepts any head.
  string head_sha = 5 [(buf.validate.field).string.max_len = 64];
}

message SetForgePullRequestDraftRequest {
  // The pull request to change, by web address. The address's host picks the forge connection.
  string url = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 2048
  }];
  // Whether the pull request is a draft. False marks the pull request ready for review.
  bool draft = 2;
}

message RequestForgePullRequestRereviewRequest {
  // The pull request to ask for reviews on, by web address. The address's host picks the forge
  // connection.
  string url = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 2048
  }];
}

message SetForgePullRequestAutoMergeRequest {
  // The pull request to change, by web address. The address's host picks the forge connection.
  string url = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 2048
  }];
  // The head commit the caller expects. The forge refuses to turn auto-merge on once the branch
  // has moved past it. Empty accepts any head.
  string head_sha = 2 [(buf.validate.field).string.max_len = 64];
  // Whether the pull request merges by itself once its checks and reviews pass.
  bool on = 3;
  // How the pull request merges once it may. Unspecified merges by a method the base branch allows.
  MergeMethod method = 4 [(buf.validate.field).enum.defined_only = true];
  // The first line of the commit the merge writes. Unset leaves it to the forge.
  optional string headline = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 1024
  }];
  // The rest of the commit the merge writes. Unset leaves it to the forge, and empty writes a
  // headline alone.
  optional string body = 6 [(buf.validate.field).string.max_len = 65536];
}

// PullRequestText is a pull request's title and description.
message PullRequestText {
  // The pull request's title.
  string title = 1 [(buf.validate.field).string.max_len = 1024];
  // The pull request's description, empty when it has none.
  string body = 2 [(buf.validate.field).string.max_len = 65536];
}

message ReadForgePullRequestTextRequest {
  // The pull request to read, by web address. The address's host picks the forge connection.
  string url = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 2048
  }];
}

message EditForgePullRequestRequest {
  // The pull request to change, by web address. The address's host picks the forge connection.
  string url = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 2048
  }];
  // The title and description the caller read. The call refuses to change a field that has moved
  // since, unless the field already holds the new value.
  PullRequestText edited_from = 2 [(buf.validate.field).required = true];
  // The new title. Unset leaves the title as it is.
  optional string title = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 1024
  }];
  // The new description. Unset leaves the description as it is, and empty clears it.
  optional string body = 4 [(buf.validate.field).string.max_len = 65536];
}

message ListForgePullRequestsResponse {
  // One page of pull requests, in the forge's order.
  repeated ForgePullRequest pull_requests = 1;
  // The cursor for the next page. Unset on the last page.
  optional string next_page_token = 2;
}

// ForgeService connects komrad to forges and reads and changes pull requests on them.
service ForgeService {
  rpc ConnectForge(ConnectForgeRequest) returns (ConnectForgeResponse) {
    option (annotation.v1.surfaces) = {
      cli: false
      mcp: false
      reason: "`komrad forge connect` reads the token from stdin or a file, and a generated command would expose it as an argument."
    };
  }
  rpc ListForges(google.protobuf.Empty) returns (ListForgesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "list_forges"
      description: "List the forges komrad is connected to and the account komrad uses on each. Tokens are never returned."
      roles: [ROLE_ORCHESTRATOR]
    };
  }
  rpc CheckForges(google.protobuf.Empty) returns (CheckForgesResponse) {
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "check_forges"
      description: "Check that each connected forge still accepts its credential, and record the result on the connection."
      destructive: false
      roles: [ROLE_ORCHESTRATOR]
    };
  }
  rpc ListForgePullRequests(ListForgePullRequestsRequest) returns (ListForgePullRequestsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "list_forge_pull_requests"
      description: "List a repository's pull requests from its forge: every one from a branch, or the open ones. `list_pull_requests` lists the ones komrad has recorded instead."
      roles: [ROLE_ORCHESTRATOR]
    };
  }
  rpc PlanForgePullRequestMerge(PlanForgePullRequestMergeRequest) returns (PlanForgePullRequestMergeResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: false
      name: "plan_forge_pull_request_merge"
      description: "Read the merge methods a pull request's forge offers, whether its base branch allows each, and the commit message the forge would write for each."
      reason: "Only the person merges, so only the person needs the plan."
    };
  }
  rpc MergeForgePullRequest(MergeForgePullRequestRequest) returns (google.protobuf.Empty) {
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: false
      name: "merge_forge_pull_request"
      description: "Merge a pull request on its forge, by the method and with the message asked for. Without a method, the forge merges by one the base branch allows, and without a message it writes its own."
      reason: "Only the person decides what lands on the base branch."
    };
  }
  rpc SetForgePullRequestDraft(SetForgePullRequestDraftRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: false
      name: "set_forge_pull_request_draft"
      description: "Mark a pull request as a draft or as ready for review on its forge."
      reason: "Only the person decides when a pull request is ready for review."
    };
  }
  rpc SetForgePullRequestAutoMerge(SetForgePullRequestAutoMergeRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: false
      name: "set_forge_pull_request_auto_merge"
      description: "Turn a pull request's auto-merge on or off on its forge."
      reason: "Only the person decides whether work lands on the base branch unattended."
    };
  }
  rpc RequestForgePullRequestRereview(RequestForgePullRequestRereviewRequest) returns (google.protobuf.Empty) {
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: false
      name: "request_forge_pull_request_rereview"
      description: "Ask every reviewer who requested changes on a pull request to review it again."
      reason: "Only the person decides when to ask colleagues for another review."
    };
  }
  rpc ReadForgePullRequestText(ReadForgePullRequestTextRequest) returns (PullRequestText) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: false
      name: "read_forge_pull_request_text"
      description: "Read a pull request's title and description from its forge. Refuses when the forge will not let the credential change them."
      reason: "Only the person edits a pull request's title and description, so only the person needs to read them first."
    };
  }
  rpc EditForgePullRequest(EditForgePullRequestRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: false
      name: "edit_forge_pull_request"
      description: "Change a pull request's title, description or both on its forge."
      reason: "Only the person decides how a pull request presents itself to reviewers."
    };
  }
  rpc DisconnectForge(DisconnectForgeRequest) returns (google.protobuf.Empty) {
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: false
      name: "disconnect_forge"
      description: "Disconnect a forge and forget its credential."
      reason: "Only the person, who gave the credential, takes it away."
    };
  }
}
