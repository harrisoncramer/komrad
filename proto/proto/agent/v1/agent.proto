syntax = "proto3";

package agent.v1;

import "agent/v1/document.proto";
import "agent/v1/mail.proto";
import "agent/v1/review.proto";
import "agent/v1/screen.proto";
import "agent/v1/transcript.proto";
import "annotation/v1/tool.proto";
import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "pagination/v1/pagination.proto";
import "pullrequest/v1/pullrequest.proto";
import "rules/v1/rules.proto";
import "task/v1/task.proto";
import "view/v1/view.proto";

option go_package = "komrad/proto/gen/agent/v1;agentv1";

// AgentState is what komrad last read an agent to be doing, from the end of its pane.
enum AgentState {
  // No state was recorded. No agent has this state.
  AGENT_STATE_UNSPECIFIED = 0;
  // The CLI is at rest with nothing typed.
  AGENT_STATE_IDLE = 1;
  // The CLI is working on a turn.
  AGENT_STATE_THINKING = 2;
  // The CLI is waiting for the person to answer a selection.
  AGENT_STATE_WAITING = 3;
  // The agent is launching and has no pane to read yet.
  AGENT_STATE_SETTING_UP = 4;
  // The launch failed. `retry_agent` launches the agent again.
  AGENT_STATE_FAILED_TO_CREATE = 5;
  // A delete failed to clean up after the agent. `failure_reason` says why.
  AGENT_STATE_FAILED_TO_CLEANUP = 6;
  // The pane could be read, but its end showed no known state.
  AGENT_STATE_UNCERTAIN = 7;
  // The CLI is at rest after an API error ended the last turn. `turn_error` names the error.
  AGENT_STATE_ERRORED = 8;
}

// AgentRole is what an agent was launched to do.
enum AgentRole {
  // No role was recorded. No agent has this role.
  AGENT_ROLE_UNSPECIFIED = 0;
  // An agent on a task that reads the writer's change and gives a review.
  AGENT_ROLE_REVIEWER = 1;
  // The one agent per workflow that hands work out across its tasks.
  AGENT_ROLE_ORCHESTRATOR = 2;
  // The one agent on a task that changes its checkout.
  AGENT_ROLE_WRITER = 3;
}

// ReportEvent is what a CLI hook reported about an agent, whichever CLI ran it.
enum ReportEvent {
  // No event was reported. `RecordReport` refuses this value.
  REPORT_EVENT_UNSPECIFIED = 0;
  // A turn ended on its own.
  REPORT_EVENT_TURN_ENDED = 1;
  // An API error ended a turn.
  REPORT_EVENT_TURN_FAILED = 2;
  // A tool call is about to run.
  REPORT_EVENT_TOOL_STARTED = 3;
  // A tool call returned or failed.
  REPORT_EVENT_TOOL_FINISHED = 4;
  // A tool call is waiting for the person to allow it.
  REPORT_EVENT_APPROVAL_WANTED = 5;
  // The conversation was just compacted.
  REPORT_EVENT_COMPACTED = 6;
}

// Agent is one CLI conversation that komrad runs in a pane and tracks.
message Agent {
  // The agent's id. Mail is addressed to it.
  string id = 1;
  // The agent's name. It is also the agent's tmux window name at launch.
  string name = 2;
  // The directory of the agent's checkout.
  string cwd = 3;
  // The command-line flags the agent's CLI started with.
  string flags = 4;
  // The agent's prompt.
  string prompt = 5;
  // The tmux pane the agent's CLI runs in.
  string pane_id = 6;
  // What komrad last read the agent to be doing.
  AgentState state = 7;
  // The CLI's own id for the agent's conversation. A resume needs it.
  string session_id = 8;
  // The harness the agent runs, such as `claude` or `codex`.
  string harness = 9;
  // The id of the workflow the agent belongs to.
  string workflow_id = 10;
  // When the agent was created.
  google.protobuf.Timestamp created_at = 11;
  // When the agent was archived. Unset while the agent is live.
  optional google.protobuf.Timestamp archived_at = 12;
  // The id of the schedule that created the agent. Unset when a person or an agent created it.
  optional string schedule_id = 13;
  // Whether the agent's pane exists. A dormant agent has none.
  optional bool alive = 14;
  // The idempotency key the agent's create carried.
  optional string idempotency_key = 15;
  // The id of the agent that created this agent. Unset when the person created it.
  optional string spawned_by_agent_id = 16;
  // Whether a hook run for the agent failed and the person has not opened its log since.
  bool failed_run = 17;
  // The id of the log of the agent's failed hook run. Unset when no run failed.
  optional int32 failed_run_log = 18;
  // How many documents the agent has written. `list_documents` returns them.
  int32 documents = 19;
  // When the newest of the agent's documents was last written. Unset when the agent
  // has none.
  optional google.protobuf.Timestamp documents_updated_at = 20;
  // When the agent's state last changed.
  google.protobuf.Timestamp state_changed_at = 21;
  // What the agent's CLI hooks last reported the agent doing.
  string reported_reason = 22;
  // Why the agent's create or cleanup last failed. Empty when neither has failed.
  string failure_reason = 23;
  // What the CLI printed when an API error ended the agent's last turn. Empty when that turn did
  // not fail.
  string turn_error = 24;
  // What the agent was launched to do.
  AgentRole role = 25;
  // Whether `prompt` holds only the prompt's opening, as a summary view returns it.
  bool prompt_truncated = 26;
  // The id of the agent's task. Unset for an orchestrator, or once the task is deleted.
  optional string task_id = 29;
  // The slug of the agent's task. Unset whenever `task_id` is.
  optional string task_slug = 30;
  // Whether the agent was told to work in the workflow's directory instead of a worktree.
  bool provision_disabled = 31;
  // The CLI hooks the agent's latest launch installed, as the CLI names its events. Empty when
  // that launch failed or never ran.
  repeated string hooks = 32;
}

// AgentRow is an agent with its mail, pull requests and review state.
message AgentRow {
  // The agent.
  Agent agent = 1;
  // Whether mail is waiting that the agent has not read.
  bool unread_mail = 2;
  // The state of the current pull request from the agent's branch.
  PullRequestStanding pull_request = 3;
  // Every pull request from the agent's branch, the current one first.
  repeated pullrequest.v1.PullRequest pull_requests = 4;
  // How many review snapshots the agent's work has.
  int32 local_review_snapshots = 5;
  // The comments reviewers have left on the agent's work. Unset while there are none.
  optional CommentCounts reviewer_comments = 6;
  // The comments the person has left on the agent's work. Unset while there are none.
  optional CommentCounts person_comments = 7;
}

// CommentCounts counts the comments on an agent's work.
message CommentCounts {
  // How many comments are not resolved, on any snapshot.
  int32 open = 1;
  // How many comments are resolved, on snapshots that have not landed.
  int32 resolved = 2;
  // How many comments hold a reply the person has not read.
  int32 unread = 3;
}

// PullRequestStanding is the current pull request from an agent's branch.
message PullRequestStanding {
  // The state of the current pull request. `UNREAD` means komrad has not read the repository yet,
  // and `NONE` means the branch has no pull request, or the checkout has moved past a finished one.
  pullrequest.v1.PullRequestState state = 1;
  // The current pull request's number. Unset for `UNREAD` and `NONE`.
  optional int32 number = 2;
  // The current pull request's web address. Unset for `UNREAD` and `NONE`.
  optional string url = 3;
  // The current pull request's title. Unset for `UNREAD` and `NONE`.
  optional string title = 4;
  // Whether the forge would merge the current pull request. Unspecified for `UNREAD` and `NONE`.
  pullrequest.v1.MergeReadiness merge_readiness = 5;
  // The commit at the head of the current pull request on the forge. Unset for `UNREAD` and
  // `NONE`.
  optional string head_sha = 6;
  // The forge the current pull request is on, such as `github`. Unset for `UNREAD` and `NONE`.
  optional string forge = 7;
}

message ListAgentsRequest {
  // The page to read.
  optional pagination.v1.Pagination pagination = 1;
  // Whether to list only archived agents instead of live ones.
  bool archived = 2;
  // How much of each agent to return. `VIEW_FULL` returns every prompt in full and can make a
  // very large response.
  view.v1.View view = 3 [(buf.validate.field).enum.defined_only = true];
}

message ListAgentsResponse {
  // The agents, most recently updated first.
  repeated AgentRow agents = 1;
  // The cursor for the next page. Unset on the last page.
  optional string next_page_token = 2;
}

message CreateAgentRequest {
  // The agent's prompt, which is all the agent has to go on.
  string prompt = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 50000
  }];
  // The agent's name. Empty to have komrad name the agent.
  string title = 2 [(buf.validate.field).string = {
    max_len: 200
    [rules.v1.printable]: true
  }];
  // The flags for the agent's CLI. Empty to use the workflow's flags.
  string flags = 3 [(buf.validate.field).string = {
    max_len: 500
    [rules.v1.shell_safe]: true
  }];
  // The workflow to create the agent in, by id. The agent uses the workflow's directory, flags
  // and context.
  string workflow_id = 4 [(buf.validate.field).string.uuid = true];
  // The harness to run. Empty to use the workflow's harness.
  string harness = 5 [(buf.validate.field).string = {
    max_len: 40
    pattern: "^[a-z0-9-]*$"
  }];
  // A key that makes a retry safe. A repeat with the same key returns the agent already created.
  optional string idempotency_key = 6 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  // Whether the agent gets a worktree of its own. False keeps the agent in the workflow's
  // directory. Unset to follow the workflow.
  optional bool provision_enabled = 7;
  // The task in `workflow_id` to put the agent on. Unset to create a task with the agent as its
  // writer. An agent that joins as a reviewer cannot set `provision_enabled` to true.
  oneof task {
    // The task, by id.
    string task_id = 8 [(buf.validate.field).string.uuid = true];
    // The task, by slug.
    string task_slug = 12 [(buf.validate.field).string.min_len = 1];
  }
  // The slug of the task komrad creates when no task is named. No task may have used it before.
  // Unset to derive one from the agent's name.
  optional string new_task_slug = 9 [(buf.validate.field).string = {
    max_len: 80
    pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
  }];
  // The goal of the task komrad creates when no task is named, in markdown. Empty to use the
  // first line of the prompt.
  string new_task_goal = 10 [(buf.validate.field).string.max_len = 50000];
  // The task in `workflow_id` the new task depends on. The new task's branch starts from that
  // task's branch on origin, and komrad rebases it as that branch moves and re-targets it onto the
  // base branch once that task merges. Unset to start from the workflow's base branch. Cannot be
  // set with a task to put the agent on.
  oneof depends_on {
    // The task, by id.
    string depends_on_id = 11 [(buf.validate.field).string.uuid = true];
    // The task, by slug.
    string depends_on_slug = 13 [(buf.validate.field).string.min_len = 1];
  }
}

message CreateAgentResponse {
  // The agent as created.
  Agent agent = 1;
}

message RequestReviewRequest {
  // The reviewer's prompt.
  string prompt = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 50000
  }];
  // The agent whose work to review, by id. Unset for the caller.
  optional string agent_id = 2 [(buf.validate.field).string.uuid = true];
  // The reviewer's name. Empty to name the reviewer after the agent under review.
  string title = 3 [(buf.validate.field).string = {
    max_len: 200
    [rules.v1.printable]: true
  }];
  // A key that makes a retry safe. A repeat with the same key returns the reviewer already
  // created.
  optional string idempotency_key = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  // The harness the reviewer runs. Empty to use the workflow's harness.
  string harness = 5 [(buf.validate.field).string = {
    max_len: 40
    pattern: "^[a-z0-9-]*$"
  }];
  // The flags for the reviewer's CLI. Empty to use the workflow's flags.
  string flags = 6 [(buf.validate.field).string = {
    max_len: 500
    [rules.v1.shell_safe]: true
  }];
}

message RequestReviewResponse {
  // The reviewer as created, on the task of the agent under review.
  Agent reviewer = 1;
  // What the caller does next: how the review arrives and how to answer it.
  string guidance = 2;
}

message AdoptRequest {
  // The branch to put an agent on. The branch must exist on origin or on disk.
  string ref = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 400
    [rules.v1.shell_safe]: true
  }];
  // The workflow to create the agent in, by id. The workflow's directory picks the repository.
  string workflow_id = 2 [(buf.validate.field).string.uuid = true];
  // The agent's prompt. Empty to launch the CLI with no prompt.
  string prompt = 3 [(buf.validate.field).string.max_len = 50000];
  // The agent's name. Empty to have komrad name the agent.
  string title = 4 [(buf.validate.field).string = {
    max_len: 200
    [rules.v1.printable]: true
  }];
  // The flags for the agent's CLI. Empty to use the workflow's flags.
  string flags = 5 [(buf.validate.field).string = {
    max_len: 500
    [rules.v1.shell_safe]: true
  }];
  // The harness to run. Empty to use the workflow's harness.
  string harness = 6 [(buf.validate.field).string = {
    max_len: 40
    pattern: "^[a-z0-9-]*$"
  }];
  // A key that makes a retry safe. A repeat with the same key returns the agent already created.
  optional string idempotency_key = 7 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
}

message AdoptResponse {
  // The agent on the branch, either the one just created or the one already there.
  Agent agent = 1;
  // Whether the branch already had an agent, which komrad returned instead of creating one.
  bool existing = 2;
}

message GetAgentRequest {
  // The agent to get, by id. Archived agents are included.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message GetAgentResponse {
  // The agent, with the prompt in full.
  Agent agent = 1;
  // Whether mail is waiting that the agent has not read.
  bool unread_mail = 2;
  // The state of the current pull request from the agent's branch.
  PullRequestStanding pull_request = 3;
  // Every pull request from the agent's branch, the current one first.
  repeated pullrequest.v1.PullRequest pull_requests = 4;
  // How many review snapshots the agent's work has.
  int32 local_review_snapshots = 5;
  // The comments reviewers have left on the agent's work. Unset while there are none.
  optional CommentCounts reviewer_comments = 6;
  // The comments the person has left on the agent's work. Unset while there are none.
  optional CommentCounts person_comments = 7;
  // The agent's task. Unset for an agent on no task.
  optional task.v1.Task task = 8;
}

// PlanRebaseRequest asks what a rebase of a task's branch would do, without doing it.
message PlanRebaseRequest {
  // The task whose branch to plan a rebase of.
  oneof task {
    option (buf.validate.oneof).required = true;
    // The task, by id.
    string task_id = 1 [(buf.validate.field).string.uuid = true];
    // The task, by slug.
    string task_slug = 3 [(buf.validate.field).string.min_len = 1];
  }
  // Plan a re-target of a child onto the workflow's base branch, rebasing only its own commits,
  // in place of a rebase onto its parent.
  bool onto_base = 2;
}

message PlanRebaseResponse {
  // The ref the branch would move onto.
  string base_ref = 1;
  // The commit `base_ref` named when komrad read it.
  string base_sha = 2;
  // How many commits the branch has that the base branch does not.
  int32 commits = 3;
  // The branch that would move.
  string branch = 4;
  // How many of the branch's commits have landed. The rebase would drop them.
  int32 landed_commits = 5;
  // How many of the branch's commits the rebase would replay.
  int32 replay_commits = 6;
  // How many merge commits the rebase would flatten.
  int32 merges = 7;
  // The paths a merge of the base branch would conflict on. A rebase can conflict where a merge
  // does not, so this is a warning only.
  repeated string conflict_paths = 8;
}

message StartOrchestratorRequest {
  // The workflow whose orchestrator to resume or create, by id.
  string workflow_id = 1 [(buf.validate.field).string.uuid = true];
  // The prompt for a new orchestrator. Empty to use komrad's default prompt.
  string prompt = 2 [(buf.validate.field).string.max_len = 50000];
}

message StartOrchestratorResponse {
  // The orchestrator, running.
  Agent agent = 1;
}

message RebaseWorktreeRequest {
  // The task whose branch to rebase onto the base branch.
  oneof task {
    option (buf.validate.oneof).required = true;
    // The task, by id.
    string task_id = 1 [(buf.validate.field).string.uuid = true];
    // The task, by slug.
    string task_slug = 3 [(buf.validate.field).string.min_len = 1];
  }
  // Re-target a child onto the workflow's base branch, rebasing only its own commits, so it no
  // longer has a parent.
  bool onto_base = 2;
}

message RebaseWorktreeResponse {
  // The ref the branch moved onto.
  string base_ref = 1;
  // The commit `base_ref` named when komrad read it.
  string base_sha = 2;
  // How many commits the branch had that the base branch did not.
  int32 commits = 3;
  // The branch that moved.
  string branch = 4;
  // Whether the rebase stopped on conflicts and is waiting for the agent.
  bool conflicted = 5;
  // Whether the branch reached the base branch without replaying anything, as when all its
  // commits have landed.
  bool moved = 6;
  // How many of the branch's commits had landed. The rebase dropped them.
  int32 landed_commits = 7;
  // How many of the branch's commits the rebase replayed.
  int32 replay_commits = 8;
}

// PlanPushRequest asks what a push of a task's branch would do, without doing it.
message PlanPushRequest {
  // The task whose branch to plan a push of.
  oneof task {
    option (buf.validate.oneof).required = true;
    // The task, by id.
    string task_id = 1 [(buf.validate.field).string.uuid = true];
    // The task, by slug.
    string task_slug = 2 [(buf.validate.field).string.min_len = 1];
  }
}

message PlanPushResponse {
  // The branch that would be pushed.
  string branch = 1;
  // How many commits would be pushed, counted against origin's copy of the branch, or against
  // the base branch when origin has none.
  int32 commits = 2;
  // Whether origin's copy has commits the branch does not, which the push would overwrite.
  bool forced = 3;
  // How many files have changes that are not committed and would not be pushed.
  int32 uncommitted_files = 4;
  // Whether origin already has every commit on the branch.
  bool in_sync = 5;
}

message PushWorktreeRequest {
  // The task whose branch to push to origin.
  oneof task {
    option (buf.validate.oneof).required = true;
    // The task, by id.
    string task_id = 1 [(buf.validate.field).string.uuid = true];
    // The task, by slug.
    string task_slug = 2 [(buf.validate.field).string.min_len = 1];
  }
}

message PushWorktreeResponse {
  // The branch that was pushed.
  string branch = 1;
  // How many commits were pushed.
  int32 commits = 2;
  // Whether origin's copy was overwritten.
  bool forced = 3;
  // The commit origin's copy of the branch now points at.
  string sha = 4;
}

message PickForkPointRequest {
  // The child task.
  oneof task {
    option (buf.validate.oneof).required = true;
    // The task, by id.
    string task_id = 1 [(buf.validate.field).string.uuid = true];
    // The task, by slug.
    string task_slug = 3 [(buf.validate.field).string.min_len = 1];
  }
  // The commit the child's own commits sit on, which its branch must hold. Any name git reads as
  // a commit.
  string commit = 2 [(buf.validate.field).string.min_len = 1];
}

message PickForkPointResponse {
  // The full name of the commit recorded.
  string fork_point = 1;
}

message AbortSequenceRequest {
  // The task whose sequence to abort.
  oneof task {
    option (buf.validate.oneof).required = true;
    // The task, by id.
    string task_id = 1 [(buf.validate.field).string.uuid = true];
    // The task, by slug.
    string task_slug = 2 [(buf.validate.field).string.min_len = 1];
  }
}

message AbortSequenceResponse {
  // The sequence that was aborted.
  task.v1.Sequence sequence = 1;
  // The branch of the task's checkout after the abort. Empty when the checkout is detached.
  string branch = 2;
  // The ref that keeps the checkout as it was before the abort, conflicts included.
  string parked_ref = 3;
}

message RecordReportRequest {
  // What the CLI hook reported.
  ReportEvent event = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // The CLI hook that ran, as the agent's CLI names its event.
  string hook = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
    [rules.v1.printable]: true
  }];
  // The tool the event is about. Empty for an event about no tool.
  string tool = 3 [(buf.validate.field).string = {
    max_len: 200
    [rules.v1.printable]: true
  }];
  // What the CLI printed when an API error ended the turn. Empty when the turn did not fail.
  string turn_error = 4 [(buf.validate.field).string = {
    max_len: 200
    [rules.v1.printable]: true
  }];
}

message MarkRunsReadRequest {
  // The agent whose failed hook runs the person has seen, by id.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message LogRequest {
  // The agent the line is about, by id. Unset for the caller.
  optional string id = 1 [(buf.validate.field).string.uuid = true];
  // The line to write.
  string message = 2 [
    (buf.validate.field).string = {
      min_len: 1
      max_len: 2048
    },
    (buf.validate.field).cel = {
      id: "message.printable"
      message: "a log message must carry no control characters"
      expression: "!this.matches('[[:cntrl:]]')"
    }
  ];
  // The hook whose run the line belongs to. A running hook finds its name in `KOMRAD_SCRIPT`.
  optional string script = 3 [(buf.validate.field).string = {
    max_len: 255
    [rules.v1.script_name]: true
  }];
}

message ArchiveAgentsRequest {
  // The agents to archive, by id.
  repeated string ids = 1 [(buf.validate.field).repeated = {
    min_items: 1
    unique: true
    items: {
      string: {uuid: true}
    }
  }];
}

message RestoreAgentsRequest {
  // The archived agents to restore, by id.
  repeated string ids = 1 [(buf.validate.field).repeated = {
    min_items: 1
    unique: true
    items: {
      string: {uuid: true}
    }
  }];
}

message RestoreAgentsResponse {
  // The agents as restored, dormant.
  repeated Agent agents = 1;
}

message RetryAgentRequest {
  // The agent whose failed create to retry, by id.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // The new flags for the agent's CLI. Empty to keep the flags of the failed attempt.
  string flags = 2 [(buf.validate.field).string = {
    max_len: 500
    [rules.v1.shell_safe]: true
  }];
  // The new prompt. Empty to keep the agent's prompt.
  string prompt = 3 [(buf.validate.field).string.max_len = 50000];
  // The new harness. Empty to keep the agent's harness.
  string harness = 4 [(buf.validate.field).string = {
    max_len: 40
    pattern: "^[a-z0-9-]*$"
  }];
}

message RetryAgentResponse {
  // The agent as launched again, running.
  Agent agent = 1;
}

message ResumeAgentRequest {
  // The dormant agent to resume, by id.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message ResumeAgentResponse {
  // The agent as resumed, running.
  Agent agent = 1;
}

message RestartAgentRequest {
  // The writer or orchestrator to restart, by id.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // Text to add to the agent's prompt. Empty to add nothing.
  string note = 2 [(buf.validate.field).string.max_len = 50000];
  // The harness to move the agent to. Empty to keep the agent's harness.
  string harness = 3 [(buf.validate.field).string = {
    max_len: 40
    pattern: "^[a-z0-9-]*$"
  }];
  // The flags for the agent's CLI. Empty to keep the agent's flags, or, when `harness` changes,
  // to use the workflow's flags if the workflow runs that harness and the CLI's default flags if not.
  string flags = 4 [(buf.validate.field).string = {
    max_len: 500
    [rules.v1.shell_safe]: true
  }];
}

message RestartAgentResponse {
  // The agent as restarted, running.
  Agent agent = 1;
}

message UpdateAgentRequest {
  // The agent to rename, by id.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // The agent's new name.
  string name = 2 [
    (buf.validate.field).string = {
      min_len: 1
      max_len: 200
      [rules.v1.printable]: true
    },
    (buf.validate.field).cel = {
      id: "name.storable"
      message: "name must not contain spaces, colons, dots, or slashes"
      expression: "!this.contains(' ') && !this.contains(':') && !this.contains('.') && !this.contains('/')"
    }
  ];
}

// AgentService creates, reads and changes agents, with their mail, transcripts, documents and
// reviews.
service AgentService {
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse) {
