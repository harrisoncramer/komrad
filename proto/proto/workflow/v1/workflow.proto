syntax = "proto3";

package workflow.v1;

import "annotation/v1/tool.proto";
import "buf/validate/validate.proto";
import "event/v1/event.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "pagination/v1/pagination.proto";
import "rules/v1/rules.proto";
import "view/v1/view.proto";

option go_package = "komrad/proto/gen/workflow/v1;workflowv1";

// Workflow is a group of tasks that share a directory, flags, harness and context.
message Workflow {
  // The workflow's id.
  string id = 1;
  // The workflow's name.
  string name = 2;
  // The workflow's context, added to the system prompt of every agent the workflow launches. Each
  // agent keeps the context it was launched with.
  string context = 3;
  // The directory the workflow's agents start in, and the repository worktrees are created from.
  string cwd = 4;
  // The flags each new agent in the workflow starts with.
  string flags = 5;
  // The harness the workflow's agents run. Empty uses komrad's default.
  string harness = 6;
  // When the workflow was archived. Unset while the workflow is live.
  optional google.protobuf.Timestamp archived_at = 7;
  // Whether the workflow's tasks get worktrees, and how komrad creates them.
  WorktreeConfig worktree = 8;
  // The workflow's hooks, at most one for each moment.
  repeated WorkflowHook hooks = 9;
  // Whether `context` was cut to its opening, as in a summary listing.
  bool context_truncated = 10;
  // The harness the workflow's reviewers run. Empty uses `harness`.
  string reviewer_harness = 11;
  // The flags each new reviewer starts with. Empty uses `flags` when the reviewer runs the same
  // harness.
  string reviewer_flags = 12;
  // The prompts komrad adds to the mail it sends the workflow's agents about events, one for each
  // event.
  repeated WorkflowEventPrompt event_prompts = 13;
}

// WorkflowEventPrompt is what a workflow's agents are told to do when komrad mails them an event.
message WorkflowEventPrompt {
  // The event.
  event.v1.Event event = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // The text added to the mail about the event. Empty adds nothing.
  string prompt = 2 [(buf.validate.field).string.max_len = 500];
  // Whether the event is muted. A muted event sends no mail of its own, and updates the agent's
  // unread mail without its prompt.
  bool muted = 3;
}

// WorkflowEventPrompts is a list of event prompts, which tells an unset list from an empty one.
message WorkflowEventPrompts {
  // The event prompts, one for each event.
  repeated WorkflowEventPrompt prompts = 1 [(buf.validate.field).repeated.max_items = 50];
}

// WorkflowHook is a hook that runs at one moment in the life of a workflow's task or agent.
message WorkflowHook {
  // The moment the hook runs at, any but the provisioner's own.
  event.v1.Moment event = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [
      0,
      1,
      2,
      3
    ]
  }];
  // The hook's script, by file name in the hooks directory.
  string script = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
    [rules.v1.script_name_or_blank]: true
  }];
}

// WorktreeConfig is whether a workflow's tasks get worktrees, and how komrad creates them.
message WorktreeConfig {
  // Whether each task gets a worktree. False runs agents in the workflow's directory.
  bool enabled = 1;
  // The workflow's base branch. Empty on create reads the branch from the repository.
  string base_branch = 2 [(buf.validate.field).string = {
    max_len: 255
    [rules.v1.shell_safe]: true
  }];
  // The untracked files to copy into each new worktree, such as ones a build needs.
  repeated string copy_paths = 3 [(buf.validate.field).repeated = {
    max_items: 50
    items: {
      string: {
        max_len: 255
        [rules.v1.relative_path]: true
      }
    }
  }];
  // The files to link into each new worktree instead of copying, such as large shared ones.
  repeated string symlink_paths = 4 [(buf.validate.field).repeated = {
    max_items: 50
    items: {
      string: {
        max_len: 255
        [rules.v1.relative_path]: true
      }
    }
  }];
  // The paths or globs left out of a task's diff and line counts, such as generated output.
  repeated string diff_exclude = 5 [(buf.validate.field).repeated = {
    max_items: 50
    items: {
      string: {
        min_len: 1
        max_len: 255
        [rules.v1.relative_path]: true
      }
    }
  }];
  // The directory new worktrees are created in. Empty uses the directory all workflows share.
  string dir = 6 [(buf.validate.field).string = {
    max_len: 4096
    [rules.v1.absolute_path_or_blank]: true
  }];
  // The shell command run in each worktree before an agent starts or resumes there, such as
  // one that installs the repository's tools. Empty runs nothing.
  string setup_command = 7 [(buf.validate.field).string = {
    max_len: 1000
    [rules.v1.printable]: true
  }];
}

message ListWorkflowsRequest {
  // The page to read.
  optional pagination.v1.Pagination pagination = 1;
  // Whether to list only archived workflows instead of live ones.
  bool archived = 2;
  // How much of each workflow to return.
  view.v1.View view = 3 [(buf.validate.field).enum.defined_only = true];
}

message ListWorkflowsResponse {
  // One page of workflows, by name.
  repeated Workflow workflows = 1;
  // The cursor for the next page. Unset on the last page.
  optional string next_page_token = 2;
}

message GetWorkflowRequest {
  // The workflow to get, by id.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message GetWorkflowResponse {
  // The workflow, with its context in full.
  Workflow workflow = 1;
}

message CreateWorkflowRequest {
  // The workflow's name.
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
    [rules.v1.printable]: true
  }];
  // The workflow's context, added to the system prompt of every agent the workflow launches.
  string context = 2 [(buf.validate.field).string.max_len = 50000];
  // The directory the workflow's agents start in, and the repository worktrees are created from.
  string cwd = 3 [(buf.validate.field).string = {
    max_len: 4096
    [rules.v1.absolute_path_or_blank]: true
  }];
  // The flags each new agent in the workflow starts with.
  string flags = 4 [(buf.validate.field).string = {
    max_len: 500
    [rules.v1.shell_safe]: true
  }];
  // The harness the workflow's agents run. Empty uses komrad's default.
  string harness = 5 [(buf.validate.field).string = {
    max_len: 40
    pattern: "^[a-z0-9-]*$"
  }];
  // Whether the workflow's tasks get worktrees, and how komrad creates them.
  WorktreeConfig worktree = 6;
  // The workflow's hooks.
  repeated WorkflowHook hooks = 7 [(buf.validate.field).repeated.max_items = 50];
  // The harness the workflow's reviewers run. Empty uses `harness`.
  string reviewer_harness = 8 [(buf.validate.field).string = {
    max_len: 40
    pattern: "^[a-z0-9-]*$"
  }];
  // The flags each new reviewer starts with. Empty uses `flags` when the reviewer runs the same
  // harness.
  string reviewer_flags = 9 [(buf.validate.field).string = {
    max_len: 500
    [rules.v1.shell_safe]: true
  }];
  // The workflow's event prompts. Unset uses komrad's default prompt for each event, and an empty
  // list sets none.
  WorkflowEventPrompts event_prompts = 10;
}

message CreateWorkflowResponse {
  // The workflow as created.
  Workflow workflow = 1;
}

message UpdateWorkflowRequest {
  // The workflow to update, by id.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // The workflow's name.
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
    [rules.v1.printable]: true
  }];
  // The workflow's context. Agents already launched keep theirs.
  string context = 3 [(buf.validate.field).string.max_len = 50000];
  // The directory agents launched from now on start in.
  string cwd = 4 [(buf.validate.field).string = {
    max_len: 4096
    [rules.v1.absolute_path_or_blank]: true
  }];
  // The flags agents launched from now on start with.
  string flags = 5 [(buf.validate.field).string = {
    max_len: 500
    [rules.v1.shell_safe]: true
  }];
  // The harness agents launched from now on run.
  string harness = 6 [(buf.validate.field).string = {
    max_len: 40
    pattern: "^[a-z0-9-]*$"
  }];
  // Whether the workflow's tasks get worktrees, and how komrad creates them. Turning worktrees off
  // applies to existing tasks too, so deleting one leaves its worktree on disk.
  WorktreeConfig worktree = 7;
  // The workflow's hooks, in full.
  repeated WorkflowHook hooks = 8 [(buf.validate.field).repeated.max_items = 50];
  // The harness reviewers created from now on run.
  string reviewer_harness = 9 [(buf.validate.field).string = {
    max_len: 40
    pattern: "^[a-z0-9-]*$"
  }];
  // The flags reviewers created from now on start with.
  string reviewer_flags = 10 [(buf.validate.field).string = {
    max_len: 500
    [rules.v1.shell_safe]: true
  }];
  // The workflow's event prompts, in full.
  repeated WorkflowEventPrompt event_prompts = 11 [(buf.validate.field).repeated.max_items = 50];
}

message ArchiveWorkflowRequest {
  // The workflow to archive, by id.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message RestoreWorkflowRequest {
  // The archived workflow to restore, by id.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message RestoreWorkflowResponse {
  // The workflow as restored.
  Workflow workflow = 1;
}

message DeleteWorkflowRequest {
  // The archived workflow to delete, by id.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // Whether to delete the agents, transcripts, documents, mail, notes and reviews of the workflow's tasks too.
  // False deletes only the tasks' worktrees and keeps the workflow archived.
  bool records = 2;
}

// WorkflowService creates and manages workflows.
service WorkflowService {
  rpc ListWorkflows(ListWorkflowsRequest) returns (ListWorkflowsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "list_workflows"
      description: "List workflows by name. Archived workflows are left out unless `archived` is set."
      roles: [
        ROLE_WRITER,
        ROLE_REVIEWER,
        ROLE_ORCHESTRATOR
      ]
    };
  }
  rpc GetWorkflow(GetWorkflowRequest) returns (GetWorkflowResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "get_workflow"
      description: "Get one workflow by id, with its context in full."
      roles: [
        ROLE_WRITER,
        ROLE_REVIEWER,
        ROLE_ORCHESTRATOR
      ]
    };
  }
  rpc CreateWorkflow(CreateWorkflowRequest) returns (CreateWorkflowResponse) {
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "create_workflow"
      description: "Create a workflow."
      destructive: false
      roles: [ROLE_ORCHESTRATOR]
    };
  }
  rpc UpdateWorkflow(UpdateWorkflowRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "update_workflow"
      description: "Replace every field of a workflow, `hooks` and `event_prompts` included. Agents already launched keep the context they started with."
      mcp_guidance: "Read the workflow first and send back every field you are not changing."
      destructive: false
      roles: [ROLE_ORCHESTRATOR]
    };
  }
  rpc ArchiveWorkflow(ArchiveWorkflowRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "archive_workflow"
      description: "Archive a workflow with its agents. Fails while a schedule still launches agents into the workflow."
      destructive: false
      roles: [ROLE_ORCHESTRATOR]
    };
  }
  rpc RestoreWorkflow(RestoreWorkflowRequest) returns (RestoreWorkflowResponse) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "restore_workflow"
      description: "Restore an archived workflow with its agents, which stay dormant until resumed. The agents on a task whose worktree was deleted stay archived."
      mcp_guidance: "Call resume_agent on the agents that should run."
      destructive: false
      roles: [ROLE_ORCHESTRATOR]
    };
  }
  rpc DeleteWorkflow(DeleteWorkflowRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: false
      name: "delete_workflow"
      description: "Delete the worktrees of an archived workflow's tasks. With records set, delete the workflow for good too, with its archived agents, tasks and schedules."
      reason: "Only the person deletes a workflow."
      destructive: true
    };
  }
}
