// The loop.v1 enums, in Edition 2026 so that each value's JSON name is its lowercase word.
// event/v1/event.proto says why Edition 2026 needs release candidates.
edition = "2026";

package loop.v1;

import option "google/protobuf/json_enumvalue_options.proto";

option go_package = "komrad/proto/gen/loop/v1;loopv1";

// Loop is a background loop komrad runs on a timer, which a caller can wake early.
export enum Loop {
  // No loop was named. `WakeLoop` refuses this value.
  LOOP_UNSPECIFIED = 0;
  // Reads each live agent's checkout for its branch, head commit and changed lines.
  LOOP_CWD_SYNC = 1 [(pb.enumvalue.json).string = "cwd_sync"];
  // Reads each agent's transcript for new turns.
  LOOP_TRANSCRIPT_SYNC = 2 [(pb.enumvalue.json).string = "transcript_sync"];
  // Reads the pull requests from agents' branches.
  LOOP_PULL_REQUEST_SYNC = 3 [(pb.enumvalue.json).string = "pull_request_sync"];
}
