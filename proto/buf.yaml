version: v2
modules:
  - path: proto
deps:
  - buf.build/bufbuild/protovalidate
plugins:
  - plugin: ../local/buf-plugin-weave
lint:
  use:
    - STANDARD
    - UNARY_RPC
    - RPC_READ_NO_SIDE_EFFECTS
    - RPC_MUTATION_IDEMPOTENT
    - RPC_REQUEST_ID_REFUSES_EMPTY
    - RPC_NAMED_TYPES_UNIQUE
  except:
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - FILE
