syntax = "proto3";

package log.v1;

import "annotation/v1/tool.proto";
import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";

option go_package = "komrad/proto/gen/log/v1;logv1";

// LogLine is one line of the server's log.
message LogLine {
  // When the line was written, in RFC 3339.
  string time = 1;
  // The line's severity, such as `INFO` or `ERROR`.
  string level = 2;
  // The line's message.
  string message = 3;
  // The line's other fields, under the keys the log gives them.
  google.protobuf.Struct fields = 4;
}

message GetLogLinesRequest {
  // The trace id to read, from a failed call or from `list_recent_traces`.
  string trace_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message GetLogLinesResponse {
  // Every line written under the trace id, in the order they were written.
  repeated LogLine lines = 1;
}

// TraceSummary is one trace in the server's log.
message TraceSummary {
  // The trace's id.
  string trace_id = 1;
  // When the trace's first line was written, in RFC 3339.
  string started_at = 2;
  // The RPC method or loop the trace belongs to. Empty when no line names one.
  string what = 3;
  // How many lines the log has under the trace.
  int32 lines = 4;
}

message ListRecentTracesRequest {
  // How many of the newest traces to list. Zero lists twenty.
  int32 limit = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
}

message ListRecentTracesResponse {
  // The newest traces in the log, oldest first.
  repeated TraceSummary traces = 1;
}

message ReadAgentLogsRequest {
  // The agents whose log lines to read, by id.
  repeated string agent_ids = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
    items: {
      string: {min_len: 1}
    }
  }];
  // The `cursor` from the previous response. Empty reads the newest lines.
  string cursor = 2;
  // The most lines to return. Zero returns up to 200.
  int32 limit = 3 [(buf.validate.field).int32 = {
    gte: 0
    lte: 1000
  }];
  // The log source to read, by the id `list_agent_log_sources` returns. Empty reads the server
  // log. A hook run's source takes exactly one agent.
  string source = 4 [(buf.validate.field).string.max_len = 256];
  // A Go regular expression each line must match. Empty matches every line. Only the last 64 MB
  // of the source is searched.
  string pattern = 5 [(buf.validate.field).string.max_len = 256];
}

message ReadAgentLogsResponse {
  // The lines about any of the agents, oldest first, as the log wrote them.
  repeated string lines = 1;
  // The cursor to pass back to read only lines written after these.
  string cursor = 2;
  // Whether the log started over since the cursor. The lines before the reset are gone.
  bool reset = 3;
  // Whether more lines remain past the cursor, which another call returns at once.
  bool more = 4;
}

// LogSource is one log an agent's lines can be read from: the server log, or one hook run.
message LogSource {
  // The source's id, to pass as `source` to `read_agent_logs`.
  string id = 1;
  // The source's name, such as `service` or `003 agent.pre-launch setup`.
  string name = 2;
  // The number of the hook run. Unset for the server log.
  optional int32 run = 3;
  // The id of the agent that recorded the hook run. Empty for the server log.
  string agent_id = 4;
  // Whether the hook run failed. Set only on a task's log sources.
  bool failed = 5;
}

message ListAgentLogSourcesRequest {
  // The agent whose log sources to list, by id.
  string agent_id = 1 [(buf.validate.field).string.min_len = 1];
}

message ListAgentLogSourcesResponse {
  // The server log first, then each hook run the agent recorded, newest first.
  repeated LogSource sources = 1;
}

message ListTaskLogSourcesRequest {
  // The task whose log sources to list, by id.
  string task_id = 1 [(buf.validate.field).string.min_len = 1];
}

message ListTaskLogSourcesResponse {
  // Each hook run recorded on the task, by the task or any agent on it, newest first.
  repeated LogSource sources = 1;
}

// LogService reads the server's log by trace and by agent.
service LogService {
  rpc GetLogLines(GetLogLinesRequest) returns (GetLogLinesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "get_log_lines"
      description: "Read every log line written under one trace id, in order. A failed call returns its trace id."
      roles: [ROLE_ORCHESTRATOR]
    };
  }
  rpc ListRecentTraces(ListRecentTracesRequest) returns (ListRecentTracesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "list_recent_traces"
      description: "List the newest traces in the server log, oldest first."
      mcp_guidance: "Use it to find a trace id to read with get_log_lines."
      roles: [ROLE_ORCHESTRATOR]
    };
  }
  rpc ReadAgentLogs(ReadAgentLogsRequest) returns (ReadAgentLogsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "read_agent_logs"
      description: "Read the log lines about one or more agents, from the server log or one hook run's output. Pass the returned `cursor` back to read only new lines."
      roles: [ROLE_ORCHESTRATOR]
    };
  }
  rpc ListAgentLogSources(ListAgentLogSourcesRequest) returns (ListAgentLogSourcesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "list_agent_log_sources"
      description: "List the logs an agent's lines can be read from: the server log and each run of the agent's own hooks. `list_task_log_sources` lists the runs of the task's hooks."
      roles: [ROLE_ORCHESTRATOR]
    };
  }
  rpc ListTaskLogSources(ListTaskLogSourcesRequest) returns (ListTaskLogSourcesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "list_task_log_sources"
      description: "List the hook runs recorded on a task, for the task and every agent on it, newest first. Pass a source's id and `agent_id` to `read_agent_logs` to read its output."
      roles: [ROLE_ORCHESTRATOR]
    };
  }
}
