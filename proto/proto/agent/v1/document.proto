syntax = "proto3";

package agent.v1;

import "buf/validate/validate.proto";

option go_package = "komrad/proto/gen/agent/v1;agentv1";

// DocumentKind is what sort of document it is.
enum DocumentKind {
  // No kind was given.
  DOCUMENT_KIND_UNSPECIFIED = 0;
  // A proposal for a change, written before building it.
  DOCUMENT_KIND_RFC = 1;
  // What an investigation found.
  DOCUMENT_KIND_REPORT = 2;
  // How something that already exists works.
  DOCUMENT_KIND_EXPLAINER = 3;
  // Anything else worth keeping.
  DOCUMENT_KIND_NOTES = 4;
}

message Document {
  // Pass this back to write_document to rewrite the document.
  string id = 1;
  // The agent that wrote it.
  string agent_id = 2;
  // The title a person reads, unique among one agent's documents.
  string name = 3;
  // What sort of document it is.
  DocumentKind kind = 4;
  // The markdown text, empty in a listing.
  string body = 5;
  // When it was first written, in RFC 3339.
  string created_at = 6;
  // When it was last written, in RFC 3339.
  string updated_at = 7;
  // How many times it has been written, which a rewrite passes back to say what it replaces.
  int32 version = 8;
}

message WriteDocumentRequest {
  // The document to rewrite, or unset to create one.
  optional string id = 1 [(buf.validate.field).string.min_len = 1];
  // The title a person reads.
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  // What sort of document it is.
  DocumentKind kind = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // Where the markdown comes from.
  oneof source {
    option (buf.validate.oneof).required = true;
    // The markdown text itself.
    string body = 4 [(buf.validate.field).string.max_bytes = 1048576];
    // A markdown file on the machine komrad runs on, relative to the writing agent's working
    // directory unless absolute.
    string path = 5 [(buf.validate.field).string.min_len = 1];
  }
  // The version a rewrite replaces, as the last read or write returned it, and required with id.
  optional int32 version = 6 [(buf.validate.field).int32.gt = 0];
}

message WriteDocumentResponse {
  // The document as stored, without its body.
  Document document = 1;
}

message ListDocumentsRequest {
  // Whose documents to list, or unset for the caller's own.
  optional string agent_id = 1 [(buf.validate.field).string.min_len = 1];
  // Only documents of this kind, or unset for every kind.
  optional DocumentKind kind = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

message ListDocumentsResponse {
  // The documents, the most recently written first, without their bodies.
  repeated Document documents = 1;
}

message GetDocumentRequest {
  // The document to read.
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetDocumentResponse {
  // The document whole.
  Document document = 1;
}
