name: engine stop

# Puts the engine down for the night.
#
# The box bills by the hour whether or not anybody is using it, and it is used for a fraction of
# the day. Stopping keeps the instance rather than replacing it, so the data volume, the database
# and the Elastic IP all follow it and the panel reaches the same address in the morning.
#
# Every agent on the box stops with it. Their conversations and worktrees are on the data volume,
# so they can be resumed once the engine is back.
#
# GitHub's cron is UTC and does not follow daylight saving, so this is 10pm in New York for half
# the year and 9pm for the other half.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: engine
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  stop:
    if: vars.AWS_CI_ROLE != ''
    runs-on: namespace-profile-harrisoncramer
    steps:
      - uses: actions/checkout@v4

      - name: Cache the tools and the Terraform providers
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: mise
          path: /home/runner/.cache/terraform/plugins

      - name: Use Mise
        uses: ./.github/actions/use-mise
        with:
          gh-access-token: ${{ env.GH_ACCESS_TOKEN }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      # The backend is not in the repository, because it names an account's own bucket.
      - name: Point Terraform at the state
        run: |
          cat >infra/engine/backend.hcl <<EOF
          bucket       = "${{ vars.TF_STATE_BUCKET }}"
          key          = "${{ vars.TF_STATE_KEY }}"
          region       = "${{ vars.AWS_REGION }}"
          encrypt      = true
          use_lockfile = true
          EOF

      # The lock is read as written, never rewritten.
      - name: Read the state
        run: mise run infra:engine:init -- -lockfile=readonly

      - name: Stop the engine
        run: mise run remote:stop --yes
