syntax = "proto3";

package hook.v1;

import "annotation/v1/tool.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";

option go_package = "komrad/proto/gen/hook/v1;hookv1";

message Hook {
  // The file name in the hooks directory, which is what a workflow names to fire it.
  string name = 1;
  // Whether the file can be run, which it cannot until the user chmods it.
  bool executable = 2;
  // What the script says about itself in its own header comments.
  string description = 3;
  // How long komrad waits for it, taken from its header, or unset to wait the default.
  optional google.protobuf.Duration timeout = 4;
  // What komrad could not read in the header, which leaves the rest of it at the defaults.
  repeated string header_problems = 5;
}

message ListHooksResponse {
  // Every file in the hooks directory, runnable or not.
  repeated Hook hooks = 1;
}

// HookService lists the scripts the user has written for komrad to fire.
service HookService {
  rpc ListHooks(google.protobuf.Empty) returns (ListHooksResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "list_hooks"
      description: "List the hook scripts in the user's hooks directory, by the name create_workflow and update_workflow take."
      roles: [ROLE_ORCHESTRATOR]
    };
  }
}
