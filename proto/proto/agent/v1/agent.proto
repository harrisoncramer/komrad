syntax = "proto3";

package agent.v1;

import "agent/v1/document.proto";
import "agent/v1/mail.proto";
import "agent/v1/review.proto";
import "agent/v1/screen.proto";
import "agent/v1/transcript.proto";
import "annotation/v1/tool.proto";
import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "pagination/v1/pagination.proto";
import "pullrequest/v1/pullrequest.proto";
import "rules/v1/rules.proto";
import "view/v1/view.proto";

option go_package = "komrad/proto/gen/agent/v1;agentv1";

// AgentState is what the panel last decided an agent was doing, read off the tail of its pane.
enum AgentState {
  // No state was recorded, which no stored agent answers with.
  AGENT_STATE_UNSPECIFIED = 0;
  // The pane is at rest with nothing typed.
  AGENT_STATE_IDLE = 1;
  // The CLI is working on a turn.
  AGENT_STATE_THINKING = 2;
  // The CLI is blocked on a human answering a selection.
  AGENT_STATE_WAITING = 3;
  // The agent is being launched and has no pane to read yet.
  AGENT_STATE_SETTING_UP = 4;
  // The launch failed, which retry_agent is for.
  AGENT_STATE_FAILED_TO_CREATE = 5;
  // A delete failed to take the worktree down, and the reason is on the row.
  AGENT_STATE_FAILED_TO_CLEANUP = 6;
  // The pane could be read but its tail decided nothing.
  AGENT_STATE_UNCERTAIN = 7;
  // The pane is at rest after an API error ended the last turn, and turn_error says which.
  AGENT_STATE_ERRORED = 8;
}

// AgentRole is what an agent was launched to do.
enum AgentRole {
  // No role was recorded, which no stored agent answers with.
  AGENT_ROLE_UNSPECIFIED = 0;
  // An agent that lands work on a branch of its own.
  AGENT_ROLE_IMPLEMENTER = 1;
  // A child that reads another agent's work and gives a review.
  AGENT_ROLE_REVIEWER = 2;
  // The agent drawn on a workflow's own row that hands work out.
  AGENT_ROLE_ORCHESTRATOR = 3;
}

// Sequence is what git has part-way through an agent's checkout and waiting on somebody.
enum Sequence {
  // Nothing was recorded, which no stored agent answers with.
  SEQUENCE_UNSPECIFIED = 0;
  // Nothing is part-way through.
  SEQUENCE_NONE = 1;
  // A rebase stopped on a commit it could not replay.
  SEQUENCE_REBASE = 2;
  // An am stopped on a patch it could not apply.
  SEQUENCE_AM = 3;
  // A merge stopped on conflicts.
  SEQUENCE_MERGE = 4;
  // A cherry-pick stopped on conflicts or resting between its picks.
  SEQUENCE_CHERRY_PICK = 5;
  // A revert stopped on conflicts or resting between its picks.
  SEQUENCE_REVERT = 6;
}

// DiffStat is how many lines a checkout adds and removes, committed and uncommitted alike.
message DiffStat {
  // The lines it adds.
  int32 added = 1;
  // The lines it removes.
  int32 removed = 2;
}

message Agent {
  // The handle every other call names this agent by, and what mail is addressed to.
  string id = 1;
  // What the panel lists it as, which is also its tmux window name at launch.
  string name = 2;
  // The directory it is running in, its own worktree when the workflow provisions one.
  string cwd = 3;
  // The command-line flags its CLI was started with.
  string flags = 4;
  // The whole briefing it was launched with.
  string prompt = 5;
  // The tmux pane its CLI is running in, which is what capture-pane reads.
  string pane_id = 6;
  // What the panel last decided it was doing, read off the tail of its pane.
  AgentState state = 7;
  // The CLI's own conversation id, which is the handle a resume needs.
  string session_id = 8;
  // Which CLI it runs, such as claude or codex.
  string harness = 9;
  // Which workflow it is filed under, whose context it took at launch.
  string workflow_id = 10;
  // When it was launched, in RFC 3339.
  string created_at = 11;
  // When it was hidden from the panel, unset while it is live.
  optional string archived_at = 12;
  // The schedule that launched it, unset for an agent a person or another agent spawned.
  optional string schedule_id = 13;
  // Whether its pane is still there, which a dormant agent's is not.
  optional bool alive = 14;
  // Whether the panel draws a row for it, which changes nothing about the agent itself.
  bool hidden = 15;
  // The key a retry of its create carried, which is what answers a repeat with this agent.
  optional string idempotency_key = 16;
  // Which agent called create, unset for one a person spawned.
  optional string spawned_by_agent_id = 17;
  // The agent this one is a child of, unset for an agent standing on its own.
  optional string parent_agent_id = 18;
  // The git branch its worktree is on, unset for an agent that provisions none.
  optional string branch = 19;
  // The canonical web address of the repository its checkout pushes to, such as
  // https://github.com/harrisoncramer/komrad, unset when the checkout is gone or its origin
  // is not a forge.
  optional string repository_url = 20;
  // The commit its checkout has checked out, unset when the checkout is gone or git cannot read it.
  optional string head_sha = 21;
  // Whether its checkout has been taken away, which leaves the record and the transcript.
  bool worktree_removed = 22;
  // What git has part-way through its checkout, waiting on somebody to settle it.
  Sequence sequence = 23;
  // Whether a script komrad fired for the agent failed and nobody has looked at it since.
  bool failed_run = 24;
  // The run log that failure was written to, which is the run the panel opens on.
  optional int32 failed_run_log = 25;
  // How many documents it has written, which list_documents returns.
  int32 documents = 26;
  // When the newest of its documents was last written, in RFC 3339, unset when it has none.
  optional string documents_updated_at = 27;
  // When the state above last moved, in RFC 3339.
  string state_changed_at = 28;
  // What the agent's own CLI last reported it was doing, alongside the state the pane decided.
  string reported_reason = 29;
  // Why its create or cleanup last failed, empty when neither has.
  string failure_reason = 30;
  // What its CLI printed when an API error ended its last turn, empty when that turn did not fail.
  string turn_error = 31;
  // What the agent was launched to do.
  AgentRole role = 32;
  // Whether prompt holds only its opening, as a summary listing returns it.
  bool prompt_truncated = 33;
  // The snapshot of its newest round while its worktree no longer hashes to it, empty otherwise.
  string moved_since_round = 34;
  // How many lines its checkout adds and removes since it left its base, unset where there is no
  // base to measure against.
  optional DiffStat diff_stat = 35;
  // When a person stopped this agent and took its worktree, empty while nobody is holding it.
  string held_at = 36;
  // The agent that took the hold, empty when the panel took it or nobody is holding it.
  string held_by_agent_id = 37;
}

// AgentRow is an agent with what the panel draws beside it: its waiting mail, the pull requests
// on its branch and where its local review stands.
message AgentRow {
  // The agent itself.
  Agent agent = 1;
  // Whether mail is waiting that it has not taken.
  bool unread_mail = 2;
  // Where the pull request opened from its branch stands.
  PullRequestStanding pull_request = 3;
  // Every pull request opened from its branch, the current one first.
  repeated pullrequest.v1.PullRequest pull_requests = 4;
  // How many rounds of local review its own work has been through.
  int32 local_review_rounds = 5;
  // Comments reviewer agents have left on its work. Absent while there are none to count.
  optional CommentCounts reviewer_comments = 6;
  // Comments the person has left on its work. Absent while there are none to count.
  optional CommentCounts person_comments = 7;
}

// CommentCounts is how the comments on an agent's work stand.
message CommentCounts {
  // Comments nobody has resolved yet, on any round.
  int32 open = 1;
  // Comments resolved on rounds not yet merged into the base branch.
  int32 resolved = 2;
  // How many of the comments hold a reply the person has not read.
  int32 unread = 3;
}

message PullRequestStanding {
  // Where the current pull request stands: UNREAD when the repository has not been read, NONE
  // when it has and nothing was opened from the branch, else the state of the current one.
  pullrequest.v1.PullRequestState state = 1;
  // The number of the current pull request, unset for UNREAD and NONE.
  optional int32 number = 2;
  // The web address of the current pull request, unset for UNREAD and NONE.
  optional string url = 3;
  // The title of the current pull request, unset for UNREAD and NONE.
  optional string title = 4;
  // Whether the forge would merge the current pull request, unset for UNREAD and NONE.
  pullrequest.v1.MergeReadiness merge_readiness = 5;
  // The commit the forge holds at the head of the current pull request, unset for UNREAD and
  // NONE.
  optional string head_sha = 6;
  // Which forge the current pull request lives on, such as github, unset for UNREAD and NONE.
  optional string forge = 7;
}

message ListAgentsRequest {
  // Where to carry on from.
  optional pagination.v1.Pagination pagination = 1;
  // True to list the archived agents and only those.
  bool archived = 2;
  // How much of each record to return. The summary cuts each prompt to its opening, and
  // VIEW_FULL returns every prompt whole, which can be a very large reply.
  view.v1.View view = 3 [(buf.validate.field).enum.defined_only = true];
}

message ListAgentsResponse {
  // One page of agents, most recently updated first, each with what the panel draws beside it.
  repeated AgentRow agents = 1;
  // Pass this back as the pagination cursor for the next page.
  optional string next_page_token = 2;
}

message CreateAgentRequest {
  // The opening briefing, which is everything the agent has to go on.
  string prompt = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 50000
  }];
  // What to call it in the panel, blank to have komrad name it.
  string title = 2 [
    (buf.validate.field).string.max_len = 200,
    (buf.validate.field).cel = {
      id: "title.printable"
      message: "title must not contain control characters"
      expression: "!this.matches('[\\x00-\\x1f\\x7f]')"
    }
  ];
  // Flags for its CLI, blank to take the workflow's own.
  string flags = 4 [(buf.validate.field).string = {
    max_len: 500
    [rules.v1.shell_safe]: true
  }];
  // Which workflow to launch it into, whose cwd, flags and context it inherits.
  string workflow_id = 5 [(buf.validate.field).string.min_len = 1];
  // Which CLI to run, blank to take the workflow's own.
  string harness = 7 [(buf.validate.field).string = {
    max_len: 40
    pattern: "^[a-z0-9-]*$"
  }];
  // A key that makes a retry safe. A repeat carrying the same key is answered with the agent
  // already launched rather than spawning another.
  optional string idempotency_key = 6 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  // False to run in the directory named above rather than a fresh worktree, which is how an
  // agent reads a checkout somebody else has open. Unset to do whatever the workflow does.
  optional bool provision_enabled = 8;
  // Which agent to attach this one to as its child. A child runs in its parent's directory, so
  // dir and provision_enabled are refused, and workflow_id must be the parent's own. Neither a
  // child nor an orchestrator may be a parent.
  optional string parent_agent_id = 11 [(buf.validate.field).string.min_len = 1];
}

message CreateAgentResponse {
  // The agent as launched.
  Agent agent = 1;
}

message RequestReviewRequest {
  // The whole briefing the reviewer is given, so it has to say what the change is meant to do
  // and where the author is unsure of it.
  string prompt = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 50000
  }];
  // Whose work to have read, or unset for the caller's own.
  optional string agent_id = 2 [(buf.validate.field).string.min_len = 1];
  // What to call the reviewer, blank to name it after the agent it is reading.
  string title = 3 [
    (buf.validate.field).string.max_len = 200,
    (buf.validate.field).cel = {
      id: "review.title.printable"
      message: "title must not contain control characters"
      expression: "!this.matches('[\\x00-\\x1f\\x7f]')"
    }
  ];
  // A key that makes a retry safe. A repeat carrying the same key is answered with the reviewer
  // already spawned rather than refused.
  optional string idempotency_key = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  // Which CLI the reviewer runs, blank to take the workflow's own.
  string harness = 5 [(buf.validate.field).string = {
    max_len: 40
    pattern: "^[a-z0-9-]*$"
  }];
  // Flags for the reviewer's CLI, blank to take the workflow's own.
  string flags = 6 [(buf.validate.field).string = {
    max_len: 500
    [rules.v1.shell_safe]: true
  }];
}

message RequestReviewResponse {
  // The reviewer as spawned, which is a child of the agent being read.
  Agent reviewer = 1;
  // What the agent that asked does next: how the review reaches it and how it answers.
  string guidance = 2;
}

message AdoptRequest {
  // The branch to put an agent on, which has to exist on the remote or on disk.
  string ref = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 400
    [rules.v1.shell_safe]: true
  }];
  // Which workflow to launch into, which is what decides the repository.
  string workflow_id = 2 [(buf.validate.field).string.min_len = 1];
  // The opening briefing, blank to launch the CLI with nothing to read.
  string prompt = 3 [(buf.validate.field).string.max_len = 50000];
  // What to call it in the panel, blank to have komrad name it.
  string title = 4 [
    (buf.validate.field).string.max_len = 200,
    (buf.validate.field).cel = {
      id: "adopt.title.printable"
      message: "title must not contain control characters"
      expression: "!this.matches('[\\x00-\\x1f\\x7f]')"
    }
  ];
  // Flags for its CLI, blank to take the workflow's own.
  string flags = 5 [(buf.validate.field).string = {
    max_len: 500
    [rules.v1.shell_safe]: true
  }];
  // Which CLI to run, blank to take the workflow's own.
  string harness = 6 [(buf.validate.field).string = {
    max_len: 40
    pattern: "^[a-z0-9-]*$"
  }];
  // A key that makes a retry safe. A repeat carrying the same key is answered with the agent
  // already launched rather than spawning another.
  optional string idempotency_key = 7 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
}

message AdoptResponse {
  // The agent on the branch, either the one just launched or the one already there.
  Agent agent = 1;
  // True when the branch already had an agent, which is returned in place of a new one.
  bool existing = 2;
}

message GetAgentRequest {
  // Which agent to read, archived or not.
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetAgentResponse {
  // The agent, its prompt whole.
  Agent agent = 1;
  // Whether mail is waiting that it has not taken.
  bool unread_mail = 2;
  // Where the pull request opened from its branch stands.
  PullRequestStanding pull_request = 3;
  // Every pull request opened from its branch, the current one first.
  repeated pullrequest.v1.PullRequest pull_requests = 4;
  // How many rounds of local review its own work has been through.
  int32 local_review_rounds = 5;
  // Comments reviewer agents have left on its work. Absent while there are none to count.
  optional CommentCounts reviewer_comments = 6;
  // Comments the person has left on its work. Absent while there are none to count.
  optional CommentCounts person_comments = 7;
}

// PlanRebaseRequest asks what a rebase would do without doing it.
message PlanRebaseRequest {
  // Whose branch the rebase would move.
  string agent_id = 1 [(buf.validate.field).string.min_len = 1];
}

message PlanRebaseResponse {
  // The ref the branch would move onto.
  string base_ref = 1;
  // The commit that ref named when it was read.
  string base_sha = 2;
  // How many of the agent's own commits would be replayed.
  int32 commits = 3;
  // Which branch would move.
  string branch = 4;
  // How many of the agent's own commits the base already holds whole, and so would be dropped.
  int32 landed_commits = 5;
  // How many are left to replay onto the new base.
  int32 replay_commits = 8;
  // How many merge commits a rebase would flatten away.
  int32 merges = 6;
  // The paths a merge of the base into the branch could not settle. A warning rather than a
  // verdict: a rebase replays commit by commit and can conflict where a merge would not.
  repeated string conflict_paths = 7;
}

message StartOrchestratorRequest {
  // The workflow whose orchestrator to bring back, or to start if it has never had one.
  string workflow_id = 1 [(buf.validate.field).string.min_len = 1];
  // The opening briefing a fresh orchestrator is launched with, blank for komrad's own.
  string prompt = 2 [(buf.validate.field).string.max_len = 50000];
}

message StartOrchestratorResponse {
  // The orchestrator, with a pane to talk to.
  Agent agent = 1;
}

message RebaseWorktreeRequest {
  // Whose branch to move onto its base.
  string agent_id = 1 [(buf.validate.field).string.min_len = 1];
}

message RebaseWorktreeResponse {
  // The ref the branch was moved onto.
  string base_ref = 1;
  // The commit that ref named when it was read.
  string base_sha = 2;
  // How many of the agent's own commits the rebase carried.
  int32 commits = 3;
  // Which branch moved.
  string branch = 4;
  // Whether the rebase stopped on conflicts and is still stopped, waiting for the agent.
  bool conflicted = 5;
  // Whether the branch reached the base without replaying anything, as when all of its work
  // has already landed.
  bool moved = 6;
  // How many of the agent's own commits the base already held, and so were dropped.
  int32 landed_commits = 7;
  // How many were replayed onto the new base.
  int32 replay_commits = 8;
}

// PlanPushRequest asks what a push would do without doing it.
message PlanPushRequest {
  // Whose branch the push would send.
  string agent_id = 1 [(buf.validate.field).string.min_len = 1];
}

message PlanPushResponse {
  // Which branch would go up.
  string branch = 1;
  // How many commits would go up, counted against origin's copy of the branch, or against the
  // base when origin has none.
  int32 commits = 2;
  // Whether origin's copy holds commits the branch does not, so the push would overwrite it.
  bool forced = 3;
  // How many files would stay behind because nothing has committed them.
  int32 uncommitted_files = 4;
}

message PushWorktreeRequest {
  // Whose branch to send to origin.
  string agent_id = 1 [(buf.validate.field).string.min_len = 1];
}

message PushWorktreeResponse {
  // Which branch went up.
  string branch = 1;
  // How many commits went up.
  int32 commits = 2;
  // Whether origin's copy was overwritten.
  bool forced = 3;
  // The commit origin's copy of the branch now names.
  string sha = 4;
}

message AbortSequenceRequest {
  // Whose worktree to abort the sequence in.
  string agent_id = 1 [(buf.validate.field).string.min_len = 1];
}

message AbortSequenceResponse {
  // What was undone.
  Sequence sequence = 1;
  // Where the checkout stands now, empty when it is detached.
  string branch = 2;
  // The ref holding the checkout as it stood before the abort, conflicts and all.
  string parked_ref = 3;
  // Whether the agent's turn was cut so the abort could run.
  bool interrupted = 4;
}

message SetHiddenRequest {
  // Which agent to hide or unhide.
  string id = 1 [(buf.validate.field).string.min_len = 1];
  // True to hide the row, false to draw it again.
  bool hidden = 2;
}

message RecordReportRequest {
  // What the CLI says it is doing, which annotates the state the pane decided.
  string reason = 1 [
    (buf.validate.field).string.max_len = 200,
    (buf.validate.field).cel = {
      id: "report.reason.printable"
      message: "reason must not contain control characters"
      expression: "!this.matches('[\\x00-\\x1f\\x7f]')"
    }
  ];
  // Whether the CLI has finished a turn.
  bool turn_ended = 2;
  // What the CLI printed when an API error ended the turn, empty when the turn ended without one.
  string turn_error = 3 [
    (buf.validate.field).string.max_len = 200,
    (buf.validate.field).cel = {
      id: "report.turn_error.printable"
      message: "turn_error must not contain control characters"
      expression: "!this.matches('[\\x00-\\x1f\\x7f]')"
    }
  ];
}

message MarkRunsReadRequest {
  // Whose failed script runs the person has looked at.
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message LogRequest {
  // Which agent the line is about, or unset for the caller's own.
  optional string id = 1 [(buf.validate.field).string.min_len = 1];
  // The line to write.
  string message = 2 [
    (buf.validate.field).string = {
      min_len: 1
      max_len: 2048
    },
    (buf.validate.field).cel = {
      id: "message.printable"
      message: "a log message must carry no control characters"
      expression: "!this.matches('[[:cntrl:]]')"
    }
  ];
  // The script whose run the line belongs to, which a running script has in KOMRAD_SCRIPT.
  optional string script = 3 [(buf.validate.field).string = {
    max_len: 255
    [rules.v1.script_name]: true
  }];
}

message ArchiveAgentsRequest {
  // The agents to stop and hide, keeping their records and transcripts, children along with
  // them. The batch goes whole or not at all.
  repeated string ids = 1 [(buf.validate.field).repeated = {
    min_items: 1
    unique: true
    items: {
      string: {min_len: 1}
    }
  }];
}

message RestoreAgentsRequest {
  // The archived agents to bring back as dormant rows, along with their workflows.
  repeated string ids = 1 [(buf.validate.field).repeated = {
    min_items: 1
    unique: true
    items: {
      string: {min_len: 1}
    }
  }];
}

message RestoreAgentsResponse {
  // The agents as restored, dormant until each is resumed.
  repeated Agent agents = 1;
}

message RetryAgentRequest {
  // Which failed agent to retry launching.
  string id = 1 [(buf.validate.field).string.min_len = 1];
  // Replacement flags for its CLI, blank to keep the ones the failed attempt used.
  string flags = 2 [(buf.validate.field).string = {
    max_len: 500
    [rules.v1.shell_safe]: true
  }];
  // Replacement prompt, blank to keep the original.
  string prompt = 3 [(buf.validate.field).string.max_len = 50000];
  // Replacement harness, blank to keep the original.
  string harness = 4 [(buf.validate.field).string = {
    max_len: 40
    pattern: "^[a-z0-9-]*$"
  }];
}

message RetryAgentResponse {
  // The agent as relaunched, running.
  Agent agent = 1;
}

message ResumeAgentRequest {
  // Which dormant agent to put back in a pane on its own conversation.
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message ResumeAgentResponse {
  // The agent as it now stands, running.
  Agent agent = 1;
}

message HoldAgentRequest {
  // Which agent to stop and hold.
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message HoldAgentResponse {
  // The agent as it now stands, held.
  Agent agent = 1;
}

message ReleaseAgentRequest {
  // Which held agent to let go of.
  string id = 1 [(buf.validate.field).string.min_len = 1];
  // What to tell the agent happened while it was held, typed into it as it starts again. Empty
  // lets it go in silence, and it is ignored for an agent whose own turn had already ended.
  string said = 2;
}

message ReleaseAgentResponse {
  // The agent as it now stands, running again.
  Agent agent = 1;
}

message DeleteAgentsRequest {
  // The agents to remove for good, transcripts and worktrees with them.
  repeated string ids = 1 [(buf.validate.field).repeated = {
    min_items: 1
    unique: true
    items: {
      string: {min_len: 1}
    }
  }];
}

message UpdateAgentRequest {
  // Which agent to rename.
  string id = 1 [(buf.validate.field).string.min_len = 1];
  // The new name, as the panel lists it. It may not contain spaces, colons, dots, slashes or
  // control characters.
  string name = 2 [
    (buf.validate.field).string = {
      min_len: 1
      max_len: 200
    },
    (buf.validate.field).cel = {
      id: "name.storable"
      message: "name must not contain spaces, colons, dots, slashes, or control characters"
      expression: "!this.contains(' ') && !this.contains(':') && !this.contains('.') && !this.contains('/') && !this.matches('[\\x00-\\x1f\\x7f]')"
    }
  ];
}

// AgentService is the agents themselves: spawning one, addressing it, reading what it wrote,
// and the review conversation held about its work.
service AgentService {
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "list_agents"
      description: "List the agents komrad tracks, most recently updated first, with the opening of each prompt. Archived agents are left out unless archived is set."
      roles: [
        ROLE_IMPLEMENTER,
        ROLE_REVIEWER,
        ROLE_ORCHESTRATOR
      ]
    };
  }
  rpc GetAgent(GetAgentRequest) returns (GetAgentResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "get_agent"
