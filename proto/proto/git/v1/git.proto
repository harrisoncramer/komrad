syntax = "proto3";

package git.v1;

import "annotation/v1/tool.proto";
import "buf/validate/validate.proto";

option go_package = "komrad/proto/gen/git/v1;gitv1";

message GetRootRequest {
  // An absolute directory in the repository, inside a live agent's checkout.
  string dir = 1 [(buf.validate.field).string.min_len = 1];
}

message GetRootResponse {
  // The top directory of the working tree that holds `dir`.
  string root = 1;
}

// FileRevision is one file at one commit.
message FileRevision {
  // The commit to read the file at.
  string sha = 1 [(buf.validate.field).string = {
    min_len: 1
    pattern: "^[^\\n]*$"
  }];
  // The file's path, relative to the top of the repository.
  string path = 2 [(buf.validate.field).string = {
    min_len: 1
    pattern: "^[^\\n]*$"
  }];
}

message ReadFilesRequest {
  // An absolute directory in the repository, inside a live agent's checkout.
  string dir = 1 [(buf.validate.field).string.min_len = 1];
  // The files to read.
  repeated FileRevision revisions = 2;
}

// File is the content of one file at one commit.
message File {
  // The file and commit, as the request named them.
  FileRevision revision = 1;
  // The file's content.
  bytes content = 2;
}

message ReadFilesResponse {
  // The files read. A path that is not a file at its commit is left out.
  repeated File files = 1;
}

message CountChangedFilesRequest {
  // An absolute directory in the repository, inside a live agent's checkout.
  string dir = 1 [(buf.validate.field).string.min_len = 1];
  // The commit to count from. Empty to count nothing.
  string from_sha = 2 [(buf.validate.field).string.pattern = "^(?:[^-].*)?$"];
  // The commit to count to. Empty to count nothing.
  string to_sha = 3 [(buf.validate.field).string.pattern = "^(?:[^-].*)?$"];
  // The paths and globs to leave out, relative to the top of the repository.
  repeated string exclude = 4;
}

message CountChangedFilesResponse {
  // How many files differ between the two commits.
  int32 count = 1;
}

message DiffRequest {
  // An absolute directory in the repository, inside a live agent's checkout.
  string dir = 1 [(buf.validate.field).string.min_len = 1];
  // The commit the patch starts from.
  string from_sha = 2 [(buf.validate.field).string.pattern = "^(?:[^-].*)?$"];
  // The commit the patch ends at.
  string to_sha = 3 [(buf.validate.field).string.pattern = "^(?:[^-].*)?$"];
  // The paths and globs to leave out, relative to the top of the repository.
  repeated string exclude = 4;
}

message DiffResponse {
  // The patch, with the `a/` and `b/` path prefixes.
  bytes patch = 1;
}

message MapRangesRequest {
  // An absolute directory in the repository, inside a live agent's checkout.
  string dir = 1 [(buf.validate.field).string.min_len = 1];
  // The commit the line positions come from.
  string from_sha = 2 [(buf.validate.field).string = {
    min_len: 1
    pattern: "^[^-]"
  }];
  // The commit to map the line positions to.
  string to_sha = 3 [(buf.validate.field).string = {
    min_len: 1
    pattern: "^[^-]"
  }];
  // The files in `from_sha` to map, relative to the top of the repository. Empty for every file.
  repeated string paths = 4;
}

// LineRange is a span of lines, numbered from one, that includes its start and excludes its end.
message LineRange {
  // The first line of the span. Equal to `end` for the point between two lines.
  int32 start = 1;
  // The line after the last line of the span.
  int32 end = 2;
}

// RangeMapping pairs lines in the old file with the lines that replace them in the new file.
message RangeMapping {
  // The lines in the earlier commit.
  LineRange old_lines = 1;
  // The lines that replace them in the later commit.
  LineRange new_lines = 2;
}

// FileMapping is where one file moved and which of its lines the later commit changed.
message FileMapping {
  // The file's path in the earlier commit. Empty when the file is not in that commit.
  string old_path = 1;
  // The file's path in the later commit. Empty when the file is not in that commit.
  string new_path = 2;
  // The lines the later commit changed. Empty for a file the patch shows no content for.
  repeated RangeMapping ranges = 3;
}

message MapRangesResponse {
  // Every file the later commit changed.
  repeated FileMapping files = 1;
}

message ReplayRequest {
  // An absolute directory in the repository, inside a live agent's checkout.
  string dir = 1 [(buf.validate.field).string.min_len = 1];
  // The base commit the snapshot was taken against.
  string from_base = 2 [(buf.validate.field).string = {
    min_len: 1
    pattern: "^[^-]"
  }];
  // The base commit to replay the snapshot onto.
  string onto_base = 3 [(buf.validate.field).string = {
    min_len: 1
    pattern: "^[^-]"
  }];
  // The snapshot commit to replay.
  string snapshot_sha = 4 [(buf.validate.field).string = {
    min_len: 1
    pattern: "^[^-]"
  }];
}

message ReplayResponse {
  // The tree the replay wrote. No ref points at it.
  string tree = 1;
  // The paths that conflicted. Empty when the replay applied cleanly.
  repeated string conflicts = 2;
}

message IsAncestorRequest {
  // An absolute directory in the repository, inside a live agent's checkout.
  string dir = 1 [(buf.validate.field).string.min_len = 1];
  // The commit that may be an ancestor.
  string maybe_ancestor = 2 [(buf.validate.field).string = {
    min_len: 1
    pattern: "^[^-]"
  }];
  // The commit `maybe_ancestor` may be reachable from.
  string of = 3 [(buf.validate.field).string = {
    min_len: 1
    pattern: "^[^-]"
  }];
}

message IsAncestorResponse {
  // Whether `maybe_ancestor` is reachable from `of`.
  bool is_ancestor = 1;
}

// GitService runs git in agents' checkouts for a client on another machine.
service GitService {
  // GetRoot returns the top directory of the working tree that holds a directory.
  rpc GetRoot(GetRootRequest) returns (GetRootResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: false
      mcp: false
      reason: "A client reading a review on another machine calls this, and an agent runs git itself."
    };
  }

  // ReadFiles returns the content of each named file at its commit.
  rpc ReadFiles(ReadFilesRequest) returns (ReadFilesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: false
      mcp: false
      reason: "A client reading a review on another machine calls this, and an agent runs git itself."
    };
  }

  // CountChangedFiles returns how many files differ between two commits.
  rpc CountChangedFiles(CountChangedFilesRequest) returns (CountChangedFilesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: false
      mcp: false
      reason: "A client reading a review on another machine calls this, and an agent runs git itself."
    };
  }

  // Diff returns the patch between two commits.
  rpc Diff(DiffRequest) returns (DiffResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: false
      mcp: false
      reason: "A client reading a review on another machine calls this, and an agent runs git itself."
    };
  }

  // MapRanges returns where each file moved between two commits and which lines changed.
  rpc MapRanges(MapRangesRequest) returns (MapRangesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: false
      mcp: false
      reason: "A client reading a review on another machine calls this, and an agent runs git itself."
    };
  }

  // Replay applies a snapshot's change onto another base commit in memory, and returns the
  // resulting tree and the paths that conflicted.
  rpc Replay(ReplayRequest) returns (ReplayResponse) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.surfaces) = {
      cli: false
      mcp: false
      reason: "A client reading a review on another machine calls this, and an agent runs git itself."
    };
  }

  // IsAncestor returns whether one commit is reachable from another.
  rpc IsAncestor(IsAncestorRequest) returns (IsAncestorResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: false
      mcp: false
      reason: "A client reading a review on another machine calls this, and an agent runs git itself."
    };
  }
}
