syntax = "proto3";

package loop.v1;

import "annotation/v1/tool.proto";
import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";

option go_package = "komrad/proto/gen/loop/v1;loopv1";

// Loop is a background loop komrad runs on a timer, which a caller can wake early.
enum Loop {
  // No loop was named. `WakeLoop` refuses this value.
  LOOP_UNSPECIFIED = 0;
  // Reads each live agent's checkout for its branch, head commit and changed lines.
  LOOP_CWD_SYNC = 1;
  // Reads each agent's transcript for new turns.
  LOOP_TRANSCRIPT_SYNC = 2;
  // Reads the pull requests from agents' branches.
  LOOP_PULL_REQUEST_SYNC = 3;
}

message WakeLoopRequest {
  // The loop to wake.
  Loop loop = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

// LoopService wakes komrad's background loops.
service LoopService {
  // WakeLoop runs a loop before its next tick, but no sooner than its minimum interval allows.
  rpc WakeLoop(WakeLoopRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.surfaces) = {
      cli: false
      mcp: false
      reason: "A client wakes a loop when the person looks at what the loop reads."
    };
  }
}
