// The view.v1 enums, in Edition 2026 so that each value's JSON name is its lowercase word.
// event/v1/event.proto says why Edition 2026 needs release candidates.
edition = "2026";

package view.v1;

import option "google/protobuf/json_enumvalue_options.proto";

option go_package = "komrad/proto/gen/view/v1;viewv1";

// View is how much of each record a listing returns.
export enum View {
  // No view was chosen. Treated as `summary`.
  VIEW_UNSPECIFIED = 0;
  // Long text is cut to its opening, and each record says which fields were cut.
  VIEW_SUMMARY = 1 [(pb.enumvalue.json).string = "summary"];
  // Every field in full, however long.
  VIEW_FULL = 2 [(pb.enumvalue.json).string = "full"];
}
