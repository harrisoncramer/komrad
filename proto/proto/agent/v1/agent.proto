  rpc GetAgent(GetAgentRequest) returns (GetAgentResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "get_agent"
      description: "Get one agent by id, archived or not, with its prompt in full."
      roles: [
        ROLE_WRITER,
        ROLE_REVIEWER,
        ROLE_ORCHESTRATOR
      ]
    };
  }
  rpc CreateAgent(CreateAgentRequest) returns (CreateAgentResponse) {
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "create_agent"
      description: "Create an agent and launch it with a prompt. With `task_id` or `task_slug` set, the agent becomes the task's writer when the task has none, and otherwise a reviewer in the writer's checkout. With neither set, komrad creates a task with the agent as its writer, and the agent returned carries its `task_id` and `task_slug`."
