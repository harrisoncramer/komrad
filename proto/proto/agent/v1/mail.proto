syntax = "proto3";

package agent.v1;

import "buf/validate/validate.proto";
import "pagination/v1/pagination.proto";

option go_package = "weave/proto/gen/agent/v1;agentv1";

// MailKind tells an agent's own mail from a notice weave raised itself.
enum MailKind {
  MAIL_KIND_UNSPECIFIED = 0;
  MAIL_KIND_PLAIN = 1;
  MAIL_KIND_REVIEW_ACTIVITY = 2;
  MAIL_KIND_EXCHANGE_CAPPED = 3;
}

// MailDirection is which half of an agent's correspondence a listing asks for.
enum MailDirection {
  MAIL_DIRECTION_UNSPECIFIED = 0;
  MAIL_DIRECTION_RECEIVED = 1;
  MAIL_DIRECTION_SENT = 2;
}

message Mail {
  string id = 1;
  optional string from_agent_id = 2;
  string from_name = 3;
  string to_agent_id = 4;
  string body = 5;
  optional string reply_to = 6;
  string created_at = 7;
  optional string claimed_at = 8;
  string expires_at = 9;
  MailKind kind = 10;
}

message SendMailRequest {
  string to_agent_id = 1 [(buf.validate.field).string.min_len = 1];
  string body = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 10000
  }];
  optional string reply_to = 3 [(buf.validate.field).string.min_len = 1];
}

message SendMailResponse {
  Mail mail = 1;
}

message ReadMailRequest {
  optional string id = 1 [(buf.validate.field).string.min_len = 1];
}

message ReadMailResponse {
  repeated Mail mail = 1;
}

message ListMailRequest {
  optional string id = 1 [(buf.validate.field).string.min_len = 1];
  optional pagination.v1.Pagination pagination = 2;
  MailDirection direction = 3 [(buf.validate.field).enum.defined_only = true];
}

message ListMailResponse {
  repeated Mail mail = 1;
  optional string next_page_token = 2;
}

message DeleteMailRequest {
  repeated string ids = 1 [(buf.validate.field).repeated.min_items = 1];
}
