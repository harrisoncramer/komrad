syntax = "proto3";

package annotation.v1;

import "google/protobuf/descriptor.proto";

option go_package = "weave/proto/gen/annotation/v1;annotationv1";

extend google.protobuf.MethodOptions {
  ToolAnnotation tool = 50003;
}

message ToolAnnotation {
  string tool_name = 1;

  string description = 2;

  optional bool read_only = 3;
  optional bool destructive = 4;
  optional bool idempotent = 5;
}
