syntax = "proto3";

package agent.v1;

import "buf/validate/validate.proto";

option go_package = "komrad/proto/gen/agent/v1;agentv1";

// ReviewAuthorKind is who wrote a review or comment.
enum ReviewAuthorKind {
  // No author was recorded.
  REVIEW_AUTHOR_KIND_UNSPECIFIED = 0;
  // The person.
  REVIEW_AUTHOR_KIND_HUMAN = 1;
  // An agent, either the writer or a reviewer.
  REVIEW_AUTHOR_KIND_AGENT = 2;
  // A forge user, whose comment komrad copied from the pull request.
  REVIEW_AUTHOR_KIND_FORGE = 3;
}

// ReviewVerdict is what a review concludes about a snapshot.
enum ReviewVerdict {
  // No verdict. An unreleased review has this value.
  REVIEW_VERDICT_UNSPECIFIED = 0;
  // The snapshot is good as it stands.
  REVIEW_VERDICT_APPROVED = 1;
  // The writer has more to do.
  REVIEW_VERDICT_CHANGES_REQUESTED = 2;
  // Comments with no conclusion either way.
  REVIEW_VERDICT_COMMENTED = 3;
}

// ReviewSnapshot is a snapshot of a task's worktree, saved as a commit, that a review is written
// against. A snapshot never changes.
message ReviewSnapshot {
  // The snapshot's id.
  string id = 1;
  // The id of the task the snapshot was taken of.
  string task_id = 2;
  // The snapshot's number within its task, counting from one.
  int32 ordinal = 3;
  // The commit on the base branch that the task's branch started from when the snapshot was taken.
  string base_sha = 4;
  // The commit holding the whole worktree, tracked and untracked files alike.
  string sha = 5;
  // When the snapshot was taken, in RFC 3339.
  string created_at = 6;
}

// Review is a reviewer agent's comments on one snapshot, released to the writer together. The
// review is private until the agent releases it.
message Review {
  // The review's id.
  string id = 1;
  // The id of the task the review is on.
  string task_id = 2;
  // The id of the snapshot the review is written against.
  string snapshot_id = 3;
  // The number of the snapshot the review is written against.
  int32 snapshot_ordinal = 4;
  // Who wrote the review.
  ReviewAuthorKind author_kind = 5;
  // The id of the agent that wrote the review. Unset when a forge user wrote it.
  optional string author_agent_id = 6;
  // The review's verdict. Unspecified until the review is released.
  ReviewVerdict verdict = 7;
  // When the review was released, in RFC 3339. Empty until then.
  string released_at = 8;
  // The absolute path of the file the released review was written to.
  string path = 9;
  // When the review was created with its first comment, in RFC 3339.
  string created_at = 11;
  // When the review last changed, in RFC 3339.
  string updated_at = 12;
  // What the author said about the work as a whole. Empty when the author said nothing.
  string body = 13;
  // How many of the review's threads are not resolved. A released review with none is finished,
  // whatever its verdict.
  int32 open_threads = 14;
  // The forge login of the author of a review copied from the forge. Empty otherwise.
  string external_login = 15;
}

// WatchedReview is a review as `Watch` events carry it, without its body.
message WatchedReview {
  // The review's id.
  string id = 1;
  // The id of the task the review is on.
  string task_id = 2;
  // The id of the snapshot the review is written against.
  string snapshot_id = 3;
  // The number of the snapshot the review is written against.
  int32 snapshot_ordinal = 4;
  // The commit of the review's snapshot.
  string snapshot_sha = 5;
  // Who wrote the review.
  ReviewAuthorKind author_kind = 6;
  // The id of the agent that wrote the review. Unset when a forge user wrote it.
  optional string author_agent_id = 7;
  // The review's verdict. Unspecified until the review is released.
  ReviewVerdict verdict = 8;
  // When the review was released, in RFC 3339. Empty until then.
  string released_at = 9;
  // When the review was created, in RFC 3339.
  string created_at = 11;
  // When the review last changed, in RFC 3339.
  string updated_at = 12;
  // When the review's snapshot was first seen landed, in RFC 3339. Empty until then.
  string snapshot_landed_at = 13;
  // The forge login of the author of a review copied from the forge. Empty otherwise.
  string external_login = 14;
}

// ReviewThread is a conversation pinned to a range of lines in a snapshot, or on the change as a
// whole.
message ReviewThread {
  // The thread's id.
  string id = 1;
  // The id of the task whose diff the thread is on.
  string task_id = 2;
  // The id of the review a reviewer agent opened the thread in. Unset for a thread the person
  // opened.
  optional string review_id = 3;
  // The id of the snapshot the thread is pinned to.
  string snapshot_id = 4;
  // The number of the snapshot the thread is pinned to.
  int32 snapshot_ordinal = 5;
  // The commit the old side of the line numbers is read against. This is the snapshot's base unless
  // the diff was narrowed to an earlier snapshot.
  string base_sha = 6;
  // The file's path, relative to the checkout. Empty for a thread on the change as a whole.
  string file_path = 7;
  // The first line of the range on the old side of the diff, counting from one.
  int32 old_start = 8;
  // The last line of the range on the old side of the diff.
  int32 old_end = 9;
  // The first line of the range on the new side of the diff, counting from one.
  int32 new_start = 10;
  // The last line of the range on the new side of the diff.
  int32 new_end = 11;
  // The diff lines the thread is about, each with its leading marker.
  repeated string quoted_lines = 12;
  // When the thread was resolved, in RFC 3339. Empty while the thread is open.
  string resolved_at = 13;
  // Whether an agent has replied since the person last read the thread.
  bool unread_by_human = 14;
  // The thread's comments, oldest first.
  repeated ReviewMessage messages = 15;
  // When the thread was created, in RFC 3339.
  string created_at = 16;
  // When the thread last changed, in RFC 3339.
  string updated_at = 17;
  // Whether the thread is copied from a pull request, where replies are public.
  bool mirrors_forge = 18;
  // The replies komrad has drafted, posted or failed to post to the forge thread, oldest first.
  // Only the person sees these.
  repeated ForgeReply forge_replies = 19;
  // Who opened the thread.
  ReviewAuthorKind author_kind = 20;
  // The id of the agent that opened the thread. Unset when the person or a forge user opened it.
  optional string author_agent_id = 21;
}

// ReviewMessage is one comment in a review thread.
message ReviewMessage {
  // The comment's id.
  string id = 1;
  // The id of the comment's thread.
  string thread_id = 2;
  // Who wrote the comment.
  ReviewAuthorKind author_kind = 3;
  // The id of the agent that wrote the comment. Unset when the person or a forge user wrote it,
  // or when the agent was deleted.
  optional string author_agent_id = 4;
  // The comment's text.
  string body = 5;
  // The lines the author proposes in place of the thread's range. Empty for a plain comment.
  repeated string suggestion = 6;
  // When the comment was written, in RFC 3339.
  string created_at = 7;
  // When the comment was last edited, in RFC 3339.
  string updated_at = 8;
  // The id of the review a reviewer agent released the comment with. Unset for the person's comments
  // and the writer's replies.
  optional string review_id = 12;
  // The id of the snapshot saved with an addressed reply. Unset on every other comment.
  optional string snapshot_id = 13;
  // The forge comment this comment was copied from. Unset for a comment written in komrad.
  optional ForgeOrigin forge = 14;
  // The id of the held forge comment the person accepted this comment as a copy of. Unset
  // otherwise.
  optional string accepted_from = 15;
  // Whether the comment is kept from the agent until the person accepts it, because a forge user
  // without write access wrote the comment or its thread.
  bool held = 16;
  // When the agent read the person's comment, in RFC 3339. Empty until then, and on every other
  // comment.
  string read_at = 17;
  // The id of the snapshot taken as the agent read the person's comment, which an addressed reply
  // is compared against. Unset until then, and on every other comment.
  optional string read_snapshot_id = 18;
}

// ForgeOrigin is the forge comment a review comment was copied from.
message ForgeOrigin {
  // The forge login of the comment's author. Empty when the forge no longer has the account.
  string login = 1;
  // The forge comment's id. The forge may have deleted the comment since.
  string comment_id = 2;
  // When the forge comment was last edited, in RFC 3339. Unset when it was never edited.
  optional string edited_at = 3;
}

message ListReviewThreadsRequest {
  // The task whose threads to list, by id or slug. Unset uses the caller's own task.
  optional string task = 1 [(buf.validate.field).cel = {
    id: "task.named"
    message: "pass task by id or by slug, or leave it unset"
    expression: "this.size() > 0"
  }];
}

message ListReviewThreadsResponse {
  // The threads on the task's diff, with their comments. An agent sees only released comments.
  repeated ReviewThread threads = 1;
}

message CreateReviewThreadRequest {
  // The task whose diff to comment on, by id or slug. Unset uses the caller's own task.
  optional string task = 1 [(buf.validate.field).cel = {
    id: "task.named"
    message: "pass task by id or by slug, or leave it unset"
    expression: "this.size() > 0"
  }];
  // The file's path, relative to the checkout. Empty for a comment on the change as a whole, with
  // no lines.
  string file_path = 2;
  // The commit the old side of the line numbers is read against. Empty uses the snapshot's base.
  string base_sha = 3;
  // The commit the new side of the line numbers is read against. Empty uses the snapshot's commit.
  string snapshot_sha = 4;
  // The first line of the range on the old side of the diff, counting from one.
  int32 old_start = 5;
  // The last line of the range on the old side of the diff.
  int32 old_end = 6;
  // The first line of the range on the new side of the diff, counting from one.
  int32 new_start = 7;
  // The last line of the range on the new side of the diff.
  int32 new_end = 8;
  // The diff lines the comment is about, each with its leading marker.
  repeated string quoted_lines = 9;
  // The thread's first comment.
  string body = 10 [(buf.validate.field).string = {
    min_len: 1
    max_len: 1000
  }];
  // The lines proposed in place of the range. Empty for a plain comment.
  repeated string suggestion = 11;
}

message CreateReviewThreadResponse {
  // The thread as created. A reviewer agent's thread stays private until its review is
  // released. The person's thread is released at once.
  ReviewThread thread = 1;
}

message AddReviewMessageRequest {
  // The thread to reply in, by id.
  string thread_id = 1 [(buf.validate.field).string.min_len = 1];
  // The reply's text.
  string body = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 1000
  }];
  // The lines proposed in place of the thread's range. Empty for a plain reply.
  repeated string suggestion = 3;
  // Whether the reply says the change the thread asks for is made. Komrad then saves a snapshot of
  // the worktree and pins it to the reply.
  bool addressed = 4;
}

message AddReviewMessageResponse {
  // The comment as written.
  ReviewMessage message = 1;
  // A reminder to set `addressed`, given when a plain reply goes on a thread whose worktree has
  // changed since the thread was created. Empty otherwise.
  string hint = 2;
}

message AcceptForgeMessageRequest {
  // The held forge comment to accept, by id.
  string message_id = 1 [(buf.validate.field).string.min_len = 1];
}

message AcceptForgeMessageResponse {
  // The copy written as the person's comment and mailed to the writer.
  ReviewMessage message = 1;
}

message EditReviewMessageRequest {
  // The comment to edit, by id.
  string id = 1 [(buf.validate.field).string.min_len = 1];
  // The comment's new text.
  string body = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 1000
  }];
  // The new lines proposed in place of the thread's range. Empty for a plain comment.
  repeated string suggestion = 3;
}

message EditReviewMessageResponse {
  // The comment as edited.
  ReviewMessage message = 1;
}

message MarkReviewThreadReadRequest {
  // The thread the caller has read, by id.
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message MarkReviewThreadReadResponse {
  // The thread as updated, no longer unread by the caller.
  ReviewThread thread = 1;
}

message SetReviewThreadResolvedRequest {
  // The thread to resolve or reopen, by id.
  string id = 1 [(buf.validate.field).string.min_len = 1];
  // Whether the thread is resolved. False reopens the thread.
  bool resolved = 2;
}

message SetReviewThreadResolvedResponse {
  // The thread as updated.
  ReviewThread thread = 1;
}

// TakeReviewSnapshotRequest saves a task's worktree as its next snapshot. When the worktree has not
// changed since the newest snapshot, the call returns that snapshot.
message TakeReviewSnapshotRequest {
  // The task whose worktree to save, by id or slug. Unset uses the caller's own task.
  optional string task = 1 [(buf.validate.field).cel = {
    id: "task.named"
    message: "pass task by id or by slug, or leave it unset"
    expression: "this.size() > 0"
  }];
}

message TakeReviewSnapshotResponse {
  // The snapshot to review. The newest existing snapshot when the worktree has not changed.
  ReviewSnapshot snapshot = 1;
}

message ListReviewSnapshotsRequest {
  // The task whose snapshots to list, by id or slug. Unset uses the caller's own task.
  optional string task = 1 [(buf.validate.field).cel = {
    id: "task.named"
    message: "pass task by id or by slug, or leave it unset"
    expression: "this.size() > 0"
  }];
}

message ListReviewSnapshotsResponse {
  // Every snapshot of the task, oldest first.
  repeated ReviewSnapshot snapshots = 1;
}

message OpenReviewHistoryRequest {
  // The task whose review history to open, by id or slug.
  string task = 1 [(buf.validate.field).cel = {
    id: "task.required"
    message: "pass task, by id or by slug"
    expression: "this.size() > 0"
  }];
  // The part of the work to diff. Unset diffs the whole change.
  oneof span {
    // A diff between two snapshots.
    ReviewSnapshotSpan snapshots = 6;
    // The change made by the reply that addressed a comment.
    ReviewAnswerSpan answer = 4;
    // The diff a comment was written against.
    ReviewOriginSpan origin = 5;
  }
}

// ReviewSnapshotSpan is the work between two snapshots of a task.
message ReviewSnapshotSpan {
  // The id of the snapshot the work starts after. Unset starts where the task starts.
  optional string from_snapshot_id = 1 [(buf.validate.field).string.min_len = 1];
  // The id of the snapshot the work ends on. Unset ends on the newest snapshot.
  optional string to_snapshot_id = 2 [(buf.validate.field).string.min_len = 1];
}

// ReviewAnswerSpan is the change between the snapshot a comment was written on and the snapshot of the
// reply that addressed it.
message ReviewAnswerSpan {
  // The id of the snapshot the comment was written on.
  string from_snapshot_id = 1 [(buf.validate.field).string.min_len = 1];
  // The id of the snapshot saved with the addressed reply.
  string to_snapshot_id = 2 [(buf.validate.field).string.min_len = 1];
}

// ReviewOriginSpan is the diff a comment was written against.
message ReviewOriginSpan {
  // The id of the snapshot the comment was written on.
  string snapshot_id = 1 [(buf.validate.field).string.min_len = 1];
  // The commit the comment's old side was read against. Empty uses the snapshot's base.
  string base_sha = 2;
}

message OpenReviewHistoryResponse {
  // The snapshot the diff is read at.
  ReviewSnapshot snapshot = 1;
  // Every snapshot of the task, oldest first.
  repeated ReviewSnapshot snapshots = 2;
  // Every thread on the task, with its comments.
  repeated ReviewThread threads = 3;
  // A note about the snapshot komrad chose. Empty when there is none.
  string notice = 5;
  // The commits the diff is between.
  ReviewResolvedSpan resolved = 6;
  // Why komrad diffed the whole change instead of the requested span. Unset when komrad diffed
  // the span.
  ReviewWidening widened = 7;
  // The id of the snapshot the person last commented on. Empty when there is none or the
  // snapshot's base has changed since.
  string earlier_snapshot_id = 9;
  // When the person last commented, in RFC 3339. Empty when the person never has.
  string earlier_released_at = 10;
  // How many files changed since `earlier_snapshot_id`.
  int32 changed_since_earlier = 11;
  // Where git traced each thread's lines in the diff's head, by thread id.
  map<string, ReviewTracedPlace> traced = 12;
}

// ReviewWidenedReason is why komrad diffed the whole change instead of the requested span.
enum ReviewWidenedReason {
  // No reason was recorded. No widening has this value.
  REVIEW_WIDENED_REASON_UNSPECIFIED = 0;
  // The snapshots the answer stands between are gone.
  REVIEW_WIDENED_REASON_ANSWER_GONE = 1;
  // The snapshot the comment was written on is gone.
  REVIEW_WIDENED_REASON_COMMENT_SNAPSHOT_GONE = 2;
  // A snapshot the range stands between is gone.
  REVIEW_WIDENED_REASON_RANGE_SNAPSHOT_GONE = 3;
  // The range starts on or after the snapshot it ends on.
  REVIEW_WIDENED_REASON_RANGE_BACKWARDS = 4;
  // The answer's older side could not be replayed across the rebase between its snapshots.
  // `conflicts` names the paths that stopped it.
  REVIEW_WIDENED_REASON_ANSWER_ACROSS_REBASE = 5;
}

// ReviewWidening is why komrad diffed the whole change, with the paths that conflicted when it did.
message ReviewWidening {
  // Why the span was widened.
  ReviewWidenedReason reason = 1;
  // The paths that conflicted replaying the answer's older side. Empty unless the reason is
  // `REVIEW_WIDENED_REASON_ANSWER_ACROSS_REBASE`.
  repeated string conflicts = 2;
}

// ReviewResolvedSpan is the pair of commits a diff is between.
message ReviewResolvedSpan {
  // The commit the diff is from. A replayed tree when the base branch moved.
  string base_sha = 1;
  // The commit the diff is to.
  string head_sha = 2;
  // Whether the older side was replayed onto the newer side's base.
  bool replayed = 3;
  // The snapshot an answer's diff is from. Empty for other spans.
  string answer_base_sha = 4;
  // The snapshot an answer's diff is to. Empty for other spans.
  string answer_head_sha = 5;
  // The commit a comment's diff is from. Empty for other spans.
  string origin_base_sha = 6;
  // The snapshot a comment was written on. Empty for other spans.
  string origin_head_sha = 7;
  // The base of the snapshot a comment was written on. Empty for other spans.
  string origin_snapshot_base_sha = 8;
  // The paths the base branch changed under the writer that replaying the older side could not
  // resolve. The diff is then from the older side as it was.
  repeated string conflicts = 9;
}

// ReviewTracedPlace is where git traced a thread's lines in the diff's head.
message ReviewTracedPlace {
  // The file the lines are in.
  string file_path = 1;
  // The first line on the new side. Zero when only the file is known.
  int32 new_start = 2;
  // Whether the lines are gone and only the file is known.
  bool file_only = 3;
  // Whether the head is the snapshot the lines were counted in.
  bool exact = 4;
}

// ReviewThreadInContext is one thread of a released review, with the code around it from the
// snapshot's commit.
message ReviewThreadInContext {
  // The thread, with only the comments released with this review.
  ReviewThread thread = 1;
  // The snapshot's lines around the thread's range, each prefixed with its line number, and `>>`
  // on the lines the thread is about. Empty when the snapshot cannot be read.
  repeated string context = 2;
}

message GetReviewRequest {
  // The review to read, by id.
  string review_id = 1 [(buf.validate.field).string.min_len = 1];
}

// GetReviewResponse is one released review in reading order: the verdict and body, then each
// thread with its code and comments.
message GetReviewResponse {
  // The review, with its verdict and body.
  Review review = 1;
  // The snapshot the review is written against.
  ReviewSnapshot snapshot = 2;
  // The review's threads, by file and line.
  repeated ReviewThreadInContext threads = 3;
}

message ListReviewsRequest {
  // The task whose reviews to list, by id or slug. Unset uses the caller's own task.
  optional string task = 1 [(buf.validate.field).cel = {
    id: "task.named"
    message: "pass task by id or by slug, or leave it unset"
    expression: "this.size() > 0"
  }];
}

message ListReviewsResponse {
  // Every review on the task, in snapshot order.
  repeated Review reviews = 1;
}

// ReleaseReviewRequest releases the caller's open review on a task.
message ReleaseReviewRequest {
  // The task the review is on, by id or slug. Unset uses the caller's own task.
  optional string task = 1 [(buf.validate.field).cel = {
    id: "task.named"
    message: "pass task by id or by slug, or leave it unset"
    expression: "this.size() > 0"
  }];
  // The review's verdict.
  ReviewVerdict verdict = 2 [(buf.validate.field).enum.defined_only = true];
  // What the reviewer says about the work as a whole. The writer reads it before the threads.
  string body = 3 [(buf.validate.field).string.max_len = 1500];
}

message ReleaseReviewResponse {
  // The review as released, with its verdict.
  Review review = 1;
  // How many comments the review released.
  int32 comments = 2;
  // The absolute path of the file the review was written to.
  string path = 3;
}

// ReviewViewedFile is a file in a task's diff that the person marked as read.
message ReviewViewedFile {
  // The id of the task whose diff has the file.
  string task_id = 1;
  // The file's path, relative to the checkout.
  string file_path = 2;
  // When the file was marked, in RFC 3339.
  string viewed_at = 3;
  // A hash of the file's diff when marked. A client shows the file as unread once the diff no
  // longer matches it.
  string fingerprint = 4;
}

message SetReviewFileViewedRequest {
  // The task whose diff has the file, by id or slug.
  string task = 1 [(buf.validate.field).cel = {
    id: "task.required"
    message: "pass task, by id or by slug"
    expression: "this.size() > 0"
  }];
  // The file's path, relative to the checkout.
  string file_path = 2 [(buf.validate.field).string.min_len = 1];
  // Whether the file is marked as read. False removes the mark.
  bool viewed = 3;
  // A hash of the file's diff when marked.
  string fingerprint = 4;
}

message SetReviewFileViewedResponse {
  // The mark as it now stands. Unset when the mark was removed.
  ReviewViewedFile viewed = 1;
}

message ListReviewViewedFilesRequest {
  // The task whose marks to list, by id or slug.
  string task = 1 [(buf.validate.field).cel = {
    id: "task.required"
    message: "pass task, by id or by slug"
    expression: "this.size() > 0"
  }];
}

message ListReviewViewedFilesResponse {
  // Every file marked as read in the task's diff.
  repeated ReviewViewedFile viewed = 1;
}

// ForgeReplyState is how far a reply komrad posts to the forge has got.
enum ForgeReplyState {
  // No state was recorded.
  FORGE_REPLY_STATE_UNSPECIFIED = 0;
  // Approved and waiting to be posted.
  FORGE_REPLY_STATE_APPROVED = 1;
  // Being posted. The forge may already have it.
  FORGE_REPLY_STATE_SENDING = 2;
  // Accepted by the forge.
  FORGE_REPLY_STATE_SENT = 3;
  // Refused by the forge on the latest attempt, waiting for the person to retry or discard it.
  FORGE_REPLY_STATE_FAILED = 4;
}

// ForgeReply is a reply komrad posts for the person on a thread copied from the forge.
message ForgeReply {
  // The reply's id.
  string id = 1;
  // The id of the review thread the reply answers.
  string thread_id = 2;
  // How far the reply has got toward the forge.
  ForgeReplyState state = 3;
  // The reply's text.
  string body = 4;
  // When the person approved the reply for posting, in RFC 3339.
  string approved_at = 5;
  // When komrad last started posting the reply, in RFC 3339. Empty until then.
  string sending_started_at = 6;
  // When the forge accepted the reply, in RFC 3339. Empty until then.
  string sent_at = 7;
  // The id of the comment komrad copied back from the forge for the reply. Unset until komrad
  // copies it.
  optional string forge_comment_id = 8;
  // What the forge said when it last refused the reply. Unset unless posting failed.
  optional string error = 9;
  // When the reply was written, in RFC 3339.
  string created_at = 10;
}

message ReplyOnForgeRequest {
  // The copied thread to reply on, by id.
  string thread_id = 1 [(buf.validate.field).string.min_len = 1];
  // The reply's text.
  string body = 2 [(buf.validate.field).string.min_len = 1];
}

message ReplyOnForgeResponse {
  // The reply after komrad tried to post it.
  ForgeReply reply = 1;
}

message RetryForgeReplyRequest {
  // The failed reply to post again, by id.
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message RetryForgeReplyResponse {
  // The reply after komrad tried to post it.
  ForgeReply reply = 1;
}

message DiscardForgeReplyRequest {
  // The failed reply to discard, by id.
  string id = 1 [(buf.validate.field).string.min_len = 1];
}
