// The pullrequest.v1 enums, in Edition 2026 so that each value's JSON name is its lowercase word.
// event/v1/event.proto says why Edition 2026 needs release candidates.
edition = "2026";

package pullrequest.v1;

import option "google/protobuf/json_enumvalue_options.proto";

option go_package = "komrad/proto/gen/pullrequest/v1;pullrequestv1";

// PullRequestState is the state of a pull request, worked out from the forge's report. A finished
// state wins over an open one.
export enum PullRequestState {
  // No state was recorded. No pull request has this value.
  PULL_REQUEST_STATE_UNSPECIFIED = 0;
  // Komrad has not read the repository yet.
  PULL_REQUEST_STATE_UNREAD = 1 [(pb.enumvalue.json).string = "unread"];
  // Komrad read the repository and found no pull request from the branch.
  PULL_REQUEST_STATE_NONE = 2 [(pb.enumvalue.json).string = "none"];
  // Open, with no review decision that decides it.
  PULL_REQUEST_STATE_OPEN = 3 [(pb.enumvalue.json).string = "open"];
  // Open, and the forge would merge it now.
  PULL_REQUEST_STATE_APPROVED = 4 [(pb.enumvalue.json).string = "approved"];
  // Open, with a reviewer asking for changes.
  PULL_REQUEST_STATE_CHANGES_REQUESTED = 5 [(pb.enumvalue.json).string = "changes_requested"];
  // A draft, whatever its reviews say.
  PULL_REQUEST_STATE_DRAFT = 6 [(pb.enumvalue.json).string = "draft"];
  // Merged.
  PULL_REQUEST_STATE_MERGED = 7 [(pb.enumvalue.json).string = "merged"];
  // Closed without merging.
  PULL_REQUEST_STATE_CLOSED = 8 [(pb.enumvalue.json).string = "closed"];
  // Open, with a failing check on the head commit, whatever its reviews say.
  PULL_REQUEST_STATE_FAILING = 9 [(pb.enumvalue.json).string = "failing"];
  // Approved, but behind its base branch or blocked by a branch rule.
  PULL_REQUEST_STATE_APPROVED_WAITING = 10 [(pb.enumvalue.json).string = "approved_waiting"];
  // Open, and in conflict with its base branch, whatever its reviews say.
  PULL_REQUEST_STATE_CONFLICTING = 11 [(pb.enumvalue.json).string = "conflicting"];
  // Open, with checks running on the head commit and no reviewer asking for changes.
  PULL_REQUEST_STATE_CHECKS_RUNNING = 12 [(pb.enumvalue.json).string = "checks_running"];
  // Open, and every reviewer who asked for changes has been asked to review again.
  PULL_REQUEST_STATE_REREVIEW_REQUESTED = 13 [(pb.enumvalue.json).string = "rereview_requested"];
}

// Mergeability is whether the forge would merge a pull request, given its base branch and branch
// rules.
export enum Mergeability {
  // No value was recorded.
  MERGEABILITY_UNSPECIFIED = 0;
  // The forge has not worked it out yet.
  MERGEABILITY_UNKNOWN = 1 [(pb.enumvalue.json).string = "unknown"];
  // The forge would merge the pull request now.
  MERGEABILITY_CLEAN = 2 [(pb.enumvalue.json).string = "clean"];
  // Some checks are not passing.
  MERGEABILITY_UNSTABLE = 3 [(pb.enumvalue.json).string = "unstable"];
  // A branch rule is not met, such as a required review.
  MERGEABILITY_BLOCKED = 4 [(pb.enumvalue.json).string = "blocked"];
  // The base branch has commits the pull request's branch does not.
  MERGEABILITY_BEHIND = 5 [(pb.enumvalue.json).string = "behind"];
  // The branch is in conflict with its base branch.
  MERGEABILITY_CONFLICTING = 6 [(pb.enumvalue.json).string = "conflicting"];
}

// ReviewDecision is the forge's decision on a pull request's reviews.
export enum ReviewDecision {
  // No value was recorded.
  REVIEW_DECISION_UNSPECIFIED = 0;
  // The forge reports no decision.
  REVIEW_DECISION_NONE = 1 [(pb.enumvalue.json).string = "none"];
  // A required review has not been given.
  REVIEW_DECISION_PENDING = 2 [(pb.enumvalue.json).string = "pending"];
  // The forge counts the pull request as approved.
  REVIEW_DECISION_APPROVED = 3 [(pb.enumvalue.json).string = "approved"];
  // A reviewer is asking for changes.
  REVIEW_DECISION_CHANGES_REQUESTED = 4 [(pb.enumvalue.json).string = "changes_requested"];
  // Every reviewer who asked for changes has been asked to review again.
  REVIEW_DECISION_REREVIEW_REQUESTED = 5 [(pb.enumvalue.json).string = "rereview_requested"];
}

// Checks is the overall state of the checks on a pull request's head commit.
export enum Checks {
  // No value was recorded.
  CHECKS_UNSPECIFIED = 0;
  // The head commit has no checks.
  CHECKS_NONE = 1 [(pb.enumvalue.json).string = "none"];
  // Checks are still running.
  CHECKS_PENDING = 2 [(pb.enumvalue.json).string = "pending"];
  // Every check passed.
  CHECKS_PASSING = 3 [(pb.enumvalue.json).string = "passing"];
  // At least one check failed, and every check has finished.
  CHECKS_FAILING = 4 [(pb.enumvalue.json).string = "failing"];
  // At least one check failed, and others are still running.
  CHECKS_FAILING_RUNNING = 5 [(pb.enumvalue.json).string = "failing_running"];
}

// CheckLogState is the state of fetching a check's log.
export enum CheckLogState {
  // No state was recorded.
  CHECK_LOG_STATE_UNSPECIFIED = 0;
  // The check has no log to fetch.
  CHECK_LOG_STATE_NONE = 1 [(pb.enumvalue.json).string = "none"];
  // The check has not finished, or komrad has not fetched its log yet.
  CHECK_LOG_STATE_PENDING = 2 [(pb.enumvalue.json).string = "pending"];
  // Komrad fetched and keeps the log.
  CHECK_LOG_STATE_FETCHED = 3 [(pb.enumvalue.json).string = "fetched"];
  // The log is larger than komrad keeps, so komrad keeps none of it.
  CHECK_LOG_STATE_TOO_LARGE = 4 [(pb.enumvalue.json).string = "too_large"];
  // The forge never had a log for the check.
  CHECK_LOG_STATE_MISSING = 5 [(pb.enumvalue.json).string = "missing"];
  // The forge no longer has the log.
  CHECK_LOG_STATE_EXPIRED = 6 [(pb.enumvalue.json).string = "expired"];
  // Komrad stopped trying to fetch the log.
  CHECK_LOG_STATE_FAILED = 7 [(pb.enumvalue.json).string = "failed"];
}

// StatusCheckKind is the kind of status check a forge reported.
export enum StatusCheckKind {
  // No kind was recorded.
  STATUS_CHECK_KIND_UNSPECIFIED = 0;
  // A check run an app reported on the commit.
  STATUS_CHECK_KIND_CHECK_RUN = 1 [(pb.enumvalue.json).string = "check_run"];
  // A commit status a service set on the commit.
  STATUS_CHECK_KIND_STATUS = 2 [(pb.enumvalue.json).string = "status"];
  // A pipeline the forge ran for the commit.
  STATUS_CHECK_KIND_PIPELINE = 3 [(pb.enumvalue.json).string = "pipeline"];
}

// StatusCheckState is how far along a status check or step is.
export enum StatusCheckState {
  // No state was recorded.
  STATUS_CHECK_STATE_UNSPECIFIED = 0;
  // Waiting for a runner.
  STATUS_CHECK_STATE_QUEUED = 1 [(pb.enumvalue.json).string = "queued"];
  // Running now.
  STATUS_CHECK_STATE_RUNNING = 2 [(pb.enumvalue.json).string = "running"];
  // Waiting on something else, such as an approval.
  STATUS_CHECK_STATE_WAITING = 3 [(pb.enumvalue.json).string = "waiting"];
  // Finished, with the conclusion saying how.
  STATUS_CHECK_STATE_COMPLETED = 4 [(pb.enumvalue.json).string = "completed"];
  // Still running when komrad stopped reading the commit, which is no longer the head.
  STATUS_CHECK_STATE_UNKNOWN = 5 [(pb.enumvalue.json).string = "unknown"];
}
