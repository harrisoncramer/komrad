name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  # What the branch touched, which is what every job below gates on. Only a pull request
  # is filtered; a push to main runs every job.
  changes:
    runs-on: namespace-profile-harrisoncramer
    outputs:
      go: ${{ github.event_name != 'pull_request' || steps.filter.outputs.go == 'true' }}
      shell: ${{ github.event_name != 'pull_request' || steps.filter.outputs.shell == 'true' }}
      db: ${{ github.event_name != 'pull_request' || steps.filter.outputs.db == 'true' }}
      proto: ${{ github.event_name != 'pull_request' || steps.filter.outputs.proto == 'true' }}
      infra: ${{ github.event_name != 'pull_request' || steps.filter.outputs.infra == 'true' }}
      generated: ${{ github.event_name != 'pull_request' || steps.filter.outputs.generated == 'true' }}
      integration: ${{ github.event_name != 'pull_request' || steps.filter.outputs.integration == 'true' }}
      docs: ${{ github.event_name != 'pull_request' || steps.filter.outputs.docs == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yaml'
              - '.custom-gcl.yml'
              - 'tools/komradlint/**'
              - 'tools/komradpkg/**'
              - '.github/workflows/ci.yml'
            shell:
              - 'mise/**'
              - '**/*.sh'
              - 'internal/scripts/builtin/**'
              - '.github/workflows/ci.yml'
            db:
              - 'db/**'
              - '.github/workflows/ci.yml'
            proto:
              - 'proto/**'
              - 'buf*.yaml'
              - '.github/workflows/ci.yml'
            infra:
              - 'infra/**'
              - 'packer/**'
              - 'mise/tasks/infra/engine/**'
              - 'mise/tasks/infra/docs/**'
              - 'mise/tasks/packer/**'
              - 'mise.toml'
              - '.github/workflows/ci.yml'
            integration:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'mise/**'
              - 'db/**'
              - 'proto/**'
              - '.github/workflows/ci.yml'
            docs:
              - 'docs/**'
              - 'mise/tasks/docs/**'
              - 'mise.toml'
              - '.github/workflows/ci.yml'
            generated:
              - 'proto/**'
              - 'db/**'
              - 'config/**'
              - 'cmd/protoc-gen-komrad-rpc/**'
              - 'cmd/gen-docs/**'
              - 'internal/cli/**'
              - 'mise/tasks/gen/**'
              - '.github/workflows/ci.yml'

  # The shell komrad runs: the mise tasks and the builtin scripts an agent's hooks call.
  shell:
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: namespace-profile-harrisoncramer
    steps:
      - uses: actions/checkout@v4

      - name: Use Mise
        uses: ./.github/actions/use-mise
        with:
          gh-access-token: ${{ env.GH_ACCESS_TOKEN }}

      - name: Check the shell
        run: |
          mise run bash:check
          mise run bash:fmt --check

  proto:
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    runs-on: namespace-profile-harrisoncramer
    steps:
      - uses: actions/checkout@v4

      - name: Use Mise
        uses: ./.github/actions/use-mise
        with:
          gh-access-token: ${{ env.GH_ACCESS_TOKEN }}

      - name: Check the protobufs
        run: |
          mise run proto:fmt --check
          mise run proto:lint

  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: namespace-profile-harrisoncramer
    steps:
      - uses: actions/checkout@v4

      - name: Use Mise
        uses: ./.github/actions/use-mise
        with:
          gh-access-token: ${{ env.GH_ACCESS_TOKEN }}

      - name: Check the Terraform formatting
        run: |
          mise run infra:engine:fmt
          mise run infra:docs:fmt

      - name: Check the Packer formatting
        run: mise run packer:fmt

      - name: Validate the Packer template
        run: mise run packer:validate

  db:
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: namespace-profile-harrisoncramer
    steps:
      - uses: actions/checkout@v4

      - name: Use Mise
        uses: ./.github/actions/use-mise
        with:
          gh-access-token: ${{ env.GH_ACCESS_TOKEN }}

      - name: Check the migrations
        run: |
          mise run db:fmt --check
          mise run db:validate

  # The generators, which read the protobufs, the schema and the config and write Go.
  generated:
    needs: changes
    if: needs.changes.outputs.generated == 'true'
    runs-on: namespace-profile-harrisoncramer

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: komrad
          POSTGRES_PASSWORD: komrad
          POSTGRES_DB: komrad
        ports:
          - 5460:5432
        options: >-
          --health-cmd "pg_isready -U komrad"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      KOMRAD_DATABASE_URL: postgres://komrad:komrad@localhost:5460/komrad?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - name: Use Mise
        uses: ./.github/actions/use-mise
        with:
          gh-access-token: ${{ env.GH_ACCESS_TOKEN }}

      - name: Check the generated files are in step
        run: mise run gen:check

  # The Go itself: formatting, the linter, and the tests that drive no external binary.
  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: namespace-profile-harrisoncramer

    # The store tests run against a real Postgres rather than a fake, and
    # internal/pgtest creates a database per test off the server KOMRAD_DATABASE_URL
    # points at. Credentials match docker-compose so nothing else has to change.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: komrad
          POSTGRES_PASSWORD: komrad
          POSTGRES_DB: komrad
        ports:
          - 5460:5432
        options: >-
          --health-cmd "pg_isready -U komrad"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      KOMRAD_DATABASE_URL: postgres://komrad:komrad@localhost:5460/komrad?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      # The module cache, golangci-lint's own cache and the tools are rebuilt from nothing
      # on every run otherwise. They live on a volume attached to the runner, and Go's
      # build and test results live in Namespace's remote Go cache. Both are shared across
      # every branch of the repository, so a new branch starts warm where actions/cache
      # would miss.
      - name: Use Mise
        uses: ./.github/actions/use-mise
        with:
          gh-access-token: ${{ env.GH_ACCESS_TOKEN }}

      # Go reuses a passing test result only when every file and folder the test read has
      # the same mtime as last time. A fresh checkout gives them all a new one, so without
      # this every test runs again, even ones whose code nothing touched.
      - name: Give the files the times the test cache expects
        run: mise run go:mtimehash

      - name: Check the formatting
        run: mise run go:fmt --check

      - name: Lint
        run: mise run go:lint

      - name: Run the unit tests
        run: mise run go:test --kind unit

  # The integration tests drive a real git, a real tmux and a real komrad, which is slow
  # and flakes when the machine is busy. They carry a build tag, so this is the only job
  # that compiles them in. The paths above are wide because these tests drive the panel
  # end to end, so most of the module is behind them.
  integration:
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: namespace-profile-harrisoncramer

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: komrad
          POSTGRES_PASSWORD: komrad
          POSTGRES_DB: komrad
        ports:
          - 5460:5432
        options: >-
          --health-cmd "pg_isready -U komrad"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      KOMRAD_DATABASE_URL: postgres://komrad:komrad@localhost:5460/komrad?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - name: Use Mise
        uses: ./.github/actions/use-mise
        with:
          gh-access-token: ${{ env.GH_ACCESS_TOKEN }}

      - name: Give the files the times the test cache expects
        run: mise run go:mtimehash

      # A test that needs tmux fails without it rather than skipping, so this step is what
      # keeps the job honest. less is what the panel pages a dormant agent's placeholder
      # into a pane with.
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux less

      - name: Run the integration tests
        run: mise run go:test --kind integration

  # The docs site: formatting, the linter, the type check, and a build.
  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: namespace-profile-harrisoncramer
    steps:
      - uses: actions/checkout@v4

      - name: Use Mise
        uses: ./.github/actions/use-mise
        with:
          gh-access-token: ${{ env.GH_ACCESS_TOKEN }}

      - name: Check the docs
        run: |
          mise run docs:fmt --check
          mise run docs:lint
          mise run docs:check
          mise run docs:build

  # One status check a ruleset can name, standing in for all eight. The jobs above are filtered
  # by path, so a pull request touching only documentation leaves several of them skipped, and a
  # ruleset naming those directly would wait forever on a check that never runs. This one runs
  # regardless and fails only on a failure or a cancellation, so a skip passes through. Every job
  # in this file has to appear below: one left out is a failure this gate cannot see.
  required:
    needs: [changes, shell, proto, infra, db, generated, go, integration, docs]
    if: always()
    runs-on: namespace-profile-harrisoncramer
    steps:
      - name: Fail when a needed job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
