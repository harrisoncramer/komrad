# The throwaway instance, a second checkout kept on main to verify builds against. It is
# not loaded by default, so a command meant for that checkout names it: MISE_ENV=test mise
# run restart. Every checkout ignores this file otherwise, including the one you develop in.
#
# Everything here is something the two instances would otherwise share. Moving all of it
# means `mise run restart` in the throwaway checkout cannot reach the agents or the data in
# the one being developed against.
#
# These are environment variables rather than a config file because the environment beats the
# file, so the isolation holds whatever a developer has written in ~/.config/weave. WEAVE_CONFIG
# then keeps the panel settings apart too, since that file can now name a database of its own.
[env]
# Its own config, so the throwaway instance is not reading the panel settings of the checkout
# being developed against. Naming it here replaces the discovery of ~/.config/weave entirely,
# which is the point: nothing outside this checkout reaches the test instance.
WEAVE_CONFIG = "{{config_root}}/weave.test.toml"

# Its own Postgres. The port is what docker-compose publishes and what the connection string
# points at, and the compose project is named after the directory, so `docker:up` brings up a
# container of its own rather than colliding on the other instance's. The read-only login is
# derived from this url, so there is nothing else here to keep in step with the port.
DB_PORT = "5461"
DATABASE_URL = "postgres://weave:weave@localhost:5461/weave?sslmode=disable"

# Its own server, so both can run at once and neither adopts the other's.
WEAVE_ADDR = "127.0.0.1:8790"

# Its own tmux server. This is the one that matters most: the panel and every agent live
# on it, and `mise run restart` kills it whole.
WEAVE_TMUX_SOCKET = "weave-test"

# Its own log and generated files, so a tail here is not the other instance's output.
WEAVE_CACHE_DIR = "{{env.HOME}}/Library/Caches/weave-test"
