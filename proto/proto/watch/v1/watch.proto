syntax = "proto3";

package watch.v1;

import "agent/v1/agent.proto";
import "agent/v1/document.proto";
import "agent/v1/mail.proto";
import "agent/v1/review.proto";
import "annotation/v1/tool.proto";
import "google/protobuf/empty.proto";
import "pullrequest/v1/pullrequest.proto";
import "schedule/v1/schedule.proto";
import "task/v1/task.proto";
import "workflow/v1/workflow.proto";
import "worktree/v1/worktree.proto";

option go_package = "komrad/proto/gen/watch/v1;watchv1";

// WatchEvent is one message on a watch stream: the snapshot, a batch of changes, or a heartbeat.
message WatchEvent {
  // The event.
  oneof event {
    // Every watched record, sent once as the stream opens.
    Snapshot snapshot = 1;
    // The records that changed since the last event.
    Changes changes = 2;
    // A sign the stream is alive while nothing has changed for a while.
    google.protobuf.Empty heartbeat = 3;
  }
}

// Snapshot is every watched record.
message Snapshot {
  // The records.
  repeated Row rows = 1;
}

// Changes is the records that changed since the last event.
message Changes {
  // The records created or changed, in full.
  repeated Row puts = 1;
  // The records no longer watched. A client may never have held some of them.
  repeated Deleted deleted = 2;
}

// Row is one watched record, in the shape its list call returns.
message Row {
  // The record.
  oneof row {
    // An agent, as `list_agents` returns it.
    agent.v1.Agent agent = 1;
    // A workflow, as `list_workflows` returns it.
    workflow.v1.Workflow workflow = 2;
    // A schedule, as `list_schedules` returns it.
    schedule.v1.Schedule schedule = 3;
    // A piece of mail, as `list_mail` returns it.
    agent.v1.Mail mail = 4;
    // A pull request, as `list_pull_requests` returns it.
    pullrequest.v1.PullRequest pull_request = 5;
    // A repository and whether its pull requests have been read.
    pullrequest.v1.Repository repository = 6;
    // A review of an agent's work, without its body.
    agent.v1.WatchedReview review = 7;
    // A review thread with its messages.
    agent.v1.ReviewThread review_thread = 8;
    // A worktree, as it is on disk.
    worktree.v1.WatchedWorktree worktree = 9;
    // A document type with its context.
    agent.v1.DocumentType document_type = 10;
    // A task, as `list_tasks` returns it.
    task.v1.Task task = 11;
  }
}

// Resource is the kind of a watched record, one value per member of `Row`.
enum Resource {
  // No kind was set. Komrad never sends this value.
  RESOURCE_UNSPECIFIED = 0;
  // An agent.
  RESOURCE_AGENT = 1;
  // A workflow.
  RESOURCE_WORKFLOW = 2;
  // A schedule.
  RESOURCE_SCHEDULE = 3;
  // A piece of mail.
  RESOURCE_MAIL = 4;
  // A pull request.
  RESOURCE_PULL_REQUEST = 5;
  // A repository and whether its pull requests have been read.
  RESOURCE_REPOSITORY = 6;
  // A review.
  RESOURCE_REVIEW = 7;
  // A thread.
  RESOURCE_REVIEW_THREAD = 8;
  // A worktree.
  RESOURCE_WORKTREE = 9;
  // A document type.
  RESOURCE_DOCUMENT_TYPE = 10;
  // A task.
  RESOURCE_TASK = 11;
}

// Deleted names a record that is no longer watched, because it was deleted or is being deleted.
message Deleted {
  // The kind of the record.
  Resource resource = 1;
  // The record's key.
  string key = 2;
}

// WatchService streams every change to the records komrad watches.
service WatchService {
  // Watch sends a snapshot of every watched record, then the changes for as long as the stream
  // is open, with a heartbeat while nothing changes.
  rpc Watch(google.protobuf.Empty) returns (stream WatchEvent) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: false
      mcp: false
      reason: "A stream held open by a long-running client, where an agent or a script calls the list methods instead."
    };
  }
}
