syntax = "proto3";

package config.v1;

import "annotation/v1/tool.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";

option go_package = "komrad/proto/gen/config/v1;configv1";

message GetConfigResponse {
  // The configuration in force, keyed as in the config file, with defaults filled in and
  // connection strings redacted.
  google.protobuf.Struct config = 1;
  // Why the person's config file failed to parse. Unset when it parsed. When set, `config` holds
  // the defaults.
  optional string config_error = 2;
  // The build version of the server.
  string version = 3;
}

// ConfigService reads the configuration the server runs with.
service ConfigService {
  rpc GetConfig(google.protobuf.Empty) returns (GetConfigResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "get_config"
      description: "Get the configuration in force, with defaults filled in, connection strings redacted, and the server's build version. A `config_error` means the config file failed to parse and the defaults are in force."
      roles: [ROLE_ORCHESTRATOR]
    };
  }
}
