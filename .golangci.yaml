version: "2"
# The integration tests carry a build tag, so without this the linter would not read them
# at all and every rule below would stop at the files a unit run compiles.
run:
  build-tags:
    - integration
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
linters:
  enable:
    - bodyclose
    - weavelint
    - unparam
    - exhaustive
    - fussy
    - depguard
    - importas
    - copyloopvar
    - errorlint
    - fatcontext
    - forcetypeassert
    - gocritic
    - iface
    - inamedparam
    - noctx
    - testifylint
    - sloglint
    - usetesting
    - errname
    - forbidigo
    - godot
    - predeclared
    - misspell
    - dupword
    - whitespace
    - wastedassign
    - unconvert
    - mirror
    - makezero
    - tparallel
    - intrange
    - nlreturn
    - revive
    - thelper
    - nolintlint
    - usestdlibvars
    - gocheckcompilerdirectives
    - dogsled
    - godox
    - asasalint
    - asciicheck
    - bidichk
    - durationcheck
    - spancheck
    - errchkjson
    - musttag
    - reassign
    - nakedret
    - exptostd
    - nilnesserr
    - containedctx
    - decorder
  settings:
    errcheck:
      # A discarded error is the same bug whether it went to _ or nowhere, so the blank
      # form is checked too. What is excluded below is the handful of calls where the zero
      # value genuinely is the answer.
      check-blank: true
      exclude-functions:
        # Cleanup that runs in a defer, where the caller has already returned and there is
        # nothing left to report the failure to.
        - (github.com/jackc/pgx/v5.Tx).Rollback
        - (*weave/internal/store.Tx).Rollback
        - (*github.com/jackc/pgx/v5.Conn).Close
        - (*weave/internal/store.Pool).Close
        - (*os.File).Close
        - (io.Closer).Close
        - (*weave/internal/engine.Tunnel).Close
        # Fails only with no HOME, and every caller treats the empty string as the fallback
        # it would have chosen anyway.
        - os.UserHomeDir
    staticcheck:
      checks:
        - all
    forbidigo:
      # Explainer: driving a real git is what makes a test slow and what makes it flake under
      # load, so the suite is split into unit tests and integration tests, and only the
      # packages below pay for it. The rule is written against the calls rather than the
      # imports, since a unit test that hands over a fake still imports weave/internal/git
      # for the types the fake is written in.
      analyze-types: true
      forbid:
        - pattern: ^git\.NewClient$
          msg: a unit test takes the git seam and hands over a fake
        - pattern: ^git\.(Run|RunBytes)$
          msg: a unit test does not run git itself
        - pattern: ^exec\.Command(Context)?$
          msg: a unit test does not shell out to git
    depguard:
      # The layers, as docs/concepts.md describes them. A layer may call the one below it
      # and may not reach past it, and the panel receives its adapters rather than
      # importing them. These are cheap to keep and expensive to rediscover.
      rules:
        presentation:
          files:
            - "**/internal/ui/paint/**"
          deny:
            - pkg: weave/internal/store
              desc: the drawing primitives hold no domain, so nothing here reads a record
            - pkg: weave/db
              desc: the drawing primitives hold no domain, so nothing here reads a record
            - pkg: weave/proto
              desc: the drawing primitives hold no domain, so nothing here reads a record
            - pkg: weave/internal/ui
              desc: paint is under the panel rather than beside it, so it never reaches back up
        panel:
          files:
            - "**/internal/ui/**"
          deny:
            - pkg: weave/internal/tmux
              desc: the panel takes what it needs of tmux as a dependency, so the option names stay in the adapter
            - pkg: weave/internal/harness
              desc: which CLI an agent runs is the service's business, and reaches the panel as data
            - pkg: weave/internal/scripts
              desc: the panel lists and fires scripts over the API rather than reading the directory
            - pkg: weave/internal/agents
              desc: the panel is a client of the service, not a caller of it in process
            - pkg: weave/db
              desc: the panel holds no database connection
            - pkg: weave/internal/store
              desc: the panel knows nothing the service has not told it, so a record reaches it as a proto and is kept in its own shape
            - pkg: weave/internal/rpc/
              desc: a handler's helpers convert between the store and the wire, and the panel has no store to convert from
        transport:
          files:
            - "!$test"
            - "**/internal/rpc/**"
            - "**/internal/mcp/**"
          deny:
            - pkg: weave/internal/tmux
              desc: a handler translates and nothing more, so what tmux can do reaches it through the service
            - pkg: weave/internal/harness
              desc: same reason, and the service restates the refusals a handler maps on
            - pkg: weave/internal/scripts
              desc: same reason, with agents.Script naming a script for a handler that has to describe one
            - pkg: weave/db
              desc: a handler holds no database connection
        domain:
          files:
            - "**/internal/agents/**"
            - "**/internal/checkouts/**"
            - "**/internal/mail/**"
            - "**/internal/marks/**"
            - "**/internal/pullrequests/**"
            - "**/internal/reviews/**"
            - "**/internal/schedules/**"
            - "**/internal/scriptrun/**"
            - "**/internal/transcripts/**"
          deny:
            - pkg: weave/proto/gen
              desc: the service decides in its own types, and rendering them onto the wire is the handler's job
            - pkg: connectrpc.com/connect
              desc: the service returns a sentinel, and rpcerr picks the code it answers with
        stores:
          files:
            - "**/internal/store/**"
          deny:
            - pkg: weave/internal/agents
              desc: a store holds no rules, so nothing above it belongs here
            - pkg: weave/internal/tmux
              desc: a store writes rows, and what is true of tmux reaches it as an argument
            - pkg: weave/internal/harness
              desc: same reason as tmux
            - pkg: weave/internal/ui
              desc: nothing below the panel may depend on it
            - pkg: weave/proto/gen
              desc: a row is the store's own struct, and two layers above it decide what the wire sees
            - pkg: connectrpc.com/connect
              desc: same reason as the wire types
        adapters:
          files:
            - "**/internal/tmux/**"
            - "**/internal/harness/**"
            - "**/internal/scripts/**"
          deny:
            - pkg: weave/internal/store
              desc: an adapter is a seam in front of something weave does not own, and knows nothing of rows
            - pkg: weave/internal/agents
              desc: the service calls the adapter rather than the other way round
            - pkg: weave/internal/ui
              desc: same reason
            - pkg: weave/proto/gen
              desc: what tmux or a CLI can do is weave's own vocabulary, not the wire's
            - pkg: connectrpc.com/connect
              desc: same reason as the wire types
        generated-queries:
          files:
            - "**/*.go"
            - "!**/internal/store/**"
            - "!**/db/**"
          deny:
            - pkg: weave/db/models
              desc: the generated queries are the store's to call, so a caller goes through the domain store
        config:
          files:
            - "**/config/**"
            - "!**/internal/**"
          deny:
            - pkg: weave/internal
              desc: config is read by everything and so may depend on nothing
    importas:
      no-unaliased: true
      alias:
        - pkg: weave/internal/store/(\w+)
          alias: ${1}store
        - pkg: weave/proto/gen/(\w+)/v1
          alias: ${1}v1
    sloglint:
      # Every line in weave is written with LogAttrs, on the logger the context carries, so a
      # line reaches the log with the request's trace on it rather than bare.
      context: all
      attr-only: true
      no-global: all
      # The keys are OpenTelemetry names declared once in internal/logging, so a literal at
      # the call site is a key nothing else will ever match on.
      no-raw-keys: true
      # A message built with Sprintf is a message no query can group by, and the arguments it
      # interpolates belong in attributes where they can be filtered.
      static-msg: true
      msg-style: lowercased
    usetesting:
      # A test's own context is cancelled when the test ends, so work it started cannot
      # outlive it and hold a database handle open into the next one.
      context-background: true
      context-todo: true
      os-temp-dir: true
    nlreturn:
      block-size: 2
    revive:
      rules:
        - name: receiver-naming
          arguments:
            - maxLength: 2
        - name: argument-limit
          arguments:
            - 4
    thelper:
      # A table row's check closure takes t too, and it is the helper's parameter position
      # and name that are held rather than its first statement.
      test:
        begin: false
    nolintlint:
      require-explanation: true
      require-specific: true
    exhaustive:
      check:
        - switch
      default-signifies-exhaustive: false
      # A member named for an end is one past the last real state, there to give a caller walking
      # an enum a bound that moves on its own, so no switch answers for it.
      ignore-enum-members: End$
    custom:
      weavelint:
        type: module
        description: Checks for this repo; a sentinel error must declare the kind of failure it is and be declared at package scope, a message wrapping another error opens with "failed to " or with the error itself, a connect handler must hand its strict half to the adapter rather than answering for itself, a forge Secret gives up its token only where it is sent or kept, an HTTP client is built by lib/xhttp, a declared function spans more than one line, a proto converter is named for its direction, a comment carries no justification clause, a loop that only maps a slice is xslice.Map, a constructor taking a params struct is New<T>(New<T>Params) declared as params, type, constructor, and a store write to a watched table is followed by a touch.
        settings:
          sentinel_inline:
            skip: false
            exclude: []
          wrap_phrase:
            skip: false
            # Unanchored regexps over the path lint was run from. A config error names the key
            # it is about, and the docs generator names the file it was writing.
            exclude:
              - ^config/
              - ^cmd/gen-docs/
          oneline_func:
            skip: false
          comment_clause:
            skip: false
            # Unanchored regexps over the path lint was run from. The config struct's doc
            # comments are the text of the generated config.toml, so they are prose on purpose.
            exclude:
              - config/appconfig\.go$
          constructor_shape:
            skip: false
            exclude: []
          store_touch:
            skip: false
            # Unanchored regexps over the path lint was run from. The packages that write rows.
            stores:
              - ^internal/store/
            # The sqlc query files, read to learn which table each query writes and which
            # tables the listings read.
            queries: db/queries
            # The panel's three listings, keyed by their table, with the queries the watch's
            # snapshot and read-back run for each. A write to any table those queries read
            # has to touch the listing afterwards.
            listings:
              agents:
                - ListAgentRows
                - ListAgentMetadata
              workflows:
                - ListWorkflowsPage
                - ListLiveWorkflowsByID
                - ListHooksForWorkflows
                - ListMarks
              schedules:
                - ListSchedulesPage
                - ListLiveSchedulesByID
          single_append:
            skip: false
            # Unanchored regexps over the path lint was run from. The package that defines Map,
            # and the sqlc output nobody edits.
            exclude:
              - ^lib/xslice/
              - ^db/models/
          conversion_name:
            skip: false
            # Unanchored regexps over the path lint was run from. The service builds proto
            # messages, so its converters are renderX.
            render:
              - ^internal/rpc/
            # The panel reads proto messages, so its converters are xFrom, never protoToX,
            # xFromProto or renderX.
            from:
              - ^internal/ui/
          bare_http:
            skip: false
            # Unanchored regexps over the path lint was run from. The one package that builds
            # the configured client and transport everything else uses.
            exclude:
              - ^lib/xhttp/
          secret_expose:
            skip: false
            # Where Expose may be called, spelled as types.Func.FullName spells a function. The
            # header that sends the token and the store that keeps it, and nothing else.
            allow:
              - (weave/internal/forge.Credential).HeaderValue
              - (*weave/internal/forge.FileStore).Set
              - weave/internal/cli.tokenForTheWire
          handler_shape:
            skip: false
            # Unanchored regexps over the path lint was run from. The adapter's own signature is
            # the one this rule looks for.
            exclude:
              - ^internal/rpcerr/
          sentinel_kind:
            skip: false
            # Unanchored regexps over the path lint was run from. Nothing a caller reaches
            # through the RPC layer is declared in these, so their sentinels answer no status
            # code: the panel's own screens, the CLI's control flow, the diff the panel draws
            # for itself, configuration, and the pool held open before a request can arrive.
            exclude:
              - ^internal/ui/
              - ^internal/errui/
              - ^internal/cli/
              - ^internal/diff/
              - ^internal/interceptors/
              - ^config/
              - ^db/
      fussy:
        type: module
        description: Checks for this repo; forbids bare os environment access and a nil pointer returned with a nil error, asks the panel to bound the contexts it starts, keeps doc comments present and prefixed with the identifier name, and holds comments to a single sentence.
        settings:
          comment_length:
            skip: false
            # Unanchored regexps over the file path. The config struct's doc comments
            # are the text of the generated config.toml, so they are prose on purpose.
            exclude:
              - config/appconfig\.go$
          forbid_getenv:
            skip: false
          forbid_nil_nil:
            skip: false
          comment_prefix:
            skip: false
            require: true
          # Unanchored regexps over the file path. The panel talks to the service over HTTP,
          # so a call of its own that never times out is a frame that never redraws.
          context_timeout:
            skip: false
            include:
              - internal/ui/
          # Unanchored regexps over the file path, same exclusion as comment_length.
          comment_reference:
            skip: false
            exclude:
              - config/appconfig\.go$
          switch_default:
            skip: false
          params_struct:
            skip: false
            # Structs named after a concept several functions build from rather than after one
            # function, which the function-name half of the rule cannot fit.
            allow:
              - scriptEnvParams
              - workflowConfigParams
              - resumeParams
          table_test:
            skip: false
          store_verb:
            skip: false
            include:
              - internal/store/
            verbs:
              - Abandon
              - Advance
              - Append
              - Archive
              - Begin
              - Claim
              - Clear
              - Complete
              - Count
              - Create
              - Delete
              - Does
              - Ensure
              - Exists
              - Finish
              - Forget
              - Get
              - Hold
              - Is
              - List
              - Lock
              - Mark
              - Move
              - Observe
              - Open
              - Prune
              - Record
              - Release
              - Rename
              - Reset
              - Restamp
              - Restore
              - Search
              - Send
              - Set
              - Start
              - Touch
              - Unmark
              - Update
              - Upsert
              - Validate
            allow:
              - Close
              - Commit
              - Config
              - CopyFrom
              - Error
              - Exec
              - InTx
              - Query
              - QueryRow
              - Rollback
              - Unwrap
              - MarshalJSON
              - MarshalText
              - Scan
              - ServeHTTP
              - String
              - UnmarshalJSON
              - UnmarshalText
              - Value
              - Workflow
  exclusions:
    rules:
      # The rule is about tests. Everything else constructs the real client on purpose, which
      # is what a seam is for.
      - path-except: _test\.go$
        linters:
          - forbidigo
      # The integration tests: the packages whose subject is what git, tmux or the panel's own
      # binaries actually do, which is the one case a test has to drive the real thing. It is
      # the set mise/tasks/go/test runs for --kind integration. The fixture packages beside
      # them, such as internal/weavetest, hold no test of their own and so need no entry.
      - path: internal/(git|diff|scripts|e2e|tmux|cli)/
        linters:
          - forbidigo
      # A binary's package comment would be the first thing a reader of the command sees on
      # pkg.go.dev, and these three exist to be run rather than to be read about.
      - path: (^main\.go$|^cmd/|^config/gen/)
        linters:
          - staticcheck
        text: ST1000
      # The config package is where configuration is read from the environment, which is
      # the thing forbidgetenv exists to funnel through it. It cannot follow its own advice.
      - path: ^config/
        linters:
          - fussy
        text: forbidgetenv
      # A nil next-page token is the absence the proto field itself carries, and it is handed
      # straight to the response rather than acted on, so there is nothing for a sentinel to say.
      - path: ^lib/pagination/
        linters:
          - fussy
        text: forbidnilnil
      # A test asserts on the assertion it just made, so an unchecked assertion fails the
      # test on the spot rather than travelling as a wrong value the way it would in the server.
      # The same files shell out to git and tmux to build their fixtures, where the command
      # is bounded by the test binary's own life and has no request to be cancelled with.
      - path: (_test\.go|internal/(pgtest|tmuxtest|storetest|harnesstest|logtest|weavetest)/)
        linters:
          - forcetypeassert
          - noctx
      # A doctor problem is a record carrying a code and a sentence, and satisfying error is
      # how it reaches a caller rather than what it is, so ProblemError would name the interface
      # instead of the thing.
      - path: ^internal/doctor/
        linters:
          - errname
      # depguard matches a denied package by prefix, so the panel's rule against
      # weave/internal/tmux also catches weave/internal/tmuxtest, which is the fixture the
      # panel's own tests stand a real tmux server up with rather than the adapter itself.
      - path: internal/ui/
        linters:
          - depguard
        text: tmuxtest
      # Tests and the fixtures they share discard errors in t.Cleanup teardown, where a
      # failure means the throwaway server or file is already gone.
      - path: (_test\.go|internal/(pgtest|tmuxtest|storetest|harnesstest|logtest|weavetest)/)
        linters:
          - errcheck
      # A test helper takes t and the fixture before its own arguments, so the limit that
      # holds a function to four does not fit one.
      - path: _test\.go$
        linters:
          - revive
        text: argument-limit
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - weave
