syntax = "proto3";

package agent.v1;

import "buf/validate/validate.proto";
import "pagination/v1/pagination.proto";

option go_package = "weave/proto/gen/agent/v1;agentv1";

// MailKind tells an agent's own mail from a notice weave raised itself.
enum MailKind {
  // No kind was recorded, which the panel draws as a dash.
  MAIL_KIND_UNSPECIFIED = 0;
  // One agent writing to another, or the person writing to an agent.
  MAIL_KIND_PLAIN = 1;
  // Weave saying a review has moved, naming the file the comments were written to.
  MAIL_KIND_REVIEW_ACTIVITY = 2;
  // Weave telling an agent that it and one other have spent their mail limit.
  MAIL_KIND_EXCHANGE_CAPPED = 3;
}

// MailDirection is which half of an agent's correspondence a listing asks for.
enum MailDirection {
  // Unspecified is received, since that is the half an agent asks for by default.
  MAIL_DIRECTION_UNSPECIFIED = 0;
  // The mail addressed to the agent.
  MAIL_DIRECTION_RECEIVED = 1;
  // The mail the agent sent.
  MAIL_DIRECTION_SENT = 2;
}

message Mail {
  // Set this as reply_to on an answer so the two read as a thread.
  string id = 1;
  // Which agent sent it, unset when weave sent it itself.
  optional string from_agent_id = 2;
  // What to show as the sender, which is weave's own name for a notice it raised.
  string from_name = 3;
  // The agent it is waiting for.
  string to_agent_id = 4;
  // What the sender wrote.
  string body = 5;
  // The mail this one answers, unset when it opens a subject.
  optional string reply_to = 6;
  // When it was sent, in RFC 3339.
  string created_at = 7;
  // When the recipient took it, unset while it is still waiting.
  optional string claimed_at = 8;
  // When it stops being offered, whether or not it was ever taken.
  string expires_at = 9;
  // Whether an agent wrote it or weave raised it.
  MailKind kind = 10;
}

message SendMailRequest {
  // Who to send to, addressed by id since two workflows may hold agents of one name.
  string to_agent_id = 1 [(buf.validate.field).string.min_len = 1];
  // What to say, which has to carry who is asking and what is wanted.
  string body = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 10000
  }];
  // The mail being answered, so the exchange reads as a thread.
  optional string reply_to = 3 [(buf.validate.field).string.min_len = 1];
}

message SendMailResponse {
  // The mail as recorded, whose id an answer can reply to.
  Mail mail = 1;
}

message ForwardLastTurnsRequest {
  // Whose newest turns to forward.
  string from_agent_id = 1 [(buf.validate.field).string.min_len = 1];
  // Who to send them to, addressed by id since two workflows may hold agents of one name.
  string to_agent_id = 2 [(buf.validate.field).string.min_len = 1];
  // How many of the source's newest turns to forward, with the prompts between them, or unset
  // for the last one alone.
  optional int32 turns = 3 [(buf.validate.field).int32 = {
    gte: 1
    lte: 20
  }];
  // What to tell the recipient about the forward in the caller's own words, which it reads
  // before the turns.
  optional string note = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 10000
  }];
  // The most of each turn's text to forward, cut from the head so the end survives, or unset
  // for the default.
  optional int32 max_bytes = 5 [(buf.validate.field).int32.gte = 0];
}

message ForwardLastTurnsResponse {
  // The mail as recorded, whose id an answer can reply to.
  Mail mail = 1;
}

message ReadMailRequest {
  // Whose mailbox to empty, or unset for the caller's own.
  optional string id = 1 [(buf.validate.field).string.min_len = 1];
}

message ReadMailResponse {
  // Everything that was waiting, oldest first, now marked read.
  repeated Mail mail = 1;
}

message ListMailRequest {
  // Whose mail to list, or unset for the caller's own.
  optional string id = 1 [(buf.validate.field).string.min_len = 1];
  // Where to carry on from.
  optional pagination.v1.Pagination pagination = 2;
  // Which half of the correspondence to return.
  MailDirection direction = 3 [(buf.validate.field).enum.defined_only = true];
}

message ListMailResponse {
  // One page of mail, most recent first, none of it claimed by listing it.
  repeated Mail mail = 1;
  // Pass this back as the pagination cursor for the next page.
  optional string next_page_token = 2;
}

message DeleteMailRequest {
  // The mail to erase, read or not, which the recipient will then never see.
  repeated string ids = 1 [(buf.validate.field).repeated.min_items = 1];
}
