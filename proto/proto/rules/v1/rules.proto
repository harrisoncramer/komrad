edition = "2023";

package rules.v1;

import "buf/validate/validate.proto";

option go_package = "komrad/proto/gen/rules/v1;rulesv1";

extend buf.validate.StringRules {
  // Refuses the characters a shell would act on, for anything komrad passes to one.
  bool shell_safe = 50100 [(buf.validate.predefined).cel = {
    id: "string.shell_safe"
    message: "must not contain shell metacharacters"
    expression: "!rule || !this.matches('[;&|<>`$\\\\\\n]')"
  }];

  // Requires a path that means the same wherever it is read from.
  bool absolute_path = 50101 [(buf.validate.predefined).cel = {
    id: "string.absolute_path"
    message: "must be an absolute path or start with ~"
    expression: "!rule || this.startsWith('/') || this.startsWith('~')"
  }];

  // Like `absolute_path`, but allows an empty string to take the default.
  bool absolute_path_or_blank = 50102 [(buf.validate.predefined).cel = {
    id: "string.absolute_path_or_blank"
    message: "must be blank, absolute, or start with ~"
    expression: "!rule || this == '' || this.startsWith('/') || this.startsWith('~')"
  }];

  // Requires a bare file name, so a caller cannot reach outside the hooks directory.
  bool script_name = 50104 [(buf.validate.predefined).cel = {
    id: "string.script_name"
    message: "must be a file name without a slash, a leading dot or control characters"
    expression: "!rule || (this != '' && !this.contains('/') && !this.startsWith('.') && !this.matches('[[:cntrl:]]'))"
  }];

  // Like `script_name`, but allows an empty string to run no hook.
  bool script_name_or_blank = 50105 [(buf.validate.predefined).cel = {
    id: "string.script_name_or_blank"
    message: "must be blank or a file name without a slash, a leading dot or control characters"
    expression: "!rule || this == '' || (!this.contains('/') && !this.startsWith('.') && !this.matches('[[:cntrl:]]'))"
  }];

  // Requires five fields, the shape the scheduler parses.
  bool cron_expression = 50103 [(buf.validate.predefined).cel = {
    id: "string.cron_expression"
    message: "must be five whitespace-separated fields, such as '0 9 * * 1-5'"
    expression: "!rule || this.split(' ').filter(f, f != '').size() == 5"
  }];

  // Refuses control characters, for text a client shows on one line.
  bool printable = 50107 [(buf.validate.predefined).cel = {
    id: "string.printable"
    message: "must not contain control characters"
    expression: "!rule || !this.matches('[\\x00-\\x1f\\x7f]')"
  }];

  // Requires a path that stays inside the checkout.
  bool relative_path = 50106 [(buf.validate.predefined).cel = {
    id: "string.relative_path"
    message: "must be a relative path without a leading / or ~ or a .. segment"
    expression: "!rule || (this != '' && !this.startsWith('/') && !this.startsWith('~') && !this.contains(\"..\"))"
  }];
}
