syntax = "proto3";

package hook.v1;

import "annotation/v1/tool.proto";
import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "rules/v1/rules.proto";

option go_package = "weave/proto/gen/hook/v1;hookv1";

message Hook {
  string name = 1;
  bool executable = 2;
  string description = 3;
  optional google.protobuf.Duration timeout = 4;
  repeated string header_problems = 5;
}

message ListHooksResponse {
  repeated Hook hooks = 1;
}

message OpenPullRequestRequest {
  string agent_id = 1 [(buf.validate.field).string.min_len = 1];
}

service HookService {
  rpc ListHooks(google.protobuf.Empty) returns (ListHooksResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.tool) = {
      tool_name: "list_hooks"
      description: "List the hooks the user has written, which are executable files in their hooks directory. A hook is a script or program that takes one agent as its input, and a workflow names one against a moment in its agents' lives, such as pre-launch or post-resume. The name is what create_workflow and update_workflow take in a hook's script field. A file listed with executable false cannot be run until the user chmods it, and the description and timeout are what the file's own header comments declare about it."
    };
  }

  rpc OpenPullRequest(OpenPullRequestRequest) returns (google.protobuf.Empty) {
    option (annotation.v1.tool) = {
      tool_name: "open_pull_request"
      description: "Open the pull request an agent recorded for itself, in the browser of whoever is at the panel. It is the panel's own key spelled as a call, so it answers as soon as the browser has been asked and says nothing about what the browser did. An error means it never got that far: no such agent, or no pull request recorded on it."
      destructive: false
    };
  }
}
