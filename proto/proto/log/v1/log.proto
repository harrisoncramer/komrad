syntax = "proto3";

package log.v1;

import "annotation/v1/tool.proto";
import "buf/validate/validate.proto";
import "google/protobuf/struct.proto";

option go_package = "komrad/proto/gen/log/v1;logv1";

message LogLine {
  // When the line was written, in RFC 3339.
  string time = 1;
  // The severity as the log spells it, such as INFO or ERROR.
  string level = 2;
  // What the line says.
  string message = 3;
  // Everything else the line carried, keyed as the log keys it.
  google.protobuf.Struct fields = 4;
}

message GetLogLinesRequest {
  // The trace id a failed call answered with, or one list_recent_traces listed.
  string trace_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}

message GetLogLinesResponse {
  // Every line written under the trace id, in the order the log holds them.
  repeated LogLine lines = 1;
}

message TraceSummary {
  // The id every line of the trace carries.
  string trace_id = 1;
  // When the trace's first line was written, in RFC 3339.
  string started_at = 2;
  // What the trace was about: the RPC method, or the loop, when a line said.
  string what = 3;
  // How many lines the log holds under it.
  int32 lines = 4;
}

message ListRecentTracesRequest {
  // How many of the newest traces to list, twenty when unset.
  int32 limit = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
}

message ListRecentTracesResponse {
  // The traces the log ends with, oldest first.
  repeated TraceSummary traces = 1;
}

message ReadAgentLogsRequest {
  // The agents whose lines to read.
  repeated string agent_ids = 1 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 100
    items: {
      string: {min_len: 1}
    }
  }];
  // Where the last call left off. Leave it empty to read the newest lines.
  string cursor = 2;
  // The most lines to answer. 200 when unset.
  int32 limit = 3 [(buf.validate.field).int32 = {
    gte: 0
    lte: 1000
  }];
  // Which of the agent's log sources to read, as list_agent_log_sources names them. The server log when unset. A script run's source reads exactly one agent.
  string source = 4 [(buf.validate.field).string.max_len = 256];
  // A regular expression in Go syntax that a line must match to be answered. Every line when unset. The newest lines are searched within the last 64 MB of the source.
  string pattern = 5 [(buf.validate.field).string.max_len = 256];
}

message ReadAgentLogsResponse {
  // The lines about any of the agents, oldest first, exactly as the log holds them.
  repeated string lines = 1;
  // What to pass back to read only the lines written after these.
  string cursor = 2;
  // Whether the log started over since the cursor, so the lines held before are gone.
  bool reset = 3;
  // Whether more lines remain past the cursor, so reading again at once returns them.
  bool more = 4;
}

message LogSource {
  // What to pass as the source of read_agent_logs.
  string id = 1;
  // What the source is called, such as service or 003 agent.pre-launch setup.
  string name = 2;
  // The number of the script run the source holds, which the agent's failed_run_log names when that run failed. Unset for the server log.
  optional int32 run = 3;
  // The agent that recorded the script run the source holds, the one agent read_agent_logs reads it for. Empty for the server log.
  string agent_id = 4;
  // Whether the script run failed, set only on a task's log sources.
  bool failed = 5;
}

message ListAgentLogSourcesRequest {
  // The agent whose log sources to list.
  string agent_id = 1 [(buf.validate.field).string.min_len = 1];
}

message ListAgentLogSourcesResponse {
  // The server log first, then each script run the agent recorded, newest first.
  repeated LogSource sources = 1;
}

message ListTaskLogSourcesRequest {
  // The task whose log sources to list, by id.
  string task_id = 1 [(buf.validate.field).string.min_len = 1];
}

message ListTaskLogSourcesResponse {
  // Each script run recorded on the task by any agent on it, its own moments and theirs, newest first.
  repeated LogSource sources = 1;
}

// LogService reads the server's own log back, by the trace id its lines carry.
service LogService {
  rpc GetLogLines(GetLogLinesRequest) returns (GetLogLinesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "get_log_lines"
      description: "Read every log line written under one trace id, in order. A failed call answers its trace id."
      roles: [ROLE_ORCHESTRATOR]
    };
  }
  rpc ListRecentTraces(ListRecentTracesRequest) returns (ListRecentTracesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "list_recent_traces"
      description: "List the traces the server log ends with, oldest first, to find the one to read with get_log_lines."
      roles: [ROLE_ORCHESTRATOR]
    };
  }
  rpc ReadAgentLogs(ReadAgentLogsRequest) returns (ReadAgentLogsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "read_agent_logs"
      description: "Read what the server logged about one or more agents, passing the cursor back for only what is new. Pass a source from list_agent_log_sources to read a script's output."
      roles: [ROLE_ORCHESTRATOR]
    };
  }
  rpc ListAgentLogSources(ListAgentLogSourcesRequest) returns (ListAgentLogSourcesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "list_agent_log_sources"
      description: "List where an agent's logs can be read from, the server log and each script run of its own moments it recorded. Its task's moments are listed by list_task_log_sources."
      roles: [ROLE_ORCHESTRATOR]
    };
  }
  rpc ListTaskLogSources(ListTaskLogSourcesRequest) returns (ListTaskLogSourcesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "list_task_log_sources"
      description: "List the script runs recorded on a task, its own moments and those of every agent on it, newest first. Pass a source with its agent_id to read_agent_logs to read its output."
      roles: [ROLE_ORCHESTRATOR]
    };
  }
}
