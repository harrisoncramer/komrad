syntax = "proto3";

package task.v1;

import "annotation/v1/tool.proto";
import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "rules/v1/rules.proto";

option go_package = "komrad/proto/gen/task/v1;taskv1";

// Sequence is what git has part-way through a task's checkout and waiting on somebody.
enum Sequence {
  // Nothing was recorded, which no stored checkout answers with.
  SEQUENCE_UNSPECIFIED = 0;
  // Nothing is part-way through.
  SEQUENCE_NONE = 1;
  // A rebase stopped on a commit it could not replay.
  SEQUENCE_REBASE = 2;
  // An am stopped on a patch it could not apply.
  SEQUENCE_AM = 3;
  // A merge stopped on conflicts.
  SEQUENCE_MERGE = 4;
  // A cherry-pick stopped on conflicts or resting between its picks.
  SEQUENCE_CHERRY_PICK = 5;
  // A revert stopped on conflicts or resting between its picks.
  SEQUENCE_REVERT = 6;
}

// DiffStat is how many lines a checkout adds and removes, committed and uncommitted alike.
message DiffStat {
  // The lines it adds.
  int32 added = 1;
  // The lines it removes.
  int32 removed = 2;
}

// Task is one outcome a person wants, which the agents linked to it work toward.
message Task {
  // The handle every other call names this task by, alongside its slug.
  string id = 1;
  // Which workflow it is filed under, which every agent on it shares.
  string workflow_id = 2;
  // The lowercase kebab-case name it is called by, unique and never reused.
  string slug = 3;
  // What the panel shows it as.
  string title = 4;
  // What it is meant to achieve, as markdown.
  string goal = 5;
  // When it was made, in RFC 3339.
  string created_at = 6;
  // When it was last changed, in RFC 3339.
  string updated_at = 7;
  // When it was archived, unset while it is live.
  optional string archived_at = 8;
  // The directory of its checkout, which every agent on it works in, unset while it has none.
  optional string cwd = 9;
  // The git branch its checkout is on, unset while it has none or git cannot read it.
  optional string branch = 10;
  // The canonical web address of the repository its checkout pushes to, such as
  // https://github.com/harrisoncramer/komrad, unset when the checkout is gone or its origin
  // is not a forge.
  optional string repository_url = 11;
  // The commit its checkout has checked out, unset when the checkout is gone or git cannot read it.
  optional string head_sha = 12;
  // Whether its checkout has been taken away.
  bool worktree_removed = 13;
  // What git has part-way through its checkout, waiting on somebody to settle it.
  Sequence sequence = 14;
  // The snapshot of the newest review round of its agents while its checkout no longer hashes
  // to it, empty otherwise.
  string moved_since_round = 15;
  // How many lines its checkout adds and removes since it left its base, unset where there is
  // no base to measure against.
  optional DiffStat diff_stat = 16;
  // The branch its checkout was put on rather than one komrad made for it, unset when komrad
  // made it.
  optional string adopted_branch = 17;
}

message CreateTaskRequest {
  // The lowercase kebab-case name to call it by, which no other task has ever had.
  string slug = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 80
    pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
  }];
  // What to show it as in the panel.
  string title = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
    [rules.v1.printable]: true
  }];
  // What it is meant to achieve, as markdown.
  string goal = 3 [(buf.validate.field).string.max_len = 50000];
  // Which workflow to file it under. Every agent on it must be in the same one.
  string workflow_id = 4 [(buf.validate.field).string.min_len = 1];
}

message CreateTaskResponse {
  // The task as created.
  Task task = 1;
}

message GetTaskRequest {
  // Which task to read, by id or by slug.
  string task = 1 [(buf.validate.field).string.min_len = 1];
}

message GetTaskResponse {
  // The task, with its goal whole.
  Task task = 1;
}

message ListTasksRequest {
  // Which workflow's tasks to list.
  string workflow_id = 1 [(buf.validate.field).string.min_len = 1];
  // True to list the archived tasks and only those.
  bool archived = 2;
}

message ListTasksResponse {
  // The workflow's tasks, newest first.
  repeated Task tasks = 1;
}

message UpdateTaskRequest {
  // Which task to rewrite, by id or by slug.
  string task = 1 [(buf.validate.field).string.min_len = 1];
  // The lowercase kebab-case name to call it by from now on, which no other task holds,
  // left as it is when unset.
  optional string slug = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 80
    pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
  }];
  // What to show it as in the panel, left as it is when unset.
  optional string title = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
    [rules.v1.printable]: true
  }];
  // What it is meant to achieve, as markdown, left as it is when unset.
  optional string goal = 4 [(buf.validate.field).string.max_len = 50000];
}

message UpdateTaskResponse {
  // The task as rewritten.
  Task task = 1;
}

message ArchiveTaskRequest {
  // Which task to archive, by id or by slug.
  string task = 1 [(buf.validate.field).string.min_len = 1];
}

message DeleteTasksRequest {
  // The tasks to remove for good, by id or by slug, with every agent on them.
  repeated string tasks = 1 [(buf.validate.field).repeated = {
    min_items: 1
    unique: true
    items: {
      string: {min_len: 1}
    }
  }];
}

// TaskService reads and writes the tasks agents work toward.
service TaskService {
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse) {
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "create_task"
      description: "Create a task, the outcome one or more agents work toward. Pass its slug or id to create_agent as task to launch an agent onto it."
      destructive: false
      roles: [ROLE_ORCHESTRATOR]
    };
  }
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "get_task"
      description: "Fetch one task by id or slug, with its whole goal."
      roles: [
        ROLE_IMPLEMENTER,
        ROLE_REVIEWER,
        ROLE_ORCHESTRATOR
      ]
    };
  }
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "list_tasks"
      description: "List a workflow's tasks, newest first. Archived tasks are left out unless archived is set."
      roles: [
        ROLE_IMPLEMENTER,
        ROLE_REVIEWER,
        ROLE_ORCHESTRATOR
      ]
    };
  }
  rpc UpdateTask(UpdateTaskRequest) returns (UpdateTaskResponse) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "update_task"
      description: "Rewrite a task's slug, title or goal by id or slug, leaving each field you leave out as it is. A goal edit reaches agents only when they read the task again."
      destructive: false
      roles: [ROLE_ORCHESTRATOR]
    };
  }
  rpc ArchiveTask(ArchiveTaskRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "archive_task"
      description: "Archive a task by id or slug, keeping its record. Archives the live agents on it too, and its slug is never reused."
      destructive: false
      roles: [ROLE_ORCHESTRATOR]
    };
  }
  rpc DeleteTasks(DeleteTasksRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "delete_tasks"
      description: "Permanently delete tasks by id or slug, with every agent on them, their documents, reviews and worktree. Prefer archive_task, and delete only when asked."
      destructive: true
      roles: [ROLE_ORCHESTRATOR]
    };
  }
}
