syntax = "proto3";

package schedule.v1;

import "annotation/v1/tool.proto";
import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "pagination/v1/pagination.proto";
import "rules/v1/rules.proto";
import "schedule/v1/enums.proto";
import "view/v1/view.proto";

option go_package = "komrad/proto/gen/schedule/v1;schedulev1";

// ScheduleRun is one time a schedule's cron expression matched, with its state.
message ScheduleRun {
  // The run's id. A higher id is a newer run.
  int64 id = 1;
  // The time the cron expression matched for this run.
  google.protobuf.Timestamp scheduled_for = 2;
  // The run's state.
  ScheduleRunState state = 3;
  // The run's current attempt, counting from one once the run has started.
  int32 attempt = 4;
  // How many attempts the run has before it is discarded.
  int32 max_attempts = 5;
  // When the run finished. Unset while the run is waiting or running.
  optional google.protobuf.Timestamp finalized_at = 6;
  // Why the run was skipped, or the error from its last failed attempt. Empty when the run
  // completed.
  string message = 7;
}

// Schedule is a cron expression that creates a task or mails an orchestrator each time it
// matches.
message Schedule {
  // The schedule's id.
  string id = 1;
  // The schedule's name.
  string name = 2;
  // The schedule's cron expression, in five fields.
  string cron = 3;
  // The timezone the cron expression is read in. Empty uses the machine's timezone.
  string timezone = 4;
  // Whether the schedule is enabled. A disabled schedule keeps its record and never runs.
  bool enabled = 5;
  // Whether the tasks the schedule creates start hidden.
  bool hide_agents = 6;
  // The prompt each launched writer starts with, or the mail sent to the orchestrator.
  string prompt = 7;
  // The id of the workflow the schedule belongs to. For an orchestrator schedule, the
  // orchestrator's workflow.
  string workflow_id = 8;
  // Whether the schedule creates a task or mails an orchestrator.
  ScheduleKind kind = 9;
  // The id of the orchestrator the schedule mails. Set only on an orchestrator schedule.
  optional string orchestrator_agent_id = 10;
  // When the cron expression next matches. Unset while the schedule is disabled.
  optional google.protobuf.Timestamp next_run_at = 11;
  // Whether `prompt` was cut to its opening, as in a summary listing.
  bool prompt_truncated = 12;
  // The schedule's newest run. Unset when the schedule has never run or the run's record has
  // expired.
  optional ScheduleRun latest_run = 13;
  // The schedule's newest runs, newest first. Set only in `Watch` events.
  repeated ScheduleRun recent_runs = 14;
  // When the schedule was archived. Unset while the schedule is live.
  optional google.protobuf.Timestamp archived_at = 15;
}

message ListSchedulesRequest {
  // The page to read.
  optional pagination.v1.Pagination pagination = 1;
  // How much of each schedule to return.
  view.v1.View view = 2 [(buf.validate.field).enum.defined_only = true];
  // Whether to list only archived schedules instead of live ones.
  bool archived = 3;
}

message ListSchedulesResponse {
  // One page of schedules, most recently updated first.
  repeated Schedule schedules = 1;
  // The cursor for the next page. Unset on the last page.
  optional string next_page_token = 2;
}

message GetScheduleRequest {
  // The schedule to get, by id.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message GetScheduleResponse {
  // The schedule, with its prompt in full.
  Schedule schedule = 1;
}

message ListScheduleRunsRequest {
  // The schedule whose runs to list, by id.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // How many of the newest runs to return. Zero returns twenty.
  int32 limit = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
}

message ListScheduleRunsResponse {
  // The schedule's runs on record, newest first.
  repeated ScheduleRun runs = 1;
}

message CreateScheduleRequest {
  // The schedule's name, which is also the title of each task the schedule creates.
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
    [rules.v1.printable]: true
  }];
  // The schedule's cron expression, in five fields separated by spaces.
  string cron = 2 [(buf.validate.field).string = {
    min_len: 1
    [rules.v1.cron_expression]: true
  }];
  // The timezone to read the cron expression in. Empty uses the machine's timezone.
  string timezone = 3 [(buf.validate.field).string.max_len = 100];
  // Whether the schedule starts enabled.
  bool enabled = 4;
  // Whether the tasks the schedule creates start hidden. An orchestrator schedule ignores it.
  bool hide_agents = 5;
  // The prompt each launched writer starts with, or the mail sent to the orchestrator.
  string prompt = 6 [(buf.validate.field).string = {
    min_len: 1
    max_len: 50000
  }];
  // What each run does.
  oneof target {
    option (buf.validate.oneof).required = true;
    // The workflow to create a task in, by id. The writer takes the workflow's directory and
    // flags.
    string workflow_id = 7 [(buf.validate.field).string.uuid = true];
    // The orchestrator to mail the prompt to, by id.
    string orchestrator_agent_id = 8 [(buf.validate.field).string.uuid = true];
  }
}

message CreateScheduleResponse {
  // The schedule as created.
  Schedule schedule = 1;
}

message UpdateScheduleRequest {
  // The schedule to update, by id.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // The schedule's name.
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
    [rules.v1.printable]: true
  }];
  // The schedule's cron expression.
  string cron = 3 [(buf.validate.field).string = {
    min_len: 1
    [rules.v1.cron_expression]: true
  }];
  // The timezone to read the cron expression in. Empty uses the machine's timezone.
  string timezone = 4 [(buf.validate.field).string.max_len = 100];
  // Whether the schedule is enabled.
  bool enabled = 5;
  // The prompt for later runs. Agents already launched keep theirs.
  string prompt = 6 [(buf.validate.field).string = {
    min_len: 1
    max_len: 50000
  }];
  // What later runs do.
  oneof target {
    option (buf.validate.oneof).required = true;
    // The workflow to create a task in, by id.
    string workflow_id = 7 [(buf.validate.field).string.uuid = true];
    // The orchestrator to mail the prompt to, by id.
    string orchestrator_agent_id = 8 [(buf.validate.field).string.uuid = true];
  }
  // Whether tasks from later runs start hidden. Existing tasks keep theirs.
  bool hide_agents = 9;
}

message SetScheduleEnabledRequest {
  // The schedule to enable or disable, by id.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // Whether the schedule is enabled. False keeps the schedule's record and runs.
  bool enabled = 2;
}

message ArchiveScheduleRequest {
  // The schedule to archive, by id.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message RestoreScheduleRequest {
  // The archived schedule to restore, by id.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message DeleteScheduleRequest {
  // The archived schedule to delete, by id.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// ScheduleService creates and manages schedules.
service ScheduleService {
  rpc ListSchedules(ListSchedulesRequest) returns (ListSchedulesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "list_schedules"
      description: "List schedules, most recently updated first, each with its latest run. Archived schedules are left out unless `archived` is set."
      roles: [ROLE_ORCHESTRATOR]
    };
  }
  rpc GetSchedule(GetScheduleRequest) returns (GetScheduleResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "get_schedule"
      description: "Get one schedule by id, with its prompt in full."
      roles: [ROLE_ORCHESTRATOR]
    };
  }
  rpc ListScheduleRuns(ListScheduleRunsRequest) returns (ListScheduleRunsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "list_schedule_runs"
      description: "List a schedule's newest runs, newest first, each with its state and why it was skipped or failed."
      roles: [ROLE_ORCHESTRATOR]
    };
  }
  rpc CreateSchedule(CreateScheduleRequest) returns (CreateScheduleResponse) {
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "create_schedule"
      description: "Create a schedule that, each time its cron expression matches, creates a task in `workflow_id` or mails the prompt to `orchestrator_agent_id`."
      destructive: false
      roles: [ROLE_ORCHESTRATOR]
    };
  }
  rpc UpdateSchedule(UpdateScheduleRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "update_schedule"
      description: "Replace every field of a schedule. Fields left empty are written empty."
      mcp_guidance: "Read the schedule first and send back every field you are not changing."
      destructive: false
      roles: [ROLE_ORCHESTRATOR]
    };
  }
  rpc SetScheduleEnabled(SetScheduleEnabledRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "set_schedule_enabled"
      description: "Enable or disable a schedule."
      destructive: false
      roles: [ROLE_ORCHESTRATOR]
    };
  }
  rpc ArchiveSchedule(ArchiveScheduleRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "archive_schedule"
      description: "Archive a schedule, keeping its record. The schedule stops running, and the agents it launched keep running."
      destructive: false
      roles: [ROLE_ORCHESTRATOR]
    };
  }
  rpc RestoreSchedule(RestoreScheduleRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "restore_schedule"
      description: "Restore an archived schedule, enabled or disabled as it was."
      destructive: false
      roles: [ROLE_ORCHESTRATOR]
    };
  }
  rpc DeleteSchedule(DeleteScheduleRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "delete_schedule"
      description: "Delete an archived schedule for good, with its runs."
      destructive: true
      roles: [ROLE_ORCHESTRATOR]
    };
  }
}
