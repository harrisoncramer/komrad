name: Use Mise
description: Install mise tools. Caching is the job's concern, through nscloud-cache-action's mise mode.

inputs:
  gh-access-token:
    description: GitHub access token for private repository access. Configures git to authenticate against private Go modules.
    required: true

runs:
  using: composite
  steps:
    - name: Configure Private GitHub Repositories
      shell: bash
      run: git config --global url.https://"$GH_ACCESS_TOKEN"@github.com/.insteadOf https://github.com/
      env:
        GH_ACCESS_TOKEN: ${{ inputs.gh-access-token }}

    - name: Set CI-only mise overrides
      shell: bash
      # These tools are local only and do not need to be installed in CI
      # We need to persist them to the github runner so that subsequent tools also pick them up
      run: |
        echo "MISE_DISABLE_TOOLS=cargo:worktrunk,rust,kubectl,mc,aqua:junegunn/fzf,go:github.com/go-delve/delve/cmd/dlv,air,aqua:securego/gosec,aqua:aws/session-manager-plugin" >> "$GITHUB_ENV"

    - name: Install mise tools
      uses: jdx/mise-action@v4
      env:
        GOWORK: "off"
      with:
        version: 2026.6.14
        cache: false
