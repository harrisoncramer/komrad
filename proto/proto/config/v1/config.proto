syntax = "proto3";

package config.v1;

import "annotation/v1/tool.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";

option go_package = "claude-agents/proto/gen/config/v1;configv1";

message GetConfigResponse {
  // The configuration in force, keyed exactly as the user's TOML file is. It is an
  // open blob rather than a message per setting because the Config struct in
  // internal/appconfig decides the shape, and a mirror of it here would drift the
  // first time somebody added a setting without one. Nothing consumes it as a typed
  // value. It exists to tell a model how this panel is set up.
  google.protobuf.Struct config = 1;
  // Why the user's config file would not parse, unset when it did. The config above
  // is then the built-in defaults, which is also what the panel falls back to, so a
  // caller is told what is in force and separately that it is not what the user
  // wrote.
  optional string config_error = 2;
}

// ConfigService reads the user's configuration. It is the one service here with no
// store behind it, since the configuration is a file the user edits rather than
// anything the panel records.
service ConfigService {
  // The file is read on every call, so a configuration edited while the server runs
  // is picked up without a restart.
  rpc GetConfig(google.protobuf.Empty) returns (GetConfigResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.tool) = {
      tool_name: "get_config"
      description: "Read the panel's configuration as it is currently in force, keyed the same way the user's config file is. Covers the default flags every new agent inherits and the keybindings for each of the panel's screens. Anything the user left out of their file reads back as the built-in default. A configError in the response means their file would not parse, in which case the configuration returned is the defaults the panel is running on instead."
    };
  }
}
