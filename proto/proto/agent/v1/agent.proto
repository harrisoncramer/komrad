syntax = "proto3";

package agent.v1;

import "annotation/v1/tool.proto";
import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "pagination/v1/pagination.proto";
import "rules/v1/rules.proto";

option go_package = "claude-agents/proto/gen/agent/v1;agentv1";

// Agent is one background Claude agent, as stored.
message Agent {
  string id = 1;
  string name = 2;
  string cwd = 3;
  string flags = 4;
  string prompt = 5;
  string pane_id = 6;
  string state = 7;
  string claude_session_id = 8;
  // The workflow this agent belongs to. Every agent has one: the workflow holds
  // the directory, flags, and shared context it started from.
  string workflow_id = 9;
  // When the agent was first created, as an RFC 3339 timestamp, for display.
  string created_at = 10;
  // The schedule that launched this agent. Unset for one a person started, so a
  // caller can tell scheduled work from work someone asked for.
  optional string schedule_id = 12;
  // Whether the agent's tmux pane is still running. It is observed at read time
  // rather than stored, so a caller does not need tmux of its own to tell a live
  // agent from a dormant one.
  bool alive = 11;
  reserved 13;
  // The glyph the user marked this agent with, unset when it carries no mark. What
  // it means is theirs to decide, and the glyphs they cycle through are their
  // config, which get_config returns.
  optional string mark = 14;
}

message ListAgentsRequest {
  optional pagination.v1.Pagination pagination = 1;
  // Lists the soft-deleted agents instead of the live ones, which is the trash
  // the panel shows on its own screen. The two sets never mix in one listing: a
  // deleted agent is not something to act on alongside live work, and its name
  // may be one a live agent has since taken.
  bool deleted = 2;
}

message ListAgentsResponse {
  repeated Agent agents = 1;
  // The token that fetches the page after this one, unset once the listing is
  // exhausted. A caller wanting every agent keeps calling until it is absent.
  optional string next_page_token = 2;
}

// CreateAgentRequest launches a background agent. The prompt and directory are
// both required. An agent created over RPC has nobody at the keyboard, so one
// with no prompt would sit idle forever, and the tmux fallback for a blank
// directory resolves against whichever client happens to be current, which would
// let the same request start in a different repository each time it ran. A blank
// title is auto-named and blank flags mean the configured defaults alone.
message CreateAgentRequest {
  string prompt = 1 [(buf.validate.field).string = {
    min_len: 1,
    max_len: 50000
  }];
  // Control characters are refused rather than sanitised. The title becomes the
  // tmux window name and tmux rejects a name containing one, so accepting it
  // here would fail the launch instead.
  string title = 2 [
    (buf.validate.field).string.max_len = 200,
    (buf.validate.field).cel = {
      id: "title.printable",
      message: "title must not contain control characters",
      expression: "!this.matches('[\\x00-\\x1f\\x7f]')"
    }
  ];
  // Where the agent starts. Leave it empty to take the workflow's directory,
  // which is what a caller with no view of the filesystem should do. When set it
  // must be absolute or ~-prefixed, since a relative path would resolve against
  // whichever pane the server happens to be in.
  string dir = 3 [(buf.validate.field).string = {
    max_len: 4096,
    [rules.v1.absolute_path_or_blank]: true
  }];
  // Flags are quoted before they reach the pane's shell, so this rule is the
  // second lock rather than the only one. A request carrying a shell
  // metacharacter is rejected outright instead of being neutralised and run.
  string flags = 4 [(buf.validate.field).string = {
    max_len: 500,
    [rules.v1.shell_safe]: true
  }];
  // The workflow to place the agent in, and where its directory and flags come
  // from when this request leaves them empty. Required: an agent outside a
  // workflow would have no defaults to inherit and nowhere to be listed.
  string workflow_id = 5 [(buf.validate.field).string.min_len = 1];
  // A key that makes this create repeatable. A second request carrying a key an
  // agent already holds returns that agent untouched rather than starting a
  // second Claude process, which is what makes retrying a launch safe. Omit it
  // to make no such claim, which is what an interactive create does.
  optional string idempotency_key = 6 [(buf.validate.field).string = {
    min_len: 1,
    max_len: 200
  }];
}

message CreateAgentResponse {
  Agent agent = 1;
}

message GetAgentRequest {
  string name = 1 [(buf.validate.field).string = {
    min_len: 1,
    max_len: 200
  }];
}

message GetAgentResponse {
  Agent agent = 1;
}

// SetStateRequest moves an agent between lifecycle states. The set of states is
// closed. The store treats an unknown value as a state nothing renders, so a typo
// would make an agent vanish from every count rather than fail.
message SetStateRequest {
  string name = 1 [(buf.validate.field).string = {
    min_len: 1,
    max_len: 200
  }];
  string state = 2 [(buf.validate.field).string = {
    in: [
      "new",
      "thinking",
      "waiting",
      "done"
    ]
  }];
}

// SetMarkRequest marks an agent, and an unset mark clears it. It is keyed by id
// rather than name because the mark outlives a rename, and the panel already holds
// the id of the row it is looking at.
//
// The glyphs a user steps through are their config, so the set cannot be closed
// here. What is checked is that a terminal row can hold the value. An escape
// sequence or a newline would corrupt the frame it is drawn into rather than fail.
message SetMarkRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  optional string mark = 2 [(buf.validate.field).cel = {
    id: "mark.glyph"
    message: "a mark must be a short glyph carrying no whitespace or control characters"
    expression: "this.size() <= 16 && !this.matches('[[:space:]]|[[:cntrl:]]')"
  }];
}

// ArchiveAgentRequest hides an agent without destroying it. This is what the
// panel's delete key does. The agent is stopped and drops out of the listing,
// while its transcript stays searchable and it can be restored.
message ArchiveAgentRequest {
  string name = 1 [(buf.validate.field).string = {
    min_len: 1,
    max_len: 200
  }];
}

// RestoreAgentRequest brings an agent back, keyed by id rather than name. An
// archived agent's name may have been taken by a live one since, in which case
// restoring renames it.
message RestoreAgentRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message RestoreAgentResponse {
  Agent agent = 1;
}

// DeleteAgentRequest removes an agent for good, keyed by id rather than name
// for the same reason restoring is: the name index only holds among live rows,
// so a deleted agent may share its name with a live one and with other deleted
// ones. A name would not say which of them to destroy.
message DeleteAgentRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

// UpdateAgentRequest renames an agent by id. The name is what tmux and the
// store agree on, so the characters the store would rewrite are rejected here
// rather than silently changed underneath the caller.
message UpdateAgentRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  string name = 2 [
    (buf.validate.field).string = {
      min_len: 1,
      max_len: 200
    },
    (buf.validate.field).cel = {
      id: "name.storable",
      message: "name must not contain spaces, colons, dots, slashes, or control characters",
      expression: "!this.contains(' ') && !this.contains(':') && !this.contains('.') && !this.contains('/') && !this.matches('[\\x00-\\x1f\\x7f]')"
    }
  ];
}

message SearchTranscriptsRequest {
  // Three characters is the floor rather than a stylistic minimum. The index uses
  // a trigram tokenizer, so a shorter query can never match anything and would
  // come back as a confident empty result.
  string query = 1 [(buf.validate.field).string = {
    min_len: 3,
    max_len: 500
  }];
  optional pagination.v1.Pagination pagination = 2;
}

// SearchHit is one transcript matched by a search. The agent it belongs to, its
// display name and whether it is soft-deleted, a snippet of the matching text
// with the matched terms wrapped in markers, and the relevance rank.
message SearchHit {
  string agent_id = 1;
  string snippet = 2;
  // How many times the query occurs in the transcript. Results come back in
  // descending order of this, so an agent that discussed something at length
  // outranks one that mentioned it once.
  int64 occurrences = 3;
  string name = 4;
  bool deleted = 5;
}

message SearchTranscriptsResponse {
  repeated SearchHit hits = 1;
  // The token that fetches the page after this one, unset once the matches are
  // exhausted. It is tied to the query that produced it, so it is only ever sent
  // back alongside that same query.
  optional string next_page_token = 2;
}

message GetTranscriptRequest {
  string agent_id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetTranscriptResponse {
  // The full flattened transcript, empty when the agent has none synced yet.
  string content = 1;
}

// AgentService reads and mutates the agent store. Every method carries a tool
// annotation, which is what puts it on the MCP surface. A method without one is
// not reachable from a model at all.
service AgentService {
  // Reads have no side effects and are safe to cache and issue over GET.
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.tool) = {
      tool_name: "list_agents"
      description: "List the agents the panel tracks, live and dormant, with each one\'s name, state, working directory, flags, and workflow. Soft-deleted agents are excluded unless deleted is set, which lists those and only those. Returns one page, most recently updated first; pass the response\'s nextPageToken back as pagination.cursor for the next one. Start here to find the id or name another tool needs."
    };
  }
  rpc GetAgent(GetAgentRequest) returns (GetAgentResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.tool) = {
      tool_name: "get_agent"
      description: "Fetch one agent by its exact name. Names are unique among live agents. Returns not_found if no agent has that name."
    };
  }
  // CreateAgent launches a background agent and returns it as stored. It is not
  // idempotent. Each call spawns another agent, since two agents may legitimately
  // run the same prompt.
  rpc CreateAgent(CreateAgentRequest) returns (CreateAgentResponse) {
    option (annotation.v1.tool) = {
      tool_name: "create_agent"
      description: "Launch a background Claude agent with an opening prompt. Requires an absolute or ~-prefixed directory: this spawns a real agent in a real tmux window, and a relative path would resolve somewhere unpredictable. Each call spawns another agent, so do not retry a call that may have succeeded."
      destructive: false
    };
  }
  // Mutations key on the unique agent name, so repeating them yields the same
  // state. They are idempotent and safe for the client to retry.
  rpc SetState(SetStateRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.tool) = {
      tool_name: "set_agent_state"
      description: "Move an agent to one of new, thinking, waiting, or done. The reconciler derives state from the live pane every couple of seconds, so a value set here is overwritten shortly after unless the agent is dormant."
      destructive: false
    };
  }
  rpc SetMark(SetMarkRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.tool) = {
      tool_name: "set_agent_mark"
      description: "Put a mark on an agent, keyed by its id, or clear the one it carries by omitting the mark. A mark is a glyph the user reads off the row, meaning whatever they decided it means, such as needs review or dealt with. Use only the glyphs get_config returns under marks, since the panel's mark key cycles through those and can only clear anything else. What an agent is currently doing is already in its state, so do not mark that."
      destructive: false
    };
  }
  rpc ArchiveAgent(ArchiveAgentRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.tool) = {
      tool_name: "archive_agent"
      description: "Stop an agent and hide it from the panel, keeping its record and transcript. Prefer this to delete_agent: it is reversible with restore_agent, and search_transcripts still finds the conversation. Returns not_found if no agent has that name."
      destructive: false
    };
  }
  rpc RestoreAgent(RestoreAgentRequest) returns (RestoreAgentResponse) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.tool) = {
      tool_name: "restore_agent"
      description: "Bring an agent back and relaunch claude on the same conversation, keyed by id. Works on archived agents and on ones whose pane has since died. An agent that is already running is returned as it stands rather than started twice. The agent may come back under a new name if another has taken its old one."
      destructive: false
    };
  }
  rpc DeleteAgent(DeleteAgentRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.tool) = {
      tool_name: "delete_agent"
      description: "Permanently remove an agent's record, keyed by id. This is a hard delete, not the panel's soft delete: the config and the transcript go with it and search will never find the conversation again. Prefer archive_agent, and prefer leaving agents alone unless asked to remove one."
      destructive: true
    };
  }
  // UpdateAgent renames an agent by id.
  rpc UpdateAgent(UpdateAgentRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.tool) = {
      tool_name: "rename_agent"
      description: "Rename an agent, keyed by its id rather than its current name. The name is a display label the store keys on; the running tmux window keeps whatever it was called at launch. It may not contain spaces, colons, dots, slashes, or control characters."
      destructive: false
    };
  }
  // SearchTranscripts runs a full-text search over stored transcripts.
  rpc SearchTranscripts(SearchTranscriptsRequest) returns (SearchTranscriptsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.tool) = {
      tool_name: "search_transcripts"
      description: "Full-text search across every agent's conversation, including deleted ones, returning a ranked snippet per hit with the matched text marked. Substring matching, so partial words work. Returns one page, best match first; pass the response's nextPageToken back as pagination.cursor alongside the same query for the next one. Use this to answer what was discussed; use query for the SQL view of the same data."
    };
  }
  // GetTranscript returns an agent's full stored transcript by id.
  rpc GetTranscript(GetTranscriptRequest) returns (GetTranscriptResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.tool) = {
      tool_name: "get_transcript"
      description: "Fetch one agent's full transcript by agent id, not by name. Transcripts can be very large; prefer search_transcripts when looking for something specific."
    };
  }
}
