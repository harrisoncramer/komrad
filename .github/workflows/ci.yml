name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: namespace-profile-harrisoncramer

    # The store tests run against a real Postgres rather than a fake, and
    # internal/pgtest creates a database per test off the server WEAVE_DATABASE_URL
    # points at. Credentials match docker-compose so nothing else has to change.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: weave
          POSTGRES_PASSWORD: weave
          POSTGRES_DB: weave
        ports:
          - 5460:5432
        options: >-
          --health-cmd "pg_isready -U weave"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      WEAVE_DATABASE_URL: postgres://weave:weave@localhost:5460/weave?sslmode=disable

      # A warm build cache otherwise lets go test replay a package's last result
      # instead of running it, and these tests reach a real Postgres and a real
      # tmux that the cache cannot see. The compile is still cached; only the
      # decision to skip running is turned off.
      GOFLAGS: -count=1

    steps:
      - uses: actions/checkout@v4

      # The Go build cache, the module cache, and golangci-lint's own cache are
      # rebuilt from nothing on every run otherwise, about 1.6GB of it. These are
      # volumes attached to the runner rather than archives to download, and they
      # are shared across every branch of the repository, so a new branch starts
      # warm where actions/cache would miss.
      - name: Cache the Go and lint caches
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: go
          path: /home/runner/.cache/golangci-lint

      - name: Use Mise
        uses: ./.github/actions/use-mise
        with:
          gh-access-token: ${{ env.GH_ACCESS_TOKEN }}

      # go:lint builds golangci-lint from source to bundle the repo's plugin,
      # which dominates the job. The binary only changes when the plugin or its
      # pin does, so it is cached against those rather than rebuilt every run.
      - name: Cache the custom linter
        uses: actions/cache@v4
        with:
          path: local/custom-gcl
          key: custom-gcl-${{ runner.os }}-${{ hashFiles('.custom-gcl.yml') }}

      - name: Check
        run: mise run check --kind unit

      # The integration tests are compiled out of a unit run, so this is what
      # says they still build when a branch has not run them.
      - name: Build the integration tests
        run: go vet -tags integration ./...
