syntax = "proto3";

package workflow.v1;

import "annotation/v1/tool.proto";
import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "pagination/v1/pagination.proto";
import "rules/v1/rules.proto";

option go_package = "weave/proto/gen/workflow/v1;workflowv1";

message Workflow {
  string id = 1;
  string name = 2;
  string context = 3;
  string cwd = 4;
  string flags = 5;
  string harness = 6;
  string provision_action = 7;
  string deprovision_action = 8;
  optional string archived_at = 9;
  WorktreeConfig worktree = 10;
  bool archive_on_pr_closed = 11;
}

message WorktreeConfig {
  bool enabled = 1;
  string base_branch = 2 [(buf.validate.field).string = {
    max_len: 255
    [rules.v1.shell_safe]: true
  }];
  repeated string copy_paths = 3 [(buf.validate.field).repeated = {
    max_items: 50
    items: {
      string: {
        max_len: 255
        [rules.v1.relative_path]: true
      }
    }
  }];
  repeated string symlink_paths = 4 [(buf.validate.field).repeated = {
    max_items: 50
    items: {
      string: {
        max_len: 255
        [rules.v1.relative_path]: true
      }
    }
  }];
  repeated string diff_exclude = 5 [(buf.validate.field).repeated = {
    max_items: 50
    items: {
      string: {
        min_len: 1
        max_len: 255
        [rules.v1.relative_path]: true
      }
    }
  }];
}

message ListWorkflowsRequest {
  optional pagination.v1.Pagination pagination = 1;
  bool archived = 2;
}

message ListWorkflowsResponse {
  repeated Workflow workflows = 1;
  optional string next_page_token = 2;
}

message GetWorkflowRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetWorkflowResponse {
  Workflow workflow = 1;
}

message CreateWorkflowRequest {
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  string context = 2 [(buf.validate.field).string.max_len = 50000];
  string cwd = 3 [(buf.validate.field).string = {
    max_len: 4096
    [rules.v1.absolute_path_or_blank]: true
  }];
  string flags = 4 [(buf.validate.field).string = {
    max_len: 500
    [rules.v1.shell_safe]: true
  }];
  string harness = 5 [(buf.validate.field).string = {
    max_len: 40
    pattern: "^[a-z0-9-]*$"
  }];
  string provision_action = 6 [(buf.validate.field).string = {
    max_len: 255
    [rules.v1.action_name_or_blank]: true
  }];
  string deprovision_action = 7 [(buf.validate.field).string = {
    max_len: 255
    [rules.v1.action_name_or_blank]: true
  }];
  WorktreeConfig worktree = 8;
  bool archive_on_pr_closed = 9;
}

message CreateWorkflowResponse {
  Workflow workflow = 1;
}

message UpdateWorkflowRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  string context = 3 [(buf.validate.field).string.max_len = 50000];
  string cwd = 4 [(buf.validate.field).string = {
    max_len: 4096
    [rules.v1.absolute_path_or_blank]: true
  }];
  string flags = 5 [(buf.validate.field).string = {
    max_len: 500
    [rules.v1.shell_safe]: true
  }];
  string harness = 6 [(buf.validate.field).string = {
    max_len: 40
    pattern: "^[a-z0-9-]*$"
  }];
  string provision_action = 7 [(buf.validate.field).string = {
    max_len: 255
    [rules.v1.action_name_or_blank]: true
  }];
  string deprovision_action = 8 [(buf.validate.field).string = {
    max_len: 255
    [rules.v1.action_name_or_blank]: true
  }];
  WorktreeConfig worktree = 9;
  bool archive_on_pr_closed = 10;
}

message ArchiveWorkflowRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message RestoreWorkflowRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message RestoreWorkflowResponse {
  Workflow workflow = 1;
}

message DeleteWorkflowRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

service WorkflowService {
  rpc ListWorkflows(ListWorkflowsRequest) returns (ListWorkflowsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.tool) = {
      tool_name: "list_workflows"
      description: "List the workflows agents are grouped into, in alphabetical order, with each one\x27s shared context, the working directory and flags its agents start from, and the action run before its agents start and the one run after they are deleted. Archived workflows are excluded unless archived is set, which lists those and only those. Returns one page; pass the response\x27s nextPageToken back as pagination.cursor for the next."
    };
  }
  rpc GetWorkflow(GetWorkflowRequest) returns (GetWorkflowResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.tool) = {
      tool_name: "get_workflow"
      description: "Fetch one workflow by id. Returns not_found if no workflow has that id."
    };
  }
  rpc CreateWorkflow(CreateWorkflowRequest) returns (CreateWorkflowResponse) {
    option (annotation.v1.tool) = {
      tool_name: "create_workflow"
      description: "Create a workflow to group agents under. Nothing runs as a result; this is organisation. The cwd and flags become the defaults prefilled when an agent is created inside it, and the context is appended to those agents' system prompts. provisionAction names the action from list_actions that owns where each of its agents runs: it goes before the agent starts, it names the directory, and a failure abandons the launch. deprovisionAction names the half that gives that directory back once one of its agents is deleted, and is read only while provisionAction is set. Leave provisionAction blank for agents that keep the directory they are given, which retires both halves. worktree.enabled provisions every agent a git worktree off cwd instead: weave names both halves itself, so provisionAction must be blank when it is set. worktree.diffExclude drops paths from the diff the panel shows for those agents, as relative paths or globs such as proto/gen or *.pb.go, and is read fresh every time a diff is drawn rather than snapshotted at launch. archiveOnPrClosed archives an agent once the pull request weave recorded for it merges or closes, checked every couple of minutes and only once that agent is idle or dormant, so nothing is taken out from under one mid-turn; the record, the transcript, and the worktree all survive, and restore_agents puts it back for good, since restoring an agent settles the pull request it carries and no later pass archives it for that one again. It works with or without a worktree, since the pull request it follows is only believed while it names the repository the workflow points at and the branch the agent's own checkout is on."
      destructive: false
    };
  }
  rpc UpdateWorkflow(UpdateWorkflowRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.tool) = {
      tool_name: "update_workflow"
      description: "Replace a workflow's name, context, directory, flags, and the provisioner that owns its agents' directories. Every field is written, so read the workflow first and send back the ones you are not changing. Editing the context or provisionAction reaches only agents spawned afterwards, since existing agents took a snapshot at launch; editing deprovisionAction reaches agents already running, since it is read when it fires. worktree.enabled is the same decision spelled the other way: weave names both halves itself, so provisionAction must be blank when it is set, and turning it off clears both halves if they still name the generated scripts. worktree.diffExclude drops paths from the diff the panel shows for those agents, as relative paths or globs such as proto/gen or *.pb.go, and is read fresh every time a diff is drawn rather than snapshotted at launch. archiveOnPrClosed archives an agent once the pull request weave recorded for it merges or closes, checked every couple of minutes and only once that agent is idle or dormant, so nothing is taken out from under one mid-turn; the record, the transcript, and the worktree all survive, and restore_agents puts it back for good, since restoring an agent settles the pull request it carries and no later pass archives it for that one again. It works with or without a worktree, since the pull request it follows is only believed while it names the repository the workflow points at and the branch the agent's own checkout is on."
      destructive: false
    };
  }
  rpc ArchiveWorkflow(ArchiveWorkflowRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.tool) = {
      tool_name: "archive_workflow"
      description: "Hide a workflow from the panel, archiving the agents inside it. Nothing is destroyed: the agents stay findable through search_transcripts and no transcript goes with them. Refused while any schedule still launches into the workflow, since those would have nowhere to run."
      destructive: false
    };
  }
  rpc RestoreWorkflow(RestoreWorkflowRequest) returns (RestoreWorkflowResponse) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.tool) = {
      tool_name: "restore_workflow"
      description: "Take a workflow out of the archive, keyed by id, along with every agent archived inside it. The agents come back as dormant rows, so call resume_agent on the ones whose conversations you want in a pane. Returns not_found if the workflow is not archived. It is refused whole rather than in part, either because its agents would not fit under the number the panel is configured to hold, or because live agents have taken their names, which the error lists for you to rename."
      destructive: false
    };
  }
  rpc DeleteWorkflow(DeleteWorkflowRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.tool) = {
      tool_name: "delete_workflow"
      description: "Permanently delete an archived workflow along with whatever archived agents are still inside it, reusing the same deprovision-action handling a direct agent delete uses. The archived schedules that launched into it go too, since nothing else ever removes them and they would keep the workflow alive. Returns not_found if the workflow does not exist or is not archived, and failed_precondition if a schedule inside it was moved from another workflow whose agents still hold it. An agent whose deprovision action is still running, or whose deprovision failed, is left behind rather than blocking the call, so the workflow can stay archived and be tried again."
      destructive: true
    };
  }
}
