syntax = "proto3";

package terminal.v1;

import "annotation/v1/tool.proto";
import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";

option go_package = "komrad/proto/gen/terminal/v1;terminalv1";

// Size is a terminal's size in character cells.
message Size {
  // How many rows of cells.
  uint32 rows = 1 [(buf.validate.field).uint32 = {
    gt: 0
    lte: 65535
  }];
  // How many columns of cells.
  uint32 cols = 2 [(buf.validate.field).uint32 = {
    gt: 0
    lte: 65535
  }];
}

// OpenShell opens a shell stream.
message OpenShell {
  // The absolute directory the shell starts in, inside a live agent's checkout.
  string dir = 1 [(buf.validate.field).string.min_len = 1];
  // The terminal's starting size.
  Size size = 2 [(buf.validate.field).required = true];
  // The terminal type the shell is given. Empty for `xterm-256color`.
  string term = 3;
}

// ShellRequest is one message from the client on a shell stream.
message ShellRequest {
  // The message.
  oneof message {
    option (buf.validate.oneof).required = true;

    // The opening, sent first and only once.
    OpenShell open = 1;
    // Bytes typed into the terminal.
    bytes input = 2;
    // The terminal's new size.
    Size resize = 3;
    // A new ID token for the caller, which keeps the stream open past the first token's expiry.
    string token = 4;
  }
}

// Exit is how the program on a terminal ended.
message Exit {
  // The exit status, or 128 plus the signal number when a signal ended the program.
  int32 code = 1;
}

// ShellResponse is one message from komrad on a shell stream.
message ShellResponse {
  // The message.
  oneof message {
    // Sent once when the shell starts, before any output.
    google.protobuf.Empty ready = 1;
    // Bytes the terminal printed.
    bytes output = 2;
    // Sent when the shell ends, as the last message.
    Exit exit = 3;
  }
}

// OpenAttach opens an attach stream.
message OpenAttach {
  // The agent to attach to, by id. The agent must be live with a pane.
  string agent_id = 1 [(buf.validate.field).string.min_len = 1];
  // The terminal's starting size.
  Size size = 2 [(buf.validate.field).required = true];
  // The terminal type tmux is given. Empty for `xterm-256color`.
  string term = 3;
}

// AttachRequest is one message from the client on an attach stream.
message AttachRequest {
  // The message.
  oneof message {
    option (buf.validate.oneof).required = true;

    // The opening, sent first and only once.
    OpenAttach open = 1;
    // Bytes typed into the terminal.
    bytes input = 2;
    // The terminal's new size.
    Size resize = 3;
    // A new ID token for the caller, which keeps the stream open past the first token's expiry.
    string token = 4;
  }
}

// AttachResponse is one message from komrad on an attach stream.
message AttachResponse {
  // The message.
  oneof message {
    // Sent once when the attach starts, before any output.
    google.protobuf.Empty ready = 1;
    // Bytes the terminal printed.
    bytes output = 2;
    // Sent when the attach ends, as the last message.
    Exit exit = 3;
  }
}

// SSHRequest is one message from the client on an SSH stream. A message with nothing set keeps the
// stream open while the connection is quiet.
message SSHRequest {
  // The message.
  oneof message {
    // Bytes the SSH client sent.
    bytes data = 1;
    // A new ID token for the caller, which keeps the stream open past the first token's expiry.
    string token = 2;
  }
}

// SSHResponse is one message from komrad on an SSH stream.
message SSHResponse {
  // Bytes the SSH server sent.
  bytes data = 1;
}

message GetSSHHostKeyResponse {
  // The public half of the key the SSH server proves itself with, as one `known_hosts` key: its
  // type, a space, and the key in base64.
  string public_key = 1;
}

// TerminalService serves terminals on komrad's machine to a remote client.
service TerminalService {
  // Shell runs a shell on komrad's machine and streams its input and output until the shell
  // exits or the client disconnects.
  rpc Shell(stream ShellRequest) returns (stream ShellResponse) {
    option (annotation.v1.surfaces) = {
      cli: false
      mcp: false
      reason: "A terminal the person types into, which `komrad shell` opens."
    };
  }

  // Attach streams the input and output of an agent's pane until the attach ends or the client
  // disconnects.
  rpc Attach(stream AttachRequest) returns (stream AttachResponse) {
    option (annotation.v1.surfaces) = {
      cli: false
      mcp: false
      reason: "A terminal the person types into, which `komrad terminal` opens."
    };
  }

  // SSH carries one SSH connection to a server on komrad's machine, until either side closes it.
  // The server runs commands, shells and file transfers as the account the agents run as, and
  // forwards to ports and sockets there. It takes no password or key, since the stream is already
  // signed in.
  rpc SSH(stream SSHRequest) returns (stream SSHResponse) {
    option (annotation.v1.surfaces) = {
      cli: false
      mcp: false
      reason: "An SSH connection, which `komrad ssh-proxy` carries for `ssh`."
    };
  }

  // GetSSHHostKey returns the public key of the SSH server that `SSH` reaches, so a client can trust
  // it before connecting.
  rpc GetSSHHostKey(google.protobuf.Empty) returns (GetSSHHostKeyResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: false
      mcp: false
      reason: "A key `komrad login` writes to a known hosts file."
    };
  }
}
