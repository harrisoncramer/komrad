# claude-agents configuration (github.com/harrisoncramer/tmux-claude-agents).
#
# Every value below is the tool's built-in default, spelled out. Copy this file
# to ~/.config/claude-agents/config.toml and change what you like; anything you
# delete falls back to the same default shown here.

# Flags appended to `claude` for every new agent.
claude_flags = ""

# Panel keybindings. Each action is a list of bubbletea key strings, such as
# "enter", "esc", "ctrl+d", "up". Scrolling is shared across every menu via the
# `nav` section below; the per-menu sections cover only that menu's own actions.

# Navigation, shared by every menu so scrolling is the same everywhere. `up` and
# `down` move the cursor; `preview_up` and `preview_down` scroll the agents
# preview. These avoid letter keys so they work in the search text field too.
[keybindings.nav]
up           = ["up", "ctrl+p"]
down         = ["down", "ctrl+n"]
preview_up   = ["ctrl+u"]
preview_down = ["ctrl+d"]

# The picker list. `back` quits at the root and steps out of a workflow scope.
# `new`, `agents`, `workflows`, and `search` jump straight to a section from
# anywhere in the list.
[keybindings.list]
quit      = ["ctrl+c", "q"]
back      = ["esc", "left", "h"]
select    = ["enter"]
new       = ["n"]
agents     = ["c"]
workflows = ["w"]
search    = ["/"]

# The search screen.
[keybindings.search]
quit = ["ctrl+c"]
back = ["esc"]
open = ["enter"]

# The split agents view. `move` reassigns the agent to a workflow, and `workflow`
# jumps into the workflow the hovered agent belongs to. `info` swaps the hovered
# agent's stored record into the preview in place of the agent itself.
[keybindings.agents]
quit     = ["ctrl+c", "q"]
back     = ["esc", "left", "h"]
open     = ["enter", "l", "right"]
info     = ["i"]
rename   = ["r"]
delete   = ["d"]
move     = ["m"]
workflow = ["w"]

# The workflow picker. It mirrors the agents view: `open` scopes into a workflow,
# and `new`, `rename`, and `delete` manage them.
[keybindings.workflows]
quit   = ["ctrl+c", "q"]
back   = ["esc", "left", "h"]
open   = ["enter", "l", "right"]
new    = ["n"]
rename = ["r"]
delete = ["d"]

# The new-agent, rename, and workflow forms. `back` and `quit` both abort the form.
[keybindings.form]
quit = ["ctrl+c"]
back = ["esc"]
