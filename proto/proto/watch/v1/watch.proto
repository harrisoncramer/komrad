syntax = "proto3";

package watch.v1;

import "agent/v1/agent.proto";
import "agent/v1/mail.proto";
import "annotation/v1/tool.proto";
import "pullrequest/v1/pullrequest.proto";
import "schedule/v1/schedule.proto";
import "workflow/v1/workflow.proto";

option go_package = "weave/proto/gen/watch/v1;watchv1";

// WatchRequest opens the stream, and asks for nothing in particular.
message WatchRequest {}

// WatchEvent is the snapshot a stream opens with, one row as the panel should now hold it, a
// tombstone for one it should drop, or a heartbeat.
message WatchEvent {
  // What moved.
  oneof event {
    // Every row the watched sets hold, sent once as the stream opens.
    Snapshot snapshot = 1;
    // One row as the panel should now hold it.
    Row put = 2;
    // A row its watched set no longer holds.
    Deleted deleted = 3;
    // Nothing has changed for a while, and the stream is still alive.
    Heartbeat heartbeat = 4;
  }
}

// Snapshot is every watched set whole, each in the order its list RPC answers.
message Snapshot {
  // Every row, one resource after another.
  repeated Row rows = 1;
}

// Row is one row of a resource table, rendered the way its list RPC renders it.
message Row {
  // Which resource the row is.
  oneof row {
    // An agent as ListAgents renders it.
    agent.v1.Agent agent = 1;
    // A workflow as ListWorkflows renders it.
    workflow.v1.Workflow workflow = 2;
    // A schedule as ListSchedules renders it.
    schedule.v1.Schedule schedule = 3;
    // A mark as ListMarks renders it.
    agent.v1.Mark mark = 4;
    // A piece of mail as ListMail renders it.
    agent.v1.Mail mail = 5;
    // A pull request as ListPullRequests renders it.
    pullrequest.v1.PullRequest pull_request = 6;
  }
}

// Resource is which table a row is of, one value per message carrying the resource option.
enum Resource {
  // No resource was set, which the service never sends.
  RESOURCE_UNSPECIFIED = 0;
  // A row of agents.
  RESOURCE_AGENT = 1;
  // A row of workflows.
  RESOURCE_WORKFLOW = 2;
  // A row of schedules.
  RESOURCE_SCHEDULE = 3;
  // A row of marks.
  RESOURCE_MARK = 4;
  // A row of mail.
  RESOURCE_MAIL = 5;
  // A row of pull_requests.
  RESOURCE_PULL_REQUEST = 6;
}

// Deleted names a row its watched set no longer holds, whether it was removed, archived or
// claimed for a delete.
message Deleted {
  // Which resource the row was of.
  Resource resource = 1;
  // The key of the row.
  string key = 2;
}

// Heartbeat says the stream is alive while nothing has changed.
message Heartbeat {}

// WatchService streams every change to the rows the panel draws.
service WatchService {
  // Watch sends a snapshot of every agent, workflow and schedule the live listings hold, then
  // one event per change for as long as the stream is open, with a heartbeat when nothing has
  // changed for a while.
  rpc Watch(WatchRequest) returns (stream WatchEvent) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: false
      mcp: false
      reason: "a stream the panel holds open; a model or a script lists instead"
    };
  }
}
