syntax = "proto3";

package loop.v1;

import "annotation/v1/tool.proto";
import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "loop/v1/enums.proto";

option go_package = "komrad/proto/gen/loop/v1;loopv1";

message WakeLoopRequest {
  // The loop to wake.
  Loop loop = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

// LoopService wakes komrad's background loops.
service LoopService {
  // WakeLoop runs a loop before its next tick, but no sooner than its minimum interval allows.
  rpc WakeLoop(WakeLoopRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.surfaces) = {
      cli: false
      mcp: false
      reason: "A client wakes a loop when the person looks at what the loop reads."
    };
  }
}
