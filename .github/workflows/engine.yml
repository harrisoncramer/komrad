name: engine

# Puts a build on the remote engine. Two ways in, and they want different things.
#
# A release calls this workflow once it has published, which is the ordinary path and the reason
# merging and shipping are no longer the same act. A dispatch deploys main or a release tag,
# which is the escape hatch: it needs no AWS credentials on your own machine, so it works when the
# laptop is the broken thing. The checks run on that path and not on the release path, where the
# commit has already passed them twice.
#
# CI reaches the engine through Systems Manager.
on:
  workflow_dispatch:
    inputs:
      run_checks:
        description: Run the full suite before touching the engine
        type: boolean
        default: true
  workflow_call:
    inputs:
      run_checks:
        type: boolean
        default: true
      version:
        description: What the deployed binary should report, blank for the usual engine stamp
        type: string
        default: ""

# One machine, so one deploy at a time. The group is a literal because github.workflow
# resolves to the caller here, which would split the two entry points into separate groups.
concurrency:
  group: engine
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  id-token: write

jobs:
  ci:
    if: inputs.run_checks
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # A skipped check is not a failed one, so this runs when the suite passed or did not run.
  deploy:
    needs: ci
    if: ${{ !failure() && !cancelled() && vars.AWS_CI_ROLE != '' }}
    runs-on: namespace-profile-harrisoncramer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Mise
        uses: ./.github/actions/use-mise

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      # The backend is not in the repository, because it names an account's own bucket.
      - name: Point Terraform at the state
        run: |
          cat >infra/engine/backend.hcl <<EOF
          bucket       = "${{ vars.TF_STATE_BUCKET }}"
          key          = "${{ vars.TF_STATE_KEY }}"
          region       = "${{ vars.AWS_REGION }}"
          encrypt      = true
          use_lockfile = true
          EOF

      # The lock is read as written, never rewritten.
      - name: Read the state
        run: mise run infra:engine:init -- -lockfile=readonly

      - name: Put this build on the engine
        env:
          KOMRAD_VERSION: ${{ inputs.version }}
        run: mise run remote:deploy
