name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: namespace-profile-harrisoncramer

    # The store tests run against a real Postgres rather than a fake, and
    # internal/pgtest creates a database per test off the server WEAVE_DATABASE_URL
    # points at. Credentials match docker-compose so nothing else has to change.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: weave
          POSTGRES_PASSWORD: weave
          POSTGRES_DB: weave
        ports:
          - 5460:5432
        options: >-
          --health-cmd "pg_isready -U weave"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      WEAVE_DATABASE_URL: postgres://weave:weave@localhost:5460/weave?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - name: Use Mise
        uses: ./.github/actions/use-mise
        with:
          gh-access-token: ${{ env.GH_ACCESS_TOKEN }}

      # The agents reconciler drives a real tmux server instead of a fake, and
      # those tests skip themselves when tmux is missing rather than failing, so
      # without this they would quietly not run. less is what the panel pages a
      # dormant agent's placeholder into a pane with, and a runner missing it
      # fails those tests rather than skipping them.
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux less

      # go:lint builds golangci-lint from source to bundle the repo's plugin,
      # which dominates the job. The binary only changes when the plugin or its
      # pin does, so it is cached against those rather than rebuilt every run.
      - name: Cache the custom linter
        uses: actions/cache@v4
        with:
          path: local/custom-gcl
          key: custom-gcl-${{ runner.os }}-${{ hashFiles('.custom-gcl.yml', 'tools/agentslinter/**') }}

      - name: Check
        run: mise run check
