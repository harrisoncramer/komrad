# claude-agents configuration.
# Copy to ~/.config/claude-agents/config.toml (or pass --config <path>).

# Default flags appended to `claude` for every new session.
claude_flags = "--model opus"

# Panel keybindings, scoped to the panel each binding acts in. Every action is a
# list of bubbletea key strings; any action left out keeps its default (the
# values shown below).

# The picker list. `back` also quits. `new`, `chats`, and `search` jump straight
# to a section from anywhere in the list.
[keybindings.list]
# quit   = ["ctrl+c", "q"]
# back   = ["esc", "left", "h"]
# up     = ["up", "k"]
# down   = ["down", "j"]
# select = ["enter"]
# new    = ["n"]
# chats  = ["c"]
# search = ["/"]

# The search screen. The query is a live text field, so navigation avoids letter
# keys, which are typed into it.
[keybindings.search]
# quit = ["ctrl+c"]
# back = ["esc"]
# up   = ["up", "ctrl+p"]
# down = ["down", "ctrl+n"]
# open = ["enter"]

# The split chats view.
[keybindings.chats]
# quit         = ["ctrl+c", "q"]
# back         = ["esc", "left", "h"]
# up           = ["up", "k"]
# down         = ["down", "j"]
# open         = ["enter", "l", "right"]
# rename       = ["r"]
# delete       = ["d"]
# preview_down = ["ctrl+d"]
# preview_up   = ["ctrl+u"]

# The new-chat and rename forms. `back` and `quit` both abort the form.
[keybindings.form]
# quit = ["ctrl+c"]
# back = ["esc"]
