name: engine hours

# Puts the engine down overnight and brings it back in the morning.
#
# The box bills by the hour whether or not anybody is using it, and it is used for a fraction of
# the day, so this stops it at 10pm and starts it at 7am. Stopping keeps the instance rather than
# replacing it, so the data volume, the database and the Elastic IP all follow it and the panel
# reaches the same address afterwards with no change to its configuration.
#
# GitHub's cron is UTC and does not follow daylight saving, so each end of the day is scheduled
# twice, once at the hour that is right in EDT and once at the hour that is right in EST, and the
# job asks what time it actually is in New York before doing anything. Exactly one of the pair
# matches on any given day.
#
# Nothing here runs until ENGINE_HOURS is set to "on" as a repository variable. The crons fire
# regardless, because a workflow cannot declare one conditionally, and the jobs decline.
on:
  schedule:
    - cron: "0 2 * * *"
    - cron: "0 3 * * *"
    - cron: "0 11 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: Stop the engine or start it
        required: true
        type: choice
        options: [stop, start]

concurrency:
  group: engine
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  hours:
    if: vars.AWS_CI_ROLE != '' && (github.event_name == 'workflow_dispatch' || vars.ENGINE_HOURS == 'on')
    runs-on: namespace-profile-harrisoncramer
    steps:
      - uses: actions/checkout@v4

      # A scheduled run can be delayed by GitHub, so the hour is what decides, not the minute.
      - name: Work out what this run is for
        id: what
        env:
          DISPATCHED: ${{ inputs.action }}
        run: |
          if [ -n "$DISPATCHED" ]; then
            echo "action=$DISPATCHED" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          HOUR="$(TZ=America/New_York date +%H)"

          case "$HOUR" in
          22) echo "action=stop" >>"$GITHUB_OUTPUT" ;;
          07) echo "action=start" >>"$GITHUB_OUTPUT" ;;
          *)
            echo "action=" >>"$GITHUB_OUTPUT"
            echo "It is $HOUR:00 in New York, which is neither end of the day, so nothing is done." \
              >>"$GITHUB_STEP_SUMMARY"
            ;;
          esac

      - name: Use Mise
        if: steps.what.outputs.action != ''
        uses: ./.github/actions/use-mise
        with:
          gh-access-token: ${{ env.GH_ACCESS_TOKEN }}

      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.what.outputs.action != ''
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      # The backend is not in the repository, because it names an account's own bucket.
      - name: Point Terraform at the state
        if: steps.what.outputs.action != ''
        run: |
          cat >infra/terraform/backend.hcl <<EOF
          bucket       = "${{ vars.TF_STATE_BUCKET }}"
          key          = "${{ vars.TF_STATE_KEY }}"
          region       = "${{ vars.AWS_REGION }}"
          encrypt      = true
          use_lockfile = true
          EOF

      # The lock is read as written, never rewritten.
      - name: Read the state
        if: steps.what.outputs.action != ''
        run: mise run terraform:init -- -lockfile=readonly

      # Nobody is at the panel at 10pm to answer a question, so an agent that is part way through a
      # turn keeps the box up for the night rather than losing that turn to save an hour's billing.
      - name: Stop the engine
        if: steps.what.outputs.action == 'stop'
        run: mise run remote:stop --yes --if-idle | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Start the engine
        if: steps.what.outputs.action == 'start'
        run: mise run remote:start
