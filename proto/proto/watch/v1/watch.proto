syntax = "proto3";

package watch.v1;

import "agent/v1/agent.proto";
import "agent/v1/mail.proto";
import "agent/v1/review.proto";
import "annotation/v1/tool.proto";
import "google/protobuf/empty.proto";
import "pullrequest/v1/pullrequest.proto";
import "schedule/v1/schedule.proto";
import "workflow/v1/workflow.proto";
import "worktree/v1/worktree.proto";

option go_package = "komrad/proto/gen/watch/v1;watchv1";

// WatchEvent is the snapshot a stream opens with, the changes one pass found, or a heartbeat.
message WatchEvent {
  // What moved.
  oneof event {
    // Every row the watched sets hold, sent once as the stream opens.
    Snapshot snapshot = 1;
    // Every row one pass over the database found moved.
    Changes changes = 2;
    // Nothing has changed for a while, and the stream is still alive.
    google.protobuf.Empty heartbeat = 3;
  }
}

// Snapshot is every watched set.
message Snapshot {
  // Every row in the snapshot.
  repeated Row rows = 1;
}

// Changes is what one pass over the database found moved.
message Changes {
  // The rows as the panel should now hold them.
  repeated Row puts = 1;
  // The rows their watched sets no longer hold, whether the panel held them or not.
  repeated Deleted deleted = 2;
}

// Row is one row of a resource table, rendered the way its list RPC renders it.
message Row {
  // Which resource the row is.
  oneof row {
    // An agent as ListAgents renders it.
    agent.v1.Agent agent = 1;
    // A workflow as ListWorkflows renders it.
    workflow.v1.Workflow workflow = 2;
    // A schedule as ListSchedules renders it.
    schedule.v1.Schedule schedule = 3;
    // A mark as ListMarks renders it.
    agent.v1.Mark mark = 4;
    // A piece of mail as ListMail renders it.
    agent.v1.Mail mail = 5;
    // A pull request as ListPullRequests renders it.
    pullrequest.v1.PullRequest pull_request = 6;
    // A repository and whether its pull requests have been read.
    pullrequest.v1.Repository repository = 7;
    // A review of an agent's work, without its body.
    agent.v1.WatchedReview review = 8;
    // A review thread with its messages.
    agent.v1.ReviewThread review_thread = 9;
    // A worktree as the filesystem holds it.
    worktree.v1.WatchedWorktree worktree = 10;
  }
}

// Resource is which table a row is of, one value per member of Row.
enum Resource {
  // No resource was set, which the service never sends.
  RESOURCE_UNSPECIFIED = 0;
  // A row of agents.
  RESOURCE_AGENT = 1;
  // A row of workflows.
  RESOURCE_WORKFLOW = 2;
  // A row of schedules.
  RESOURCE_SCHEDULE = 3;
  // A row of marks.
  RESOURCE_MARK = 4;
  // A row of mail.
  RESOURCE_MAIL = 5;
  // A row of pull_requests.
  RESOURCE_PULL_REQUEST = 6;
  // A row of pull_request_syncs.
  RESOURCE_REPOSITORY = 7;
  // A row of reviews.
  RESOURCE_REVIEW = 8;
  // A row of review_threads.
  RESOURCE_REVIEW_THREAD = 9;
  // A row of worktrees.
  RESOURCE_WORKTREE = 10;
}

// Deleted names a row its watched set no longer holds, whether it was removed or claimed for a
// delete.
message Deleted {
  // Which resource the row was of.
  Resource resource = 1;
  // The key of the row.
  string key = 2;
}

// WatchService streams every change to the rows the panel draws.
service WatchService {
  // Watch sends a snapshot of every row the watched sets hold, then one event per change for
  // as long as the stream is open, with a heartbeat when nothing has changed for a while.
  rpc Watch(google.protobuf.Empty) returns (stream WatchEvent) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: false
      mcp: false
      reason: "a stream the panel holds open; a model or a script lists instead"
    };
  }
}
