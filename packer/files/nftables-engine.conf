#!/usr/sbin/nft -f

flush ruleset

table inet filter {
	set control_plane {
		type ipv4_addr
	}

	chain input {
		type filter hook input priority filter; policy accept;
		tcp dport 8788 ip saddr != @control_plane drop
	}

	chain output {
		type filter hook output priority filter; policy accept;
		meta skuid != 0 ip daddr 169.254.169.254 reject
	}
}

include "/etc/komrad/nftables/control-plane.nft"
