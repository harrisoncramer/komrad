syntax = "proto3";

package agent.v1;

import "buf/validate/validate.proto";

option go_package = "weave/proto/gen/agent/v1;agentv1";

// ReviewAuthorKind is who wrote a review message.
enum ReviewAuthorKind {
  // No author was recorded.
  REVIEW_AUTHOR_KIND_UNSPECIFIED = 0;
  // The person running weave.
  REVIEW_AUTHOR_KIND_HUMAN = 1;
  // The agent whose work is being read, or the reviewer reading it.
  REVIEW_AUTHOR_KIND_AGENT = 2;
}

// ReviewDeliveryState is how far one of the person's comments has got towards the agent reading
// it. It is no stored field: it is read off the comment's own sent stamp and the newest doorbell
// raised against it, since the stamp outlives mail the agent deletes or lets expire. Whether the
// comment has been answered is a different question, read off the messages of the thread.
enum ReviewDeliveryState {
  // Delivery says nothing about this message, which is the case for anything the agent wrote,
  // since nobody is waiting to be told about it.
  REVIEW_DELIVERY_STATE_UNSPECIFIED = 0;
  // Written down and not yet let go of.
  REVIEW_DELIVERY_STATE_UNSENT = 1;
  // Released, with a doorbell still waiting to be claimed.
  REVIEW_DELIVERY_STATE_SENT = 2;
  // Released, and the agent has claimed the doorbell.
  REVIEW_DELIVERY_STATE_DELIVERED = 3;
}

// ReviewVerdict is what an author concluded about a round, which is what tells the agent
// whether it is done rather than leaving it to read that out of the prose.
enum ReviewVerdict {
  // Nothing has been concluded, which is what an unreleased review carries.
  REVIEW_VERDICT_UNSPECIFIED = 0;
  // This round is good as it stands.
  REVIEW_VERDICT_APPROVED = 1;
  // The agent should keep working.
  REVIEW_VERDICT_CHANGES_REQUESTED = 2;
  // Notes without a conclusion either way.
  REVIEW_VERDICT_COMMENTED = 3;
}

// ReviewRound is one immutable snapshot of what an agent has written, which is what a review is
// given against. Nothing a comment is pinned to can move underneath the person reading it,
// because the snapshot is a commit rather than the worktree.
message ReviewRound {
  // The handle a review or a viewed-file record names this round by.
  string id = 1;
  // Whose work the snapshot was taken of.
  string agent_id = 2;
  // Which round this is for its agent, counting from one.
  int32 ordinal = 3;
  // The commit the agent's branch left its base at when the round was taken.
  string base_sha = 4;
  // The commit the whole worktree was written out as, tracked and untracked alike.
  string snapshot_sha = 5;
  // When the snapshot was taken, in RFC 3339.
  string created_at = 6;
}

// Review is one author's batch of comments against one round, private while it is written and
// released as a whole, the way a pending review on a forge is.
message Review {
  // The handle the threads in this batch name it by.
  string id = 1;
  // Whose work is being read.
  string agent_id = 2;
  // The snapshot the batch was written against.
  string round_id = 3;
  // Which round that is, counting from one, so a caller need not fetch the round to say.
  int32 round_ordinal = 4;
  // Whether a person or an agent wrote it.
  ReviewAuthorKind author_kind = 5;
  // The agent giving the review, absent when the person reviewing is.
  optional string author_agent_id = 6;
  // What the author concluded, unspecified while the review is still open.
  ReviewVerdict verdict = 7;
  // When the review was let go of, empty while nothing in it has reached the agent.
  string released_at = 8;
  // The absolute path the released review was written to.
  string path = 9;
  // When the agent claimed the mail that told it the review was waiting.
  string delivered_at = 10;
  // When the batch was opened, which is the first comment written into it.
  string created_at = 11;
  // When anything in it last moved.
  string updated_at = 12;
  // What the author said about the work as a whole rather than about any one line, empty when
  // they said nothing.
  string body = 13;
  // How many of this review's comments nobody has settled. A released review with none left is
  // finished, which the verdict does not say, since a verdict is what its author concluded at
  // the time rather than what has happened since.
  int32 open_threads = 14;
}

// ReviewThread is one conversation pinned to a place in a round of an agent's diff.
message ReviewThread {
  // The handle a reply or a resolve names this thread by.
  string id = 1;
  // Whose diff the thread is pinned to.
  string agent_id = 2;
  // The batch this thread was opened as part of.
  string review_id = 15;
  // The round the thread is anchored to, which never moves.
  string round_id = 16;
  // Which round that is, counting from one.
  int32 round_ordinal = 17;
  // The commit the old side of these line numbers was read against, which is the round's own
  // base unless the diff was narrowed to an earlier round when the thread was written.
  string base_sha = 19;
  // Which file, relative to the checkout.
  string file_path = 3;
  // Where the range begins on the old side of the diff, counting from one.
  int32 old_start = 4;
  // Where it ends on the old side, inclusive.
  int32 old_end = 5;
  // Where the range begins on the new side.
  int32 new_start = 6;
  // Where it ends on the new side, inclusive.
  int32 new_end = 7;
  // The diff lines the thread was written against, each keeping its leading marker.
  repeated string quoted_lines = 8;
  // When the person reviewing settled this thread, empty while it is still owed an answer.
  // Whether a thread is settled is a different question from whether the code under it has
  // moved, and it is this one that decides whether the thread is still asking for something.
  string resolved_at = 9;
  // Whether the agent has replied since the person reviewing last looked.
  bool unread_by_human = 11;
  // Everything said in the thread, oldest first.
  repeated ReviewMessage messages = 12;
  // When the thread was opened.
  string created_at = 13;
  // When anything in it last moved.
  string updated_at = 14;
}

// ReviewMessage is one thing said in a review thread.
message ReviewMessage {
  // The handle an edit of this message names it by.
  string id = 1;
  // Which conversation it belongs to.
  string thread_id = 2;
  // Whether a person or an agent wrote it.
  ReviewAuthorKind author_kind = 3;
  // The agent that wrote it, absent for the person reviewing and cleared if that agent is
  // deleted. author_kind, not this, is what says who wrote it.
  optional string author_agent_id = 4;
  // What the author wrote.
  string body = 5;
  // Replacement lines the author proposes for the thread's range, empty for an ordinary
  // comment. An agent applies these rather than reasoning about them.
  repeated string suggestion = 11;
  // When it was written.
  string created_at = 6;
  // When it was last edited.
  string updated_at = 7;
  // How far this comment has got towards the agent reading it.
  ReviewDeliveryState delivery = 8;
  // When the person reviewing released this comment, empty while it is only written down.
  string sent_at = 9;
  // When the agent claimed the doorbell raised for this comment, empty until it has.
  string delivered_at = 10;
}

message ListReviewThreadsRequest {
  // The agent whose diff is being reviewed. An agent reading its own threads may leave this
  // unset, since the call already carries which agent is asking.
  optional string agent_id = 1 [(buf.validate.field).string.min_len = 1];
}

message ListReviewThreadsResponse {
  // The threads on that diff and what has been said in each. An agent reading a review is shown
  // only the comments the person has let go of, and none of the panel's record of when each was
  // released, so that a review is read once it is a review rather than as it is being written.
  repeated ReviewThread threads = 1;
}

message CreateReviewThreadRequest {
  // Whose diff to pin the comment to.
  string agent_id = 1 [(buf.validate.field).string.min_len = 1];
  // Which file, relative to the checkout.
  string file_path = 2 [(buf.validate.field).string.min_len = 1];
  // The commit the old side of these line numbers was read against, empty for the round's own
  // base.
  string base_sha = 10;
  // The commit the new side of these line numbers was read against, empty for a caller that read
  // the round's own snapshot.
  string snapshot_sha = 11;
  // Where the range begins on the old side of the diff, counting from one.
  int32 old_start = 3;
  // Where it ends on the old side, inclusive.
  int32 old_end = 4;
  // Where the range begins on the new side.
  int32 new_start = 5;
  // Where it ends on the new side, inclusive.
  int32 new_end = 6;
  // The diff lines being written about, each keeping its leading marker, so the anchor still
  // says something once the code moves.
  repeated string quoted_lines = 7;
  // The first thing said. The ceiling refuses an essay and is not a length to write up to.
  string body = 8 [(buf.validate.field).string = {
    min_len: 1
    max_len: 1000
  }];
  // Replacement lines proposed for the range, empty for an ordinary comment.
  repeated string suggestion = 9;
}

message CreateReviewThreadResponse {
  // The thread as opened, private until the batch is released.
  ReviewThread thread = 1;
}

message AddReviewMessageRequest {
  // Which conversation to say it in.
  string thread_id = 1 [(buf.validate.field).string.min_len = 1];
  // What to say. The ceiling refuses an essay and is not a length to write up to.
  string body = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 1000
  }];
  // Replacement lines proposed for the thread's range, empty for an ordinary message.
  repeated string suggestion = 3;
}

message AddReviewMessageResponse {
  // The message as recorded.
  ReviewMessage message = 1;
}

message EditReviewMessageRequest {
  // Which message to rewrite.
  string id = 1 [(buf.validate.field).string.min_len = 1];
  // What it should say instead, under the same ceiling the message was written to.
  string body = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 1000
  }];
  // Replacement lines proposed for the thread's range, empty for an ordinary message.
  repeated string suggestion = 3;
}

message EditReviewMessageResponse {
  // The message as it now reads.
  ReviewMessage message = 1;
}

message MarkReviewThreadReadRequest {
  // Which thread the caller has caught up on.
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message MarkReviewThreadReadResponse {
  // The thread as it now stands, no longer unread by the caller.
  ReviewThread thread = 1;
}

message SetReviewThreadResolvedRequest {
  // Which thread to settle or reopen.
  string id = 1 [(buf.validate.field).string.min_len = 1];
  // Whether the thread is settled. Unsetting it reopens the thread, which is what a person
  // does when the answer was not the end of it.
  bool resolved = 2;
}

message SetReviewThreadResolvedResponse {
  // The thread as it now stands.
  ReviewThread thread = 1;
}

// OpenReviewRoundRequest freezes what an agent has written now and records it as its next
// round. A tree that has not moved since the last round is that round again rather than a new
// one, so opening the diff twice does not walk the ordinal on.
message OpenReviewRoundRequest {
  // Whose worktree to freeze.
  string agent_id = 1 [(buf.validate.field).string.min_len = 1];
}

message OpenReviewRoundResponse {
  // The round to review against, which is the last one again if nothing has moved.
  ReviewRound round = 1;
}

message ListReviewRoundsRequest {
  // Whose rounds to read.
  string agent_id = 1 [(buf.validate.field).string.min_len = 1];
}

message ListReviewRoundsResponse {
  // Every round taken of that agent, oldest first.
  repeated ReviewRound rounds = 1;
}

message ListReviewsRequest {
  // Whose reviews to read.
  string agent_id = 1 [(buf.validate.field).string.min_len = 1];
}

message ListReviewsResponse {
  // Every review given on that agent, in the order their rounds were taken.
  repeated Review reviews = 1;
}

// ReleaseReviewRequest lets go of the author's open batch. Weave writes the whole review out as
// one file beside the agent's work and sends one piece of ordinary mail saying where it is, so
// nothing here decides when the agent is interrupted or typed at: that is mail's own affair.
message ReleaseReviewRequest {
  // Whose work the batch was written against.
  string agent_id = 1 [(buf.validate.field).string.min_len = 1];
  // What the review concludes, which is what tells the agent whether it is done.
  ReviewVerdict verdict = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // Stop the agent where it stands before telling it, so it reads now rather than at the end
  // of whatever it is doing.
  bool interrupt = 3;
  // What to say about the work as a whole rather than about any one line, which goes at the
  // head of the file the agent reads. Optional: a review of pinned comments alone is complete.
  string body = 4 [(buf.validate.field).string.max_len = 1500];
}

message ReleaseReviewResponse {
  // The review as released, carrying its verdict.
  Review review = 1;
  // How many comments the released batch carried.
  int32 comments = 2;
  // The absolute path the review was written to.
  string path = 3;
}

// ReviewViewedFile is one file of an agent's diff the person reviewing has marked as read,
// together with the fingerprint the diff had when they read it.
message ReviewViewedFile {
  // Which agent the file belongs to.
  string agent_id = 1;
  // Which file, relative to the checkout.
  string file_path = 2;
  // When it was marked, in RFC 3339.
  string viewed_at = 3;
  // A hash of the file's diff content as it stood when marked. The panel recomputes this on
  // every load and shows the file as unread once the two disagree.
  string fingerprint = 4;
}

message SetReviewFileViewedRequest {
  // Which agent the mark belongs to.
  string agent_id = 1 [(buf.validate.field).string.min_len = 1];
  // Which file, relative to the checkout.
  string file_path = 2 [(buf.validate.field).string.min_len = 1];
  // Whether the file has been read. Unsetting it drops the mark, which is what the toggle does
  // on its way back.
  bool viewed = 3;
  // The fingerprint of the file's diff content at the time it was marked.
  string fingerprint = 4;
}

message SetReviewFileViewedResponse {
  // The mark as it now stands, absent when the file was unmarked.
  ReviewViewedFile viewed = 1;
}

message ListReviewViewedFilesRequest {
  // Which agent's marks to read.
  string agent_id = 1 [(buf.validate.field).string.min_len = 1];
}

message ListReviewViewedFilesResponse {
  // Every file marked read for that agent.
  repeated ReviewViewedFile viewed = 1;
}
