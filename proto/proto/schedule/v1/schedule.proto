syntax = "proto3";

package schedule.v1;

import "annotation/v1/tool.proto";
import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "pagination/v1/pagination.proto";

option go_package = "claude-agents/proto/gen/schedule/v1;schedulev1";

// Schedule is a recurring agent launch. The record is a blueprint holding the
// prompt to run, where to run it, and how often. Each firing produces an agent
// that records the schedule it came from, so a schedule points at no agent itself.
message Schedule {
  string id = 1;
  string name = 2;
  // A standard five-field cron expression, as written.
  string cron = 3;
  // The IANA zone the expression is read in, empty for the machine's local
  // zone.
  string timezone = 4;
  // False pauses the schedule. It keeps its record and stops firing.
  bool enabled = 5;
  string prompt = 6;
  // The workflow launched agents are filed under, unset to leave them at the
  // root.
  optional string workflow_id = 7;
  string cwd = 8;
  string flags = 9;
  // When this schedule next fires, derived from the cron expression rather than
  // stored. Unset when the schedule is paused, since a paused one has no next
  // run.
  optional google.protobuf.Timestamp next_run_at = 10;
}

message ListSchedulesRequest {
  optional pagination.v1.Pagination pagination = 1;
}

message ListSchedulesResponse {
  repeated Schedule schedules = 1;
  // The token that fetches the page after this one, unset once the listing is
  // exhausted.
  optional string next_page_token = 2;
}

message GetScheduleRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetScheduleResponse {
  Schedule schedule = 1;
}

// CreateScheduleRequest describes a recurring launch. The prompt and the cron
// expression are what make it a schedule, and everything else shapes the agents
// it produces.
message CreateScheduleRequest {
  string name = 1 [(buf.validate.field).string = {
    min_len: 1,
    max_len: 200
  }];
  // Five whitespace-separated fields. The shape is checked here and the
  // expression is parsed by the service, which rejects one that is well-shaped
  // but meaningless.
  string cron = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "cron.five_fields",
      message: "cron must be five whitespace-separated fields, such as '0 9 * * 1-5'",
      expression: "this.split(' ').filter(f, f != '').size() == 5"
    }
  ];
  // An IANA zone such as America/New_York, or blank for the machine's local
  // zone. A zone rather than an offset, so a 9am schedule stays at 9am across a
  // daylight saving change.
  string timezone = 3 [(buf.validate.field).string.max_len = 100];
  // Leave false to create the schedule paused, which is how a draft is written
  // before it is trusted to run.
  bool enabled = 4;
  // What each launched agent is asked to do. Required, since a schedule that
  // launches an agent with nothing to do is never what the caller meant.
  string prompt = 5 [(buf.validate.field).string = {
    min_len: 1,
    max_len: 50000
  }];
  // The workflow launched agents are filed under. Omit to leave them at the root.
  // An empty string names a workflow that cannot exist.
  optional string workflow_id = 6 [(buf.validate.field).string.min_len = 1];
  // Where the launched agent starts. Required and absolute or ~-prefixed, the
  // same rule creating an agent follows, since nothing interactive is present
  // at launch to fall back to a current directory.
  string cwd = 7 [
    (buf.validate.field).string = {
      min_len: 1,
      max_len: 4096
    },
    (buf.validate.field).cel = {
      id: "cwd.absolute",
      message: "cwd must be absolute or start with ~",
      expression: "this.startsWith('/') || this.startsWith('~')"
    }
  ];
  string flags = 8 [
    (buf.validate.field).string.max_len = 500,
    (buf.validate.field).cel = {
      id: "flags.no_shell_metacharacters",
      message: "flags must not contain shell metacharacters",
      expression: "!this.matches('[;&|<>`$\\\\\\n]')"
    }
  ];
}

message CreateScheduleResponse {
  Schedule schedule = 1;
}

// UpdateScheduleRequest replaces a schedule's editable fields. Every field is
// sent, so an omitted one reads as cleared rather than unchanged. Fetch the
// schedule, change what you mean to, and send it back.
message UpdateScheduleRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  string name = 2 [(buf.validate.field).string = {
    min_len: 1,
    max_len: 200
  }];
  string cron = 3 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).cel = {
      id: "cron.five_fields",
      message: "cron must be five whitespace-separated fields, such as '0 9 * * 1-5'",
      expression: "this.split(' ').filter(f, f != '').size() == 5"
    }
  ];
  string timezone = 4 [(buf.validate.field).string.max_len = 100];
  bool enabled = 5;
  string prompt = 6 [(buf.validate.field).string = {
    min_len: 1,
    max_len: 50000
  }];
  optional string workflow_id = 7 [(buf.validate.field).string.min_len = 1];
  string cwd = 8 [
    (buf.validate.field).string = {
      min_len: 1,
      max_len: 4096
    },
    (buf.validate.field).cel = {
      id: "cwd.absolute",
      message: "cwd must be absolute or start with ~",
      expression: "this.startsWith('/') || this.startsWith('~')"
    }
  ];
  string flags = 9 [
    (buf.validate.field).string.max_len = 500,
    (buf.validate.field).cel = {
      id: "flags.no_shell_metacharacters",
      message: "flags must not contain shell metacharacters",
      expression: "!this.matches('[;&|<>`$\\\\\\n]')"
    }
  ];
}

// SetScheduleEnabledRequest pauses or resumes one schedule, the single edit the
// panel makes with one keystroke.
message SetScheduleEnabledRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  bool enabled = 2;
}

message DeleteScheduleRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

// ScheduleService manages recurring agent launches. Every method carries a tool
// annotation, which is what puts it on the MCP surface.
service ScheduleService {
  rpc ListSchedules(ListSchedulesRequest) returns (ListSchedulesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.tool) = {
      tool_name: "list_schedules"
      description: "List the recurring agent launches, most recently updated first, with each one's cron expression, prompt, and next run time. Returns one page; pass the response's nextPageToken back as pagination.cursor for the next."
    };
  }
  rpc GetSchedule(GetScheduleRequest) returns (GetScheduleResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.tool) = {
      tool_name: "get_schedule"
      description: "Fetch one schedule by id. Returns not_found if no schedule has that id."
    };
  }
  rpc CreateSchedule(CreateScheduleRequest) returns (CreateScheduleResponse) {
    option (annotation.v1.tool) = {
      tool_name: "create_schedule"
      description: "Create a recurring agent launch. Nothing runs at create time; the agent is spawned when the cron expression next matches, and again on every match after that. Create it with enabled false to write it down without arming it."
      destructive: false
    };
  }
  rpc UpdateSchedule(UpdateScheduleRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.tool) = {
      tool_name: "update_schedule"
      description: "Replace a schedule's name, cron expression, timezone, prompt, workflow, directory, and flags. Every field is written, so read the schedule first and send back the ones you are not changing. Agents already launched are untouched."
      destructive: false
    };
  }
  rpc SetScheduleEnabled(SetScheduleEnabledRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.tool) = {
      tool_name: "set_schedule_enabled"
      description: "Pause or resume one schedule without editing anything else. A paused schedule keeps its record and its history and stops firing."
      destructive: false
    };
  }
  rpc DeleteSchedule(DeleteScheduleRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.tool) = {
      tool_name: "delete_schedule"
      description: "Remove a schedule so it stops firing. The agents it already launched are left alone and keep running, and they still record the schedule that made them."
      destructive: true
    };
  }
}
