# Local development database. The app itself is not containerised: it runs on
# the host because it drives tmux. Only Postgres is in Docker.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: weave
      POSTGRES_PASSWORD: weave
      POSTGRES_DB: weave
    ports:
      - "${DB_PORT:-5460}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "weave"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - weave-db:/var/lib/postgresql

  # The machines weave doctor is written for, each the same image at a different stage of
  # having been set up. They are the only way to see the first-run experience, since the
  # machine this is developed on has every dependency already.
  #
  # They sit behind a profile so they are not started by docker:up, and they are run rather
  # than brought up: each one runs the binary once and exits. Drive them with
  # `mise run doctor:sandbox <stage>`, which builds the binary they mount first.
  doctor-bare:
    profiles: ["doctor"]
    build: &doctor-sandbox-build
      context: docker
      dockerfile: doctor-sandbox.Dockerfile
      target: bare
    volumes: &doctor-sandbox-volumes
      - ./bin/weave-linux:/usr/local/bin/weave:ro

  doctor-tmux-old:
    profiles: ["doctor"]
    build:
      <<: *doctor-sandbox-build
      target: tmux-old
    volumes: *doctor-sandbox-volumes

  doctor-tmux:
    profiles: ["doctor"]
    build:
      <<: *doctor-sandbox-build
      target: tmux
    volumes: *doctor-sandbox-volumes

volumes:
  weave-db:
