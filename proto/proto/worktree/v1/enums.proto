// The worktree.v1 enums, in Edition 2026 so that each value's JSON name is its lowercase word.
// event/v1/event.proto says why Edition 2026 needs release candidates.
edition = "2026";

package worktree.v1;

import option "google/protobuf/json_enumvalue_options.proto";

option go_package = "komrad/proto/gen/worktree/v1;worktreev1";

// WorktreeFate is what removes a worktree directory.
export enum WorktreeFate {
  // No value was recorded. No worktree has this value.
  WORKTREE_FATE_UNSPECIFIED = 0;
  // No task owns the directory. `remove_unowned_worktrees` removes it.
  WORKTREE_FATE_UNOWNED = 1 [(pb.enumvalue.json).string = "unowned"];
  // The directory's task is archived. Deleting the task removes it.
  WORKTREE_FATE_ARCHIVED = 2 [(pb.enumvalue.json).string = "archived"];
  // The directory's task is live. Nothing removes it.
  WORKTREE_FATE_LIVE = 3 [(pb.enumvalue.json).string = "live"];
  // The directory's task is being deleted, which removes the directory.
  WORKTREE_FATE_DELETING = 4 [(pb.enumvalue.json).string = "deleting"];
}

// RefusalReason is why komrad kept a worktree it was asked to remove.
export enum RefusalReason {
  // No reason was recorded. No refusal has this value.
  REFUSAL_REASON_UNSPECIFIED = 0;
  // The path is not under the worktree directories.
  REFUSAL_REASON_OUTSIDE = 1 [(pb.enumvalue.json).string = "outside"];
  // The listing of the worktree directories does not hold the path.
  REFUSAL_REASON_UNLISTED = 2 [(pb.enumvalue.json).string = "unlisted"];
  // The task `task_slug` names owns the worktree. Deleting the task removes it.
  REFUSAL_REASON_TASK_HOLDS = 3 [(pb.enumvalue.json).string = "task_holds"];
  // The task `task_slug` names is live. Archiving it comes before deleting its worktree.
  REFUSAL_REASON_TASK_LIVE = 4 [(pb.enumvalue.json).string = "task_live"];
  // The task `task_slug` names is being deleted, which removes the worktree.
  REFUSAL_REASON_TASK_DELETING = 5 [(pb.enumvalue.json).string = "task_deleting"];
  // The agent `agent_name` names is working in the worktree.
  REFUSAL_REASON_AGENT_INSIDE = 6 [(pb.enumvalue.json).string = "agent_inside"];
  // The agent `agent_name` names is working somewhere under the worktree.
  REFUSAL_REASON_AGENT_BENEATH = 7 [(pb.enumvalue.json).string = "agent_beneath"];
  // The worktree `nested_dir` names sits inside this one. Removing that worktree comes first.
  REFUSAL_REASON_NESTS_WORKTREE = 8 [(pb.enumvalue.json).string = "nests_worktree"];
  // Komrad could not resolve the path. `error` says why.
  REFUSAL_REASON_UNRESOLVED = 9 [(pb.enumvalue.json).string = "unresolved"];
  // Git could not list the worktrees of the worktree's repository. `error` says why.
  REFUSAL_REASON_LIST_FAILED = 10 [(pb.enumvalue.json).string = "list_failed"];
  // Git could not unlock the worktree. `error` says why.
  REFUSAL_REASON_UNLOCK_FAILED = 11 [(pb.enumvalue.json).string = "unlock_failed"];
  // Komrad could not remove the worktree's directory. `error` says why.
  REFUSAL_REASON_REMOVE_FAILED = 12 [(pb.enumvalue.json).string = "remove_failed"];
}
