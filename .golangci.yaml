version: "2"
run:
  build-tags:
    - integration
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
linters:
  enable:
    - bodyclose
    - komradlint
    - unparam
    - exhaustive
    - fussy
    - depguard
    - importas
    - copyloopvar
    - errorlint
    - fatcontext
    - forcetypeassert
    - nilerr
    - nilnil
    - gocritic
    - iface
    - inamedparam
    - noctx
    - testifylint
    - sloglint
    - usetesting
    - errname
    - forbidigo
    - godot
    - predeclared
    - misspell
    - dupword
    - whitespace
    - wastedassign
    - unconvert
    - mirror
    - makezero
    - tparallel
    - intrange
    - nlreturn
    - revive
    - thelper
    - nolintlint
    - usestdlibvars
    - gocheckcompilerdirectives
    - dogsled
    - godox
    - asasalint
    - asciicheck
    - bidichk
    - durationcheck
    - spancheck
    - errchkjson
    - musttag
    - reassign
    - nakedret
    - exptostd
    - nilnesserr
    - containedctx
    - decorder
  settings:
    errcheck:
      check-blank: true
      check-type-assertions: true
      exclude-functions:
        - (github.com/jackc/pgx/v5.Tx).Rollback
        - (*github.com/jackc/pgx/v5.Conn).Close
        - (*komrad/internal/store.Pool).Close
        - (*os.File).Close
        - (io.Closer).Close
        - os.UserHomeDir
    staticcheck:
      checks:
        - all
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^git\.NewClient$
          msg: a unit test takes the git seam and hands over a fake
        - pattern: ^git\.Run$
          msg: a unit test does not run git itself
        - pattern: ^exec\.Command(Context)?$
          msg: a unit test does not shell out to git
        - pattern: ^(fmt\.Print(|f|ln)|print|println)$
          msg: log through internal/logging
        - pattern: ^log\.(Print|Fatal|Panic)(|f|ln)$
          msg: log through internal/logging
        - pattern: ^proto\.(String|Bool|Int32|Int64|Uint32|Uint64|Float32|Float64)$
          msg: take a pointer with xptr.Ptr
        - pattern: ^sort\.
          msg: sort with slices
        - pattern: ^os\.Rename$
          msg: write a file in place with xfile.WriteAtomic
        - pattern: ^time\.Sleep$
          msg: sleep with clock.Sleep so the wait ends with its context
        - pattern: ^context\.(Background|TODO)$
          msg: take the caller's context
        - pattern: ^slog\.Default$
          msg: log on logging.From(ctx) or a logger handed in
        - pattern: ^pgx\.ErrNoRows$
          msg: ask db.IsNoRows whether Postgres found nothing
        - pattern: ^connect\.NewError$
          msg: answer through rpcerr
        - pattern: ^os\.Exit$
          msg: return the error and let main exit
    depguard:
      rules:
        presentation:
          files:
            - "**/internal/ui/paint/**"
          deny:
            - pkg: komrad/internal/store
              desc: the drawing primitives hold no domain, so nothing here reads a record
            - pkg: komrad/db
              desc: the drawing primitives hold no domain, so nothing here reads a record
            - pkg: komrad/proto
              desc: the drawing primitives hold no domain, so nothing here reads a record
            - pkg: komrad/internal/ui
              desc: paint is under the panel rather than beside it, so it never reaches back up
        panel:
          files:
            - "**/internal/ui/**"
          deny:
            - pkg: komrad/internal/tmux$
              desc: the panel takes what it needs of tmux as a dependency, so the option names stay in the adapter
            - pkg: komrad/internal/git$
              desc: the panel takes what it reads of git as a dependency or over the API, never running git itself
            - pkg: komrad/internal/harness
              desc: which CLI an agent runs is the service's business, and reaches the panel as data
            - pkg: komrad/internal/scripts
              desc: the panel lists and fires scripts over the API rather than reading the directory
            - pkg: komrad/internal/agents
              desc: the panel is a client of the service, not a caller of it in process
            - pkg: komrad/db
              desc: the panel holds no database connection
            - pkg: komrad/internal/store
              desc: the panel knows nothing the service has not told it, so a record reaches it as a proto and is kept in its own shape
            - pkg: komrad/internal/rpc/
              desc: a handler's helpers convert between the store and the wire, and the panel has no store to convert from
        transport:
          files:
            - "!$test"
            - "**/internal/rpc/**"
            - "**/internal/mcp/**"
          deny:
            - pkg: komrad/internal/tmux
              desc: a handler translates and nothing more, so what tmux can do reaches it through the service
            - pkg: komrad/internal/harness
              desc: same reason, and the service restates the refusals a handler maps on
            - pkg: komrad/internal/scripts
              desc: same reason, with agents.Script naming a script for a handler that has to describe one
            - pkg: komrad/db
              desc: a handler holds no database connection
        domain:
          files:
            - "**/internal/agents/**"
            - "**/internal/checkouts/**"
            - "**/internal/documents/**"
            - "**/internal/mail/**"
            - "**/internal/pullrequests/**"
            - "**/internal/reviews/**"
            - "**/internal/schedules/**"
            - "**/internal/scriptrun/**"
            - "**/internal/tasks/**"
            - "**/internal/transcripts/**"
            - "**/internal/worktrees/**"
          deny:
            - pkg: komrad/proto/gen
              desc: the service decides in its own types, and rendering them onto the wire is the handler's job
            - pkg: connectrpc.com/connect
              desc: the service returns a sentinel, and rpcerr picks the code it answers with
        peers-of-agents:
          files:
            - "!$test"
            - "**/internal/checkouts/**"
            - "**/internal/documents/**"
            - "**/internal/mail/**"
            - "**/internal/pullrequests/**"
            - "**/internal/reviews/**"
            - "**/internal/schedules/**"
            - "**/internal/scriptrun/**"
            - "**/internal/tasks/**"
            - "**/internal/transcripts/**"
            - "**/internal/worktrees/**"
          deny:
            - pkg: komrad/internal/agents$
              desc: the other domain services sit beside the lifecycle and below it, so the lifecycle calls them and its sentinels reach them through agenterr
        agenterr:
          files:
            - "**/internal/agenterr/**"
          list-mode: lax
          allow:
            - komrad/internal/fail
          deny:
            - pkg: komrad/internal
              desc: agenterr is imported by every domain package and so may depend on nothing but fail
        doctor:
          files:
            - "**/internal/doctor/**"
          deny:
            - pkg: komrad/internal/view
              desc: doctor reads the glyph table from glyph, so it never pulls in the list's renderer
            - pkg: komrad/internal/ui/paint$
              desc: same reason as view
        stores:
          files:
            - "**/internal/store/**"
          list-mode: lax
          allow:
            - komrad/proto/gen/watch/v1
          deny:
            - pkg: komrad/internal/agents
              desc: a store holds no rules, so nothing above it belongs here
            - pkg: komrad/internal/tmux
              desc: a store writes rows, and what is true of tmux reaches it as an argument
            - pkg: komrad/internal/harness
              desc: same reason as tmux
            - pkg: komrad/internal/ui
              desc: nothing below the panel may depend on it
            - pkg: komrad/proto/gen
              desc: a row is the store's own struct, and two layers above it decide what the wire sees
            - pkg: connectrpc.com/connect
              desc: same reason as the wire types
        adapters:
          files:
            - "**/internal/tmux/**"
            - "**/internal/harness/**"
            - "**/internal/scripts/**"
          deny:
            - pkg: komrad/internal/store
              desc: an adapter is a seam in front of something komrad does not own, and knows nothing of rows
            - pkg: komrad/internal/agents
              desc: the service calls the adapter rather than the other way round
            - pkg: komrad/internal/ui
              desc: same reason
            - pkg: komrad/proto/gen
              desc: what tmux or a CLI can do is komrad's own vocabulary, not the wire's
            - pkg: connectrpc.com/connect
              desc: same reason as the wire types
        handler-tests:
          files:
            - "**/internal/rpc/**/*_test.go"
          deny:
            - pkg: komrad/internal/storetest
              desc: a handler takes its service as an interface, so its test hands in a fake service and covers only what the handler adds
            - pkg: komrad/internal/pgtest
              desc: same reason as storetest
        generated-queries:
          files:
            - "**/*.go"
            - "!**/internal/store/**"
            - "!**/db/**"
          deny:
            - pkg: komrad/db/models
              desc: the generated queries are the store's to call, so a caller goes through the domain store
        config:
          files:
            - "**/config/**"
            - "!**/internal/**"
          list-mode: lax
          allow:
            - komrad/internal/glyph
            - komrad/internal/loader
            - komrad/internal/theme
          deny:
            - pkg: komrad/internal
              desc: config is read by everything and so may depend on nothing
    importas:
      no-unaliased: true
      alias:
        - pkg: komrad/internal/store/(\w+)
          alias: ${1}store
        - pkg: komrad/proto/gen/(\w+)/v1
          alias: ${1}v1
    sloglint:
      context: all
      attr-only: true
      no-global: all
      no-raw-keys: true
      static-msg: true
      msg-style: lowercased
    usetesting:
      context-background: true
      context-todo: true
      os-temp-dir: true
    nlreturn:
      block-size: 2
    revive:
      rules:
        - name: receiver-naming
          arguments:
            - maxLength: 2
        - name: argument-limit
          arguments:
            - 4
    thelper:
      test:
        begin: false
    nolintlint:
      require-explanation: true
      require-specific: true
    exhaustive:
      check:
        - switch
      default-signifies-exhaustive: false
      ignore-enum-members: End$
    custom:
      komradlint:
        type: module
        description: Checks for komrad's own conventions.
        settings:
          sentinel_inline:
            skip: false
            exclude: []
          wrap_phrase:
            skip: false
            exclude:
              - ^config/
              - ^cmd/gen-docs/
          oneline_func:
            skip: false
          params_shape:
            skip: false
            exclude: []
          single_append:
            skip: false
            exclude:
              - ^lib/xslice/
              - ^db/models/
              - ^db/testmodels/
          conversion_name:
            skip: false
            render:
              - ^internal/rpc/
            from:
              - ^internal/ui/
          bare_http:
            skip: false
            exclude:
              - ^lib/xhttp/
          secret_expose:
            skip: false
            allow:
              - (komrad/internal/forge.Credential).HeaderValue
              - (*komrad/internal/forge.FileStore).Set
              - komrad/internal/cli.tokenForTheWire
          handler_shape:
            skip: false
            exclude:
              - ^internal/rpcerr/
          sentinel_kind:
            skip: false
            exclude:
              - ^internal/ui/
              - ^internal/errui/
              - ^internal/cli/
              - ^internal/diff/
              - ^internal/interceptors/
              - ^config/
              - ^db/
          black_box:
            skip: false
            types:
              - komrad/internal/ui.model
            exclude:
              - ^internal/ui/export_test\.go$
          fake_store:
            skip: false
            exclude:
              - ^internal/store/
          test_beside:
            skip: false
            exclude:
              - ^internal/e2e/
              - ^internal/ui/harness_test\.go$
              - ^internal/ui/export_test\.go$
              - ^internal/ui/panel_integration_test\.go$
          bound_key:
            skip: false
            roots:
              - type: komrad/config.Keybindings
              - type: komrad/config.FixedKeys
                prefix: Fixed
            matchers:
              - komrad/internal/ui.isBound
              - komrad/internal/ui.directionOf
            compares:
              - slices.Contains
            navigation:
              - Nav
              - Column
              - Sidebar
              - Tabs
              - Kinds
              - Views
              - Help
              - Filter
              - Diff
              - Menu.Open
              - Messages.Open
              - Review.PrevOpenThread
              - Review.PrevThread
              - Fixed.Back
              - Fixed.Quit
              - Fixed.Editor
            dispatchers:
              - komrad/internal/ui.actionSpec.dispatch
              - komrad/internal/ui.screenActionSpec.dispatch
              - komrad/internal/ui.model.updateDoc
              - komrad/internal/ui.model.updateSubmenu
            inputs:
              - komrad/internal/ui.model.updateForm
              - komrad/internal/ui.model.updateWorkflowForm
              - komrad/internal/ui.model.updateMessages
              - komrad/internal/ui.model.updateSignIn
              - komrad/internal/ui.nameEdit.take
              - komrad/internal/ui.nameEdit.takeGone
              - komrad/internal/ui.reviewScreen.updateComposer
              - komrad/internal/ui.reviewScreen.updateRelease
            exclude:
              - _test\.go$
          ctx_sleep:
            skip: false
            exclude:
              - ^lib/clock/
          test_fatal_err:
            skip: false
            packages:
              - ^komrad/
          error_text:
            skip: false
          store_query:
            skip: false
            allow:
              - ^komrad/internal/(agents|checkouts|documents|forge|mail|pullrequests|reviews|schedules|scriptrun|tasks|transcripts|worktrees)$
              - ^komrad/internal/jobs(/internaljobs)?$
              - ^komrad/internal/(server|watch|doctor)$
              - ^komrad/internal/(storetest|komradtest)$
          tx_store:
            skip: false
          one_service:
            skip: false
            readers:
              - rows
            exclude:
              - ^internal/fail/
              - ^internal/rpc/log/handler\.go$
          view_split:
            skip: false
            packages:
              - ^komrad/internal/ui$
      fussy:
        type: module
        description: General Go checks from fussy.
        settings:
          comment_length:
            skip: false
            exclude:
              - /config/[^/]+\.go$
          forbid_getenv:
            skip: false
          forbid_nil_nil:
            skip: false
          comment_prefix:
            skip: false
            require: true
          context_timeout:
            skip: false
            include:
              - internal/ui/
          comment_reference:
            skip: false
            exclude:
              - /config/[^/]+\.go$
          switch_default:
            skip: false
          params_struct:
            skip: false
            allow:
              - scriptEnvParams
              - workflowConfigParams
              - resumeParams
          table_test:
            skip: false
          store_verb:
            skip: false
            include:
              - internal/store/
            verbs:
              - Abandon
              - Advance
              - Append
              - Archive
              - Begin
              - Claim
              - Clear
              - Complete
              - Count
              - Create
              - Delete
              - Does
              - Ensure
              - Exists
              - Finish
              - Forget
              - Get
              - Hold
              - Is
              - List
              - Lock
              - Mark
              - Move
              - Normalize
              - Observe
              - Open
              - Prune
              - Record
              - Release
              - Rename
              - Reset
              - Restore
              - Search
              - Send
              - Set
              - Start
              - Unmark
              - Update
              - Upsert
              - Validate
            allow:
              - Close
              - Config
              - Error
              - InTx
              - MarshalJSON
              - MarshalText
              - Scan
              - ServeHTTP
              - String
              - UnmarshalJSON
              - UnmarshalText
              - Value
              - Workflow
  exclusions:
    paths:
      - ^docs/
    rules:
      - path-except: _test\.go$
        linters:
          - forbidigo
        text: a unit test
      - path: internal/(git|diff|scripts|e2e|tmux|tmuxtest|cli|harness|postgres)/
        linters:
          - forbidigo
        text: a unit test
      - path: ((^|/)main\.go$|^cmd/|^internal/(cli|ui|tmux)/)
        linters:
          - forbidigo
        text: the caller's context
      - path: (_test\.go$|^internal/tmux/)
        linters:
          - forbidigo
        text: a logger handed in
      - path: ^db/errors\.go$
        linters:
          - forbidigo
        text: db.IsNoRows
      - path: (_test\.go$|^internal/rpcerr/)
        linters:
          - forbidigo
        text: answer through rpcerr
      - path: ((^|/)main\.go$|_test\.go$)
        linters:
          - forbidigo
        text: let main exit
      - path: (^main\.go$|^cmd/|^config/gen/)
        linters:
          - staticcheck
        text: ST1000
      - path: ^config/
        linters:
          - fussy
        text: forbidgetenv
      - path: ^lib/pagination/
        linters:
          - fussy
        text: forbidnilnil
      - path: ^tools/komradlint/
        linters:
          - nilnil
      - path: ^internal/cli/(migrate|engine)\.go$
        linters:
          - komradlint
        text: is a store query
      - path: (_test\.go|internal/(pgtest|tmuxtest|storetest|harnesstest|logtest|komradtest)/)
        linters:
          - forcetypeassert
          - noctx
          - errcheck
      - path: ^internal/doctor/
        linters:
          - errname
      - path: _test\.go$
        linters:
          - revive
        text: argument-limit
      - path: ^internal/bufcheck/tighten\.go$
        linters:
          - revive
        text: argument-limit
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - ^docs/
  settings:
    goimports:
      local-prefixes:
        - komrad
