syntax = "proto3";

package schedule.v1;

import "annotation/v1/tool.proto";
import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "pagination/v1/pagination.proto";
import "rules/v1/rules.proto";
import "view/v1/view.proto";

option go_package = "weave/proto/gen/schedule/v1;schedulev1";

message Schedule {
  string id = 1;
  string name = 2;
  string cron = 3;
  string timezone = 4;
  bool enabled = 5;
  bool hide_agents = 8;
  string prompt = 6;
  string workflow_id = 7;
  optional google.protobuf.Timestamp next_run_at = 10;
  string last_result_status = 11;
  string last_result_message = 12;
  optional google.protobuf.Timestamp last_result_at = 13;
  // Whether prompt holds only its opening, which a summary listing returns.
  bool prompt_truncated = 14;
}

message ListSchedulesRequest {
  optional pagination.v1.Pagination pagination = 1;
  view.v1.View view = 2;
}

message ListSchedulesResponse {
  repeated Schedule schedules = 1;
  optional string next_page_token = 2;
}

message GetScheduleRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetScheduleResponse {
  Schedule schedule = 1;
}

message CreateScheduleRequest {
  string name = 1 [
    (buf.validate.field).string = {
      min_len: 1
      max_len: 200
    },
    (buf.validate.field).cel = {
      id: "name.printable"
      message: "name must not contain control characters"
      expression: "!this.matches('[\\x00-\\x1f\\x7f]')"
    }
  ];
  string cron = 2 [(buf.validate.field).string = {
    min_len: 1
    [rules.v1.cron_expression]: true
  }];
  string timezone = 3 [(buf.validate.field).string.max_len = 100];
  bool enabled = 4;
  bool hide_agents = 7;
  string prompt = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 50000
  }];
  string workflow_id = 6 [(buf.validate.field).string.min_len = 1];
}

message CreateScheduleResponse {
  Schedule schedule = 1;
}

message UpdateScheduleRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  string name = 2 [
    (buf.validate.field).string = {
      min_len: 1
      max_len: 200
    },
    (buf.validate.field).cel = {
      id: "name.printable"
      message: "name must not contain control characters"
      expression: "!this.matches('[\\x00-\\x1f\\x7f]')"
    }
  ];
  string cron = 3 [(buf.validate.field).string = {
    min_len: 1
    [rules.v1.cron_expression]: true
  }];
  string timezone = 4 [(buf.validate.field).string.max_len = 100];
  bool enabled = 5;
  string prompt = 6 [(buf.validate.field).string = {
    min_len: 1
    max_len: 50000
  }];
  string workflow_id = 7 [(buf.validate.field).string.min_len = 1];
  bool hide_agents = 8;
}

message SetScheduleEnabledRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  bool enabled = 2;
}

message ArchiveScheduleRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

service ScheduleService {
  rpc ListSchedules(ListSchedulesRequest) returns (ListSchedulesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.tool) = {
      tool_name: "list_schedules"
      description: "List the recurring agent launches, most recently updated first, with each one's cron expression, prompt, workflow, next run time, and the outcome of its last firing. Returns one page; pass the response's nextPageToken back as pagination.cursor for the next. The summary this returns by default holds only the opening of each schedule's prompt, marked by promptTruncated; get_schedule returns one whole, and view VIEW_FULL returns every prompt on the page."
    };
  }
  rpc GetSchedule(GetScheduleRequest) returns (GetScheduleResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.tool) = {
      tool_name: "get_schedule"
      description: "Fetch one schedule by id. Returns not_found if no schedule has that id."
    };
  }
  rpc CreateSchedule(CreateScheduleRequest) returns (CreateScheduleResponse) {
    option (annotation.v1.tool) = {
      tool_name: "create_schedule"
      description: "Create a recurring agent launch inside a workflow. Nothing runs at create time; the agent is spawned when the cron expression next matches, and again on every match after that. The workflow supplies the directory, flags, and shared context each launch uses, so only the prompt and the timing are set here. Create it with enabled false to write it down without arming it, or with hideAgents true to keep its runs out of the panel's sidebar while they still run."
      destructive: false
    };
  }
  rpc UpdateSchedule(UpdateScheduleRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.tool) = {
      tool_name: "update_schedule"
      description: "Replace a schedule's name, cron expression, timezone, prompt, workflow, and whether the agents it launches start hidden from the panel. Every field is written, so read the schedule first and send back the ones you are not changing. Agents already launched are untouched, including their own hidden flag."
      destructive: false
    };
  }
  rpc SetScheduleEnabled(SetScheduleEnabledRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.tool) = {
      tool_name: "set_schedule_enabled"
      description: "Pause or resume one schedule without editing anything else. A paused schedule keeps its record and its history and stops firing."
      destructive: false
    };
  }
  rpc ArchiveSchedule(ArchiveScheduleRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.tool) = {
      tool_name: "archive_schedule"
      description: "Hide a schedule from the panel so it stops firing, keeping its record. The agents it already launched are left alone and keep running, and they still record the schedule that made them. Nothing brings an archived schedule back yet, so this is the end of it in practice."
      destructive: false
    };
  }
}
