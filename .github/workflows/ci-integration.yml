name: ci-integration

# The integration tests drive a real git, a real tmux and a real weave, which is slow and
# flakes when the machine is busy. They are a workflow of their own so GitHub can decide
# whether a branch needs them at all, rather than a job that starts and then works that out.
#
# The paths are wide on purpose. These tests drive the panel end to end, so most of the
# module is behind them, and a list naming the packages would go stale the first time
# somebody added an import. What this skips is a change to documentation.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'mise/**'
      - '.mise.toml'
      - 'db/**'
      - 'proto/**'
      - '.github/workflows/ci-integration.yml'
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  integration:
    runs-on: namespace-profile-harrisoncramer

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: weave
          POSTGRES_PASSWORD: weave
          POSTGRES_DB: weave
        ports:
          - 5460:5432
        options: >-
          --health-cmd "pg_isready -U weave"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      WEAVE_DATABASE_URL: postgres://weave:weave@localhost:5460/weave?sslmode=disable
      GOFLAGS: -count=1

    steps:
      - uses: actions/checkout@v4

      - name: Cache the Go and lint caches
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: go

      - name: Use Mise
        uses: ./.github/actions/use-mise
        with:
          gh-access-token: ${{ env.GH_ACCESS_TOKEN }}

      # The tmux tests skip themselves when tmux is missing rather than failing,
      # which issue 553 is about. less is what the panel pages a dormant agent's
      # placeholder into a pane with.
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux less

      - name: Run the integration tests
        run: mise run go:test --kind integration
