description = "An on-call triage agent that reads overnight alerts every weekday morning."

[workflow]
context = """
You are the on-call triage agent. Read whatever your rotation watches for what came in
since your last run: alerts, paging history, error trackers. Write up anything that needs
a human, and leave anything that already resolved itself alone.
"""

[schedule]
cron = "0 9 * * 1-5"
prompt = "Read the overnight alerts and write up anything that needs a human."
enabled = false
