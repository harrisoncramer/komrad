syntax = "proto3";

package resource.v1;

import "annotation/v1/resource.proto";

message Kept {
  option (annotation.v1.resource) = {
    table: "kept"
    projects: [
      {
        table: "kept_notes"
        column: "kept_id"
      },
      {
        table: "kept_configs"
        lookup: "config_id"
        via: "id"
        where: "archived_at IS NULL"
      }
    ]
  };
  string id = 1;
}

message Late {
  option (annotation.v1.resource) = {table: "late"};
  string id = 1;
}

message Orphan {
  option (annotation.v1.resource) = {table: "orphans"};
  string id = 1;
}

message Bare {
  string id = 1;
}

message Nameless {
  option (annotation.v1.resource) = {key: "mark"};
  string mark = 1;
}

message Muddled {
  option (annotation.v1.resource) = {
    table: "muddled"
    projects: [
      {column: "muddled_id"},
      {table: "both_ways"},
      {
        table: "both_ways_too"
        column: "muddled_id"
        lookup: "id"
        via: "muddled_id"
      },
      {
        table: "half_lookup"
        lookup: "id"
      },
      {
        table: "narrowed"
        column: "muddled_id"
        where: "archived_at IS NULL"
      }
    ]
  };
  string id = 1;
}
