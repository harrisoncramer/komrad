name: image

# The control plane's and the engines' machine images, on their own clock and pressed by hand.
#
# Building images and applying them are different acts. Building is cheap and changes nothing.
# Applying replaces every instance and stops every agent, which is why this records the ids and
# stops there. Run `mise run remote:reimage` when the engines are free.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  image:
    if: vars.AWS_CI_ROLE != ''
    runs-on: namespace-profile-harrisoncramer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Mise
        uses: ./.github/actions/use-mise

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      # Dispatched on a release tag the image records it, and on main it falls back to the revision.
      - name: Build the images
        env:
          KOMRAD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run packer:build

      - name: Record what it built
        run: |
          while read -r image ami; do
            aws ssm put-parameter \
              --name "/${{ vars.ENGINE_NAME || 'komrad-development' }}/images/$image" \
              --type String --overwrite --value "$ami"
          done < <(jq -r '.builds[] | "\(.custom_data.image) \(.artifact_id | split(":") | last)"' dist/packer-manifest.json)

          {
            echo "### New images are ready"
            echo
            jq -r '.builds[] | "    \(.custom_data.image): \(.artifact_id | split(":") | last)"' dist/packer-manifest.json
            echo
            echo "Applying them replaces every instance and stops every agent, so they are not"
            echo "applied here. Run \`mise run remote:reimage\` when the engines are free."
          } >>"$GITHUB_STEP_SUMMARY"
