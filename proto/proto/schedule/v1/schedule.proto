syntax = "proto3";

package schedule.v1;

import "annotation/v1/tool.proto";
import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "pagination/v1/pagination.proto";
import "rules/v1/rules.proto";
import "view/v1/view.proto";

option go_package = "komrad/proto/gen/schedule/v1;schedulev1";

// ScheduleRunState is where River holds a firing's job.
enum ScheduleRunState {
  // No state was recorded.
  SCHEDULE_RUN_STATE_UNSPECIFIED = 0;
  // Waiting for a worker to pick it up.
  SCHEDULE_RUN_STATE_AVAILABLE = 1;
  // Held back from running until something releases it.
  SCHEDULE_RUN_STATE_PENDING = 2;
  // Queued to become available at a later time.
  SCHEDULE_RUN_STATE_SCHEDULED = 3;
  // Being worked right now.
  SCHEDULE_RUN_STATE_RUNNING = 4;
  // Failed an attempt and waiting to try again.
  SCHEDULE_RUN_STATE_RETRYABLE = 5;
  // Launched its agent or delivered its mail.
  SCHEDULE_RUN_STATE_COMPLETED = 6;
  // Skipped on purpose, with the reason in its message.
  SCHEDULE_RUN_STATE_CANCELLED = 7;
  // Ran out of attempts, with the last error in its message.
  SCHEDULE_RUN_STATE_DISCARDED = 8;
}

// ScheduleKind is what a schedule does each time it fires.
enum ScheduleKind {
  // No kind was recorded.
  SCHEDULE_KIND_UNSPECIFIED = 0;
  // Launches a new implementer into the workflow with the prompt.
  SCHEDULE_KIND_IMPLEMENTER = 1;
  // Mails the prompt to an orchestrator that is already running.
  SCHEDULE_KIND_ORCHESTRATOR = 2;
}

// ScheduleRun is one firing of a schedule, as the job that carried it out stands.
message ScheduleRun {
  // The job's own id, which orders firings newest first.
  int64 id = 1;
  // Which occurrence of the cron expression this firing stands for.
  google.protobuf.Timestamp scheduled_for = 2;
  // Where the firing stands.
  ScheduleRunState state = 3;
  // Which try this is, starting at one once it has been worked.
  int32 attempt = 4;
  // How many tries it is given before it is discarded.
  int32 max_attempts = 5;
  // When it finished, unset while it is still waiting or working.
  optional google.protobuf.Timestamp finalized_at = 6;
  // Why it was skipped or what its last failed attempt said, blank once it has fired.
  string message = 7;
}

message Schedule {
  reserved 11, 12, 13;
  reserved "last_result_status", "last_result_message", "last_result_at";

  // The handle every other call names this schedule by.
  string id = 1;
  // What the panel lists it as.
  string name = 2;
  // Five fields saying when it fires, in the timezone below.
  string cron = 3;
  // Which clock the expression is read against, blank for the machine's own.
  string timezone = 4;
  // Whether it is armed, since a paused schedule keeps its record and stops firing.
  bool enabled = 5;
  // Whether its launches stay out of the panel's sidebar while still running.
  bool hide_agents = 8;
  // The opening prompt every agent it launches is given, or the mail its orchestrator is sent.
  string prompt = 6;
  // Which workflow it is filed under, which for an orchestrator schedule is its orchestrator's.
  string workflow_id = 7;
  // Whether it launches an implementer or mails an orchestrator.
  ScheduleKind kind = 17;
  // The orchestrator it mails, set only on an orchestrator schedule.
  optional string orchestrator_agent_id = 18;
  // When the expression next matches, unset while the schedule is paused.
  optional google.protobuf.Timestamp next_run_at = 10;
  // Whether prompt holds only its opening, which a summary listing returns.
  bool prompt_truncated = 14;
  // The newest firing still on record, unset when it has never fired or the record has aged out.
  optional ScheduleRun latest_run = 15;
  // The newest firings on record, newest first, which only the watch fills.
  repeated ScheduleRun recent_runs = 16;
  // When it was archived, unset while it is live.
  optional google.protobuf.Timestamp archived_at = 19;
}

message ListSchedulesRequest {
  // Where to carry on from.
  optional pagination.v1.Pagination pagination = 1;
  // How much of each record to return, since the panel draws every field and a model reading
  // the same endpoint has a context window to spend.
  view.v1.View view = 2 [(buf.validate.field).enum.defined_only = true];
  // True to list the archived schedules and only those.
  bool archived = 3;
}

message ListSchedulesResponse {
  // One page of schedules, most recently updated first.
  repeated Schedule schedules = 1;
  // Pass this back as the pagination cursor for the next page.
  optional string next_page_token = 2;
}

message GetScheduleRequest {
  // Which schedule to read.
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetScheduleResponse {
  // The schedule, with its prompt whole rather than cut to its opening.
  Schedule schedule = 1;
}

message ListScheduleRunsRequest {
  // Which schedule's firings to read.
  string id = 1 [(buf.validate.field).string.min_len = 1];
  // How many of the newest firings to return, twenty when unset.
  int32 limit = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
}

message ListScheduleRunsResponse {
  // The firings on record, newest first.
  repeated ScheduleRun runs = 1;
}

message CreateScheduleRequest {
  // What to list it as, which also becomes the title of each agent it launches.
  string name = 1 [
    (buf.validate.field).string = {
      min_len: 1
      max_len: 200
    },
    (buf.validate.field).cel = {
      id: "name.printable"
      message: "name must not contain control characters"
      expression: "!this.matches('[\\x00-\\x1f\\x7f]')"
    }
  ];
  // When to fire, as five whitespace-separated fields.
  string cron = 2 [(buf.validate.field).string = {
    min_len: 1
    [rules.v1.cron_expression]: true
  }];
  // Which clock to read that against, blank for the machine's own.
  string timezone = 3 [(buf.validate.field).string.max_len = 100];
  // False to write the schedule down without arming it.
  bool enabled = 4;
  // True to keep its launches out of the panel's sidebar, ignored by an orchestrator schedule.
  bool hide_agents = 7;
  // The opening prompt each launch is given, or the mail an orchestrator is sent.
  string prompt = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 50000
  }];
  // What each firing does.
  oneof target {
    option (buf.validate.oneof).required = true;
    // Launch an implementer into this workflow, whose cwd and flags it inherits.
    string workflow_id = 6 [(buf.validate.field).string.min_len = 1];
    // Mail the prompt to this orchestrator.
    string orchestrator_agent_id = 8 [(buf.validate.field).string.min_len = 1];
  }
}

message CreateScheduleResponse {
  // The schedule as recorded, which has fired nothing yet.
  Schedule schedule = 1;
}

message UpdateScheduleRequest {
  // Which schedule to rewrite.
  string id = 1 [(buf.validate.field).string.min_len = 1];
  // Every field here is written, so send back the ones you are not changing.
  string name = 2 [
    (buf.validate.field).string = {
      min_len: 1
      max_len: 200
    },
    (buf.validate.field).cel = {
      id: "name.printable"
      message: "name must not contain control characters"
      expression: "!this.matches('[\\x00-\\x1f\\x7f]')"
    }
  ];
  // When it fires from now on.
  string cron = 3 [(buf.validate.field).string = {
    min_len: 1
    [rules.v1.cron_expression]: true
  }];
  // Which clock that is read against.
  string timezone = 4 [(buf.validate.field).string.max_len = 100];
  // Whether it stays armed.
  bool enabled = 5;
  // The prompt later firings use, leaving agents already launched alone.
  string prompt = 6 [(buf.validate.field).string = {
    min_len: 1
    max_len: 50000
  }];
  // What later firings do.
  oneof target {
    option (buf.validate.oneof).required = true;
    // Launch an implementer into this workflow.
    string workflow_id = 7 [(buf.validate.field).string.min_len = 1];
    // Mail the prompt to this orchestrator.
    string orchestrator_agent_id = 9 [(buf.validate.field).string.min_len = 1];
  }
  // Whether later launches stay out of the sidebar, leaving existing agents alone.
  bool hide_agents = 8;
}

message SetScheduleEnabledRequest {
  // Which schedule to arm or pause.
  string id = 1 [(buf.validate.field).string.min_len = 1];
  // False to stop it firing while keeping its record and its history.
  bool enabled = 2;
}

message ArchiveScheduleRequest {
  // Which schedule to hide, leaving the agents it already launched running.
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message RestoreScheduleRequest {
  // Which archived schedule to bring back.
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message DeleteScheduleRequest {
  // Which archived schedule to remove for good.
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

// ScheduleService is the recurring firings, which spawn an implementer into a workflow or mail an
// orchestrator whenever their cron expression next matches.
service ScheduleService {
  rpc ListSchedules(ListSchedulesRequest) returns (ListSchedulesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "list_schedules"
      description: "List the schedules, most recently updated first, with each one's kind, cron expression, prompt, target, next run time, and its latest run. The summary this returns by default holds only the opening of each schedule's prompt, marked by prompt_truncated; get_schedule returns one whole, and view VIEW_FULL returns every prompt on the page. Archived schedules are excluded unless archived is set, which lists those and only those."
      roles: [ROLE_ORCHESTRATOR]
    };
  }
  rpc GetSchedule(GetScheduleRequest) returns (GetScheduleResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "get_schedule"
      description: "Fetch one schedule by id. Returns not_found if no schedule has that id."
      roles: [ROLE_ORCHESTRATOR]
    };
  }
  rpc ListScheduleRuns(ListScheduleRunsRequest) returns (ListScheduleRunsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "list_schedule_runs"
      description: "List a schedule's most recent firings, newest first, each with the occurrence it stands for, its state, its attempt count, and why it was skipped or how it failed. A completed run launched its agent or delivered its mail, a cancelled one was skipped on purpose, a discarded one ran out of attempts, and a retryable one is still being tried. Firings are kept for 90 days. Returns not_found if no schedule has that id."
      roles: [ROLE_ORCHESTRATOR]
    };
  }
  rpc CreateSchedule(CreateScheduleRequest) returns (CreateScheduleResponse) {
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "create_schedule"
      description: "Create a schedule that fires on a cron expression. Give workflowId to launch a new implementer into that workflow on every match, or orchestratorAgentId to mail the prompt to that live orchestrator instead. Nothing fires at create time. Create it with enabled false to write it down without arming it. A firing whose orchestrator has since been archived or deleted is skipped, and its run says why."
      destructive: false
      roles: [ROLE_ORCHESTRATOR]
    };
  }
  rpc UpdateSchedule(UpdateScheduleRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "update_schedule"
      description: "Replace a schedule's name, cron expression, timezone, prompt, target, and whether the agents it launches start hidden from the panel. Every field is written, so read the schedule first and send back the ones you are not changing, giving workflowId for an implementer schedule and orchestratorAgentId for an orchestrator one. Agents already launched are untouched."
      destructive: false
      roles: [ROLE_ORCHESTRATOR]
    };
  }
  rpc SetScheduleEnabled(SetScheduleEnabledRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "set_schedule_enabled"
      description: "Pause or resume one schedule without editing anything else. A paused schedule keeps its record and its history and stops firing."
      destructive: false
      roles: [ROLE_ORCHESTRATOR]
    };
  }
  rpc ArchiveSchedule(ArchiveScheduleRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "archive_schedule"
      description: "Hide a schedule from the panel so it stops firing, keeping its record. The agents it already launched are left alone and keep running, and they still record the schedule that made them. restore_schedule brings it back."
      destructive: false
      roles: [ROLE_ORCHESTRATOR]
    };
  }
  rpc RestoreSchedule(RestoreScheduleRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "restore_schedule"
      description: "Take a schedule out of the archive, keyed by id. It comes back paused or armed as it was when archived. Returns not_found if the schedule is not archived, failed_precondition if its workflow or orchestrator has since been archived, and already_exists if a live schedule has taken its name."
      destructive: false
      roles: [ROLE_ORCHESTRATOR]
    };
  }
  rpc DeleteSchedule(DeleteScheduleRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "delete_schedule"
      description: "Permanently delete an archived schedule and its firing history. The agents it launched are left alone and no longer record the schedule that made them. Returns not_found if the schedule does not exist or is not archived."
      destructive: true
      roles: [ROLE_ORCHESTRATOR]
    };
  }
}
