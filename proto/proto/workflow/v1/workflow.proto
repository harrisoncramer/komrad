syntax = "proto3";

package workflow.v1;

import "annotation/v1/tool.proto";
import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "pagination/v1/pagination.proto";
import "rules/v1/rules.proto";

option go_package = "weave/proto/gen/workflow/v1;workflowv1";

// Workflow is a named bucket of related agents. It runs nothing itself. It holds
// a label, shared context injected into the agents spawned inside it, the harness,
// working directory, and flags those agents start from, and the actions run at the
// start and end of each of their lives.
message Workflow {
  string id = 1;
  string name = 2;
  // Free-text durable state the user edits. Agents created inside the workflow
  // get it appended to their system prompt as a snapshot at launch, so editing
  // it reaches only agents spawned afterwards.
  string context = 3;
  string cwd = 4;
  string flags = 5;
  // Which CLI agents in this workflow run, blank when they take the user's
  // configured default.
  string harness = 6;
  // The action run before an agent in this workflow starts, blank for none. It blocks and
  // a failure abandons the launch. A file in the actions directory names it, so nothing
  // here promises it still exists.
  string setup_action = 7;
  // The action run once an agent in this workflow is deleted, blank for none. Nothing
  // waits on it.
  string cleanup_action = 8;
}

message ListWorkflowsRequest {
  optional pagination.v1.Pagination pagination = 1;
}

message ListWorkflowsResponse {
  repeated Workflow workflows = 1;
  // The token that fetches the page after this one, unset once the listing is
  // exhausted.
  optional string next_page_token = 2;
}

message GetWorkflowRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetWorkflowResponse {
  Workflow workflow = 1;
}

// CreateWorkflowRequest describes a new bucket. Only the name is required. A
// workflow with no context, directory, or flags is a plain folder.
message CreateWorkflowRequest {
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  string context = 2 [(buf.validate.field).string.max_len = 50000];
  // Blank means agents inside this workflow choose their own directory. When set
  // it must be absolute or ~-prefixed, matching what creating an agent demands,
  // since this is the value prefilled into that form.
  string cwd = 3 [(buf.validate.field).string = {
    max_len: 4096
    [rules.v1.absolute_path_or_blank]: true
  }];
  string flags = 4 [(buf.validate.field).string = {
    max_len: 500
    [rules.v1.shell_safe]: true
  }];
  // Which CLI agents created inside this workflow run. Blank leaves them on the
  // user's configured default. A name this panel does not implement is refused.
  string harness = 5 [(buf.validate.field).string = {
    max_len: 40
    pattern: "^[a-z0-9-]*$"
  }];
  // The action to run before an agent in this workflow starts, blank for none. One
  // action rather than a list, since an action is a script and a script already
  // sequences its own steps.
  string setup_action = 6 [(buf.validate.field).string = {
    max_len: 255
    [rules.v1.action_name_or_blank]: true
  }];
  // The action to run once an agent in this workflow is deleted, blank for none.
  string cleanup_action = 7 [(buf.validate.field).string = {
    max_len: 255
    [rules.v1.action_name_or_blank]: true
  }];
}

message CreateWorkflowResponse {
  Workflow workflow = 1;
}

// UpdateWorkflowRequest replaces a workflow's editable fields. Every field is
// sent, so an omitted one reads as cleared rather than unchanged. Fetch the
// workflow, change what you mean to, and send it back.
message UpdateWorkflowRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  string context = 3 [(buf.validate.field).string.max_len = 50000];
  string cwd = 4 [(buf.validate.field).string = {
    max_len: 4096
    [rules.v1.absolute_path_or_blank]: true
  }];
  string flags = 5 [(buf.validate.field).string = {
    max_len: 500
    [rules.v1.shell_safe]: true
  }];
  // Which CLI agents created inside this workflow run from now on. Blank leaves
  // them on the user's configured default. Agents already spawned keep the harness
  // they started on, which is recorded against each of them.
  string harness = 6 [(buf.validate.field).string = {
    max_len: 40
    pattern: "^[a-z0-9-]*$"
  }];
  // The action run before an agent in this workflow starts, blank for none. Written like
  // every other field here, and reaches only agents launched afterwards.
  string setup_action = 7 [(buf.validate.field).string = {
    max_len: 255
    [rules.v1.action_name_or_blank]: true
  }];
  // The action run once an agent in this workflow is deleted, blank for none. Editing this
  // does reach agents already running, since cleanup is read when it fires rather than at
  // launch.
  string cleanup_action = 8 [(buf.validate.field).string = {
    max_len: 255
    [rules.v1.action_name_or_blank]: true
  }];
}

// DeleteWorkflowRequest removes a workflow and the agents inside it.
message DeleteWorkflowRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

// WorkflowService manages the buckets agents are grouped into. Every method
// carries a tool annotation, which is what puts it on the MCP surface.
service WorkflowService {
  rpc ListWorkflows(ListWorkflowsRequest) returns (ListWorkflowsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.tool) = {
      tool_name: "list_workflows"
      description: "List the workflows agents are grouped into, most recently updated first, with each one's shared context, the working directory and flags its agents start from, and the action run before its agents start and the one run after they are deleted. Returns one page; pass the response's nextPageToken back as pagination.cursor for the next."
    };
  }
  rpc GetWorkflow(GetWorkflowRequest) returns (GetWorkflowResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.tool) = {
      tool_name: "get_workflow"
      description: "Fetch one workflow by id. Returns not_found if no workflow has that id."
    };
  }
  rpc CreateWorkflow(CreateWorkflowRequest) returns (CreateWorkflowResponse) {
    option (annotation.v1.tool) = {
      tool_name: "create_workflow"
      description: "Create a workflow to group agents under. Nothing runs as a result; this is organisation. The cwd and flags become the defaults prefilled when an agent is created inside it, and the context is appended to those agents' system prompts. setupAction names one action from list_actions to run before each of its agents starts, which blocks and abandons the launch if it fails; cleanupAction names the one run once one of its agents is deleted. Both are blank for none."
      destructive: false
    };
  }
  rpc UpdateWorkflow(UpdateWorkflowRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.tool) = {
      tool_name: "update_workflow"
      description: "Replace a workflow's name, context, directory, flags, and the actions run around its agents' lives. Every field is written, so read the workflow first and send back the ones you are not changing. Editing the context or the setup action reaches only agents spawned afterwards, since existing agents took a snapshot at launch; editing the cleanup action reaches agents already running, since it is read when it fires."
      destructive: false
    };
  }
  rpc DeleteWorkflow(DeleteWorkflowRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.tool) = {
      tool_name: "delete_workflow"
      description: "Remove a workflow. Its agents are archived alongside it, which leaves them findable through search_transcripts and deletes no transcript. Refused while any schedule still launches into the workflow, since those would have nowhere to run."
      destructive: true
    };
  }
}
