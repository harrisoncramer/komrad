commits(last: 1) {
  nodes {
    commit {
      oid
      statusCheckRollup {
        contexts(first: 100) {
          pageInfo {
            hasNextPage
          }
          nodes {
            __typename
            ... on CheckRun {
              id
              name
              status
              conclusion
              startedAt
              completedAt
              detailsUrl
              checkSuite {
                id
                createdAt
                app {
                  name
                }
                workflowRun {
                  event
                  workflow {
                    name
                  }
                }
              }
              isRequired(pullRequestId: $pullRequest)
            }
            ... on StatusContext {
              id
              context
              state
              targetUrl
              createdAt
              isRequired(pullRequestId: $pullRequest)
            }
          }
        }
      }
    }
  }
}
