name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  # One job running every check in turn. Namespace bills each job at least a minute and bills the
  # cache volume for as long as a job holds it, so one runner costs far less than one per check. A
  # draft pull request runs nothing; marking it ready runs the suite.
  required:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: namespace-profile-harrisoncramer

    # The store tests run against a real Postgres rather than a fake, and
    # internal/pgtest creates a database per test off the server KOMRAD_DATABASE_URL
    # points at. Credentials match docker-compose so nothing else has to change.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: komrad
          POSTGRES_PASSWORD: komrad
          POSTGRES_DB: komrad
        ports:
          - 5460:5432
        options: >-
          --health-cmd "pg_isready -U komrad"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      KOMRAD_DATABASE_URL: postgres://komrad:komrad@localhost:5460/komrad?sslmode=disable
      ALL: ${{ github.event_name != 'pull_request' }}

    steps:
      - uses: actions/checkout@v4

      # What the branch touched, which is what every step below gates on. Only a pull request
      # is filtered; a push to main runs every step.
      - id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yaml'
              - '.custom-gcl.yml'
              - 'tools/komradlint/**'
              - 'tools/komradpkg/**'
              - 'tools/komradslot/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/use-mise/**'
            shell:
              - 'mise/**'
              - '**/*.sh'
              - 'internal/scripts/builtin/**'
              - '.github/workflows/ci.yml'
            db:
              - 'db/**'
              - '.github/workflows/ci.yml'
            proto:
              - 'proto/**'
              - 'buf*.yaml'
              - '.github/workflows/ci.yml'
            infra:
              - 'infra/**'
              - 'packer/**'
              - 'mise/tasks/infra/engine/**'
              - 'mise/tasks/infra/docs/**'
              - 'mise/tasks/packer/**'
              - 'mise.toml'
              - '.github/workflows/ci.yml'
            integration:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'mise/**'
              - 'db/**'
              - 'proto/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/use-mise/**'
            docs:
              - 'docs/**'
              - 'mise/tasks/docs/**'
              - 'mise.toml'
              - '.github/workflows/ci.yml'
            generated:
              - 'proto/**'
              - 'db/**'
              - 'config/**'
              - 'cmd/protoc-gen-komrad-rpc/**'
              - 'cmd/gen-docs/**'
              - 'internal/cli/**'
              - 'mise/tasks/gen/**'
              - '.github/workflows/ci.yml'

      - name: Use Mise
        uses: ./.github/actions/use-mise
        with:
          gh-access-token: ${{ env.GH_ACCESS_TOKEN }}

      # The shell komrad runs: the mise tasks and the builtin scripts an agent's hooks call.
      - name: Check the shell
        if: env.ALL == 'true' || steps.changes.outputs.shell == 'true'
        run: |
          mise run bash:check
          mise run bash:fmt --check

      - name: Check the protobufs
        if: env.ALL == 'true' || steps.changes.outputs.proto == 'true'
        run: |
          mise run proto:fmt --check
          mise run proto:lint

      - name: Check the infrastructure
        if: env.ALL == 'true' || steps.changes.outputs.infra == 'true'
        run: |
          mise run infra:engine:fmt
          mise run infra:docs:fmt
          mise run packer:fmt
          mise run packer:validate

      - name: Check the migrations
        if: env.ALL == 'true' || steps.changes.outputs.db == 'true'
        run: |
          mise run db:fmt --check
          mise run db:validate

      # The generators, which read the protobufs, the schema and the config and write Go.
      - name: Check the generated files are in step
        if: env.ALL == 'true' || steps.changes.outputs.generated == 'true'
        run: mise run gen:check

      # Go reuses a passing test result only when every file and folder the test read has
      # the same mtime as last time. A fresh checkout gives them all a new one, so without
      # this every test runs again, even ones whose code nothing touched.
      - name: Give the files the times the test cache expects
        if: env.ALL == 'true' || steps.changes.outputs.go == 'true' || steps.changes.outputs.integration == 'true'
        run: mise run go:mtimehash

      - name: Check the Go formatting
        if: env.ALL == 'true' || steps.changes.outputs.go == 'true'
        run: mise run go:fmt --check

      - name: Lint
        if: env.ALL == 'true' || steps.changes.outputs.go == 'true'
        run: mise run go:lint

      - name: Run the unit tests
        if: env.ALL == 'true' || steps.changes.outputs.go == 'true'
        run: mise run go:test --kind unit

      # A test that needs tmux fails without it rather than skipping, so this step is what
      # keeps the integration tests honest. less is what the panel pages a dormant agent's
      # placeholder into a pane with.
      - name: Install tmux
        if: env.ALL == 'true' || steps.changes.outputs.integration == 'true'
        run: sudo apt-get update && sudo apt-get install -y tmux less

      # The integration tests drive a real git, a real tmux and a real komrad, which is slow
      # and flakes when the machine is busy. They carry a build tag, so this is the only step
      # that compiles them in.
      - name: Run the integration tests
        if: env.ALL == 'true' || steps.changes.outputs.integration == 'true'
        run: mise run go:test --kind integration

      # The docs site: formatting, the linter, the type check, and a build.
      - name: Check the docs
        if: env.ALL == 'true' || steps.changes.outputs.docs == 'true'
        run: |
          mise run docs:fmt --check
          mise run docs:lint
          mise run docs:check
          mise run docs:build
