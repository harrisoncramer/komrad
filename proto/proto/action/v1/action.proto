syntax = "proto3";

package action.v1;

import "annotation/v1/tool.proto";
import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "rules/v1/rules.proto";

option go_package = "weave/proto/gen/action/v1;actionv1";

// Action is one executable in the user's actions directory. The name is the file's
// own name, which is the whole of what identifies it, since nothing is parsed out of
// the file.
message Action {
  // The name of the file
  string name = 1;
  // If the action is executable (valid to run) or not.
  bool executable = 2;
  // The start of the file, for a caller that wants to show it. Bytes rather than a
  // string because an action can be a binary.
  bytes preview = 3;
  // Whether the file is longer than the preview carries.
  bool preview_truncated = 4;
}

message ListActionsResponse {
  repeated Action actions = 1;
}

// RunActionRequest names the action to fire and the agent to fire it on.
message RunActionRequest {
  string agent_id = 1 [(buf.validate.field).string.min_len = 1];
  string action = 2 [(buf.validate.field).string = {
    max_len: 255
    [rules.v1.action_name]: true
  }];
}

// ActionService lists and fires the executables the user keeps in their actions
// directory. An action runs in that directory, with the agent it was fired on using
// WEAVE_AGENT environment variable as JSON.
service ActionService {
  // The directory is read on every call, so an action written while the server runs is listed without a restart.
  rpc ListActions(google.protobuf.Empty) returns (ListActionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.tool) = {
      tool_name: "list_actions"
      description: "List the actions the user has written, which are executable files in their actions directory. An action is a script or program that takes one agent as its input and does whatever the user wrote it to do, such as opening the pull request that agent recorded. The name is what run_action takes. A file listed with executable false cannot be run until the user chmods it, and the preview is the start of the file so you can see what one does before firing it."
    };
  }

  // Fire and forget. The action is started and nothing waits for it, so this
  // answers as soon as the process exists and never reports what it did.
  rpc RunAction(RunActionRequest) returns (google.protobuf.Empty) {
    option (annotation.v1.tool) = {
      tool_name: "run_action"
      description: "Fire one of the user's actions on an agent, naming the action as list_actions reports it and the agent by id. The action is started and nothing waits for it, so a successful call means the process began and says nothing about what it did or whether it worked. Where its output goes is the action's own business. An error means it never started: no such action, no such agent, or a file the user has not made executable. Your own id is in the WEAVE_AGENT_ID environment variable."
    };
  }
}
