syntax = "proto3";

package workflow.v1;

import "annotation/v1/tool.proto";
import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "pagination/v1/pagination.proto";
import "rules/v1/rules.proto";
import "view/v1/view.proto";

option go_package = "komrad/proto/gen/workflow/v1;workflowv1";

message Workflow {
  // The handle every other call names this workflow by.
  string id = 1;
  // What the panel groups its agents under.
  string name = 2;
  // Text appended to the system prompt of every agent launched into it, taken as a snapshot at
  // launch rather than read again.
  string context = 3;
  // The directory its agents start in, and the checkout new worktrees are cut from.
  string cwd = 4;
  // Command-line flags prefilled for each new agent.
  string flags = 5;
  // Which CLI its agents run, blank for komrad's default.
  string harness = 6;
  // When it was hidden from the panel, unset while it is live.
  optional string archived_at = 9;
  // Whether its agents each get a worktree of their own, and how those are built.
  WorktreeConfig worktree = 10;
  // Scripts hung on moments in its agents' lives, one per moment.
  repeated WorkflowHook hooks = 12;
  // Whether context holds only its opening, which a summary listing returns.
  bool context_truncated = 14;
  // Which CLI its reviewers run, blank for the one its other agents run.
  string reviewer_harness = 15;
  // Command-line flags for each new reviewer, blank for the other agents' flags when the CLI is
  // the same.
  string reviewer_flags = 16;
  // What its agents are asked to do when komrad mails them a notice, one per notice.
  repeated WorkflowPrompt prompts = 17;
}

message WorkflowPrompt {
  // Which notice it answers, such as pull_request.checks_failing or review.approved.
  string notice = 1 [(buf.validate.field).string = {
    in: [
      "pull_request.checks_failing",
      "pull_request.changes_requested",
      "pull_request.approved",
      "pull_request.conflicting",
      "pull_request.behind",
      "pull_request.merged",
      "pull_request.closed",
      "worktree.rebased",
      "worktree.landed",
      "worktree.rebase_conflicted",
      "worktree.rebase_failed",
      "document.written_by_person",
      "review.approved",
      "review.changes_requested",
      "review.commented",
      "review.commented_by_person",
      "review.answered"
    ]
  }];
  // The text added to the mail carrying that notice.
  string prompt = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 2000
  }];
}

message WorkflowHook {
  // Which moment fires it, such as pre-launch or post-archive.
  string event = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 40
  }];
  // The file in the hooks directory to run, blank to fire nothing at that moment.
  string script = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
    [rules.v1.script_name_or_blank]: true
  }];
}

message WorktreeConfig {
  // Whether komrad cuts a worktree for each agent, or leaves it in the directory it was given.
  bool enabled = 1;
  // The branch worktrees are cut from and every agent's work is measured against, filled in
  // from the clone when left blank on create and never blank once stored.
  string base_branch = 2 [(buf.validate.field).string = {
    max_len: 255
    [rules.v1.shell_safe]: true
  }];
  // Files copied into each new worktree, for the untracked ones a build needs.
  repeated string copy_paths = 3 [(buf.validate.field).repeated = {
    max_items: 50
    items: {
      string: {
        max_len: 255
        [rules.v1.relative_path]: true
      }
    }
  }];
  // Files linked into each new worktree rather than copied, for the large shared ones.
  repeated string symlink_paths = 4 [(buf.validate.field).repeated = {
    max_items: 50
    items: {
      string: {
        max_len: 255
        [rules.v1.relative_path]: true
      }
    }
  }];
  // Paths or globs the panel leaves out of the diff it draws, such as generated output.
  repeated string diff_exclude = 5 [(buf.validate.field).repeated = {
    max_items: 50
    items: {
      string: {
        min_len: 1
        max_len: 255
        [rules.v1.relative_path]: true
      }
    }
  }];
  // Where new worktrees are made, blank for the parent every workflow shares.
  string dir = 6 [(buf.validate.field).string = {
    max_len: 4096
    [rules.v1.absolute_path_or_blank]: true
  }];
}

message ListWorkflowsRequest {
  // Where to carry on from.
  optional pagination.v1.Pagination pagination = 1;
  // True to list the archived workflows and only those.
  bool archived = 2;
  // How much of each record to return, since the panel draws every field and a model reading
  // the same endpoint has a context window to spend.
  view.v1.View view = 3 [(buf.validate.field).enum.defined_only = true];
}

message ListWorkflowsResponse {
  // One page of workflows, in alphabetical order.
  repeated Workflow workflows = 1;
  // Pass this back as the pagination cursor for the next page.
  optional string next_page_token = 2;
}

message GetWorkflowRequest {
  // Which workflow to read.
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetWorkflowResponse {
  // The workflow, with its context whole rather than cut to its opening.
  Workflow workflow = 1;
}

message CreateWorkflowRequest {
  // What to group its agents under in the panel.
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  // Text to append to the system prompt of every agent launched into it.
  string context = 2 [(buf.validate.field).string.max_len = 50000];
  // The directory its agents start in, and the checkout worktrees are cut from.
  string cwd = 3 [(buf.validate.field).string = {
    max_len: 4096
    [rules.v1.absolute_path_or_blank]: true
  }];
  // Flags to prefill for each new agent.
  string flags = 4 [(buf.validate.field).string = {
    max_len: 500
    [rules.v1.shell_safe]: true
  }];
  // Which CLI its agents run, blank for komrad's default.
  string harness = 5 [(buf.validate.field).string = {
    max_len: 40
    pattern: "^[a-z0-9-]*$"
  }];
  // Whether its agents each get a worktree, and how those are built.
  WorktreeConfig worktree = 8;
  // Scripts to hang on moments in its agents' lives.
  repeated WorkflowHook hooks = 10 [(buf.validate.field).repeated.max_items = 50];
  // Which CLI its reviewers run, blank for the one its other agents run.
  string reviewer_harness = 11 [(buf.validate.field).string = {
    max_len: 40
    pattern: "^[a-z0-9-]*$"
  }];
  // Flags for each new reviewer, blank for the other agents' flags when the CLI is the same.
  string reviewer_flags = 12 [(buf.validate.field).string = {
    max_len: 500
    [rules.v1.shell_safe]: true
  }];
  // What its agents are asked to do when komrad mails them a notice.
  repeated WorkflowPrompt prompts = 13 [(buf.validate.field).repeated.max_items = 50];
}

message CreateWorkflowResponse {
  // The workflow as recorded, holding no agents yet.
  Workflow workflow = 1;
}

message UpdateWorkflowRequest {
  // Which workflow to rewrite.
  string id = 1 [(buf.validate.field).string.min_len = 1];
  // Every field here is written, so send back the ones you are not changing.
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  // Reaches only agents launched afterwards, since existing ones took a snapshot.
  string context = 3 [(buf.validate.field).string.max_len = 50000];
  // Where agents launched afterwards start.
  string cwd = 4 [(buf.validate.field).string = {
    max_len: 4096
    [rules.v1.absolute_path_or_blank]: true
  }];
  // Flags prefilled for agents launched afterwards.
  string flags = 5 [(buf.validate.field).string = {
    max_len: 500
    [rules.v1.shell_safe]: true
  }];
  // Which CLI agents launched afterwards run.
  string harness = 6 [(buf.validate.field).string = {
    max_len: 40
    pattern: "^[a-z0-9-]*$"
  }];
  // Turning worktrees off reaches agents already running, since whether komrad removes a
  // directory is read when the agent is deleted.
  WorktreeConfig worktree = 9;
  // The whole hook list, so send back the ones you are keeping.
  repeated WorkflowHook hooks = 11 [(buf.validate.field).repeated.max_items = 50];
  // Which CLI reviewers spawned afterwards run.
  string reviewer_harness = 12 [(buf.validate.field).string = {
    max_len: 40
    pattern: "^[a-z0-9-]*$"
  }];
  // Flags for reviewers spawned afterwards.
  string reviewer_flags = 13 [(buf.validate.field).string = {
    max_len: 500
    [rules.v1.shell_safe]: true
  }];
  // The whole prompt list, so send back the ones you are keeping.
  repeated WorkflowPrompt prompts = 14 [(buf.validate.field).repeated.max_items = 50];
}

message ArchiveWorkflowRequest {
  // Which workflow to hide, archiving the agents inside it.
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message RestoreWorkflowRequest {
  // Which archived workflow to bring back, along with the agents archived inside it.
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

message RestoreWorkflowResponse {
  // The workflow as restored, its agents dormant until each is resumed.
  Workflow workflow = 1;
}

message DeleteWorkflowRequest {
  // Which archived workflow to remove for good, with whatever is still inside it.
  string id = 1 [(buf.validate.field).string.min_len = 1];
}

// WorkflowService is the groups agents are filed under, which decide the directory, flags and
// shared context each of their agents starts from.
service WorkflowService {
  rpc ListWorkflows(ListWorkflowsRequest) returns (ListWorkflowsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "list_workflows"
      description: "List the workflows agents are grouped into, in alphabetical order, with each one\x27s shared context, the working directory and flags its agents start from, and the scripts hooked to moments in their agents\x27 lives. Archived workflows are excluded unless archived is set, which lists those and only those. The summary this returns by default holds only the opening of each workflow\x27s context, marked by context_truncated; get_workflow returns one whole, and view VIEW_FULL returns every context on the page."
      roles: [
        ROLE_IMPLEMENTER,
        ROLE_REVIEWER,
        ROLE_ORCHESTRATOR
      ]
    };
  }
  rpc GetWorkflow(GetWorkflowRequest) returns (GetWorkflowResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "get_workflow"
      description: "Fetch one workflow by id. Returns not_found if no workflow has that id."
      roles: [
        ROLE_IMPLEMENTER,
        ROLE_REVIEWER,
        ROLE_ORCHESTRATOR
      ]
    };
  }
  rpc CreateWorkflow(CreateWorkflowRequest) returns (CreateWorkflowResponse) {
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "create_workflow"
      description: "Create a workflow to group agents under. Nothing runs as a result; this is organisation. The cwd and flags become the defaults prefilled when an agent is created inside it, and the context is appended to those agents\x27 system prompts. reviewer_harness and reviewer_flags are the CLI and flags its reviewers launch with instead: blank reviewer_harness means the workflow\x27s CLI, and blank reviewer_flags means the workflow\x27s flags only when the reviewer runs that same CLI. worktree.enabled gives every agent a git worktree of its own, cut from cwd, which komrad makes before the agent starts and removes when it is deleted; left off, agents run in the directory they are given and komrad provisions nothing. hooks hang your own scripts on a moment in those agents\x27 lives, one per moment, each naming a hook from list_hooks and one of pre-launch, post-launch, pre-resume, post-resume, pre-archive, post-archive, pre-restore, post-restore, pre-delete or post-delete; komrad waits for every pre hook and one that fails refuses the step, and it runs every post hook in the background, where one that fails only marks its run. prompts add your own instructions to the mail komrad sends its agents on a notice, such as pull_request.checks_failing or review.approved, one per notice. worktree.baseBranch is the branch worktrees are cut from and every agent\x27s work is measured against, filled in from the clone when left blank, which is what origin/HEAD names there, else the branch cwd is on, else main; the response carries the name stored. worktree.dir names the parent new worktrees are made in, blank meaning the one every workflow shares. worktree.diffExclude drops paths from the diff the panel draws, as paths or globs relative to the checkout such as proto/gen or *.pb.go. docs/src/content/guides/workflows.md says why each is there."
      destructive: false
      roles: [ROLE_ORCHESTRATOR]
    };
  }
  rpc UpdateWorkflow(UpdateWorkflowRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "update_workflow"
      description: "Replace a workflow\x27s name, context, directory, flags, reviewer harness and flags, worktree config, hooks and prompts. Every field is written, so read the workflow first and send back the ones you are not changing, the hooks and prompts lists included. Each hook names a hook from list_hooks and one of pre-launch, post-launch, pre-resume, post-resume, pre-archive, post-archive, pre-restore, post-restore, pre-delete or post-delete; komrad waits for every pre hook and one that fails refuses the step, and it runs every post hook in the background, where one that fails only marks its run. Editing the context reaches only agents spawned afterwards, since existing agents took a snapshot at launch, while worktree.enabled reaches agents already running, since whether komrad removes an agent\x27s directory is read when the agent is deleted. worktree.baseBranch is the branch worktrees are cut from and every agent\x27s work is measured against, and a blank one is refused here, so send back the stored name when it is not what you are changing. worktree.dir names the parent new worktrees are made in, blank meaning the one every workflow shares. worktree.diffExclude drops paths from the diff the panel draws, as paths or globs relative to the checkout such as proto/gen or *.pb.go. docs/src/content/guides/workflows.md says why each is there."
      destructive: false
      roles: [ROLE_ORCHESTRATOR]
    };
  }
  rpc ArchiveWorkflow(ArchiveWorkflowRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "archive_workflow"
      description: "Hide a workflow from the panel, archiving the agents inside it. Nothing is destroyed: the agents stay findable through search_transcripts and no transcript goes with them. Refused while any schedule still launches into the workflow, since those would have nowhere to run. The call waits for each agent\x27s pre-archive hook, and one that fails refuses the whole archive."
      destructive: false
      roles: [ROLE_ORCHESTRATOR]
    };
  }
  rpc RestoreWorkflow(RestoreWorkflowRequest) returns (RestoreWorkflowResponse) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "restore_workflow"
      description: "Take a workflow out of the archive, keyed by id, along with every agent archived inside it. The agents come back as dormant rows, so call resume_agent on the ones whose conversations you want in a pane. Returns not_found if the workflow is not archived. It is refused whole rather than in part, either because its agents would not fit under the number the panel is configured to hold, or because live agents have taken their names, which the error lists for you to rename. The call waits for each agent\x27s pre-restore hook, and one that fails refuses the whole restore."
      destructive: false
      roles: [ROLE_ORCHESTRATOR]
    };
  }
  rpc DeleteWorkflow(DeleteWorkflowRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "delete_workflow"
      description: "Permanently delete an archived workflow along with whatever archived agents are still inside it, reusing the same worktree-removal handling a direct agent delete uses. The archived schedules that launched into it go too, since nothing else ever removes them and they would keep the workflow alive. Returns not_found if the workflow does not exist or is not archived. An agent whose worktree is still being removed, or whose removal failed, is left behind rather than blocking the call, so the workflow can stay archived and be tried again."
      destructive: true
      roles: [ROLE_ORCHESTRATOR]
    };
  }
}
