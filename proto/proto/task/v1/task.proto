syntax = "proto3";

package task.v1;

import "annotation/v1/tool.proto";
import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "rules/v1/rules.proto";

option go_package = "komrad/proto/gen/task/v1;taskv1";

// Sequence is a git operation stopped part way in a task's checkout.
enum Sequence {
  // No value was recorded. No task has this value.
  SEQUENCE_UNSPECIFIED = 0;
  // No git operation is stopped part way.
  SEQUENCE_NONE = 1;
  // A rebase stopped on a commit it could not replay.
  SEQUENCE_REBASE = 2;
  // A `git am` stopped on a patch it could not apply.
  SEQUENCE_AM = 3;
  // A merge stopped on conflicts.
  SEQUENCE_MERGE = 4;
  // A cherry-pick stopped on conflicts or paused between commits.
  SEQUENCE_CHERRY_PICK = 5;
  // A revert stopped on conflicts or paused between commits.
  SEQUENCE_REVERT = 6;
}

// CascadeBlock is why the cascade cannot rebase a child onto its parent.
enum CascadeBlock {
  // Nothing blocks the cascade.
  CASCADE_BLOCK_UNSPECIFIED = 0;
  // Rebasing the child's own commits onto its parent stopped on conflicts.
  CASCADE_BLOCK_CONFLICTED = 1;
  // The child is orphaned: its branch holds neither its fork point nor any of its parent's own commits.
  CASCADE_BLOCK_ORPHANED = 2;
  // The parent's pull request closed without merging.
  CASCADE_BLOCK_PARENT_CLOSED = 3;
}

// WorktreeRemovalReason is why a task's worktree is no longer on disk.
enum WorktreeRemovalReason {
  // The worktree is on disk, or the task has none.
  WORKTREE_REMOVAL_REASON_UNSPECIFIED = 0;
  // A delete removed the worktree. Komrad never makes it again.
  WORKTREE_REMOVAL_REASON_DELETED = 1;
  // Komrad found the worktree's directory gone without a delete.
  WORKTREE_REMOVAL_REASON_GONE = 2;
}

// DiffStat counts the lines a checkout adds and removes, committed or not.
message DiffStat {
  // How many lines the checkout adds.
  int32 added = 1;
  // How many lines the checkout removes.
  int32 removed = 2;
}

// Task is one piece of work that agents do.
message Task {
  // The task's id.
  string id = 1;
  // The id of the workflow the task belongs to.
  string workflow_id = 2;
  // The task's slug, such as `fix-login`. No two tasks ever share one.
  string slug = 3;
  // The task's title.
  string title = 4;
  // What the task is meant to achieve, in markdown.
  string goal = 5;
  // When the task was created.
  google.protobuf.Timestamp created_at = 6;
  // When the task last changed.
  google.protobuf.Timestamp updated_at = 7;
  // When the task was archived. Unset while the task is live.
  optional google.protobuf.Timestamp archived_at = 8;
  // The directory of the task's checkout. Unset while the task has no checkout.
  optional string cwd = 9;
  // The git branch of the task's checkout. Unset when the task has no checkout or git cannot
  // read the branch.
  optional string branch = 10;
  // The canonical web address of the repository the task's checkout pushes to, such as
  // `https://github.com/harrisoncramer/komrad`. Unset when the checkout is gone or origin is not
  // on a forge.
  optional string repository_url = 11;
  // The commit checked out in the task's checkout. Unset when the checkout is gone or git cannot
  // read it.
  optional string head_sha = 12;
  // Why the task's worktree is no longer on disk. Unspecified while it is.
  WorktreeRemovalReason worktree_removal_reason = 13;
  // The git operation stopped part way in the task's checkout.
  Sequence sequence = 14;
  // The commit of the task's newest snapshot, set while the checkout has changed since that
  // snapshot. Empty otherwise.
  string moved_since_snapshot = 15;
  // How many lines the task's checkout adds and removes since it left the base branch. Unset when
  // there is no base branch to measure against.
  optional DiffStat diff_stat = 16;
  // The existing branch the task was put on. Unset when komrad created the branch.
  optional string adopted_branch = 17;
  // Why the task's last delete failed to remove its checkout. Empty unless a delete failed.
  string failure_reason = 18;
  // The task's notes, in markdown, written by its agents and the person.
  string notes = 19;
  // When the task's notes were last written. Unset until the notes
  // are first written.
  optional google.protobuf.Timestamp notes_updated_at = 20;
  // Whether a hook run on the task failed and the person has not opened its log since.
  bool failed_run = 21;
  // Whether the task is hidden. A hidden task stays live, and clients leave it out of their
  // lists.
  bool hidden = 22;
  // How many documents agents have written for the task. `list_documents` returns them.
  int32 documents = 23;
  // When the newest of the task's documents was last written. Unset when the task
  // has none.
  optional google.protobuf.Timestamp documents_updated_at = 24;
  // The task this task depends on. Unset for a task on the workflow's base branch.
  optional Parent parent = 25;
  // How many snapshots komrad has taken of the task's checkout.
  int32 snapshots = 26;
}

// Parent is the task a child depends on, and the fork point where the child's own commits begin on
// the parent's branch. Snapshots and line counts measure from `fork_point`.
message Parent {
  // The id of the parent task.
  string task_id = 1;
  // The commit of the parent's branch the child's own commits sit on.
  string fork_point = 2;
  // The id of the parent's pull request, which komrad reads for the parent's newest commit and its
  // merge. Empty until the parent has one.
  string pull_request_id = 3;
  // Why the cascade cannot rebase the child onto its parent.
  CascadeBlock blocked = 4;
}

message CreateTaskRequest {
  // The task's slug. No task may have used it before.
  string slug = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 80
    pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
  }];
  // The task's title.
  string title = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
    [rules.v1.printable]: true
  }];
  // What the task is meant to achieve, in markdown.
  string goal = 3 [(buf.validate.field).string.max_len = 50000];
  // The workflow to create the task in, by id.
  string workflow_id = 4 [(buf.validate.field).string.uuid = true];
}

message CreateTaskResponse {
  // The task as created.
  Task task = 1;
}

message GetTaskRequest {
  // The task to get.
  oneof task {
    option (buf.validate.oneof).required = true;
    // The task, by id.
    string task_id = 1 [(buf.validate.field).string.uuid = true];
    // The task, by slug.
    string task_slug = 2 [(buf.validate.field).string.min_len = 1];
  }
}

message GetTaskResponse {
  // The task, with the goal in full.
  Task task = 1;
}

message ListTasksRequest {
  // The workflow whose tasks to list, by id.
  string workflow_id = 1 [(buf.validate.field).string.uuid = true];
  // Whether to list only archived tasks instead of live ones.
  bool archived = 2;
}

message ListTasksResponse {
  // The workflow's tasks, newest first.
  repeated Task tasks = 1;
}

message UpdateTaskRequest {
  // The task to update.
  oneof task {
    option (buf.validate.oneof).required = true;
    // The task, by id.
    string task_id = 1 [(buf.validate.field).string.uuid = true];
    // The task, by slug.
    string task_slug = 7 [(buf.validate.field).string.min_len = 1];
  }
  // The new slug. No other task may have used it. Unchanged when unset.
  optional string slug = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 80
    pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
  }];
  // The new title. Unchanged when unset.
  optional string title = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
    [rules.v1.printable]: true
  }];
  // The new goal, in markdown. Unchanged when unset.
  optional string goal = 4 [(buf.validate.field).string.max_len = 50000];
  // The new notes in full, in markdown. Unchanged when unset.
  optional string notes = 5 [(buf.validate.field).string.max_len = 100000];
  // The `notes_updated_at` the notes were read with. Unset when the notes were never written.
  optional google.protobuf.Timestamp notes_updated_at = 6;
}

message UpdateTaskResponse {
  // The task as updated.
  Task task = 1;
}

message SetTaskNotesRequest {
  // The task whose notes to write.
  oneof task {
    option (buf.validate.oneof).required = true;
    // The task, by id.
    string task_id = 1 [(buf.validate.field).string.uuid = true];
    // The task, by slug.
    string task_slug = 4 [(buf.validate.field).string.min_len = 1];
  }
  // The task's new notes in full, in markdown.
  string notes = 2 [(buf.validate.field).string.max_len = 100000];
  // The `notes_updated_at` that `get_task` returned with the notes. Unset when the notes were
  // never written.
  optional google.protobuf.Timestamp notes_updated_at = 3;
}

message SetTaskNotesResponse {
  // The task, with the new notes.
  Task task = 1;
}

message ArchiveTaskRequest {
  // The task to archive.
  oneof task {
    option (buf.validate.oneof).required = true;
    // The task, by id.
    string task_id = 1 [(buf.validate.field).string.uuid = true];
    // The task, by slug.
    string task_slug = 2 [(buf.validate.field).string.min_len = 1];
  }
}

message SetTaskHiddenRequest {
  // The task to hide or show.
  oneof task {
    option (buf.validate.oneof).required = true;
    // The task, by id.
    string task_id = 1 [(buf.validate.field).string.uuid = true];
    // The task, by slug.
    string task_slug = 3 [(buf.validate.field).string.min_len = 1];
  }
  // Whether to hide the task. False shows the task again.
  bool hidden = 2;
}

message MarkTaskRunsReadRequest {
  // The task whose failed hook runs the person has seen, by id.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message DeleteTasksRequest {
  option (buf.validate.message).cel = {
    id: "tasks.named"
    message: "name at least one task, by id or by slug"
    expression: "this.task_ids.size() + this.task_slugs.size() > 0"
  };

  // The tasks to delete, by id.
  repeated string task_ids = 1 [(buf.validate.field).repeated = {
    unique: true
    items: {
      string: {uuid: true}
    }
  }];
  // Whether to delete the tasks' agents, transcripts, documents, mail, notes and reviews too.
  // False deletes only the tasks' worktrees and keeps the tasks archived.
  bool records = 2;
  // The tasks to delete, by slug.
  repeated string task_slugs = 3 [(buf.validate.field).repeated = {
    unique: true
    items: {
      string: {min_len: 1}
    }
  }];
}

// TaskService creates, reads and changes tasks.
service TaskService {
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse) {
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "create_task"
      description: "Create a task in a workflow. To put an agent on the task, pass its id as `task_id` or its slug as `task_slug` to `create_agent`."
      destructive: false
      roles: [ROLE_ORCHESTRATOR]
    };
  }
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "get_task"
      description: "Get one task by `task_id` or `task_slug`, with its goal and notes in full."
      roles: [
        ROLE_WRITER,
        ROLE_REVIEWER,
        ROLE_ORCHESTRATOR
      ]
    };
  }
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "list_tasks"
      description: "List a workflow's tasks, newest first. Archived tasks are left out unless `archived` is set."
      roles: [
        ROLE_WRITER,
        ROLE_REVIEWER,
        ROLE_ORCHESTRATOR
      ]
    };
  }
  rpc UpdateTask(UpdateTaskRequest) returns (UpdateTaskResponse) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "update_task"
      description: "Change a task's slug, title, goal or notes, by `task_id` or `task_slug`. Fields left unset keep their values. Changing the notes needs the `notes_updated_at` they were read with, and fails with `failed_precondition` when they changed since. Agents see the change the next time they read the task."
      destructive: false
      roles: [ROLE_ORCHESTRATOR]
    };
  }
  rpc SetTaskNotes(SetTaskNotesRequest) returns (SetTaskNotesResponse) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "set_task_notes"
      description: "Replace a task's notes, which every agent that joins the task starts from. The write fails with `failed_precondition` when the notes changed since `notes_updated_at`."
      mcp_guidance: "On failed_precondition, read the task again and keep what was written since."
      destructive: false
      roles: [
        ROLE_WRITER,
        ROLE_REVIEWER,
        ROLE_ORCHESTRATOR
      ]
    };
  }
  rpc ArchiveTask(ArchiveTaskRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "archive_task"
      description: "Archive a task by `task_id` or `task_slug`, with the live agents on it. The task keeps its record, and its slug is never reused."
      destructive: false
      roles: [ROLE_ORCHESTRATOR]
    };
  }
  rpc DeleteTasks(DeleteTasksRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: false
      name: "delete_tasks"
      description: "Delete tasks' worktrees, by `task_ids` or `task_slugs`, archiving the tasks first. With records set, delete the tasks for good too, with every agent on them and their transcripts, documents, mail, notes and reviews."
      reason: "Only the person deletes tasks."
      destructive: true
    };
  }
  rpc SetTaskHidden(SetTaskHiddenRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.surfaces) = {
      cli: true
      mcp: true
      name: "set_task_hidden"
      description: "Hide a task by `task_id` or `task_slug`, or show it again. A hidden task stays live with its agents running, and clients leave it out of their lists."
      mcp_guidance: "Hide a task only when asked."
      destructive: false
      roles: [ROLE_ORCHESTRATOR]
    };
  }
  rpc MarkTaskRunsRead(MarkTaskRunsReadRequest) returns (google.protobuf.Empty) {
    option idempotency_level = IDEMPOTENT;
    option (annotation.v1.surfaces) = {
      cli: false
      mcp: false
      reason: "Only the person can say they have seen a task's failed hook runs."
    };
  }
}
